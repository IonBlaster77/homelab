apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    path: gitops/homepage-chart
    targetRevision: HEAD
    helm:
      releaseName: homepage
      values: |
        enableRbac: true
        serviceAccount:
          name: homepage
          create: true

        env:
          - name: HOMEPAGE_ALLOWED_HOSTS
            value: "home.jupitertech.net,home.jupitertech.net:443,home.jupitertech.net:80"

        envFrom:
          - secretRef:
              name: homepage-synology
          - secretRef:
              name: homepage-arr-keys

        service:
          main:
            ports:
              http:
                port: 3000

        config:
          settings:
            title: Jupiter Tech
            theme: dark
            color: zinc
            headerStyle: boxedWidgets
            cardBlur: sm
            layout:
              Cluster Management:
                tab: Infrastructure
                style: row
                columns: 4
                icon: mdi-server-network
              Network & Security:
                tab: Infrastructure
                style: row
                columns: 2
                icon: mdi-shield-lock
              Network Hardware:
                tab: Infrastructure
                style: row
                columns: 4
                icon: mdi-router-network
              Media:
                tab: Media
                style: row
                columns: 2
                icon: mdi-television-play
              Media Management:
                tab: Media
                style: row
                columns: 5
                icon: mdi-cog-play
              Tools & AI:
                tab: Apps
                style: row
                columns: 3
                icon: mdi-toolbox
              Quick Links:
                tab: Apps
                icon: mdi-bookmark-multiple

          bookmarks:
            - Quick Links:
                - GitHub:
                    - abbr: GH
                      href: https://github.com/IonBlaster77/homelab
                      icon: github.png

          services:
            - Cluster Management:
                - pgAdmin:
                    id: pgadmin-card
                    href: https://pgadmin.jupitertech.net
                    description: PostgreSQL database administration
                    icon: pgadmin.png
                    siteMonitor: http://pgadmin4.pgadmin.svc.cluster.local:80
                    namespace: pgadmin
                    app: pgadmin4
                - ArgoCD:
                    id: argocd-card
                    href: https://argocd.jupitertech.net
                    description: GitOps continuous delivery
                    icon: argo-cd.png
                    siteMonitor: http://argocd-server.argocd.svc.cluster.local:80
                    namespace: argocd
                    app: argocd-server
                - Grafana:
                    id: grafana-card
                    href: https://grafana.jupitertech.net
                    description: Metrics & dashboards
                    icon: grafana.png
                    siteMonitor: http://monitoring-grafana.monitoring.svc.cluster.local:80
                    namespace: monitoring
                    app: grafana
                - Longhorn:
                    id: longhorn-card
                    href: https://longhorn.jupitertech.net
                    description: Distributed block storage
                    icon: longhorn.png
                    siteMonitor: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
                    namespace: longhorn-system
                    app: longhorn
                - Hubble:
                    id: hubble-card
                    href: https://hubble.jupitertech.net
                    description: Cilium network flow visibility
                    icon: mdi-lan-check
                    siteMonitor: http://hubble-ui.kube-system.svc.cluster.local:80
                    namespace: kube-system
                    app: hubble-ui
                - MinIO Console:
                    id: minio-card
                    href: https://minio.jupitertech.net
                    description: S3-compatible object storage
                    icon: minio.png
                    siteMonitor: http://buzz-minio-console.buzz.svc.cluster.local:9090
                    namespace: buzz
                    podSelector: v1.min.io/tenant=buzz-minio

            - Network & Security:
                - Authentik:
                    id: authentik-card
                    href: https://auth.jupitertech.net
                    description: Identity provider — SSO, LDAP, RADIUS
                    icon: authentik.png
                    # Poll the lightweight health endpoint rather than /, which
                    # 302-redirects into the flow interface and runs Authentik's
                    # full ~20-layer Django middleware stack (~400ms vs ~100ms).
                    siteMonitor: http://authentik-server.authentik.svc.cluster.local:80/-/health/live/
                    namespace: authentik
                    app: authentik
                - AdGuard Home:
                    id: adguard-card
                    href: https://adguard.jupitertech.net
                    description: Network-wide DNS filtering & ad blocking
                    icon: adguard-home.png
                    siteMonitor: http://adguard-ui.adguard.svc.cluster.local:3000
                    namespace: adguard
                    app: adguard
                - Kea:
                    id: kea-card
                    description: DHCP server
                    icon: isc-kea.png
                    siteMonitor: http://kea-ctrl-agent.kea.svc.cluster.local:8000
                    namespace: kea
                    app: kea-dhcp4
                    podSelector: app=kea-dhcp4

            - Media:
                - Jellyfin:
                    id: jellyfin-card
                    href: https://jellyfin.jupitertech.net
                    description: Media server
                    icon: jellyfin.png
                    siteMonitor: http://jellyfin.media.svc.cluster.local:8096
                    namespace: media
                    app: jellyfin
                - Seerr:
                    id: seerr-card
                    href: https://seerr.jupitertech.net
                    description: Media requests (Jellyseerr/Overseerr successor)
                    icon: jellyseerr.png
                    siteMonitor: http://seerr.media.svc.cluster.local:5055
                    namespace: media
                    app: seerr

            - Media Management:
                - Radarr:
                    id: radarr-card
                    href: https://radarr.jupitertech.net
                    description: Movie automation
                    icon: radarr.png
                    siteMonitor: http://radarr.media.svc.cluster.local:7878
                    namespace: media
                    app: radarr
                    widget:
                      type: radarr
                      url: http://radarr.media.svc.cluster.local:7878
                      key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
                - Sonarr:
                    id: sonarr-card
                    href: https://sonarr.jupitertech.net
                    description: TV show automation
                    icon: sonarr.png
                    siteMonitor: http://sonarr.media.svc.cluster.local:8989
                    namespace: media
                    app: sonarr
                    widget:
                      type: sonarr
                      url: http://sonarr.media.svc.cluster.local:8989
                      key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
                - Prowlarr:
                    id: prowlarr-card
                    href: https://prowlarr.jupitertech.net
                    description: Indexer management
                    icon: prowlarr.png
                    siteMonitor: http://prowlarr.media.svc.cluster.local:9696
                    namespace: media
                    app: prowlarr
                    widget:
                      type: prowlarr
                      url: http://prowlarr.media.svc.cluster.local:9696
                      key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
                - qBittorrent:
                    id: qbittorrent-card
                    href: https://qbittorrent.jupitertech.net
                    description: Torrent client
                    icon: qbittorrent.png
                    siteMonitor: http://qbittorrent.media.svc.cluster.local:8080
                    namespace: media
                    app: qbittorrent
                    widget:
                      type: qbittorrent
                      url: http://qbittorrent.media.svc.cluster.local:8080
                      username: "{{HOMEPAGE_VAR_QBIT_USER}}"
                      password: "{{HOMEPAGE_VAR_QBIT_PASSWORD}}"
                - NZBGet:
                    id: nzbget-card
                    href: https://nzbget.jupitertech.net
                    description: Usenet download client
                    icon: nzbget.png
                    siteMonitor: http://nzbget.media.svc.cluster.local:6789
                    namespace: media
                    app: nzbget
                    widget:
                      type: nzbget
                      url: http://nzbget.media.svc.cluster.local:6789
                      username: "{{HOMEPAGE_VAR_NZBGET_USER}}"
                      password: "{{HOMEPAGE_VAR_NZBGET_PASSWORD}}"
                - Bazarr:
                    id: bazarr-card
                    href: https://bazarr.jupitertech.net
                    description: Subtitle automation
                    icon: bazarr.png
                    siteMonitor: http://bazarr.media.svc.cluster.local:6767
                    namespace: media
                    app: bazarr
                    widget:
                      type: bazarr
                      url: http://bazarr.media.svc.cluster.local:6767
                      key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
                - Arr Dashboard:
                    id: arrdashboard-card
                    href: https://arrdashboard.jupitertech.net
                    description: Unified *arr management dashboard
                    icon: mdi-view-dashboard-variant
                    siteMonitor: http://arr-dashboard.media.svc.cluster.local:3000
                    namespace: media
                    app: arr-dashboard

            - Tools & AI:
                - SearXNG:
                    id: searxng-card
                    href: https://searxng.jupitertech.net
                    description: Privacy-respecting metasearch engine
                    icon: searxng.png
                    siteMonitor: http://searxng.searxng.svc.cluster.local:8080
                    namespace: searxng
                    app: searxng
                    podSelector: app=searxng
                - Crawl4AI:
                    id: crawl4ai-card
                    href: https://crawl4ai.jupitertech.net
                    description: LLM-friendly web crawler & scraper
                    icon: mdi-spider-web
                    siteMonitor: http://crawl4ai.crawl4ai.svc.cluster.local:11235
                    namespace: crawl4ai
                    app: crawl4ai
                    podSelector: app=crawl4ai
                - Hermes:
                    id: hermes-card
                    href: https://hermes.jupitertech.net
                    description: Self-hosted AI chat
                    icon: mdi-robot-happy-outline
                    siteMonitor: http://hermes-webui.hermes.svc.cluster.local:8787
                    namespace: hermes
                    app: hermes
                    podSelector: app=hermes
                - Streamystats:
                    id: streamystats-card
                    href: https://streamystats.jupitertech.net
                    description: Jellyfin watch stats & AI recommendations
                    icon: mdi-chart-box-outline
                    siteMonitor: http://streamystats.streamystats.svc.cluster.local:3000
                    namespace: streamystats
                    app: streamystats
                    podSelector: app=streamystats
                - Buzz:
                    id: buzz-card
                    href: https://buzz.jupitertech.net
                    description: Self-hosted human/agent chat workspace
                    icon: mdi-forum-outline
                    siteMonitor: http://buzz.buzz.svc.cluster.local:3000/health
                    namespace: buzz
                    app: buzz

            - Network Hardware:
                - MikroTik CCR1036:
                    id: mikrotik-core-card
                    href: http://10.77.10.1
                    description: Core router — AS 65530
                    icon: mikrotik.png
                    siteMonitor: http://10.77.10.1
                    widget:
                      type: prometheus
                      url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
                      query: mikrotik_system_cpu_load{name="homelab"}
                - UniFi Network:
                    id: unifi-card
                    href: https://10.77.10.10
                    description: CloudKey Gen2+ — wireless AP management
                    icon: unifi.png
                    siteMonitor: https://10.77.10.10
                - MikroTik Aggregation Switch:
                    id: mikrotik-agg-card
                    href: http://10.77.10.2
                    description: SFP+ aggregation switch
                    icon: mikrotik.png
                    siteMonitor: http://10.77.10.2
                - Dell N1148P-ON:
                    id: dell-switch-card
                    href: http://10.77.10.3
                    description: Core switch
                    icon: dell.png
                    siteMonitor: http://10.77.10.3
                - HP 1930 Instant On:
                    id: hp-switch-card
                    href: http://10.77.10.5
                    description: PoE access switch
                    icon: hp.png
                    siteMonitor: http://10.77.10.5
                - rack01:
                    id: synology-card
                    href: http://10.77.10.20:5000
                    description: Synology DiskStation
                    icon: synology.png
                    siteMonitor: http://10.77.10.20:5000
                    widget:
                      type: diskstation
                      url: http://10.77.20.20:5000
                      username: "{{HOMEPAGE_VAR_SYNOLOGY_USER}}"
                      password: "{{HOMEPAGE_VAR_SYNOLOGY_PASSWORD}}"
                      volume: volume_1

          widgets:
            - kubernetes:
                cluster:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
                  label: homelab
                nodes:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true

            - datetime:
                text_size: l
                format:
                  timeStyle: short
                  dateStyle: medium
                  hourCycle: h23

            - search:
                provider: google
                target: _blank

          kubernetes:
            mode: cluster

        persistence:
          custom-css:
            enabled: true
            type: custom
            volumeSpec:
              configMap:
                name: homepage-custom-css
            subPath:
              - path: custom.css
                mountPath: /app/config/custom.css
                readOnly: true

  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

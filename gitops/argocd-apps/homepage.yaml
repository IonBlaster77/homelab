apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    path: gitops/homepage-chart
    targetRevision: HEAD
    helm:
      releaseName: homepage
      values: |
        enableRbac: true
        serviceAccount:
          name: homepage
          create: true

        env:
          - name: HOMEPAGE_ALLOWED_HOSTS
            value: "home.jupitertech.net,home.jupitertech.net:443,home.jupitertech.net:80"

        envFrom:
          - secretRef:
              name: homepage-synology
          - secretRef:
              name: homepage-arr-keys
              optional: true

        service:
          main:
            ports:
              http:
                port: 3000

        config:
          settings:
            title: Jupiter Tech
            theme: dark
            color: zinc
            headerStyle: boxedWidgets
            cardBlur: sm
            layout:
              Cluster Management:
                tab: Infrastructure
                style: row
                columns: 4
                icon: mdi-server-network
              Network & Security:
                tab: Infrastructure
                style: row
                columns: 2
                icon: mdi-shield-lock
              Network Hardware:
                tab: Infrastructure
                style: row
                columns: 4
                icon: mdi-router-network
              Media:
                tab: Media
                style: row
                columns: 2
                icon: mdi-television-play
              Media Management:
                tab: Media
                style: row
                columns: 5
                icon: mdi-cog-play
              Tools & AI:
                tab: Apps
                style: row
                columns: 3
                icon: mdi-toolbox
              Quick Links:
                tab: Apps
                icon: mdi-bookmark-multiple
              Update Queue:
                tab: Patch Ops
                style: row
                columns: 2
                icon: mdi-package-down
              Upstream Releases:
                tab: Patch Ops
                style: row
                columns: 3
                icon: mdi-tag-arrow-up
              Device Firmware:
                tab: Patch Ops
                style: row
                columns: 3
                icon: mdi-chip

          bookmarks:
            - Quick Links:
                - GitHub:
                    - abbr: GH
                      href: https://github.com/IonBlaster77/homelab
                      icon: github.png

          services:
            - Cluster Management:
                - pgAdmin:
                    id: pgadmin-card
                    href: https://pgadmin.jupitertech.net
                    description: PostgreSQL database administration
                    icon: pgadmin.png
                    siteMonitor: http://pgadmin4.pgadmin.svc.cluster.local:80
                    namespace: pgadmin
                    app: pgadmin4
                - ArgoCD:
                    id: argocd-card
                    href: https://argocd.jupitertech.net
                    description: GitOps continuous delivery
                    icon: argo-cd.png
                    siteMonitor: http://argocd-server.argocd.svc.cluster.local:80
                    namespace: argocd
                    app: argocd-server
                - Grafana:
                    id: grafana-card
                    href: https://grafana.jupitertech.net
                    description: Metrics & dashboards
                    icon: grafana.png
                    siteMonitor: http://monitoring-grafana.monitoring.svc.cluster.local:80
                    namespace: monitoring
                    app: grafana
                - Longhorn:
                    id: longhorn-card
                    href: https://longhorn.jupitertech.net
                    description: Distributed block storage
                    icon: longhorn.png
                    siteMonitor: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
                    namespace: longhorn-system
                    app: longhorn
                - Hubble:
                    id: hubble-card
                    href: https://hubble.jupitertech.net
                    description: Cilium network flow visibility
                    icon: mdi-lan-check
                    siteMonitor: http://hubble-ui.kube-system.svc.cluster.local:80
                    namespace: kube-system
                    app: hubble-ui
                - MinIO Console:
                    id: minio-card
                    href: https://minio.jupitertech.net
                    description: S3-compatible object storage
                    icon: minio.png
                    siteMonitor: http://buzz-minio-console.buzz.svc.cluster.local:9090
                    namespace: buzz
                    podSelector: v1.min.io/tenant=buzz-minio

            - Network & Security:
                - Authentik:
                    id: authentik-card
                    href: https://auth.jupitertech.net
                    description: Identity provider — SSO, LDAP, RADIUS
                    icon: authentik.png
                    # Poll the lightweight health endpoint rather than /, which
                    # 302-redirects into the flow interface and runs Authentik's
                    # full ~20-layer Django middleware stack (~400ms vs ~100ms).
                    siteMonitor: http://authentik-server.authentik.svc.cluster.local:80/-/health/live/
                    namespace: authentik
                    app: authentik
                - AdGuard Home:
                    id: adguard-card
                    href: https://adguard.jupitertech.net
                    description: Network-wide DNS filtering & ad blocking
                    icon: adguard-home.png
                    siteMonitor: http://adguard-ui.adguard.svc.cluster.local:3000
                    namespace: adguard
                    app: adguard
                - Kea:
                    id: kea-card
                    description: DHCP server
                    icon: isc-kea.png
                    siteMonitor: http://kea-ctrl-agent.kea.svc.cluster.local:8000
                    namespace: kea
                    app: kea-dhcp4
                    podSelector: app=kea-dhcp4

            - Media:
                - Jellyfin:
                    id: jellyfin-card
                    href: https://jellyfin.jupitertech.net
                    description: Media server
                    icon: jellyfin.png
                    siteMonitor: http://jellyfin.media.svc.cluster.local:8096
                    namespace: media
                    app: jellyfin
                - Seerr:
                    id: seerr-card
                    href: https://seerr.jupitertech.net
                    description: Media requests (Jellyseerr/Overseerr successor)
                    icon: jellyseerr.png
                    siteMonitor: http://seerr.media.svc.cluster.local:5055
                    namespace: media
                    app: seerr

            - Media Management:
                - Radarr:
                    id: radarr-card
                    href: https://radarr.jupitertech.net
                    description: Movie automation
                    icon: radarr.png
                    siteMonitor: http://radarr.media.svc.cluster.local:7878
                    namespace: media
                    app: radarr
                    widget:
                      type: radarr
                      url: http://radarr.media.svc.cluster.local:7878
                      key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
                - Sonarr:
                    id: sonarr-card
                    href: https://sonarr.jupitertech.net
                    description: TV show automation
                    icon: sonarr.png
                    siteMonitor: http://sonarr.media.svc.cluster.local:8989
                    namespace: media
                    app: sonarr
                    widget:
                      type: sonarr
                      url: http://sonarr.media.svc.cluster.local:8989
                      key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
                - Prowlarr:
                    id: prowlarr-card
                    href: https://prowlarr.jupitertech.net
                    description: Indexer management
                    icon: prowlarr.png
                    siteMonitor: http://prowlarr.media.svc.cluster.local:9696
                    namespace: media
                    app: prowlarr
                    widget:
                      type: prowlarr
                      url: http://prowlarr.media.svc.cluster.local:9696
                      key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
                - qBittorrent:
                    id: qbittorrent-card
                    href: https://qbittorrent.jupitertech.net
                    description: Torrent client
                    icon: qbittorrent.png
                    siteMonitor: http://qbittorrent.media.svc.cluster.local:8080
                    namespace: media
                    app: qbittorrent
                    widget:
                      type: qbittorrent
                      url: http://qbittorrent.media.svc.cluster.local:8080
                      username: "{{HOMEPAGE_VAR_QBIT_USER}}"
                      password: "{{HOMEPAGE_VAR_QBIT_PASSWORD}}"
                - NZBGet:
                    id: nzbget-card
                    href: https://nzbget.jupitertech.net
                    description: Usenet download client
                    icon: nzbget.png
                    siteMonitor: http://nzbget.media.svc.cluster.local:6789
                    namespace: media
                    app: nzbget
                    widget:
                      type: nzbget
                      url: http://nzbget.media.svc.cluster.local:6789
                      username: "{{HOMEPAGE_VAR_NZBGET_USER}}"
                      password: "{{HOMEPAGE_VAR_NZBGET_PASSWORD}}"
                - Bazarr:
                    id: bazarr-card
                    href: https://bazarr.jupitertech.net
                    description: Subtitle automation
                    icon: bazarr.png
                    siteMonitor: http://bazarr.media.svc.cluster.local:6767
                    namespace: media
                    app: bazarr
                    widget:
                      type: bazarr
                      url: http://bazarr.media.svc.cluster.local:6767
                      key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
                - Arr Dashboard:
                    id: arrdashboard-card
                    href: https://arrdashboard.jupitertech.net
                    description: Unified *arr management dashboard
                    icon: mdi-view-dashboard-variant
                    siteMonitor: http://arr-dashboard.media.svc.cluster.local:3000
                    namespace: media
                    app: arr-dashboard

            - Tools & AI:
                - SearXNG:
                    id: searxng-card
                    href: https://searxng.jupitertech.net
                    description: Privacy-respecting metasearch engine
                    icon: searxng.png
                    siteMonitor: http://searxng.searxng.svc.cluster.local:8080
                    namespace: searxng
                    app: searxng
                    podSelector: app=searxng
                - Crawl4AI:
                    id: crawl4ai-card
                    href: https://crawl4ai.jupitertech.net
                    description: LLM-friendly web crawler & scraper
                    icon: mdi-spider-web
                    siteMonitor: http://crawl4ai.crawl4ai.svc.cluster.local:11235
                    namespace: crawl4ai
                    app: crawl4ai
                    podSelector: app=crawl4ai
                - Hermes:
                    id: hermes-card
                    href: https://hermes.jupitertech.net
                    description: Self-hosted AI chat
                    icon: mdi-robot-happy-outline
                    siteMonitor: http://hermes-webui.hermes.svc.cluster.local:8787
                    namespace: hermes
                    app: hermes
                    podSelector: app=hermes
                - Streamystats:
                    id: streamystats-card
                    href: https://streamystats.jupitertech.net
                    description: Jellyfin watch stats & AI recommendations
                    icon: mdi-chart-box-outline
                    siteMonitor: http://streamystats.streamystats.svc.cluster.local:3000
                    namespace: streamystats
                    app: streamystats
                    podSelector: app=streamystats
                - Buzz:
                    id: buzz-card
                    href: https://buzz.jupitertech.net
                    description: Self-hosted human/agent chat workspace
                    icon: mdi-forum-outline
                    siteMonitor: http://buzz.buzz.svc.cluster.local:3000/health
                    namespace: buzz
                    app: buzz

            - Network Hardware:
                - MikroTik CCR1036:
                    id: mikrotik-core-card
                    href: http://10.77.10.1
                    description: Core router — AS 65530
                    icon: mikrotik.png
                    siteMonitor: http://10.77.10.1
                    widget:
                      type: prometheus
                      url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
                      query: mikrotik_system_cpu_load{name="homelab"}
                - UniFi Network:
                    id: unifi-card
                    href: https://10.77.10.10
                    description: CloudKey Gen2+ — wireless AP management
                    icon: unifi.png
                    siteMonitor: https://10.77.10.10
                - MikroTik Aggregation Switch:
                    id: mikrotik-agg-card
                    href: http://10.77.10.2
                    description: SFP+ aggregation switch
                    icon: mikrotik.png
                    siteMonitor: http://10.77.10.2
                - Dell N1148P-ON:
                    id: dell-switch-card
                    href: http://10.77.10.3
                    description: Core switch
                    icon: dell.png
                    siteMonitor: http://10.77.10.3
                - HP 1930 Instant On:
                    id: hp-switch-card
                    href: http://10.77.10.5
                    description: PoE access switch
                    icon: hp.png
                    siteMonitor: http://10.77.10.5
                - rack01:
                    id: synology-card
                    href: http://10.77.10.20:5000
                    description: Synology DiskStation
                    icon: synology.png
                    siteMonitor: http://10.77.10.20:5000
                    widget:
                      type: diskstation
                      url: http://10.77.20.20:5000
                      username: "{{HOMEPAGE_VAR_SYNOLOGY_USER}}"
                      password: "{{HOMEPAGE_VAR_SYNOLOGY_PASSWORD}}"
                      volume: volume_1

            # Patch ops centre (task #21). Deliberately built with customapi
            # widgets hitting public APIs directly rather than a custom
            # aggregator service: this repo has no image-build pipeline, so a
            # bespoke backend would be a delivery problem, not a coding one.
            #
            # Division of labour: Renovate (task #22) covers every Helm chart
            # and container image in the repo and raises a PR per update, so
            # "Update Queue" just counts its open PRs rather than duplicating
            # version-checking. "Upstream Releases" covers the things Renovate
            # structurally CANNOT see - Talos OS (Image Factory serves
            # content-addressed installer images, not versioned tags, so
            # Renovate's docker datasource gets no-result) and Kubernetes
            # (ships as part of Talos, not as a tracked dependency here).
            - Update Queue:
                - Renovate:
                    id: renovate-card
                    href: https://github.com/IonBlaster77/homelab/pulls
                    description: Dependency update PRs awaiting review
                    icon: mdi-source-pull
                    widget:
                      type: customapi
                      # GitHub's search API returns a single total_count field,
                      # which maps cleanly onto one customapi field. Listing
                      # /pulls directly would return an array with no count.
                      # Unauthenticated search is rate-limited to 10 req/min;
                      # a 10-minute refresh sits far inside that.
                      url: "https://api.github.com/search/issues?q=repo:IonBlaster77/homelab+is:pr+is:open+label:renovate"
                      refreshInterval: 600000
                      # GitHub's API rejects any request without a User-Agent
                      # ("Request forbidden by administrative rules"), and
                      # Homepage's proxy sends none by default - without this
                      # the widget shows a bare "API Error Information".
                      headers:
                        User-Agent: homepage-jupitertech
                      mappings:
                        - field: total_count
                          label: Open PRs
                          format: number
                - Dependency Dashboard:
                    id: renovate-dashboard-card
                    href: https://github.com/IonBlaster77/homelab/issues
                    description: Full backlog incl. rate-limited & skipped updates
                    icon: mdi-clipboard-list-outline

            - Upstream Releases:
                - Talos OS:
                    id: talos-release-card
                    # Current version is hardcoded because nothing serves it
                    # over HTTP that Homepage can reach - it lives on the Node
                    # objects (.status.nodeInfo.osImage) and reading those needs
                    # a service-account token, which customapi cannot supply.
                    # Update this line whenever the cluster is upgraded, or
                    # replace the whole card once the aggregator lands.
                    description: Running v1.12.6 — compare against latest
                    href: https://github.com/siderolabs/talos/releases
                    icon: mdi-server
                    widget:
                      type: customapi
                      url: "https://api.github.com/repos/siderolabs/talos/releases/latest"
                      refreshInterval: 3600000
                      headers:
                        User-Agent: homepage-jupitertech
                      mappings:
                        - field: tag_name
                          label: Latest
                        - field: published_at
                          label: Released
                          format: relativeDate
                - Kubernetes:
                    id: k8s-release-card
                    description: Running v1.35.0 — ships with Talos, not tracked by Renovate
                    href: https://github.com/kubernetes/kubernetes/releases
                    icon: kubernetes.png
                    widget:
                      type: customapi
                      url: "https://api.github.com/repos/kubernetes/kubernetes/releases/latest"
                      refreshInterval: 3600000
                      headers:
                        User-Agent: homepage-jupitertech
                      mappings:
                        - field: tag_name
                          label: Latest
                        - field: published_at
                          label: Released
                          format: relativeDate
            # Per-device firmware. AP versions come from unpoller_device_info's
            # `version` label - note the metric prefix is `unpoller_`, not
            # `unifi_` (the project renamed itself from unifi-poller to
            # UnPoller), which makes the data very easy to miss when grepping.
            # Read through Prometheus' HTTP API via customapi rather than
            # Homepage's `prometheus` widget type, because that widget renders
            # a series *value* and the information here lives in a label.
            # Each AP is selected by name so the cards can't silently swap
            # round if the series order changes.
            - Device Firmware:
                - U6-Lite Office:
                    id: unifi-ap-office-card
                    description: Access point — 10.77.10.12
                    href: https://10.77.10.10
                    icon: ubiquiti.png
                    widget:
                      type: customapi
                      url: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090/api/v1/query?query=unpoller_device_info%7Bname%3D%22U6-Lite-Office%22%7D"
                      refreshInterval: 3600000
                      mappings:
                        - field: data.result.0.metric.version
                          label: Firmware
                - U6-Lite Garage:
                    id: unifi-ap-garage-card
                    description: Access point — 10.77.10.100
                    href: https://10.77.10.10
                    icon: ubiquiti.png
                    widget:
                      type: customapi
                      url: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090/api/v1/query?query=unpoller_device_info%7Bname%3D%22U6-Lite-Garage%22%7D"
                      refreshInterval: 3600000
                      mappings:
                        - field: data.result.0.metric.version
                          label: Firmware
                - UniFi Network Controller:
                    id: unifi-controller-card
                    # unpoller_controller_info carries NO version label (only
                    # hostname/site_name/source), so the controller's version
                    # string is not obtainable here. What IS available is
                    # whether the controller reports a pending update, which is
                    # the part that actually matters for patch ops. 0 = up to
                    # date, 1 = update waiting.
                    description: Network application — update flag
                    href: https://10.77.10.10
                    icon: unifi.png
                    widget:
                      type: customapi
                      url: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090/api/v1/query?query=unpoller_controller_update_available"
                      refreshInterval: 3600000
                      mappings:
                        - field: data.result.0.value.1
                          label: Update pending
                - CloudKey Gen2+ / UniFi OS:
                    id: cloudkey-pending-card
                    # Placeholder, not a live card. The CloudKey never appears
                    # in unpoller_device_info - unpoller polls the Network API
                    # and so only sees adopted devices (the 2 APs), not the
                    # host it runs on. Probed the controller directly on
                    # 2026-08-15: https://10.77.10.10/api/system answers
                    # UNauthenticated but returns only identity/state
                    # (hardware.shortname UCKP, name, mac, cloudConnected) with
                    # no firmware field; /proxy/network/status is 401. Getting
                    # UniFi OS + CloudKey firmware needs a real login flow
                    # (POST /api/auth/login -> token -> authed GET), which
                    # customapi cannot do - it sends static headers, not a
                    # round-trip. Needs the aggregator (task #21/#31).
                    description: Firmware needs authenticated API — see task #21
                    icon: mdi-alert-circle-outline
                - MikroTik RouterOS:
                    id: routeros-pending-card
                    # Placeholder, not a live card. RouterOS versions need
                    # either SSH (blocked - task #26, the router key import has
                    # never worked) or the REST API; the mikrotik exporter
                    # feeding Prometheus has no version collector (confirmed
                    # 2026-08-15: only cpu/memory/interface/route/uptime).
                    description: Version check blocked — see task #26
                    icon: mdi-alert-circle-outline

          widgets:
            - kubernetes:
                cluster:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
                  label: homelab
                nodes:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true

            - datetime:
                text_size: l
                format:
                  timeStyle: short
                  dateStyle: medium
                  hourCycle: h23

            - search:
                provider: google
                target: _blank

          kubernetes:
            mode: cluster

        persistence:
          custom-css:
            enabled: true
            type: custom
            volumeSpec:
              configMap:
                name: homepage-custom-css
            subPath:
              - path: custom.css
                mountPath: /app/config/custom.css
                readOnly: true

  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

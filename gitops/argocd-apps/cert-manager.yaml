# ArgoCD Application — cert-manager
#
# Deploys cert-manager via the official Helm chart.
# cert-manager watches Certificate resources and automatically requests,
# renews, and stores TLS certificates as Kubernetes Secrets.
#
# installCRDs: true — installs cert-manager's own CRDs (Certificate,
# ClusterIssuer, etc.) as part of the Helm release. This is the
# recommended approach for ArgoCD-managed releases.
#
# After this syncs, apply cert-manager-config (ClusterIssuers + Cloudflare
# secret + wildcard Certificate) before syncing the gateway Application.
#
# Check latest version: helm search repo cert-manager/cert-manager

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    # v1.20.3: upgraded from v1.16.3 to fix the Cloudflare DNS-01 cleanup bug.
    # Cloudflare stopped returning per-record zone_id in list responses; pre-1.17.1
    # cert-manager built DELETE /zones//dns_records/<id> (empty zone -> CF 7003),
    # so challenge TXT records were never cleaned up. Fixed upstream in v1.17.1
    # (cert-manager/cert-manager#7549). v1.20.3 is current + security-patched.
    targetRevision: v1.20.3
    helm:
      values: |
        installCRDs: true
        # Use public resolvers for the DNS-01 zone/SOA lookup instead of
        # in-cluster CoreDNS. In-cluster resolution was returning an empty
        # Cloudflare zone ID during challenge cleanup (DELETE /zones//dns_records
        # -> CF error 7003), wedging renewals in the "Renewing" state.
        extraArgs:
          - --dns01-recursive-nameservers-only=true
          - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
        # Tolerate control-plane taints so cert-manager can run on all nodes
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
        webhook:
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"
        cainjector:
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

# Buzz — self-hosted Nostr-based agent/team workspace. Stage 1 of a staged
# rollout (see the plan): core platform only, internal-only (no Gateway
# route yet), relay membership requirement off until the owner's pubkey is
# known (Stage 2).
#
# Compromise on pinning: the chart itself (deploy/charts/buzz) is too new —
# no commit that has both the chart AND a published GHCR image tag exists
# yet (checked ~10 recent sha-<commit> image tags, none had the chart path;
# the chart only exists on `main` as of this commit). So the chart source
# floats on `main` (unavoidable for now), but image.tag below is still
# pinned to the newest confirmed-published tag — the actual running binary
# won't change on its own, only the chart's templates/values schema might.
# Revisit pinning the chart source once an image build catches up to a
# commit that includes it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: buzz
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/block/buzz.git
    targetRevision: main
    path: deploy/charts/buzz
    helm:
      releaseName: buzz
      values: |
        image:
          tag: "sha-1fa63ba"

        replicaCount: 1

        relayUrl: "wss://buzz.jupitertech.net"

        # Stage 2: once the owner installs a Buzz client and shares their
        # pubkey, set ownerPubkey here and flip requireRelayMembership back
        # to true (the chart default) to lock the relay down.
        relay:
          requireRelayMembership: false

        secrets:
          existingSecret: buzz-relay-secrets

        externalPostgresql:
          url: ""
        externalRedis:
          url: ""

        s3:
          endpoint: "http://buzz-minio.buzz.svc.cluster.local:9000"
          bucket: "buzz-media"
          addressingStyle: path

        ingress:
          enabled: false
        httproute:
          enabled: false

        serviceMonitor:
          enabled: true
          labels:
            release: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: buzz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

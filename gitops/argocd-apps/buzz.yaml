# Buzz — self-hosted Nostr-based agent/team workspace. Stage 2 of a staged
# rollout (see the plan): core platform + owner-locked relay, internal-only
# (no Gateway route yet).
#
# Compromise on pinning: the chart itself (deploy/charts/buzz) is too new —
# no commit that has both the chart AND a published GHCR image tag exists
# yet, so the chart source floats on `main` (unavoidable for now).
#
# image.tag was originally pinned to a specific sha (sha-1fa63ba) for
# reproducibility, but that build predates a multi-tenant "communities"
# schema refactor that the current `main` migrations require (confirmed:
# the pinned binary had zero references to `communities`/`community_id`,
# vs. current migrations making community_id NOT NULL on every tenant-
# scoped table — every event insert was failing FK/not-null checks).
# Floating image.tag on `main` too keeps the binary and the schema it
# expects from drifting apart, at the cost of losing image reproducibility
# (same tradeoff already accepted for the chart source above). Revisit
# pinning both to a single immutable commit once one exists.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: buzz
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/block/buzz.git
    targetRevision: main
    path: deploy/charts/buzz
    helm:
      releaseName: buzz
      values: |
        image:
          tag: "main"

        replicaCount: 1

        relayUrl: "wss://buzz.jupitertech.net"

        # Owner's Nostr pubkey (Krishna's account, created via the desktop
        # client's onboarding flow, confirmed against the live `users`
        # table). requireRelayMembership left at the chart default (true) —
        # only the owner is a member until explicitly added via
        # `buzz-admin add-member` or a relay invite.
        ownerPubkey: "6310be1fb6afb6152cfc9aa688673bce59c9742b48f7124661c45e0f34541f31"

        secrets:
          existingSecret: buzz-relay-secrets

        externalPostgresql:
          url: ""
        externalRedis:
          url: ""

        # migrate.autoMigrate alone never actually ran anything — no
        # _sqlx_migrations table, only one stray table (audit_log) existed
        # after 20h of uptime, and the relay was silently failing background
        # jobs the whole time ("relation channels/workflows/events does not
        # exist"). The dedicated pre-upgrade Job is the reliable path.
        migrate:
          preUpgradeJob:
            enabled: true

        # The MinIO Operator names the Tenant's S3-facing Service "minio"
        # regardless of the Tenant's own name — not "<tenant-name>", as I'd
        # assumed. Verified against the live Service list. Port 80, not
        # 9000 — that's the Service's port (which targets 9000 on the pod).
        s3:
          endpoint: "http://minio.buzz.svc.cluster.local"
          bucket: "buzz-media"
          addressingStyle: path

        ingress:
          enabled: false
        httproute:
          enabled: false

        serviceMonitor:
          enabled: true
          labels:
            release: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: buzz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

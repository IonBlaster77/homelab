apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 83.6.0
    helm:
      releaseName: monitoring
      values: |
        # Disable components that Talos doesn't expose externally
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false

        # node-exporter must run on control-plane nodes too
        prometheus-node-exporter:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule

        prometheus:
          prometheusSpec:
            retention: 60d
            retentionSize: 45GB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn-ssd
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 50Gi

        grafana:
          # Loki (logging namespace) as a log datasource alongside Prometheus.
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://loki.logging.svc.cluster.local:3100
              jsonData:
                maxLines: 1000
          admin:
            existingSecret: grafana-admin-secret
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: false
          envValueFrom:
            GF_DATABASE_PASSWORD:
              secretKeyRef:
                name: grafana-db-credentials
                key: password
          "grafana.ini":
            database:
              type: postgres
              host: grafana-db-rw.monitoring.svc.cluster.local:5432
              name: grafana
              user: grafana
              password: $__env{GF_DATABASE_PASSWORD}
          service:
            type: ClusterIP

        alertmanager:
          enabled: true
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn-ssd
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 2Gi
            # Mounted at /etc/alertmanager/secrets/pushover-credentials/{user_key,token}
            secrets:
              - pushover-credentials
          config:
            global: {}
            route:
              receiver: pushover-default
              group_by: ["alertname", "namespace"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - matchers:
                    - severity="critical"
                  receiver: pushover-critical
            receivers:
              - name: pushover-default
                pushover_configs:
                  - user_key_file: /etc/alertmanager/secrets/pushover-credentials/user_key
                    token_file: /etc/alertmanager/secrets/pushover-credentials/token
                    priority: "0"
              - name: pushover-critical
                pushover_configs:
                  - user_key_file: /etc/alertmanager/secrets/pushover-credentials/user_key
                    token_file: /etc/alertmanager/secrets/pushover-credentials/token
                    priority: "1"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /status/terminatingReplicas

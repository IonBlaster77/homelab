apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.11.0
    helm:
      releaseName: alloy
      # DaemonSet collector: tails this node's pod logs (CRI format), ships k8s
      # events, and listens for RFC5424 syslog on :1514 (exposed on standard :514
      # via the alloy-syslog LoadBalancer in clusters/homelab/logging). All -> Loki.
      values: |
        controller:
          type: daemonset
          # Talos: talos1-3 are control-plane (tainted). Tolerate so we collect their pod logs too.
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule

        alloy:
          extraEnv:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          mounts:
            varlog: true
          extraPorts:
            - name: syslog
              port: 1514
              targetPort: 1514
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          configMap:
            content: |-
              // ================= pod logs (this node only) =================
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("NODE_NAME")
                }
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  action        = "replace"
                  replacement   = "/var/log/pods/*$1/*.log"
                  target_label  = "__path__"
                }
              }

              local.file_match "pod_logs" {
                path_targets = discovery.relabel.pod_logs.output
              }

              loki.source.file "pod_logs" {
                targets    = local.file_match.pod_logs.targets
                forward_to = [loki.process.pod_logs.receiver]
              }

              loki.process "pod_logs" {
                stage.cri { }
                forward_to = [loki.write.default.receiver]
              }

              // ================= kubernetes events =================
              loki.source.kubernetes_events "events" {
                job_name   = "kube-events"
                forward_to = [loki.write.default.receiver]
              }

              // ================= syslog from network devices (RFC5424 over TCP) =================
              loki.source.syslog "network" {
                listener {
                  address  = "0.0.0.0:1514"
                  protocol = "tcp"
                  labels   = { job = "syslog", source = "network" }
                }
                forward_to = [loki.write.default.receiver]
              }

              // ================= write to Loki =================
              loki.write "default" {
                endpoint {
                  url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

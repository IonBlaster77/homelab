# First-install copy of the `homelab` AppProject (applied by hand in the
# bootstrap runbook, before Argo CD can sync anything). The live, Argo-managed
# copy is kubernetes/platform/system/argocd/appproject-homelab.yaml; keep the
# two spec-identical.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
spec:
  description: HomeLab production cluster
  sourceRepos:
    - https://github.com/IonBlaster77/homelab.git
    - https://charts.goauthentik.io
    - https://helm.runix.net
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://github.com/kubernetes-csi/external-snapshotter.git
    # Upstream charts of apps moved from the default project (2026-10)
    - https://argoproj.github.io/argo-helm
    - https://charts.jetstack.io
    - https://charts.longhorn.io
    - https://cloudnative-pg.github.io/charts
    - https://grafana.github.io/helm-charts
    - https://jameswynn.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - ghcr.io/element-hq/ess-helm
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

# First-install copy of the `homelab` AppProject (applied by hand in the
# bootstrap runbook, before Argo CD can sync anything). The live, Argo-managed
# copy is kubernetes/platform/system/argocd/appproject-homelab.yaml; keep the
# two spec-identical.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
spec:
  description: HomeLab production cluster
  sourceRepos:
    - https://github.com/IonBlaster77/homelab.git
    - https://charts.goauthentik.io
    - https://helm.runix.net
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://github.com/kubernetes-csi/external-snapshotter.git
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

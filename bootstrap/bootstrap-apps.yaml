apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-apps
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    targetRevision: HEAD
    # The root app: every app folder's app.yaml becomes a child Application,
    # so adding an app is adding a folder. (Until October 2026 it also read
    # gitops/argocd-apps/*.yaml, the old layout.)
    path: .
    directory:
      recurse: true
      include: 'kubernetes/**/app.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # Deleting an app folder removes its Application. No child Application
      # has the resources-finalizer, so that does NOT cascade to the app's
      # workloads; decommissioning an app is a deliberate separate step
      # (see docs/runbooks). prune was off during the October 2026
      # restructure and re-enabled after it.
      prune: true
      selfHeal: true

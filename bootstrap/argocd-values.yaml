# argocd-values.yaml
global:
  # OOM protection (docs/projects/oom-protection.md): the CD system is
  # evicted after ordinary pods. Sized 2026-11-07: memory requests from
  # 7-day use, limits ~2x the 30-day peak, CPU requests from the 7-day
  # average, never a CPU limit.
  priorityClassName: homelab-critical
  domain: "argocd.jupitertech.net"  # sets configs.cm.url; empty renders a hostless https://
  # Newest 3.4 patch (chart 10.2.2 ships v3.4.6), 2026-11-08. The two CMP sidecars
  # under repoServer.extraContainers pin the same image: keep all three in step.
  image:
    tag: v3.4.13
  # Chart 10's default, set explicitly: ingress-only NetworkPolicies per
  # component. See kubernetes/platform/system/argocd/chart/values.yaml.
  networkPolicy:
    create: true

server:
  # ~160 MiB typical, 313 MiB peak
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      memory: 768Mi
  service:
    type: LoadBalancer
    annotations:
      # lbipam.cilium.io/ips pins this service to exactly 10.77.20.50 every time.
      # Without this annotation, Cilium picks the next free IP from the pool —
      # fine functionally, but the IP would change after a cluster wipe.
      # With the pin you can bookmark http://10.77.20.50 and it never moves.
      lbipam.cilium.io/ips: "10.77.20.50"

  ingress:
    enabled: false

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring

controller:
  # ~1.25 GiB typical, 1.9 GiB 30-day peak (grows with apps)
  resources:
    requests:
      cpu: 90m
      memory: 1536Mi
    limits:
      memory: 4Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring

configs:
  params:
    # server.insecure: true — ArgoCD serves plain HTTP.
    # This is fine because traffic stays on your local network and the
    # LoadBalancer IP is only reachable inside 10.77.20.0/24.
    # If you later add TLS (cert-manager + Let's Encrypt), set this to false.
    server.insecure: "true"
  cm:
    # Local service account for the Claude Code CLI integration — apiKey-only
    # (no "login" capability, so it can never authenticate with a password).
    accounts.claude-code: apiKey
    application.resourceTrackingMethod: annotation
    # Kubernetes 1.35 adds terminatingReplicas to StatefulSet status but the field
    # is not yet in the schema ArgoCD uses for structured merge diff — suppress globally.
    resource.customizations.ignoreDifferences.apps_StatefulSet: |
      jsonPointers:
        - /status/terminatingReplicas
    # Custom Lua health checks for CRDs ArgoCD doesn't understand natively.
    resource.customizations.health.networking.k8s.io_Ingress: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "Unused: no Ingress controller in this cluster (Gateway API is used)"
      return hs
    resource.customizations.health.monitoring.coreos.com_Prometheus: |
      hs = {}
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, condition in pairs(obj.status.conditions) do
          if condition.type == "Available" and condition.status == "True" then
            hs.status = "Healthy"
            hs.message = "Prometheus is available"
            return hs
          end
        end
      end
      hs.status = "Progressing"
      hs.message = "Waiting for Prometheus to become available"
      return hs
  rbac:
    # Scoped role for the claude-code account: read + trigger sync only.
    # No access to accounts/projects/repos management, no admin fallback.
    policy.csv: |
      p, role:claude-code, applications, get, */*, allow
      p, role:claude-code, applications, sync, */*, allow
      p, role:claude-code, logs, get, */*, allow
      p, role:claude-code, projects, get, *, allow
      p, role:claude-code, repositories, get, *, allow
      g, claude-code, role:claude-code

repoServer:
  # ~120 MiB typical, 356 MiB sampled 7-day peak (2026-11-08). Limit 1Gi:
  # render bursts (e.g. a cold cache after an Argo CD restart) OOM-killed it
  # at 512Mi.
  resources:
    requests:
      cpu: 40m
      memory: 192Mi
    limits:
      memory: 1Gi
  # Volumes shared between the init container and the CMP sidecar.
  volumes:
    - name: sops-age
      secret:
        secretName: sops-age
    - name: custom-tools
      emptyDir: {}
    - name: argocd-cmp-sops
      configMap:
        name: argocd-cmp-sops
    # Plugin config for the cmp-sops-kustomize sidecar (restructured layout).
    - name: argocd-cmp-sops-kustomize
      configMap:
        name: argocd-cmp-sops-kustomize

  # Copies the sops binary from the official image into the shared custom-tools
  # volume. Using a versioned image avoids a wget-at-runtime network call —
  # containerd pulls and caches the image, so the pod starts even if GitHub
  # is temporarily unreachable.
  initContainers:
    - name: install-sops
      image: ghcr.io/getsops/sops:v3.13.3
      command: [cp, /usr/local/bin/sops, /custom-tools/sops]
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 999
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: custom-tools
          mountPath: /custom-tools

  # CMP sidecar — ArgoCD routes SOPS-encrypted source directories through
  # this container. It auto-discovers directories that contain a sops: block,
  # decrypts those files in-memory, and passes plain files through unchanged.
  # The decrypted values never reach disk or git.
  extraContainers:
    - name: cmp-sops
      # plugin sidecar: ~25-100 MiB typical, 115 MiB peak; generous limit, it runs kustomize/helm
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 512Mi
      image: quay.io/argoproj/argocd:v3.4.13
      command: [/var/run/argocd/argocd-cmp-server]
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: SOPS_AGE_KEY_FILE
          value: /home/argocd/.config/sops/age/keys.txt
      volumeMounts:
        # Standard ArgoCD CMP sidecar mounts (created automatically by the chart).
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        # Plugin config from argocd-cmp-configmap.yaml.
        - name: argocd-cmp-sops
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: plugin.yaml
        # Age decryption key (same secret used during manual bootstrap).
        - name: sops-age
          mountPath: /home/argocd/.config/sops/age
          readOnly: true
        # sops binary installed by the init container.
        - name: custom-tools
          mountPath: /usr/local/bin/sops
          subPath: sops

    # Second plugin for the restructured kubernetes/** layout: decrypts
    # *.sops.yaml then runs kustomize build. Plugin config from
    # argocd-cmp-sops-kustomize.yaml; apps opt in with
    # source.plugin.name: sops-kustomize-v1.0.
    - name: cmp-sops-kustomize
      # plugin sidecar: ~25-100 MiB typical, 115 MiB peak; generous limit, it runs kustomize/helm
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
      image: quay.io/argoproj/argocd:v3.4.13
      command: [/var/run/argocd/argocd-cmp-server]
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: SOPS_AGE_KEY_FILE
          value: /home/argocd/.config/sops/age/keys.txt
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: argocd-cmp-sops-kustomize
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: plugin.yaml
        - name: sops-age
          mountPath: /home/argocd/.config/sops/age
          readOnly: true
        - name: custom-tools
          mountPath: /usr/local/bin/sops
          subPath: sops

applicationSet:
  # ~108 MiB typical, 127 MiB peak
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 256Mi

redis:
  # Same 8.2 line as chart 9.5.2's 8.2.3-alpine; Trivy findings, 2026-11-08.
  image:
    tag: 8.2.11-alpine
  # ~16 MiB typical, 52 MiB peak
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

dex:
  # Chart 9.5.2 ships v2.45.1; v2.46.1 for Trivy findings, 2026-11-08.
  image:
    tag: v2.46.1
  # ~41 MiB typical, 112 MiB peak
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

notifications:
  # ~57 MiB typical, 113 MiB peak
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

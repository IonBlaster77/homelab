creation_rules:
  # Talos configs - only encrypt the actual secrets, leave config readable
  - path_regex: (^|/)talos/[^/]+\.yaml$
    age: age1kutgmk5ml0lwf4u53h9um8nfdtjdzgftalpxwlwt2zt63h5l450qeyp7zm
    encrypted_regex: "^(token|key|crt|secret|bootstrapToken|secretboxEncryptionSecret)$"

  # Every Kubernetes Secret in kubernetes/** is named *.sops.yaml
  # (secret.sops.yaml / secret-<name>.sops.yaml), so one rule covers them all
  # regardless of folder. The sops-kustomize Argo CD plugin decrypts exactly
  # these files. Only data/stringData is encrypted, so Argo CD can still read
  # apiVersion/kind/metadata.
  - path_regex: \.sops\.yaml$
    age: age1kutgmk5ml0lwf4u53h9um8nfdtjdzgftalpxwlwt2zt63h5l450qeyp7zm
    encrypted_regex: "^(data|stringData)$"

  # Argo CD bootstrap secrets (applied by hand in the bootstrap runbook)
  - path_regex: (^|/)bootstrap/[^/]*secret[^/]*\.yaml$
    age: age1kutgmk5ml0lwf4u53h9um8nfdtjdzgftalpxwlwt2zt63h5l450qeyp7zm
    encrypted_regex: "^(data|stringData)$"

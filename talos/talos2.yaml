            key: ENC[AES256_GCM,data:,iv:i+IY88vgmfjW8T/9XCJJSggj1X8vEjlWMLbTpEJ+RLs=,tag:eWkZsqahmhUdHfCC44aTOQ==,type:str]
        advertisedSubnets:
            - 10.77.20.0/24
            # # The container image used to create the etcd service.

# Indicates the schema used to decode the contents.
version: v1alpha1
# Enable verbose logging to the console.
debug: false
persist: true
# Provides machine specific configuration options.
machine:
    # Defines the role of the machine within the cluster.
    type: controlplane
    # The `token` is used by a machine to join the PKI of the cluster.
    token: ENC[AES256_GCM,data:zOZOSTnM4oUQLfOwxoK6STFc9vUg1Xk=,iv:xHmnazU4R2RLq/VjbbyN96z9vf/1/27/vz1igUiIwgw=,tag:w1X3nag9u1EapXPnE6oyDA==,type:str]
    # The root certificate authority of the PKI.
    ca:
        crt: ENC[AES256_GCM,data:,iv:TBnoEyD0LQPRWXsYXfYaRx8+kJohAt8o2OyxCuCo7C0=,tag:3JujR0lNxQG1i4uB5t1uWw==,type:str]
        key: ENC[AES256_GCM,data:oTYBU/I6zdD4wpXe+S7CNUzlB6PTovtvIAoIP6BNR9egJObCI1zL11SWsTwEddpkVBqFHQ0u+y4nXiAY/Gcnon0iV3j37B0ukIUy41Qn3I6CKyHncqD0IVCq5oQDVfjlAHoWj+qLkICck1GstieMTfOWKuN7xqo+yYlZMIN42qgiBbQ5pzhY9aq2FvavYVs8E89CrJeHXA+bGp0XAHnxuK2nBEI/yuAH9R8KXlnMWXPzVK92,iv:ErtBuv+G3cqneslluFVy1FwITsDNfBpAVfQ3Nmcb+sg=,tag:IlvAlZUOVfaRykUst6O77Q==,type:str]
    # Extra certificate subject alternative names for the machine's certificate.
    certSANs: []
    #   # Uncomment this to enable SANs.
    #   - 10.0.0.10
    #   - 172.16.0.10
    #   - 192.168.0.10
    # Used to provide additional options to the kubelet.
    kubelet:
        # The `image` field is an optional reference to an alternative kubelet image.
        image: ghcr.io/siderolabs/kubelet:v1.35.8
        # Enable container runtime default Seccomp profile.
        defaultRuntimeSeccompProfileEnabled: true
        # OOM protection layer 4 (docs/projects/oom-protection.md): reserve
        # memory for system + podruntime (etcd/kubelet/containerd) and let the
        # kubelet evict before the node runs dry. Talos only applies its own
        # systemReserved defaults when this map is empty, so cpu,
        # ephemeral-storage and pid restate them. mergeDefaultEvictionSettings
        # keeps unlisted eviction thresholds at their defaults (otherwise 0).
        extraConfig:
            systemReserved:
                cpu: 50m
                memory: 512Mi
                ephemeral-storage: 256Mi
                pid: "100"
            kubeReserved:
                memory: 1536Mi
            mergeDefaultEvictionSettings: true
            evictionHard:
                memory.available: 500Mi
                nodefs.available: 10%
                nodefs.inodesFree: 5%
                imagefs.available: 15%
                imagefs.inodesFree: 5%
            evictionSoft:
                memory.available: 1Gi
            evictionSoftGracePeriod:
                memory.available: 1m30s
            evictionMaxPodGracePeriod: 60
            evictionMinimumReclaim:
                memory.available: 256Mi
        # The `disableManifestsDirectory` field configures the kubelet to get static pod manifests from the /etc/kubernetes/manifests directory.
        disableManifestsDirectory: true
        nodeIP:
            validSubnets:
                - 10.77.20.0/24
                # # The `ClusterDNS` field is an optional reference to an alternative kubelet clusterDNS ip list.
                # clusterDNS:
                #     - 10.96.0.10
                #     - 169.254.2.53
                # # The `extraArgs` field is used to provide additional flags to the kubelet.
                # extraArgs:
                #     key: value
                # # The `extraMounts` field is used to add additional mounts to the kubelet container.
                # extraMounts:
                #     - destination: /var/lib/example # Destination is the absolute path where the mount will be placed in the container.
                #       type: bind # Type specifies the mount kind.
                #       source: /var/lib/example # Source specifies the source path of the mount.
                #       # Options are fstab style mount options.
                #       options:
                #         - bind
                #         - rshared
                #         - rw
                # # The `extraConfig` field is used to provide kubelet configuration overrides.
                # extraConfig:
                #     serverTLSBootstrap: true
                # # The `KubeletCredentialProviderConfig` field is used to provide kubelet credential configuration.
                # credentialProviderConfig:
                #     apiVersion: kubelet.config.k8s.io/v1
                #     kind: CredentialProviderConfig
                #     providers:
                #         - apiVersion: credentialprovider.kubelet.k8s.io/v1
                #           defaultCacheDuration: 12h
                #           matchImages:
                #             - '*.dkr.ecr.*.amazonaws.com'
                #             - '*.dkr.ecr.*.amazonaws.com.cn'
                #             - '*.dkr.ecr-fips.*.amazonaws.com'
                #             - '*.dkr.ecr.us-iso-east-1.c2s.ic.gov'
                #             - '*.dkr.ecr.us-isob-east-1.sc2s.sgov.gov'
                #           name: ecr-credential-provider
                # # The `nodeIP` field is used to configure `--node-ip` flag for the kubelet.
                # nodeIP:
                #     # The `validSubnets` field configures the networks to pick kubelet node IP from.
                #     validSubnets:
                #         - 10.0.0.0/8
                #         - '!10.0.0.3/32'
                #         - fdc7::/16
    # Provides machine specific network configuration options.
    network:
        interfaces:
            - interface: enp0s31f6
              dhcp: false
              addresses:
                - 10.77.20.12/24
              vip:
                ip: 10.77.20.10
              routes:
                - network: 0.0.0.0/0
                  gateway: 10.77.20.1
        nameservers:
            - 10.77.20.1
    disks:
        - device: /dev/nvme0n1
          partitions:
            - mountpoint: /var/lib/longhorn-nvme
              size: 256GB
    # # Configures KubeSpan feature.
    # kubespan:
    #     enabled: true # Enable the KubeSpan feature.
    # Used to provide instructions for installations.
    install:
        # The disk used for installations.
        disk: /dev/sda
        # Allows for supplying the image used to perform the installation.
        #
        # page_owner DEBUG schematic 29ed3086, applied with the v1.12.12
        # upgrade on 2026-11-07 for the memory-leak hunt. IT DOES NOTHING:
        # the Talos kernel has no CONFIG_PAGE_OWNER, so boot logs
        # `Unknown kernel command line parameters "... page_owner=on"` and
        # there is no /proc/page_owner. Harmless (otherwise identical), but
        # switch back to the plain schematic at the next upgrade. To go back to the
        # plain schematic used by the other nodes, upgrade with
        #   factory.talos.dev/installer/203464d7568ceebc8d7d6f16811629d1722c3e1a4d4f2979c85587f19367f17b:v1.12.12
        # and set the image line below to it. A plain reboot or apply-config
        # will NOT change it, because grubUseUKICmdline below means the kernel
        # cmdline comes from the signed UKI rather than being built on the
        # host. That is also why page_owner is baked into a factory schematic
        # instead of machine.install.extraKernelArgs, which this node ignores.
        #
        # Schematic 29ed3086 == 203464d7 (iscsi-tools, nfs-utils,
        # util-linux-tools, dual-boot) plus `extraKernelArgs: [page_owner=on]`
        # (both checked against factory.talos.dev on 2026-11-07).
        #
        # Why: talos2 leaks ~0.46 GiB/day of kernel memory that no counter
        # attributes - not slab, vmalloc, BPF maps, GUP pins, netns/veth, page
        # tables or any cgroup. Measured 2026-08-29: 217 processes summed to
        # 6.16 GiB RSS against 13.96 GiB used, so ~7.8 GiB has no owning process
        # (on healthy talos1 the same sum is 10.66 vs 7.73 - RSS above used, as
        # expected, since shared pages double-count). page_owner records a stack
        # trace per allocated page, so /proc/page_owner names the leaking call
        # site directly. Costs ~64-128 MiB of page_ext on a 16 GiB node.
        #
        # Upgrades keep EPHEMERAL (/var/lib/longhorn on /dev/sda): talosctl 1.12
        # has no --preserve flag any more because it is always on, so the
        # replicas survive and only resync.
        image: factory.talos.dev/installer/29ed30861180b374ed20fef0b1ebeda27c9e94e061a60bb029934378d335c5ac:v1.12.12
        # Indicates if the installation disk should be wiped at installation time.
        wipe: true
        # Indicates if legacy GRUB bootloader should use kernel cmdline from the UKI instead of building it on the host.
        grubUseUKICmdline: true
        # # Look up disk using disk attributes like model, size, serial and others.
        # diskSelector:
        #     size: 4GB # Disk size.
        #     model: WDC* # Disk model `/sys/block/<dev>/device/model`.
        #     busPath: /pci0000:00/0000:00:17.0/ata1/host0/target0:0:0/0:0:0:0 # Disk bus path.
    # Features describe individual Talos features that can be switched on or off.
    features:
        # Enable XFS project quota support for EPHEMERAL partition and user disks.
        diskQuotaSupport: true
        # KubePrism - local proxy/load balancer on defined port that will distribute
        kubePrism:
            # Enable KubePrism support - will start local load balancing proxy.
            enabled: true
            # KubePrism port.
            port: 7445
        # Configures host DNS caching resolver.
        hostDNS:
            # Enable host DNS caching resolver.
            enabled: true
            # Use the host DNS resolver as upstream for Kubernetes CoreDNS pods.
            forwardKubeDNSToHost: true
            # # Configure Talos API access from Kubernetes pods.
            # kubernetesTalosAPIAccess:
            #     enabled: true # Enable Talos API access from Kubernetes pods.
            #     # The list of Talos API roles which can be granted for access from Kubernetes pods.
            #     allowedRoles:
            #         - os:reader
            #     # The list of Kubernetes namespaces Talos API access is available from.
            #     allowedKubernetesNamespaces:
            #         - kube-system
    # Configures the node labels for the machine.
    nodeLabels:
        node.kubernetes.io/exclude-from-external-load-balancers: ""
        node.longhorn.io/create-default-disk: config
        # # Provides machine specific control plane configuration options.
        # # ControlPlane definition example.
        # controlPlane:
        #     # Controller manager machine specific configuration options.
        #     controllerManager:
        #         disabled: false # Disable kube-controller-manager on the node.
        #     # Scheduler machine specific configuration options.
        #     scheduler:
        #         disabled: true # Disable kube-scheduler on the node.
        # # Used to provide static pod definitions to be run by the kubelet directly bypassing the kube-apiserver.
        # # nginx static pod.
        # pods:
        #     - apiVersion: v1
        #       kind: pod
        #       metadata:
        #         name: nginx
        #       spec:
        #         containers:
        #             - image: nginx
        #               name: nginx
        # # Allows the addition of user specified files.
        # # MachineFiles usage example.
        # files:
        #     - content: '...' # The contents of the file.
        #       permissions: 0o666 # The file's permissions in octal.
        #       path: /tmp/file.txt # The path of the file.
        #       op: append # The operation to use
        # # The `env` field allows for the addition of environment variables.
        # # Environment variables definition examples.
        # env:
        #     GRPC_GO_LOG_SEVERITY_LEVEL: info
        #     GRPC_GO_LOG_VERBOSITY_LEVEL: "99"
        #     https_proxy: http://SERVER:PORT/
        # env:
        #     GRPC_GO_LOG_SEVERITY_LEVEL: error
        #     https_proxy: https://USERNAME:PASSWORD@SERVER:PORT/
        # env:
        #     https_proxy: http://DOMAIN\USERNAME:PASSWORD@SERVER:PORT/
        # # Used to configure the machine's sysctls.
        # # MachineSysctls usage example.
        # sysctls:
        #     kernel.domainname: talos.dev
        #     net.ipv4.ip_forward: "0"
        #     net/ipv6/conf/eth0.100/disable_ipv6: "1"
        # # Used to configure the machine's sysfs.
        # # MachineSysfs usage example.
        # sysfs:
        #     devices.system.cpu.cpu0.cpufreq.scaling_governor: performance
        # # Configures the udev system.
        # udev:
        #     # List of udev rules to apply to the udev system
        #     rules:
        #         - SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="44", MODE="0660"
        # # Configures the logging system.
        # logging:
        #     # Logging destination.
        #     destinations:
        #         - endpoint: tcp://1.2.3.4:12345 # Where to send logs. Supported protocols are "tcp" and "udp".
        #           format: json_lines # Logs format.
        # # Configures the kernel.
        # kernel:
        #     # Kernel modules to load.
        #     modules:
        #         - name: btrfs # Module name.
        # # Configures the seccomp profiles for the machine.
        # seccompProfiles:
        #     - name: audit.json # The `name` field is used to provide the file name of the seccomp profile.
        #       # The `value` field is used to provide the seccomp profile.
        #       value:
        #         defaultAction: SCMP_ACT_LOG
        # # Override (patch) settings in the default OCI runtime spec for CRI containers.
        # # override default open file limit
        # baseRuntimeSpecOverrides:
        #     process:
        #         rlimits:
        #             - hard: 1024
        #               soft: 1024
        #               type: RLIMIT_NOFILE
    # Configures the node annotations for the machine.
    nodeAnnotations:
        node.longhorn.io/default-disks-config: '[{"path":"/var/lib/longhorn","allowScheduling":true,"storageReserved":42949672960,"tags":["ssd"]},{"path":"/var/lib/longhorn-nvme","allowScheduling":true,"storageReserved":10737418240,"tags":["nvme"]}]'
        # # Configures the node taints for the machine. Effect is optional.
        # # node taints example.
        # nodeTaints:
        #     exampleTaint: exampleTaintValue:NoSchedule
# Provides cluster specific configuration options.
cluster:
    # Globally unique identifier for this cluster (base64 encoded random 32 bytes).
    id: Ze65t7ZWu0npCYgrOD8qTLVFTOSTvmCBh5a4eiMND5E=
    # Shared secret of cluster (base64 encoded random 32 bytes).
    secret: ENC[AES256_GCM,data:j2nS3dqWzDCh3OPKntesjaMcGrLZd1jvyYbGpgzA25lQJgkoevKfou3U6eM=,iv:ghv7y6GFxbhNN/ywEPp29Fx8EVIiz2Ve1q0DFOGWNXQ=,tag:BjNNDzoU/0npjuEmwbHFNg==,type:str]
    # Provides control plane specific configuration options.
    controlPlane:
        # Endpoint is the canonical controlplane endpoint, which can be an IP address or a DNS hostname.
        endpoint: https://10.77.20.10:6443
    # Configures the cluster's name.
    clusterName: homelab
    # Provides cluster specific network configuration options.
    network:
        # The domain used by Kubernetes DNS.
        dnsDomain: cluster.local
        # The pod subnet CIDR.
        podSubnets:
            - 10.244.0.0/16
        # The service subnet CIDR.
        serviceSubnets:
            - 10.96.0.0/12
        # The CNI used.
        cni:
            name: none
    # The [bootstrap token](https://kubernetes.io/docs/reference/access-authn-authz/bootstrap-tokens/) used to join the cluster.
    token: ENC[AES256_GCM,data:94LYNHTjQ9xXTHc1Qd+mN3Sn2r/2/qg=,iv:xXO4e3OCFmsDgfoiMWUNDJ3mCbAR/1ZQqIYU0juUKwA=,tag:y5vAs+bGFSazZfyXUf5WNw==,type:str]
    # A key used for the [encryption of secret data at rest](https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/).
    secretboxEncryptionSecret: ENC[AES256_GCM,data:VZlG2GXCWynDcTIwj3nVYnk7w8WtsaCksuhnILxR9bAz+QuSooB4LIHx+9g=,iv:u+RhJuVBTCMlk9+xPtIOnGwggs1RDEy4ViUGmjocXtg=,tag:YoRkkiw+OxPAK53UknJLbw==,type:str]
    # The base64 encoded root certificate authority used by Kubernetes.
    ca:
        crt: ENC[AES256_GCM,data:,iv:144fg4NDuCnVRtyr6NCkiy1GiS6wkPDqpDC1w9C6gQQ=,tag:j4rykgS4Yn7eZiBbhdspQA==,type:str]
        key: ENC[AES256_GCM,data:,iv:lf0lJJQl4fxQ3MxoVA76LShE/cBZy6SNy94/k+d7iVE=,tag:SCvj/8fOWav2KqKQw8XBGg==,type:str]
    # The base64 encoded aggregator certificate authority used by Kubernetes for front-proxy certificate generation.
    aggregatorCA:
        crt: ENC[AES256_GCM,data:,iv:VdX37PGXd+uZGQogRsK2AJLsIqyCoZTzGU5hAUfids8=,tag:Cqv/RUTImjocMTWEflxSFg==,type:str]
        key: ENC[AES256_GCM,data:,iv:6Zxtm08sznqtmaU435AeNEbOkVRxLwc54wELyUxyRgw=,tag:vTpTLhjD3+mZepW4pgyo5Q==,type:str]
    # The base64 encoded private key for service account token generation.
    serviceAccount:
        key: ENC[AES256_GCM,data:,iv:ZvInZ0fR4AW3ZJ+rupaAdtGOTZvn7i/37evv1UWOFks=,tag:9wCeyfNi3R1jZY+wE2Qefg==,type:str]
    # API server specific configuration options.
    apiServer:
        # The container image used in the API server manifest.
        image: registry.k8s.io/kube-apiserver:v1.35.8
        # OOM protection batch 5 (docs/projects/oom-protection.md): request
        # only, no limit. Memory 2Gi is below real use (7-day average
        # 3.1-3.7 GiB) on purpose while talos3 is ~84% requested; raise it
        # to ~3.5Gi once the two new nodes join. CPU = 7-day average.
        resources:
            requests:
                cpu: 250m
                memory: 2Gi
        extraArgs:
            advertise-address: 10.77.20.12
        # Configure the API server admission plugins.
        admissionControl:
            # Name is the name of the admission controller.
            - name: PodSecurity
              # Configuration is an embedded configuration object to be used as the plugin's
              configuration:
                apiVersion: pod-security.admission.config.k8s.io/v1alpha1
                defaults:
                    audit: restricted
                    audit-version: latest
                    enforce: baseline
                    enforce-version: latest
                    warn: restricted
                    warn-version: latest
                exemptions:
                    namespaces:
                        - kube-system
                    runtimeClasses: []
                    usernames: []
                kind: PodSecurityConfiguration
        # Configure the API server audit policy.
        auditPolicy:
            apiVersion: audit.k8s.io/v1
            kind: Policy
            rules:
                - level: Metadata
                  # # Configure the API server authorization config. Node and RBAC authorizers are always added irrespective of the configuration.
                  # authorizationConfig:
                  #     - type: Webhook # Type is the name of the authorizer. Allowed values are `Node`, `RBAC`, and `Webhook`.
                  #       name: webhook # Name is used to describe the authorizer.
                  #       # webhook is the configuration for the webhook authorizer.
                  #       webhook:
                  #         connectionInfo:
                  #             type: InClusterConfig
                  #         failurePolicy: Deny
                  #         matchConditionSubjectAccessReviewVersion: v1
                  #         matchConditions:
                  #             - expression: has(request.resourceAttributes)
                  #             - expression: '!(\''system:serviceaccounts:kube-system\'' in request.groups)'
                  #         subjectAccessReviewVersion: v1
                  #         timeout: 3s
                  #     - type: Webhook # Type is the name of the authorizer. Allowed values are `Node`, `RBAC`, and `Webhook`.
                  #       name: in-cluster-authorizer # Name is used to describe the authorizer.
                  #       # webhook is the configuration for the webhook authorizer.
                  #       webhook:
                  #         connectionInfo:
                  #             type: InClusterConfig
                  #         failurePolicy: NoOpinion
                  #         matchConditionSubjectAccessReviewVersion: v1
                  #         subjectAccessReviewVersion: v1
                  #         timeout: 3s
    # Controller manager server specific configuration options.
    controllerManager:
        # The container image used in the controller manager manifest.
        image: registry.k8s.io/kube-controller-manager:v1.35.8
    # Kube-proxy server-specific configuration options
    proxy:
        # The container image used in the kube-proxy manifest.
        image: registry.k8s.io/kube-proxy:v1.35.8
        disabled: true
    # Scheduler server specific configuration options.
    scheduler:
        # The container image used in the scheduler manifest.
        image: registry.k8s.io/kube-scheduler:v1.35.8
    # Configures cluster member discovery.
    discovery:
        # Enable the cluster membership discovery feature.
        enabled: true
        # Configure registries used for cluster member discovery.
        registries:
            # Kubernetes registry uses Kubernetes API server to discover cluster members and stores additional information
            kubernetes:
                # Disable Kubernetes discovery registry.
                disabled: true
            # Service registry is using an external service to push and pull information about cluster members.
            service: {}
            # # External service endpoint.
            # endpoint: https://discovery.talos.dev/
    # Etcd specific configuration options.
    etcd:
        # The `ca` is the root certificate authority of the PKI.
        ca:
            crt: ENC[AES256_GCM,data:,iv:KSGlp2cNYMG9OkYm2IX/N5aOpsUfwg9QC6lT1WyN9yg=,tag:bntM+DSUOoKDx3sVXFrE7Q==,type:str]
            key: ENC[AES256_GCM,data:,iv:lkcOqvo8m6MBPedtcIQET70nKEW9ubjKIEM6NCej41c=,tag:T8FAgAwNewb9smeXaUn9qg==,type:str]
        advertisedSubnets:
            - 10.77.20.0/24
            # # The container image used to create the etcd service.
            # image: registry.k8s.io/etcd:v3.6.7
            # # The `advertisedSubnets` field configures the networks to pick etcd advertised IP from.
            # advertisedSubnets:
            #     - 10.0.0.0/8
    # A list of urls that point to additional manifests.
    extraManifests: []
    #   - https://www.example.com/manifest1.yaml
    #   - https://www.example.com/manifest2.yaml
    # A list of inline Kubernetes manifests.
    inlineManifests: []
    #   - name: namespace-ci # Name of the manifest.
    #     contents: |- # Manifest contents as a string.
    #       apiVersion: v1
    #       kind: Namespace
    #       metadata:
    #       	name: ci
    # # A key used for the [encryption of secret data at rest](https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/).
    # # Decryption secret example (do not use in production!).
    # aescbcEncryptionSecret: z01mye6j16bspJYtTB/5SFX8j7Ph4JXxM2Xuu4vsBPM=
    # # Core DNS specific configuration options.
    # coreDNS:
    #     image: registry.k8s.io/coredns/coredns:v1.13.2 # The `image` field is an override to the default coredns image.
    # # External cloud provider configuration.
    # externalCloudProvider:
    #     enabled: true # Enable external cloud provider.
    #     # A list of urls that point to additional manifests for an external cloud provider.
    #     manifests:
    #         - https://raw.githubusercontent.com/kubernetes/cloud-provider-aws/v1.20.0-alpha.0/manifests/rbac.yaml
    #         - https://raw.githubusercontent.com/kubernetes/cloud-provider-aws/v1.20.0-alpha.0/manifests/aws-cloud-controller-manager-daemonset.yaml
    # # A map of key value pairs that will be added while fetching the extraManifests.
    # extraManifestHeaders:
    #     Token: "1234567"
    #     X-ExtraInfo: info
    # # Settings for admin kubeconfig generation.
    # adminKubeconfig:
    #     certLifetime: 1h0m0s # Admin kubeconfig certificate lifetime (default is 1 year).
    # # Allows running workload on control-plane nodes.
    allowSchedulingOnControlPlanes: true

        key: ENC[AES256_GCM,data:,iv:1P11Od5bKre44MKMgv1bTX/hMtSZhOW12/EmCUpzjrU=,tag:Cp+Vz8FoZu9hdalK4ObeGQ==,type:str]
    # The base64 encoded aggregator certificate authority used by Kubernetes for front-proxy certificate generation.
    aggregatorCA:
        crt: ENC[AES256_GCM,data:,iv:JALYDX/2y9SptbrD7L+DgxgIjrtz5HuvRsmAFobA5Hk=,tag:0oQK2/c8LImWqzXai2ruWw==,type:str]
        key: ENC[AES256_GCM,data:,iv:1BPQk0LWkjZrm+s7j38u5SoEKQBRPm6kVdlRbQgkXsw=,tag:noex03qLCSAvJHr1tP/bXw==,type:str]

            key: ENC[AES256_GCM,data:,iv:y9aNVgMPBjX4ChKg3/uH7DhPKShH033+nNS7f/Mxs/8=,tag:3q41T41TzwM/Pt/S9rL2FQ==,type:str]
        advertisedSubnets:
            - 10.77.20.0/24
            # # The container image used to create the etcd service.

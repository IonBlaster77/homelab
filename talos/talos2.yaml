        key: ENC[AES256_GCM,data:,iv:NR7BPhrPOI71sPj0c8xPJCRjPkjqYkG+QyFHeaYQnmo=,tag:NmOcJCMgw2CUD9hkLCrCMg==,type:str]
    # The base64 encoded aggregator certificate authority used by Kubernetes for front-proxy certificate generation.
    aggregatorCA:
        crt: ENC[AES256_GCM,data:,iv:3hgQ+/p8FPO0gbl+jrYPn4/UxfAOzbuSWkjZ6aUu90g=,tag:FgoWRsGwMWUJQ+Mw2YxY9w==,type:str]
        key: ENC[AES256_GCM,data:,iv:PVqVkfPLwAgVlYJyMfbQMOr5yUkVhF9+E0IjCbjcQ78=,tag:YYYu+B8q0XUL0L23GukRPQ==,type:str]

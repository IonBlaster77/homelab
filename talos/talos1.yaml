    # Provides machine specific network configuration options.
    network:
        interfaces:
            - interface: enp0s31f6
              dhcp: false
              addresses:
                - 10.77.20.11/24
              vip:
                ip: 10.77.20.10
              routes:
                - network: 0.0.0.0/0
                  gateway: 10.77.20.1

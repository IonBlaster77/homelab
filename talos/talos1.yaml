    token: ENC[AES256_GCM,data:uBE/pjheiRbFGnX5/apbR10l1EPkXd4=,iv:g433e1x7jOTWqhJO+IeG8+2RmHe8Htb51AB0xLtsR+E=,tag:NAUp3ThveGZyGWnSnA62dw==,type:str]

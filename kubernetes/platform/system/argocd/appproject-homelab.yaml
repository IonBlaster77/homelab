# Brings the `homelab` AppProject under GitOps - it existed only as a manual
# `kubectl apply` before this (no prior source file, confirmed via the
# last-applied-configuration annotation on the live resource). Adding the
# external-snapshotter repo here (task #13) is what triggered writing this
# down instead of doing another one-off manual edit.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
spec:
  description: HomeLab production cluster
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  sourceRepos:
    - https://github.com/IonBlaster77/homelab.git
    - https://charts.goauthentik.io
    - https://helm.runix.net
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://github.com/kubernetes-csi/external-snapshotter.git
    # Upstream charts of apps moved from the default project (2026-10)
    - https://argoproj.github.io/argo-helm
    - https://charts.jetstack.io
    - https://charts.longhorn.io
    - https://cloudnative-pg.github.io/charts
    - https://grafana.github.io/helm-charts
    - https://jameswynn.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - ghcr.io/element-hq/ess-helm

# ArgoCD values — nested under "argo-cd:" because this is an umbrella chart.
# The subchart name in Chart.yaml is "argo-cd", so Helm requires all values
# to live under that key.  These must stay in sync with:
#   bootstrap/argocd-values.yaml  (used for manual bootstrap)
#
# To upgrade ArgoCD:
#   1. Bump version in Chart.yaml dependencies
#   2. Run: helm dependency update kubernetes/platform/system/argocd/chart
#   3. Commit Chart.lock and the new charts/argo-cd-X.Y.Z.tgz, delete the old .tgz
#   4. Manually sync the "argocd" ArgoCD Application

argo-cd:
  global:
    # OOM protection (docs/projects/oom-protection.md): the CD system is
    # evicted after ordinary pods. Sized 2026-11-07: memory requests from
    # 7-day use, limits ~2x the 30-day peak, CPU requests from the 7-day
    # average, never a CPU limit.
    priorityClassName: homelab-critical
    # Sets configs.cm.url (https://<domain>) — used for web-UI generated links
    # and OIDC/SSO callback URLs. Empty renders a hostless "https://". This is the
    # Cilium Gateway HTTPRoute host (argocd.jupitertech.net).
    domain: "argocd.jupitertech.net"
    # Newest 3.4 patch (chart 9.7.1 ships v3.4.4), 2026-11-08. The two CMP sidecars
    # under repoServer.extraContainers pin the same image: keep all three in step.
    image:
      tag: v3.4.13

  server:
    # ~160 MiB typical, 313 MiB peak
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 768Mi
    service:
      type: LoadBalancer
      annotations:
        # lbipam.cilium.io/ips pins this service to exactly 10.77.20.50 every time.
        lbipam.cilium.io/ips: "10.77.20.50"
    ingress:
      enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: monitoring

  controller:
    # ~1.25 GiB typical, 1.9 GiB 30-day peak (grows with apps)
    resources:
      requests:
        cpu: 90m
        memory: 1536Mi
      limits:
        memory: 4Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: monitoring

  configs:
    params:
      # server.insecure: true — ArgoCD serves plain HTTP.
      # Traffic stays on your local network; the LB IP is only reachable inside 10.77.20.0/24.
      server.insecure: "true"
    cm:
      # Local service account for the Claude Code CLI integration — apiKey-only
      # (no "login" capability, so it can never authenticate with a password).
      accounts.claude-code: apiKey
      application.resourceTrackingMethod: annotation
      # Kubernetes 1.35 adds terminatingReplicas to StatefulSet status but the field
      # is not yet in the schema ArgoCD uses for structured merge diff — suppress globally.
      resource.customizations.ignoreDifferences.apps_StatefulSet: |
        jsonPointers:
          - /status/terminatingReplicas
      # This cluster routes with Gateway API and has NO Ingress controller, so
      # Ingresses a chart renders anyway (e.g. Element's ESS chart for Matrix)
      # never get a load-balancer address. Argo CD's built-in check would keep
      # them "Progressing" forever and hold every sync of that app open.
      resource.customizations.health.networking.k8s.io_Ingress: |
        hs = {}
        hs.status = "Healthy"
        hs.message = "Unused: no Ingress controller in this cluster (Gateway API is used)"
        return hs
      # Custom Lua health checks for CRDs ArgoCD doesn't understand natively.
      resource.customizations.health.monitoring.coreos.com_Prometheus: |
        hs = {}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for _, condition in pairs(obj.status.conditions) do
            if condition.type == "Available" and condition.status == "True" then
              hs.status = "Healthy"
              hs.message = "Prometheus is available"
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for Prometheus to become available"
        return hs
    rbac:
      # Scoped role for the claude-code account: read + trigger sync only.
      # No access to accounts/projects/repos management, no admin fallback.
      policy.csv: |
        p, role:claude-code, applications, get, */*, allow
        p, role:claude-code, applications, sync, */*, allow
        p, role:claude-code, logs, get, */*, allow
        p, role:claude-code, projects, get, *, allow
        p, role:claude-code, repositories, get, *, allow
        g, claude-code, role:claude-code

  repoServer:
    # ~120 MiB typical, 356 MiB sampled 7-day peak (2026-11-08). Limit raised
    # 512Mi -> 1Gi: bursts while rendering many apps at once (e.g. a cold cache
    # right after an Argo CD restart) OOM-killed it ~4 times in 30 days, which
    # turns every app's sync status "Unknown" until it restarts.
    resources:
      requests:
        cpu: 40m
        memory: 192Mi
      limits:
        memory: 1Gi
    volumes:
      - name: sops-age
        secret:
          secretName: sops-age
      - name: custom-tools
        emptyDir: {}
      - name: argocd-cmp-sops
        configMap:
          name: argocd-cmp-sops
      # Plugin config for the cmp-sops-kustomize sidecar (restructured
      # kubernetes/** layout); see bootstrap/argocd-cmp-sops-kustomize.yaml.
      - name: argocd-cmp-sops-kustomize
        configMap:
          name: argocd-cmp-sops-kustomize

    initContainers:
      - name: install-sops
        image: ghcr.io/getsops/sops:v3.13.3
        command: [cp, /usr/local/bin/sops, /custom-tools/sops]
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: custom-tools
            mountPath: /custom-tools

    extraContainers:
      - name: cmp-sops
        # plugin sidecar: ~25-100 MiB typical, 115 MiB peak; generous limit, it runs kustomize/helm
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 512Mi
        image: quay.io/argoproj/argocd:v3.4.13
        command: [/var/run/argocd/argocd-cmp-server]
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: SOPS_AGE_KEY_FILE
            value: /home/argocd/.config/sops/age/keys.txt
        volumeMounts:
          - name: var-files
            mountPath: /var/run/argocd
          - name: plugins
            mountPath: /home/argocd/cmp-server/plugins
          - name: argocd-cmp-sops
            mountPath: /home/argocd/cmp-server/config/plugin.yaml
            subPath: plugin.yaml
          - name: sops-age
            mountPath: /home/argocd/.config/sops/age
            readOnly: true
          - name: custom-tools
            mountPath: /usr/local/bin/sops
            subPath: sops
      # Second plugin for the restructured layout: decrypt *.sops.yaml, then
      # kustomize build (handles component subfolders). Same image, key and
      # sops binary as cmp-sops; only the plugin config differs. Apps opt in
      # with source.plugin.name: sops-kustomize-v1.0.
      - name: cmp-sops-kustomize
        # plugin sidecar: ~25-100 MiB typical, 115 MiB peak; generous limit, it runs kustomize/helm
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi
        image: quay.io/argoproj/argocd:v3.4.13
        command: [/var/run/argocd/argocd-cmp-server]
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: SOPS_AGE_KEY_FILE
            value: /home/argocd/.config/sops/age/keys.txt
        volumeMounts:
          - name: var-files
            mountPath: /var/run/argocd
          - name: plugins
            mountPath: /home/argocd/cmp-server/plugins
          - name: argocd-cmp-sops-kustomize
            mountPath: /home/argocd/cmp-server/config/plugin.yaml
            subPath: plugin.yaml
          - name: sops-age
            mountPath: /home/argocd/.config/sops/age
            readOnly: true
          - name: custom-tools
            mountPath: /usr/local/bin/sops
            subPath: sops

  applicationSet:
    # ~108 MiB typical, 127 MiB peak
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 256Mi

  redis:
    # Same 8.2 line as chart 9.7.1's 8.2.3-alpine; Trivy findings, 2026-11-08.
    image:
      tag: 8.2.11-alpine
    # ~16 MiB typical, 52 MiB peak
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  dex:
    # Chart 9.7.1 ships v2.45.1; v2.46.1 for Trivy findings, 2026-11-08.
    image:
      tag: v2.46.1
    # ~41 MiB typical, 112 MiB peak
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

  notifications:
    # ~57 MiB typical, 113 MiB peak
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

apiVersion: v2
name: argocd-wrapper
description: >
  Umbrella chart wrapping the upstream argo-cd Helm chart.
  Using a git-path source instead of a direct Helm repo source avoids
  the ArgoCD v3 semver bug ("improper constraint: HEAD") that fires
  on GenerateManifest when the repoURL is a Helm HTTP index.
  ArgoCD renders the archive committed in charts/ as is (it only runs
  `helm dependency build` when the dependency is missing there), so
  the .tgz must match the version below: bump them together with
  `helm dependency update` (repo-lint's `vendored` check enforces it).
type: application
version: 0.1.0
dependencies:
  - name: argo-cd
    version: 10.17.2
    repository: https://argoproj.github.io/argo-helm

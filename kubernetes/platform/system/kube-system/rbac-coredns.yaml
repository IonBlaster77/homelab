# CoreDNS identity and read-only API access (list/watch Services,
# EndpointSlices, Pods, Namespaces for the kubernetes plugin). Adopted from
# Talos 2026-11-22 unchanged, see deployment-coredns.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    # Not Talos's: stops `talosctl upgrade-k8s` pruning it (deployment-coredns.yaml)
    config.k8s.io/owning-inventory: argocd
  name: coredns
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations:
    # Not Talos's: stops `talosctl upgrade-k8s` pruning it (deployment-coredns.yaml)
    config.k8s.io/owning-inventory: argocd
  labels:
    kubernetes.io/bootstrapping: rbac-defaults
  name: system:coredns
rules:
  - apiGroups:
      - ""
    resources:
      - endpoints
      - services
      - pods
      - namespaces
    verbs:
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    # Not Talos's: stops `talosctl upgrade-k8s` pruning it (deployment-coredns.yaml)
    config.k8s.io/owning-inventory: argocd
    rbac.authorization.kubernetes.io/autoupdate: "true"
  labels:
    kubernetes.io/bootstrapping: rbac-defaults
  name: system:coredns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:coredns
subjects:
  - kind: ServiceAccount
    name: coredns
    namespace: kube-system

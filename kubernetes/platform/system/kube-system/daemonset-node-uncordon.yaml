apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-uncordon
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: node-uncordon
  template:
    metadata:
      labels:
        app: node-uncordon
    spec:
      serviceAccountName: node-uncordon
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      initContainers:
        - name: uncordon
          image: registry.k8s.io/kubectl:v1.36.6
          command: ["kubectl", "uncordon"]
          args: ["$(NODE_NAME)"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
          resources:
            requests:
              cpu: 1m
              memory: 1Mi

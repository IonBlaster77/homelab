# CoreDNS: DNS for every pod (Service kube-dns, 10.96.0.10).
#
# Owned by Argo CD since 2026-11-22. Before that Talos rendered it as a
# bootstrap manifest and only this app's ConfigMap was ours. Talos 1.13's
# `talosctl upgrade-k8s` re-applies ALL bootstrap manifests with server-side
# apply and an inventory, which would have reset our Corefile to stock
# `forward . /etc/resolv.conf` (losing the AdGuard rewrites) and fought
# Argo CD over ownership on every Kubernetes upgrade. So the whole CoreDNS set
# now lives here and Talos's copy is switched off (`cluster.coreDNS.disabled:
# true` in talos/*.yaml).
#
# Adopted exactly as Talos rendered it (image v1.14.2), so taking ownership
# changed nothing and restarted nothing. Renovate tracks the image from here
# on: CoreDNS updates now arrive as normal PRs, independent of Talos and
# Kubernetes upgrades. CoreDNS is backwards compatible across Kubernetes
# minors, but read its release notes for plugin changes before merging.
#
# GOMEMLIMIT (161MiB) is Talos's value: ~95% of the 170Mi limit, so the Go GC
# works harder before the cgroup OOM killer steps in. Keep the two in step.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    # Marks this object as NOT Talos's. Talos 1.13's `upgrade-k8s` keeps an
    # inventory (kube-system/talos-bootstrap-manifests-inventory) of the
    # bootstrap objects it created and prunes any it no longer renders; with
    # Talos's CoreDNS disabled that would delete all of CoreDNS. cli-utils never
    # prunes an object whose owning-inventory names someone else (default
    # policy AdoptIfNoInventory). Set on all six CoreDNS objects; keep it.
    config.k8s.io/owning-inventory: argocd
  labels:
    k8s-app: kube-dns
    kubernetes.io/name: CoreDNS
  name: coredns
  namespace: kube-system
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      k8s-app: kube-dns
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        k8s-app: kube-dns
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: k8s-app
                      operator: In
                      values:
                        - kube-dns
                topologyKey: kubernetes.io/hostname
              weight: 100
      containers:
        - args:
            - -conf
            - /etc/coredns/Corefile
          env:
            - name: GOMEMLIMIT
              value: 161MiB
          image: registry.k8s.io/coredns/coredns:v1.14.2
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          name: coredns
          ports:
            - containerPort: 53
              name: dns
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 9153
              name: metrics
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ready
              port: 8181
              scheme: HTTP
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              memory: 170Mi
            requests:
              cpu: 100m
              memory: 70Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/coredns
              name: config-volume
              readOnly: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccountName: coredns
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node.cloudprovider.kubernetes.io/uninitialized
          operator: Exists
      volumes:
        - configMap:
            defaultMode: 420
            items:
              - key: Corefile
                path: Corefile
            name: coredns
          name: config-volume

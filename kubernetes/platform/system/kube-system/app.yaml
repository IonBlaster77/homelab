# kube-system: the few things this repo manages inside the kube-system
# namespace (Talos owns the rest): the CoreDNS config, and node-uncordon.
# See README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-system
  namespace: argocd
  annotations:
    # Required with ServerSideApply, or Argo CD shows phantom OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: homelab
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    targetRevision: HEAD
    path: kubernetes/platform/system/kube-system
    plugin:
      name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # kube-system always exists (Talos creates it); never let Argo CD try.
      - CreateNamespace=false

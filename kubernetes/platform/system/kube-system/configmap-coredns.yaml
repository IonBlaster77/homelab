# The Corefile. Originally a Talos bootstrap manifest; Argo CD managed only
# this ConfigMap until 2026-11-22, when it took over the whole CoreDNS set
# (Deployment, Service, RBAC) and Talos's copy was disabled with
# `cluster.coreDNS.disabled: true`. Reason: Talos 1.13's `upgrade-k8s`
# re-applies bootstrap manifests with server-side apply and would have reset
# this file to stock on every Kubernetes upgrade. See deployment-coredns.yaml.
#
# Change from stock: `forward . /etc/resolv.conf` -> `forward . 10.77.20.53 10.77.20.1`
#   - 10.77.20.53 (adguard-dns LoadBalancer) is primary: gives every pod
#     ad-blocking and the *.jupitertech.net rewrites, not just clients that
#     query AdGuard directly.
#   - 10.77.20.1 (the router) is the secondary upstream. CoreDNS's forward
#     plugin health-checks upstreams and automatically fails over — if AdGuard
#     is down or still booting (e.g. cold start after a full power outage,
#     waiting on its Longhorn PVC), pod DNS keeps working via the router
#     without any manual intervention, then prefers AdGuard again once it's
#     healthy. Node-level DNS is untouched (nodes still point at 10.77.20.1
#     directly per talos/*.yaml at the repo root) — that's the literal
#     "boot off the router" fallback and requires no change.
#   - Both are IPs, not hostnames: forwarding to a hostname CoreDNS itself
#     would need to resolve is circular.
#   - `policy sequential` is required: the forward plugin's DEFAULT policy is
#     `random` load-balancing across all listed upstreams per query, not
#     "primary then failover". Without `sequential` this was observed live —
#     CoreDNS randomly picked the router for ~half of queries, and since the
#     router has no *.jupitertech.net rewrites those resolved NXDOMAIN. Only
#     `sequential` tries 10.77.20.53 first and falls through to 10.77.20.1
#     when (and only when) the current upstream is unhealthy.
#
# `reload` is already enabled below, so this takes effect within ~45s of
# the ConfigMap changing — no coredns pod restart required.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . 10.77.20.53 10.77.20.1 {
           policy sequential
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }

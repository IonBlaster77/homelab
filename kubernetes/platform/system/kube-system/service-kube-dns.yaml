# The cluster DNS Service. Every pod's /etc/resolv.conf points at
# 10.96.0.10 (the kubelet's clusterDNS), so clusterIP is pinned here and must
# never change: it is immutable, and a different IP would break DNS for every
# pod until each one restarted. Adopted from Talos 2026-11-22, see
# deployment-coredns.yaml.
apiVersion: v1
kind: Service
metadata:
  annotations:
    # Not Talos's: stops `talosctl upgrade-k8s` pruning it (deployment-coredns.yaml)
    config.k8s.io/owning-inventory: argocd
    prometheus.io/port: "9153"
    prometheus.io/scrape: "true"
  labels:
    k8s-app: kube-dns
    kubernetes.io/cluster-service: "true"
    kubernetes.io/name: CoreDNS
  name: kube-dns
  namespace: kube-system
spec:
  clusterIP: 10.96.0.10
  clusterIPs:
    - 10.96.0.10
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - name: dns
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
    - name: metrics
      port: 9153
      protocol: TCP
      targetPort: 9153
  selector:
    k8s-app: kube-dns
  sessionAffinity: None
  type: ClusterIP

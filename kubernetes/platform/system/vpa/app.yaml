# Vertical Pod Autoscaler, recommender only. It watches the critical
# workloads listed in verticalpodautoscalers.yaml and publishes suggested
# CPU/memory requests. Nothing is ever changed automatically: there is no
# updater and no admission webhook, and every VPA object is updateMode "Off".
# See README.md.
# Rendered with Kustomize helmCharts (sops-kustomize plugin, like the
# descheduler), so the chart repo doesn't need to be in sourceRepos.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpa
  namespace: argocd
  annotations:
    # Required with ServerSideApply below, or Argo CD shows phantom OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: homelab
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    targetRevision: HEAD
    path: kubernetes/platform/system/vpa
    plugin:
      name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: vpa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

# One VPA per critical workload, recommend only (updateMode "Off"): VPA
# publishes suggested requests in each object's status and never changes a
# pod. Read them with `kubectl get vpa -A` or the "Resource drift" Grafana
# dashboard. Scope = the pods that got requests/limits in the 2026-11-07 OOM
# work (docs/projects/oom-protection.md); add more here as needed.
# SkipDryRunOnMissingResource: the VPA CRD is created by the same sync.
---
# DNS and DHCP
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: adguard-primary
  namespace: adguard
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: adguard-primary
  updatePolicy:
    updateMode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler

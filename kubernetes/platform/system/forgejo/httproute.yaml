# forge.jupitertech.net: the Forgejo web UI, HTTPS git and the API, via the
# chart's forgejo-http Service. LAN-ONLY for now: AdGuard resolves it to the
# Gateway and there is no Cloudflare record. It goes public (Cloudflare
# Access + Authentik with 2FA) once Authentik sign-in works; see README.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: networking
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: networking
      sectionName: https
  hostnames:
    - forge.jupitertech.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: forgejo-http
          namespace: forgejo
          port: 3000

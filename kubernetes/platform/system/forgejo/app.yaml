# Forgejo: the self-hosted git forge (task #51, docs/projects/forgejo.md).
# See README.md.
#
# Single source: the chart is rendered by Kustomize (helmCharts in
# kustomization.yaml, pulled from code.forgejo.org's OCI registry) inside the
# sops-kustomize plugin, as Nextcloud and Harbor are, so this folder's secrets
# and manifests ship in the same app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
  annotations:
    # Required with ServerSideApply, or Argo CD shows phantom OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: homelab
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    targetRevision: HEAD
    path: kubernetes/platform/system/forgejo
    plugin:
      name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

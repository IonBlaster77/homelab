# Renders the Forgejo chart (helmCharts, needs the plugin's --enable-helm)
# plus this folder's own manifests. app.yaml is deliberately NOT listed: it
# is picked up by the root app. *.sops.yaml files are decrypted by the
# sops-kustomize plugin before this runs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: forgejo
    repo: oci://code.forgejo.org/forgejo-helm
    version: 17.3.2
    releaseName: forgejo
    namespace: forgejo
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - secret-forgejo-admin.sops.yaml
  # Attachments, LFS, avatars, Actions logs and artifacts: RustFS bucket
  # `forgejo` (rustfs-app-provision.sh)
  - secret-forgejo-s3.sops.yaml
  - cluster-forgejo-db.yaml
  - podmonitor-forgejo-db.yaml
  # Its point-in-time-recovery backups to RustFS (Barman Cloud plugin)
  - secret-forgejo-db-backup.sops.yaml
  - objectstore-forgejo-db.yaml
  - scheduledbackup-forgejo-db.yaml
  - httproute.yaml
  - referencegrant.yaml
  - networkpolicy.yaml

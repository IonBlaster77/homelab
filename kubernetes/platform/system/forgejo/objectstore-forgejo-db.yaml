# Where forgejo-db's WAL archive and base backups go: RustFS, under
# s3://cnpg/forgejo-db/ (Barman appends the serverName set on the Cluster).
# The key in forgejo-db-backup-s3 can only touch that prefix and cannot
# delete object versions; the bucket is versioned, so nothing here can destroy
# the backup history. See kubernetes/platform/databases/cnpg-barman-cloud/README.md.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: forgejo-db-backup
  namespace: forgejo
spec:
  # Recovery window. The Longhorn NAS dailies keep 30 days on top.
  retentionPolicy: "14d"
  configuration:
    destinationPath: s3://cnpg/
    endpointURL: http://rustfs.rustfs.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: forgejo-db-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: forgejo-db-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      # Newer boto3 data-integrity checks break S3-compatible stores like
      # RustFS (x-amz-content-sha256 errors, plugin issue #393).
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required

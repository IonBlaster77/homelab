# Forgejo's database: users, issues, PRs, reviews, labels, settings. Once the
# task list lives in Forgejo this is the only copy of it (the GitHub mirror
# carries git data only), so it gets point-in-time recovery from day one.
# No credentials secret is supplied, so CloudNativePG generates one
# (forgejo-db-app) and Forgejo reads the password from it (values.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  instances: 2
  # Pinned here so Renovate tracks it, same image as the other clusters.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  # OOM protection (docs/projects/oom-protection.md): memory request = limit,
  # a CPU request and no CPU limit. First sizing; revisit after real use.
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 384Mi
  # Promote the running standby for primary updates (seconds of downtime)
  # instead of restarting the primary pod in place.
  primaryUpdateMethod: switchover
  # Point-in-time recovery: the Barman Cloud plugin archives every WAL segment
  # and stores base backups in RustFS (s3://cnpg/forgejo-db/, see
  # objectstore-forgejo-db.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: forgejo-db-backup
        serverName: forgejo-db
  storage:
    storageClass: longhorn-nvme
    # 10Gi, not 5Gi: nextcloud-db filled 5Gi with WAL (2026-10-30).
    size: 10Gi
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo

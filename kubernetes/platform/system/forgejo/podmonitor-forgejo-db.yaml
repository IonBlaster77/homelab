# CNPG metrics for forgejo-db, so the CNPG alerts cover it.
# forgejo-db-allow-apiserver-and-operator in networkpolicy.yaml admits the scrape.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: forgejo-db
  namespace: forgejo
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: forgejo-db
  podMetricsEndpoints:
    - port: metrics

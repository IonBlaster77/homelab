# Lists the manifests this folder adds next to the chart. app.yaml and
# values.yaml are deliberately NOT listed: app.yaml is picked up by the root
# app, and values.yaml is input to the chart, not a manifest.
# Objects here set their own namespace (argo-builds or argo-workflows).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace-argo-builds.yaml
  - networkpolicy.yaml
  - workflowtemplate-build-image.yaml
  - secret-registry-push.sops.yaml
  - workflowtemplate-harbor-preload.yaml
  - rbac-harbor-preload.yaml

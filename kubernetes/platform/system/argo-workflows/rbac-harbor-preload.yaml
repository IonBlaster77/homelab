# Identity for the harbor-preload WorkflowTemplate. Separate from the build
# SA (argo-workflow) so builds don't gain cluster-wide pod read access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-preload
  namespace: argo-builds
---
# Read-only: list pods everywhere to collect the running image digests.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harbor-preload-read-pods
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harbor-preload-read-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harbor-preload-read-pods
subjects:
  - kind: ServiceAccount
    name: harbor-preload
    namespace: argo-builds
---
# The Argo executor's own permissions (step results), from the chart's Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-preload-workflow
  namespace: argo-builds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-workflows-workflow
subjects:
  - kind: ServiceAccount
    name: harbor-preload
    namespace: argo-builds

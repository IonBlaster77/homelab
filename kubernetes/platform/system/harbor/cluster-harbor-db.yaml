# Harbor's database. No credentials secret is supplied, so CloudNativePG
# generates one (harbor-db-app: username, password, uri) and Harbor reads the
# password from it (database.external.existingSecret, key "password").
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: harbor-db
  namespace: harbor
spec:
  instances: 2
  # OOM protection (docs/projects/oom-protection.md), sized 2026-11-07:
  # 30-day peak 210 MiB. Memory request = limit (~2x peak) so the
  # kubelet and the Talos OOM controller leave it alone; a CPU request but
  # no CPU limit (CPU is the scarce resource), so the pod is Burstable.
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 30m
      memory: 384Mi
    limits:
      memory: 384Mi
  # Promote the running standby for primary updates (seconds of downtime)
  # instead of restarting the primary pod in place.
  primaryUpdateMethod: switchover
  storage:
    # nvme, not ssd: same reasoning as the other databases (kea-db, 2026-08-05).
    storageClass: longhorn-nvme
    size: 5Gi
  bootstrap:
    initdb:
      database: registry
      owner: harbor
  # Point-in-time recovery: the Barman Cloud plugin archives every WAL segment
  # and stores base backups in RustFS (s3://cnpg/harbor-db/, see
  # objectstore-harbor-db.yaml). Adding this restarts both pods once.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: harbor-db-backup
        serverName: harbor-db

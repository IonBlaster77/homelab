# Daily base backup of harbor-db to RustFS via the Barman Cloud plugin.
# 15:20 UTC = 01:50 Adelaide; the clusters are staggered 10 min apart from
# grafana-db's 15:00. CNPG cron has a seconds field. No `immediate`: it would
# fire before the pods restart with the sidecar and fail; the first base backup
# is taken by hand (see the cnpg-barman-cloud README).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: harbor-db-daily
  namespace: harbor
spec:
  schedule: "0 20 15 * * *"
  backupOwnerReference: self
  cluster:
    name: harbor-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

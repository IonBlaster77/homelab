# Renders the Harbor chart (helmCharts, needs the plugin's --enable-helm) plus
# this folder's own manifests. app.yaml is deliberately NOT listed: it is
# picked up by the root app. *.sops.yaml files (including the secret values
# file) are decrypted by the sops-kustomize plugin before this runs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: harbor
    repo: https://helm.goharbor.io
    version: 1.19.4
    releaseName: harbor
    namespace: harbor
    valuesFile: values.yaml
    additionalValuesFiles:
      - values-secret.sops.yaml
resources:
  - namespace.yaml
  - secret-harbor.sops.yaml
  - secret-harbor-signing.sops.yaml
  - cluster-harbor-db.yaml
  - podmonitor-harbor-db.yaml
  # harbor-db's point-in-time-recovery backups to RustFS (Barman Cloud plugin)
  - secret-harbor-db-backup.sops.yaml
  - objectstore-harbor-db.yaml
  - scheduledbackup-harbor-db.yaml
  - httproute.yaml
  - referencegrant.yaml
  - servicemonitor.yaml
  - networkpolicy.yaml
# harbor-registry and harbor-jobservice mount ReadWriteOnce PVCs, so the
# default 25% surge would start the new pod while the old one still holds the
# volume and the rollout would hang. The chart's only knob is a chart-wide
# updateStrategy.type, and switching a live Deployment to Recreate under Argo
# SSA is rejected (the live rollingUpdate block is kept). maxSurge 0 stops the
# old pod first.
patches:
  - target:
      kind: Deployment
      name: harbor-registry|harbor-jobservice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
      spec:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1

# CNPG metrics for harbor-db (none were scraped before 2026-10-24), so the
# CNPG alerts, including WALArchiveBacklog, cover it. Hand-rolled like
# grafana-db's: spec.monitoring.enablePodMonitor is deprecated in CNPG.
# harbor-db-allow-apiserver-and-operator in networkpolicy.yaml admits the scrape.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: harbor-db
  namespace: harbor
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: harbor-db
  podMetricsEndpoints:
    - port: metrics

# Values for the Harbor chart (helm.goharbor.io).
# Reference: https://github.com/goharbor/harbor-helm/blob/main/values.yaml

# Plain HTTP inside the cluster; TLS is terminated by the Gateway with the
# wildcard certificate (httproute.yaml). Harbor's own nginx fronts the
# components on the "harbor" Service.
expose:
  type: clusterIP
  tls:
    enabled: false
  clusterIP:
    name: harbor
    ports:
      httpPort: 80

# The URL clients and image references use. Must match the HTTPRoute host.
externalURL: https://registry.jupitertech.net

internalTLS:
  enabled: false

# The chart can run DB migrations as a Helm pre-upgrade hook; under Argo CD
# that becomes a PreSync Job (the same deadlock Matrix hit). Harbor core runs
# its migrations itself at startup, so keep this off.
enableMigrateHelmHook: false

# --- Secrets -----------------------------------------------------------------
# The chart generates random secrets (and a token-signing certificate) on
# every render, and tries to keep them with Helm's lookup(), which does NOT
# work under Argo CD: every sync would rotate them, restarting Harbor and
# invalidating logins. Every one is supplied here from SOPS instead:
#   harbor-secrets (secret-harbor.sops.yaml): secret, secretKey, CSRF_KEY,
#     JOBSERVICE_SECRET, REGISTRY_HTTP_SECRET, REGISTRY_PASSWD,
#     REGISTRY_HTPASSWD, HARBOR_ADMIN_PASSWORD
#   harbor-token (secret-harbor-signing.sops.yaml): token-signing cert/key
#   harbor-db-app: generated by CloudNativePG (cluster-harbor-db.yaml)
#   values-secret.sops.yaml: redis.external.password. The chart builds the
#     Redis URLs at render time and can't read redis.external.existingSecret
#     under Argo CD (lookup() returns nothing: the URLs got an empty
#     password), so the password is a value, kept encrypted.
# secretKey (16 chars) encrypts credentials Harbor stores in its database,
# e.g. upstream registry tokens: never change it.
existingSecretAdminPassword: harbor-secrets
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
existingSecretSecretKey: harbor-secrets

core:
  existingSecret: harbor-secrets
  secretName: harbor-token
  existingXsrfSecret: harbor-secrets
  existingXsrfSecretKey: CSRF_KEY

jobservice:
  existingSecret: harbor-secrets
  existingSecretKey: JOBSERVICE_SECRET

registry:
  existingSecret: harbor-secrets
  existingSecretKey: REGISTRY_HTTP_SECRET
  credentials:
    username: harbor_registry_user
    existingSecret: harbor-secrets

# --- Storage -----------------------------------------------------------------
persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    registry:
      # One replica on NVMe: cached images re-download if ever lost (see
      # longhorn/storageclass-nvme-single.yaml). Expand here if it fills up.
      storageClass: longhorn-nvme-single
      size: 150Gi
    jobservice:
      jobLog:
        storageClass: longhorn-ssd
        size: 1Gi
    trivy:
      storageClass: longhorn-ssd
      size: 5Gi
  imageChartStorage:
    type: filesystem

# --- Database and Redis ------------------------------------------------------
database:
  type: external
  external:
    host: harbor-db-rw.harbor.svc.cluster.local
    port: "5432"
    username: harbor
    coreDatabase: registry
    existingSecret: harbor-db-app
    sslmode: require

# The HA Redis (kubernetes/platform/databases/redis) through Sentinel: Harbor
# asks the Sentinels for the current primary, so it follows failovers.
redis:
  type: external
  external:
    addr: "redis-0.redis.redis.svc.cluster.local:26379,redis-1.redis.redis.svc.cluster.local:26379,redis-2.redis.redis.svc.cluster.local:26379"
    sentinelMasterSet: mymaster
    # password: set in values-secret.sops.yaml

# --- Scanning and metrics ----------------------------------------------------
trivy:
  enabled: true

metrics:
  enabled: true
  # Our own ServiceMonitor is in servicemonitor.yaml (the chart's would get a
  # duplicate "release" label, which Kustomize rejects).
  serviceMonitor:
    enabled: false

# Pinned ahead of the chart: 3.14.0 is the newest chart and still ships
# v0.9.0. v0.9.1 is for Trivy findings (2026-11-08). Drop once a chart
# ships >= v0.9.1.
image:
  repository: registry.k8s.io/metrics-server/metrics-server
  tag: v0.9.1

args:
  # Talos kubelets present self-signed serving certs — skip TLS verification.
  - --kubelet-insecure-tls
  # Use node IPs rather than hostnames; Talos nodes don't register with
  # resolvable DNS names inside the cluster.
  - --kubelet-preferred-address-types=InternalIP

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

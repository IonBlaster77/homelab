# Descheduler: nightly rebalancing. Kubernetes only places a pod when it
# starts, so after restarts pods pile onto whichever node was emptiest. This
# CronJob evicts a few pods from over-full nodes each night, and the normal
# scheduler restarts them on emptier ones. See README.md.
# Rendered with Kustomize helmCharts (sops-kustomize plugin, like Harbor), so
# the chart repo doesn't need to be in the AppProject's sourceRepos.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: descheduler
  namespace: argocd
  annotations:
    # Required with ServerSideApply below, or Argo CD shows phantom OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: homelab
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    targetRevision: HEAD
    path: kubernetes/platform/system/descheduler
    plugin:
      name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: descheduler
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

# MS-11: every Namespace declares its Pod Security Admission level. With no
# label the apiserver applies the cluster default, `privileged`, so a missing
# label quietly means "anything goes". Declaring it makes the level a
# reviewed decision (MS-08's exceptions hang off it).
apiVersion: policies.kyverno.io/v1beta1
kind: ValidatingPolicy
metadata:
  name: ms-11-psa-label
  annotations:
    policies.kyverno.io/title: "MS-11 Pod Security Admission label"
    policies.kyverno.io/category: Manifest standards
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      Every Namespace must set the pod-security.kubernetes.io/enforce label to
      privileged, baseline or restricted. See
      docs/projects/manifest-standards.md.
spec:
  validationActions:
    - Audit
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  validations:
    - expression: >-
        object.metadata.?labels[?'pod-security.kubernetes.io/enforce'].orValue('')
        in ['privileged', 'baseline', 'restricted']
      messageExpression: >-
        'MS-11: namespace ' + object.metadata.name +
        ' has no valid pod-security.kubernetes.io/enforce label'

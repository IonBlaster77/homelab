# Lists the manifests this folder adds next to the two charts. app.yaml and
# the values files are deliberately NOT listed: app.yaml is picked up by the
# root app, and the values files are input to the charts, not manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - networkpolicy.yaml
  - policies/validatingpolicy-ms-03-requests.yaml
  - policies/validatingpolicy-ms-07-probes.yaml
  - policies/validatingpolicy-ms-09-image-tag.yaml
  - policies/validatingpolicy-ms-11-psa-label.yaml

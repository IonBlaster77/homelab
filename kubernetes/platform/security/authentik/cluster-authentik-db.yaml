apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
  namespace: authentik
spec:
  instances: 2
  storage:
    # nvme, not ssd - see kea-db-cluster.yaml (2026-08-05) for why.
    storageClass: longhorn-nvme
    size: 5Gi
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-db-credentials

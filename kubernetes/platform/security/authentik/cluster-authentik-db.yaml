apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
  namespace: authentik
spec:
  instances: 2
  storage:
    # nvme, not ssd - see kea-db-cluster.yaml (2026-08-05) for why.
    storageClass: longhorn-nvme
    size: 5Gi
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-db-credentials
  # Point-in-time recovery: the Barman Cloud plugin archives every WAL segment
  # and stores base backups in RustFS (s3://cnpg/authentik-db/, see
  # objectstore-authentik-db.yaml). Adding this restarts both pods once.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-db-backup
        serverName: authentik-db

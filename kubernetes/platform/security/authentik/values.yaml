authentik:
  postgresql:
    host: authentik-db-rw.authentik.svc.cluster.local
    name: authentik
    user: authentik
    password: ""

# OOM protection (docs/projects/oom-protection.md): every login goes through
# Authentik, so it is evicted after ordinary pods. Sized 2026-11-07: memory
# requests from 7-day use, limits ~2x the 30-day peak, CPU requests from the
# 7-day average, never a CPU limit.
global:
  priorityClassName: homelab-critical
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secret
          key: secret-key
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-db-credentials
          key: password

server:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring
  replicas: 2
  # ~690 MiB typical, 860 MiB peak (each)
  resources:
    requests:
      cpu: 40m
      memory: 768Mi
    limits:
      memory: 2Gi
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: authentik
                app.kubernetes.io/component: server
            topologyKey: kubernetes.io/hostname

worker:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      labels:
        release: monitoring
  replicas: 1
  # ~340 MiB typical, 685 MiB peak (blueprint runs)
  resources:
    requests:
      cpu: 90m
      memory: 384Mi
    limits:
      memory: 1536Mi

postgresql:
  enabled: false

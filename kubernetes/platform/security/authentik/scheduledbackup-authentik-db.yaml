# Daily base backup of authentik-db to RustFS via the Barman Cloud plugin.
# 15:30 UTC = 02:00 Adelaide; the clusters are staggered 10 min apart from
# grafana-db's 15:00. CNPG cron has a seconds field. No `immediate`: it would
# fire before the pods restart with the sidecar and fail; the first base backup
# is taken by hand (see the cnpg-barman-cloud README).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-db-daily
  namespace: authentik
spec:
  schedule: "0 30 15 * * *"
  backupOwnerReference: self
  cluster:
    name: authentik-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

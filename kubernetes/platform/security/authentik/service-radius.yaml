apiVersion: v1
kind: Service
metadata:
  name: authentik-radius
  namespace: authentik
  annotations:
    lbipam.cilium.io/ips: "10.77.20.62"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: ak-outpost-radius
  ports:
    - name: radius
      port: 1812
      protocol: UDP
      targetPort: 1812
    - name: radius-acct
      port: 1813
      protocol: UDP
      targetPort: 1813

# Authentik: the identity provider. Cloudflare Access sends remote logins
# for every public *.jupitertech.net hostname here (OIDC). The upstream chart
# plus this folder (its CNPG database, secrets, LDAP/RADIUS LoadBalancers) in
# one app. See README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    # Required with ServerSideApply below, or Argo CD shows phantom OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: homelab
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.2.3
      helm:
        releaseName: authentik
        valueFiles:
          - $values/kubernetes/platform/security/authentik/values.yaml
    # This folder: applies its own manifests and, as ref "values", supplies
    # values.yaml to the chart above.
    - repoURL: https://github.com/IonBlaster77/homelab.git
      targetRevision: HEAD
      path: kubernetes/platform/security/authentik
      ref: values
      plugin:
        name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

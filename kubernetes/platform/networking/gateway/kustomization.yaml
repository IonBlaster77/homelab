# Lists every manifest Argo CD applies for this app. app.yaml is deliberately
# NOT listed: it is picked up by the root app, not by this folder's own app.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - certificate.yaml
  - gateway.yaml
  - httproute-redirect.yaml
  # Routes for apps that haven't moved into the new layout yet; each goes to
  # its app (argocd) when that app moves.
  - httproute-argocd.yaml
  - referencegrant-argocd.yaml

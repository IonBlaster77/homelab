apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    # Temporary: route handoff in progress (zero-gap move between apps).
    argocd.argoproj.io/sync-options: Prune=false
  name: hubble
  namespace: networking
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: networking
      sectionName: https
  hostnames:
    - "hubble.jupitertech.net"
  rules:
    - backendRefs:
        - name: hubble-ui
          namespace: kube-system
          port: 80

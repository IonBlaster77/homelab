# Cilium values — nested under "cilium:" because this is an umbrella chart.
# The subchart name in Chart.yaml is "cilium", so Helm requires all values
# to live under that key.  These must stay in sync with:
#   bootstrap/cilium-values.yaml  (used for manual bootstrap)
#
# To upgrade Cilium:
#   1. Bump version in Chart.yaml dependencies + Chart.lock
#   2. Run: helm dependency update kubernetes/platform/networking/cilium/chart
#   3. Commit Chart.lock (and the updated .tgz in charts/ if vendored)
#   4. Manually sync the "cilium" ArgoCD Application

cilium:
  # The Cilium minor this cluster was first installed with (April 2026). The
  # upgrade guide asks for it on every upgrade so the chart keeps that
  # release's datapath defaults. Never bump it.
  upgradeCompatibility: "1.17"
  kubeProxyReplacement: true
  socketLB:
    hostNamespaceOnly: true
  # Point Cilium at KubePrism (per-node local API load-balancer on 127.0.0.1:7445,
  # enabled in the Talos machineconfig) rather than the control-plane VIP.
  # KubePrism forwards to any healthy apiserver, so Cilium no longer blocks on the
  # single VIP being assigned during a cold boot — this is what makes the datapath
  # come up cleanly after a full rack power-cycle. See bootstrap/cilium-values.yaml.
  k8sServiceHost: localhost
  k8sServicePort: 7445
  routingMode: native
  autoDirectNodeRoutes: true
  ipv4NativeRoutingCIDR: 10.0.0.0/8
  l2announcements:
    enabled: true
    leaseDuration: 15s
    renewDeadline: 5s
    retryPeriod: 2s
  bgpControlPlane:
    enabled: true
  gatewayAPI:
    enabled: true
  operator:
    replicas: 1
    # OOM protection (docs/projects/oom-protection.md), sized 2026-11-07:
    # ~93 MiB typical, 157 MiB 30-day peak. Request only, no limit.
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
  # cilium-agent (top-level `resources` is the agent container), sized
  # 2026-11-10: ~357 MiB 7-day average, 555 MiB 30-day peak, ~120m CPU.
  # Request only, no limit (an OOM-killed agent takes the node's networking
  # with it). Added with a Cilium upgrade so the agent and Envoy restart
  # together; restarting the agent alone can desync Envoy's proxy port.
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
  # TEMPORARY for the 1.20.4 hop: OnDelete, so a sync restarts nothing and
  # each node's agent (and Envoy) is upgraded by hand, talos4 first as the
  # canary. Restore the RollingUpdate block below once all 4 nodes run 1.20.4.
  #
  # Normally: roll the agent one node at a time (chart default is 2 = half
  # this 4-node cluster). A bad version then breaks one node, the rollout
  # stalls on its failing readiness, and the other three keep serving.
  #   updateStrategy:
  #     type: RollingUpdate
  #     rollingUpdate:
  #       maxUnavailable: 1
  updateStrategy:
    type: OnDelete
  # Envoy (the Gateway's L7 proxy, one per node): ~97 MiB typical, 301 MiB
  # peak. Request only, no limit; the request lifts it out of BestEffort, the
  # class Talos' OOM controller kills first.
  envoy:
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
    # TEMPORARY OnDelete for the 1.20.4 hop, as for the agent above; normally
    # RollingUpdate with maxUnavailable: 1.
    updateStrategy:
      type: OnDelete
  hubble:
    relay:
      enabled: true
    ui:
      enabled: true
    metrics:
      enabled:
        - dns
        - drop
        - tcp
        - flow
        - icmp
        - http
        - policy
      serviceMonitor:
        enabled: true
        labels:
          release: monitoring
  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
        # Added with 1.19 (upstream default since then): read dmesg and kernel
        # pointers, which Talos hides with kernel.kptr_restrict=1.
        - SYSLOG
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE

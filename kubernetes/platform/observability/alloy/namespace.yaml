apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    # The Alloy DaemonSet mounts the host's /var/log (hostPath) to tail pod logs.
    # hostPath volumes are forbidden under the cluster's baseline PSA default, so
    # this namespace must opt into privileged enforcement (same as monitoring's
    # node-exporter). Loki itself is a plain non-root PVC workload.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged

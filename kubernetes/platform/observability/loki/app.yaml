# Loki: log storage and query engine (Grafana's "Prometheus for logs").
# Single-binary mode on a Longhorn volume, 30-day retention; Alloy pushes to
# it and Grafana queries it. Upstream chart; values in values.yaml.
# See README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    # Required with ServerSideApply below, or Argo CD shows phantom OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: homelab
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.1.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/kubernetes/platform/observability/loki/values.yaml
    # This repo, only to supply values.yaml to the chart above ($values).
    - repoURL: https://github.com/IonBlaster77/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

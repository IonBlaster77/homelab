deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 720h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    volume_enabled: true
    # Write detected patterns back as __pattern__ streams so the patterns
    # API covers a full day, not just the in-memory retain_for window (3h).
    pattern_persistence_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  # Log-line templating (Drain) for Hermes' daily log review: infra-mcp's
  # loki_patterns tool returns a few hundred templates instead of raw lines.
  # Sized for ~100 streams at ~15 lines/s; expect +30-150Mi. Watch loki-0
  # memory after enabling (the 2Gi limit had ~1.6Gi headroom at 417Mi peak).
  pattern_ingester:
    enabled: true
    metric_aggregation:
      # Persistence pushes back into Loki itself; single binary -> localhost.
      loki_address: localhost:3100
  ruler:
    enable_api: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: longhorn-ssd
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    # Was 1Gi: OOMKilled 2026-10-17 22:08 UTC at 1023Mi while Hermes'
    # daily log review ran several full-day queries at once (idle ~230Mi).
    limits:
      memory: 2Gi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
gateway:
  enabled: false

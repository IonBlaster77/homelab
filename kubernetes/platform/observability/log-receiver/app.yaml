# log-receiver: Vector, receiving logs that are PUSHED at the cluster from
# outside Kubernetes (Talos machine/kernel logs, network-device syslog) on the
# LoadBalancer IP 10.77.20.64, and forwarding them to Loki. See README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: log-receiver
  namespace: argocd
  annotations:
    # Required with ServerSideApply, or Argo CD shows phantom OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: homelab
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    targetRevision: HEAD
    path: kubernetes/platform/observability/log-receiver
    plugin:
      name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    # The namespace itself belongs to the alloy app (namespace.yaml there).
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

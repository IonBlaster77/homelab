apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db
  namespace: monitoring
spec:
  instances: 2
  # OOM protection (docs/projects/oom-protection.md), sized 2026-11-07:
  # 30-day peak 131 MiB. Memory request = limit (~2x peak) so the
  # kubelet and the Talos OOM controller leave it alone; a CPU request but
  # no CPU limit (CPU is the scarce resource), so the pod is Burstable.
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 60m
      memory: 384Mi
    limits:
      memory: 384Mi
  # Promote the running standby for primary updates (seconds of downtime)
  # instead of restarting the primary pod in place.
  primaryUpdateMethod: switchover
  storage:
    # nvme, not ssd - see kubernetes/apps/network/kea/database.yaml (2026-08-05) for why.
    storageClass: longhorn-nvme
    size: 5Gi
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
      secret:
        name: grafana-db-credentials
  # Point-in-time recovery: the Barman Cloud plugin archives every WAL segment
  # and stores base backups in RustFS (s3://cnpg/grafana-db/, see
  # objectstore-grafana-db.yaml). Adding this restarts both pods once.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: grafana-db-backup
        serverName: grafana-db

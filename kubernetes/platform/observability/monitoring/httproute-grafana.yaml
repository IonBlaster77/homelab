apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    # Temporary: route handoff in progress (zero-gap move between apps).
    argocd.argoproj.io/sync-options: Prune=false
  name: grafana
  namespace: networking
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: networking
      sectionName: https
  hostnames:
    - "grafana.jupitertech.net"
  rules:
    - backendRefs:
        - name: monitoring-grafana
          namespace: monitoring
          port: 80

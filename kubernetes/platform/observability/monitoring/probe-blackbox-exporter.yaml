apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: adguard-dns
  namespace: monitoring
  labels:
    release: monitoring
spec:
  module: dns_udp
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - adguard-dns.adguard.svc.cluster.local:53
      labels:
        target: adguard-dns
  interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: kea-ctrl-agent
  namespace: monitoring
  labels:
    release: monitoring
spec:
  module: kea_ctrl_agent
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - kea-ctrl-agent.kea.svc.cluster.local:8000
      labels:
        target: kea-ctrl-agent
  interval: 30s
---
# TCP connect check against the Synology's NFS port. This is the earliest
# possible signal that media-nfs (see NAS-AND-SWITCH-MAINTENANCE.md) has
# gone unreachable — well before it'd show up as pod errors, and in time to
# scale down consumers before anyone attempts a node reboot into a hang.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: nas-nfs
  namespace: monitoring
  labels:
    release: monitoring
spec:
  module: tcp_connect
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - 10.77.20.20:2049
      labels:
        target: nas-nfs
  interval: 30s
---
# Probes the shared Cilium Gateway the same way cloudflared does: an HTTPS
# request straight to the gateway's ClusterIP with a real Host header. This
# is the origin-reachability check cloudflared itself can't give us — its
# CloudflareTunnelDown alert only fires on zero edge connections, which
# stayed healthy during the 2026-08-09 outage even though every hostname
# behind the gateway was unreachable (cilium-agent/cilium-envoy proxy-port
# drift after a partial restart). hermes.jupitertech.net is just the canary
# Host header; a failure here means the whole gateway is down, not just Hermes.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: cilium-gateway
  namespace: monitoring
  labels:
    release: monitoring
spec:
  module: gateway_https
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://cilium-gateway-homelab-gateway.networking.svc.cluster.local:443/
      labels:
        target: cilium-gateway
  interval: 30s

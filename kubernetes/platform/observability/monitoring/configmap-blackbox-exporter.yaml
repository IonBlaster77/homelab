# blackbox_exporter — active probes for services with no native /metrics
# endpoint (AdGuard's DNS resolution, Kea's control-agent API). Prometheus
# Operator's Probe CRD (probe-blackbox-exporter.yaml) tells Prometheus to hit this exporter, which
# in turn performs the actual check against the target.
#
# This binary only reads config.yml at startup — no --web.enable-lifecycle,
# no reloader sidecar. Editing `modules:` below requires a manual
# `kubectl rollout restart deployment/blackbox-exporter -n monitoring`
# afterward, or the new/changed module 400s until the pod happens to restart
# some other way.
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: monitoring
data:
  config.yml: |
    modules:
      dns_udp:
        prober: dns
        timeout: 5s
        dns:
          transport_protocol: "udp"
          query_name: "jupitertech.net."
          query_type: "A"
          valid_rcodes:
            - NOERROR
      kea_ctrl_agent:
        prober: http
        timeout: 5s
        http:
          method: POST
          headers:
            Content-Type: application/json
          body: '{"command":"list-commands"}'
          valid_status_codes: [200]
      tcp_connect:
        prober: tcp
        timeout: 5s
      gateway_https:
        prober: http
        timeout: 5s
        http:
          method: GET
          tls_config:
            insecure_skip_verify: true
          headers:
            Host: hermes.jupitertech.net
          # Any HTTP response proves the gateway (Envoy) is up and routing,
          # including 502/503/504, which Envoy itself returns while the
          # canary backend (Hermes) restarts. Without them every Hermes
          # restart fired a CRIT CiliumGatewayProbeFailed (3x on
          # 2026-10-24). The failure this probe exists for (Envoy proxy-port
          # drift, 2026-08-09) shows as connection/TLS errors or timeouts,
          # which still fail it.
          valid_status_codes: [200, 301, 302, 401, 403, 502, 503, 504]

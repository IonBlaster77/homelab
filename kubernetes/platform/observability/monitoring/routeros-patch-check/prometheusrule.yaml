# RouterOS patch alerts. Agreed behaviour (2026-11-20):
#   - A pending update whose changelogs mention CVEs / security fixes goes to
#     #alerts-vulnerabilities (category=vulnerability), repeated weekly (own
#     Alertmanager route in values.yaml) until patched: plan an outage window.
#   - A bug-fix-only update gets NO alert; the Patch Ops card shows it.
#   - Firmware left behind after a RouterOS upgrade (the second reboot was
#     skipped) and a broken checker are warnings.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: routeros-patch-check
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: routeros-patch
      interval: 5m
      rules:
        - alert: RouterOSSecurityUpdatePending
          expr: routeros_security_update_available == 1
          for: 1h
          labels:
            category: vulnerability
          annotations:
            summary: >-
              {{ with printf "routeros_patch_info{device=%q}" $labels.device | query }}{{ with first }}{{ .Labels.name }} ({{ .Labels.model }}): RouterOS {{ .Labels.version }} has security fixes{{ end }}{{ end }}
            description: >-
              {{ with printf "routeros_patch_info{device=%q}" $labels.device | query }}{{ with first }}{{ .Labels.name }} runs RouterOS {{ .Labels.installed }}; {{ .Labels.latest }} ({{ .Labels.channel }})
              fixes: {{ .Labels.security }}.{{ end }}{{ end }}
              Changelogs: https://mikrotik.com/download/changelogs ; advisories: https://mikrotik.com/supportsec
              {{ if eq $labels.device "switch" }}The NAS hangs off this switch: scale the media-nfs apps to 0 through git before rebooting it (docs/runbooks/nas-and-switch-maintenance.md).{{ end }}
              {{ if eq $labels.device "router" }}Rebooting the router drops the BGP-advertised LB IPs and the Cloudflare tunnel for a few minutes.{{ end }}
              After the update: /system routerboard upgrade, then reboot again.

        - alert: RouterOSFirmwareUpgradePending
          expr: routeros_firmware_upgrade_pending == 1
          for: 1d
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.device }}: RouterBOARD firmware is behind RouterOS"
            description: >-
              {{ with printf "routeros_patch_info{device=%q}" $labels.device | query }}{{ with first }}{{ .Labels.name }} firmware {{ .Labels.firmware }}.{{ end }}{{ end }}
              The RouterOS upgrade was done but the firmware step wasn't: run
              /system routerboard upgrade and reboot (or set
              /system routerboard settings set auto-upgrade=yes).

        - alert: RouterOSPatchCheckFailing
          expr: routeros_patch_check_success == 0
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "RouterOS patch check can't read {{ $labels.device }}"
            description: >-
              routeros-patch-check (monitoring) has failed for 6h, so the Patch Ops
              card shows stale data. Check the pod log: API service or user
              address limits on the device, the router's forward rules, or
              upgrade.mikrotik.com unreachable.

        - alert: RouterOSPatchCheckStale
          expr: time() - routeros_patch_check_last_run_timestamp_seconds > 4 * 3600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "RouterOS patch check hasn't run for over 4h"
            description: "routeros-patch-check's loop is stuck or the pod isn't being scraped."

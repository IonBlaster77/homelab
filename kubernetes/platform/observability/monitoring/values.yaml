# Disable components that Talos doesn't expose externally
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false

# node-exporter must run on control-plane nodes too
prometheus-node-exporter:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

prometheus:
  prometheusSpec:
    retention: 60d
    retentionSize: 45GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-ssd
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

grafana:
  # Loki (logging namespace) as a log datasource alongside Prometheus.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
      jsonData:
        maxLines: 1000
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  envValueFrom:
    GF_DATABASE_PASSWORD:
      secretKeyRef:
        name: grafana-db-credentials
        key: password
  "grafana.ini":
    database:
      type: postgres
      host: grafana-db-rw.monitoring.svc.cluster.local:5432
      name: grafana
      user: grafana
      password: $__env{GF_DATABASE_PASSWORD}
  service:
    type: ClusterIP
  # Community dashboards, auto-downloaded from grafana.com at pod start
  # by the chart's built-in sidecar. Pinned revisions so a pod restart
  # never silently changes what's rendered.
  dashboardProviders:
    "dashboardproviders.yaml":
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      argocd:
        gnetId: 14584
        revision: 1
        datasource: Prometheus
      cilium-agent:
        gnetId: 16611
        revision: 1
        datasource: Prometheus
      cert-manager:
        gnetId: 20842
        revision: 3
        datasource: Prometheus
      longhorn:
        gnetId: 16888
        revision: 14
        datasource: Prometheus
      unifi-poller-sites:
        gnetId: 11311
        revision: 5
        datasource: Prometheus
      unifi-poller-aps:
        gnetId: 11314
        revision: 10
        datasource: Prometheus
      cloudnative-pg:
        gnetId: 20417
        revision: 4
        datasource: Prometheus
      redis:
        gnetId: 763
        revision: 6
        datasource: Prometheus

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-ssd
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
    # Mounted at /etc/alertmanager/secrets/alertmanager-matrix/webhook-password:
    # the basic-auth password for the Matrix alert bridge. Keep this list in
    # step with real Secrets: a missing one leaves the pod stuck at Init
    # (that is what happened with the old pushover-credentials).
    secrets:
      - alertmanager-matrix
  # Alerts go to Matrix (kubernetes/apps/comms/matrix) through the in-cluster
  # matrix-alertmanager-receiver bridge, never over the internet. Same routing
  # as the old Buzz channels: one room per severity, and group_by severity so
  # every firing alert of that severity is batched into one message per
  # group_interval instead of one message per alert. Anything else (Watchdog,
  # InfoInhibitor, severity=info/none) stays on "null".
  config:
    global: {}
    route:
      receiver: "null"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - severity="critical"
          receiver: matrix-critical
          group_by: ["severity"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - matchers:
            - severity="warning"
          receiver: matrix-warning
          group_by: ["severity"]
          group_wait: 2m
          group_interval: 15m
          repeat_interval: 4h
    receivers:
      - name: "null"
      - name: matrix-critical
        webhook_configs:
          - url: http://matrix-alertmanager-receiver.matrix.svc.cluster.local:12345/alerts/alerts-critical
            send_resolved: true
            http_config:
              basic_auth:
                username: alertmanager
                password_file: /etc/alertmanager/secrets/alertmanager-matrix/webhook-password
      - name: matrix-warning
        webhook_configs:
          - url: http://matrix-alertmanager-receiver.matrix.svc.cluster.local:12345/alerts/alerts-warning
            send_resolved: true
            http_config:
              basic_auth:
                username: alertmanager
                password_file: /etc/alertmanager/secrets/alertmanager-matrix/webhook-password

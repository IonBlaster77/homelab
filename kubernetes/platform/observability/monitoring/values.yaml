# Disable components that Talos doesn't expose externally
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false

# --- Resources and priority (docs/projects/oom-protection.md) ----------------
# Sized 2026-11-07 from Prometheus: memory requests from 7-day use, CPU
# requests from the 7-day average, never a CPU limit. Prometheus itself is
# request-only (its memory tracks series count; a limit kill means a long WAL
# replay); the small exporters/operator get a limit of ~2x the 30-day peak.

# node-exporter must run on control-plane nodes too
prometheus-node-exporter:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  # ~28 MiB typical, 42 MiB peak
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# ~43 MiB typical, 81 MiB peak. Its metrics feed most alerts.
kube-state-metrics:
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi
  # VPA recommendations as metrics, for the "Resource drift" dashboard.
  # kube-state-metrics dropped its built-in VPA metrics in v2.9, so they come
  # from a custom-resource config instead. Produces
  # kube_vpa_recommendation_{target,upper_bound}_{memory_bytes,cpu_cores}
  # labelled namespace, verticalpodautoscaler, target_kind, target_name,
  # container. The VPA objects live in kubernetes/platform/system/vpa.
  rbac:
    extraRules:
      - apiGroups: ["autoscaling.k8s.io"]
        resources: ["verticalpodautoscalers"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: autoscaling.k8s.io
              kind: VerticalPodAutoscaler
              version: v1
            metricNamePrefix: kube_vpa
            labelsFromPath:
              verticalpodautoscaler: [metadata, name]
              namespace: [metadata, namespace]
              target_kind: [spec, targetRef, kind]
              target_name: [spec, targetRef, name]
            metrics:
              - name: recommendation_target_memory_bytes
                help: VPA recommended memory request per container
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [target, memory]
              - name: recommendation_upper_bound_memory_bytes
                help: VPA upper bound for memory per container
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [upperBound, memory]
              - name: recommendation_target_cpu_cores
                help: VPA recommended CPU request per container
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [target, cpu]

# ~43 MiB typical, 79 MiB peak
prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi

prometheus:
  # HA (2026-11-13): on 2026-11-13 talos3+talos4 shut down together and the only
  # Prometheus, Alertmanager and Loki were all on them, so nothing alerted for
  # 5 hours. Two Prometheus replicas each scrape everything and evaluate every
  # rule on their own; either one alone keeps alerts flowing. The operator adds
  # a prometheus_replica external label and drops it from alerts, so the
  # Alertmanager cluster deduplicates the pair.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Grafana and other clients hit the Service: stick each client to one
  # replica so panels don't flip between two slightly different histories.
  service:
    sessionAffinity: ClientIP
  prometheusSpec:
    replicas: 2
    # Never two replicas on one node.
    podAntiAffinity: hard
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    priorityClassName: homelab-critical
    # ~3.8 GiB typical, 3.9 GiB 30-day peak. Request only, no limit.
    resources:
      requests:
        cpu: 110m
        memory: 4Gi
    retention: 60d
    # Size cap below the 50Gi volume, leaving room for the WAL: at 45GB the
    # volume sat at ~88% and would trip KubePersistentVolumeFillingUp
    # (warning below 15% free). 38GB keeps it near 78%; the oldest data is
    # dropped first, so history is roughly 50 days instead of 60.
    retentionSize: 38GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          # NVMe, not SSD: at 50Gi x 3 replicas this was the biggest consumer
          # of the SSD disks, and with talos1/talos3 SSD scheduling nearly full
          # a failed replica couldn't be rebuilt for ~12h (2026-10-16/17).
          # The existing volume was moved in place on 2026-10-18 (Longhorn
          # disk selector ssd -> nvme, replicas replaced one at a time), so its
          # PVC still names longhorn-ssd; the class only applies on recreate.
          # Single Longhorn replica since 2026-11-13: the second Prometheus is
          # the redundancy, so 3 storage copies per replica only cost disk and
          # write I/O. prometheus-0's existing PVC keeps its 3 copies; only new
          # PVCs (prometheus-1) get this class.
          storageClassName: longhorn-nvme-single
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

grafana:
  # ~760 MiB typical, 801 MiB peak. Default priority: dashboards can wait.
  resources:
    requests:
      cpu: 70m
      memory: 768Mi
    limits:
      memory: 2Gi
  # The dashboard/datasource sidecars: ~90 MiB each, flat
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 256Mi
  # Loki (logging namespace) as a log datasource alongside Prometheus.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
      jsonData:
        maxLines: 1000
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  envValueFrom:
    GF_DATABASE_PASSWORD:
      secretKeyRef:
        name: grafana-db-credentials
        key: password
  "grafana.ini":
    database:
      type: postgres
      host: grafana-db-rw.monitoring.svc.cluster.local:5432
      name: grafana
      user: grafana
      password: $__env{GF_DATABASE_PASSWORD}
    # Grafana 13 moved core datasources (Prometheus, Loki, Tempo, ...) out of
    # core and "preinstalls" newer copies at startup: it unregisters each
    # bundled plugin, then replaces its files. Since chart 13.x (kps 89) the
    # root filesystem is read-only, the replace fails, and the plugin stays
    # unregistered: every dashboard query returned "Plugin not registered".
    # Keep the versions bundled in the (pinned) image instead.
    plugins:
      preinstall_disabled: true
  service:
    type: ClusterIP
  # Community dashboards, auto-downloaded from grafana.com at pod start
  # by the chart's built-in sidecar. Pinned revisions so a pod restart
  # never silently changes what's rendered.
  dashboardProviders:
    "dashboardproviders.yaml":
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      argocd:
        gnetId: 14584
        revision: 1
        datasource: Prometheus
      cilium-agent:
        gnetId: 16611
        revision: 1
        datasource: Prometheus
      cert-manager:
        gnetId: 20842
        revision: 3
        datasource: Prometheus
      longhorn:
        gnetId: 16888
        revision: 14
        datasource: Prometheus
      unifi-poller-sites:
        gnetId: 11311
        revision: 5
        datasource: Prometheus
      unifi-poller-aps:
        gnetId: 11314
        revision: 10
        datasource: Prometheus
      cloudnative-pg:
        gnetId: 20417
        revision: 4
        datasource: Prometheus
      redis:
        gnetId: 763
        revision: 6
        datasource: Prometheus

alertmanager:
  enabled: true
  # HA (2026-11-13): three replicas gossip notification state, so whichever
  # survive still send each alert exactly once. See the prometheus: comment.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  alertmanagerSpec:
    replicas: 3
    podAntiAffinity: hard
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    # The alert path to Matrix. ~42 MiB typical, 46 MiB peak; the operator
    # already defaulted a 200Mi request.
    priorityClassName: homelab-critical
    resources:
      requests:
        cpu: 10m
        memory: 200Mi
      limits:
        memory: 384Mi
    storage:
      volumeClaimTemplate:
        spec:
          # Single Longhorn copy for new PVCs: the replicas share state over
          # gossip. alertmanager-0's existing PVC stays on longhorn-ssd.
          storageClassName: longhorn-nvme-single
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
    # Mounted at /etc/alertmanager/secrets/alertmanager-matrix/webhook-password:
    # the basic-auth password for the Matrix alert bridge. Keep this list in
    # step with real Secrets: a missing one leaves the pod stuck at Init
    # (that is what happened with the old pushover-credentials).
    secrets:
      - alertmanager-matrix
  # Alerts go to Matrix (kubernetes/apps/comms/matrix) through the in-cluster
  # matrix-alertmanager-receiver bridge, never over the internet. Same routing
  # as the old Buzz channels: one room per severity, and group_by severity so
  # every firing alert of that severity is batched into one message per
  # group_interval instead of one message per alert. Anything else (Watchdog,
  # InfoInhibitor, severity=info/none) stays on "null".
  config:
    global: {}
    route:
      receiver: "null"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Trivy vulnerability alerts (prometheusrule-trivy.yaml). These come
        # first so their own severity labels (Critical/High/..., from Trivy)
        # never fall through to the routes below. A new fixable Critical goes
        # to #alerts-critical; every vulnerability alert, Criticals included,
        # goes to #alerts-vulnerabilities. They resolve by themselves within
        # 6h, so repeat_interval 24h means one message each.
        - matchers:
            - alertname="TrivyNewCriticalFixable"
          receiver: matrix-critical-vulnerabilities
          group_by: ["alertname"]
          group_wait: 2m
          group_interval: 15m
          repeat_interval: 24h
        - matchers:
            - category="vulnerability"
          receiver: matrix-vulnerabilities
          group_by: ["alertname"]
          group_wait: 2m
          group_interval: 15m
          repeat_interval: 24h
        - matchers:
            - severity="critical"
          receiver: matrix-critical
          group_by: ["severity"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        - matchers:
            - severity="warning"
          receiver: matrix-warning
          group_by: ["severity"]
          group_wait: 2m
          group_interval: 15m
          repeat_interval: 4h
    receivers:
      - name: "null"
      - name: matrix-critical
        webhook_configs:
          - url: http://matrix-alertmanager-receiver.matrix.svc.cluster.local:12345/alerts/alerts-critical
            send_resolved: true
            http_config:
              basic_auth:
                username: alertmanager
                password_file: /etc/alertmanager/secrets/alertmanager-matrix/webhook-password
      - name: matrix-warning
        webhook_configs:
          - url: http://matrix-alertmanager-receiver.matrix.svc.cluster.local:12345/alerts/alerts-warning
            send_resolved: true
            http_config:
              basic_auth:
                username: alertmanager
                password_file: /etc/alertmanager/secrets/alertmanager-matrix/webhook-password
      # Vulnerability alerts: send_resolved off, because these resolve when a
      # finding stops being NEW, not when it is fixed.
      - name: matrix-vulnerabilities
        webhook_configs:
          - url: http://matrix-alertmanager-receiver.matrix.svc.cluster.local:12345/alerts/alerts-vulnerabilities
            send_resolved: false
            http_config:
              basic_auth:
                username: alertmanager
                password_file: /etc/alertmanager/secrets/alertmanager-matrix/webhook-password
      - name: matrix-critical-vulnerabilities
        webhook_configs:
          - url: http://matrix-alertmanager-receiver.matrix.svc.cluster.local:12345/alerts/alerts-critical
            send_resolved: false
            http_config:
              basic_auth:
                username: alertmanager
                password_file: /etc/alertmanager/secrets/alertmanager-matrix/webhook-password

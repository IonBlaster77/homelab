apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-default-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: cnpg-default.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: "Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query."
            summary: "A query is taking longer than 5 minutes."
          expr: cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: "Pod {{ $labels.pod }} has been waiting for longer than 5 minutes."
            summary: "A backend is waiting for longer than 5 minutes."
          expr: cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabaseXidAge
          annotations:
            description: "Over 300,000,000 transactions from frozen xid on pod {{ $labels.pod }}."
            summary: "Number of transactions from the frozen XID to the current one."
          expr: cnpg_pg_database_xid_age > 300000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: "Standby is lagging behind by over 300 seconds (5 minutes)."
            summary: "The standby is lagging behind the primary."
          expr: cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: "Archiving failed for {{ $labels.pod }}."
            summary: "Checks the last time archiving failed."
          expr: (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: "There are over 10 deadlock conflicts in {{ $labels.pod }}."
            summary: "Checks the number of database conflicts."
          expr: cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
        # Not upstream: WAL segments finished but not yet uploaded to RustFS
        # (.ready files in pg_wal). Normally 0-1; it only climbs while archiving
        # is failing or stuck, and Postgres keeps every one of them, so pg_wal
        # grows on the database volume until it fills. Deliberately not "time
        # since last archival": an idle database (kea-db) archives nothing for
        # days and would fire.
        - alert: WALArchiveBacklog
          annotations:
            description: "{{ $labels.pod }} has {{ $value }} WAL segments (16 MiB each) waiting to be archived."
            summary: "WAL archiving to RustFS is falling behind; pg_wal is growing."
          expr: cnpg_collector_pg_wal_archive_status{value="ready"} > 10
          for: 15m
          labels:
            severity: warning
        - alert: ReplicaFailingReplication
          annotations:
            description: "Replica {{ $labels.pod }} is failing to replicate."
            summary: "Checks if the replica is failing to replicate."
          expr: cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 1m
          labels:
            severity: warning
        # Not upstream: a replication slot is holding WAL on the primary. CNPG's
        # HA slots have no size cap (max_slot_wal_keep_size -1), so a replica
        # that stops consuming makes the primary keep every segment until its
        # volume fills. That took Nextcloud down 2026-10-30 to 11-04 (a replica
        # stopped replaying but stayed Ready). Healthy peak over 30 days was one
        # segment (~16 MiB) on every cluster.
        - alert: ReplicationSlotRetainingWAL
          annotations:
            description: "Slot {{ $labels.slot_name }} on {{ $labels.namespace }}/{{ $labels.pod }} is holding {{ $value | humanize1024 }}B of WAL."
            summary: "A replica has stopped consuming WAL; the primary's volume will fill."
          expr: cnpg_pg_replication_slots_pg_wal_lsn_diff > 1073741824
          for: 15m
          labels:
            severity: warning
        # Not upstream: a CNPG instance pod Prometheus has no metrics for, so
        # none of the alerts above can see it (nextcloud-db had no PodMonitor
        # until 2026-11-04). bootstrap-controller is the init container CNPG
        # puts in every instance pod, and only there.
        - alert: CNPGInstanceNotScraped
          annotations:
            description: "{{ $labels.namespace }}/{{ $labels.pod }} has no CNPG metrics: add a PodMonitor and admit Prometheus on port 9187."
            summary: "A CloudNativePG instance is not being monitored."
          expr: kube_pod_init_container_info{container="bootstrap-controller"} unless on(namespace, pod) cnpg_collector_up
          for: 30m
          labels:
            severity: warning
        # Not upstream: the exporter is scraped but its replication queries fail,
        # so PGReplication and ReplicationSlotRetainingWAL go blind while
        # CNPGInstanceNotScraped stays quiet. Happened to nextcloud-db, whose
        # installer revoked CONNECT from PUBLIC. Every healthy instance, primary
        # or replica, reports cnpg_pg_replication_lag.
        - alert: CNPGReplicationMetricsMissing
          annotations:
            description: "{{ $labels.namespace }}/{{ $labels.pod }} is scraped but reports no replication metrics; check its postgres log for \"Error collecting user query\"."
            summary: "CNPG replication queries are failing, so replication alerts cannot fire."
          expr: cnpg_collector_up unless on(namespace, pod) cnpg_pg_replication_lag
          for: 30m
          labels:
            severity: warning
        # Not upstream: too many database primaries on one node. Switchovers
        # promote whichever standby exists, so primaries drift together (six of
        # eight landed on talos2 on 2026-11-07), and the descheduler never moves
        # them (the primary PDB allows 0). Rebalance by hand with
        # `kubectl cnpg promote <cluster> <standby>` (docs/projects/oom-protection.md).
        - alert: CNPGPrimariesConcentrated
          annotations:
            description: "{{ $value }} CloudNativePG primaries are running on {{ $labels.node }}."
            summary: "Database primaries are concentrated on one node; promote some standbys elsewhere."
          # topk keeps one kube_pod_info series per pod: group_left errors if ANY
          # pod (CNPG or not) has two. kube-state-metrics briefly exports a new pod
          # with and without pod_ip (seen 2026-11-09 on the prometheus-operator
          # rollout), and a rescheduled StatefulSet pod can show on two nodes until
          # the old series goes stale.
          expr: count by (node) ((cnpg_pg_replication_in_recovery == 0) * on(namespace, pod) group_left(node) topk by (namespace, pod) (1, kube_pod_info)) > 3
          for: 6h
          labels:
            severity: warning

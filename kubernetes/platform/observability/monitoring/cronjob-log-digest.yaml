apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-digest
  namespace: monitoring
spec:
  # FALLBACK for Hermes' daily-health-review (Hermes cron, 22:00 UTC, posts to
  # #log-digest). At 23:00 UTC this checks whether that report arrived; only if
  # not does it post a per-namespace error-count summary from Loki, as
  # @alertbot over the in-cluster network (Synapse's HAProxy in the matrix
  # namespace; a matrix CiliumNetworkPolicy allows exactly this pod label).
  # Was the primary 07:00 digest until 2026-10-19.
  schedule: "0 23 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: log-digest
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: log-digest
              image: curlimages/curl:8.23.0
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: MATRIX_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: log-digest-matrix
                      key: token
                - name: MATRIX_ROOM
                  valueFrom:
                    secretKeyRef:
                      name: log-digest-matrix
                      key: room-id
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  SYNAPSE="http://matrix-synapse.matrix.svc.cluster.local:8008"

                  # Skip if Hermes' review landed in the last 3h. Hermes may split a
                  # long report over several messages, so look at its newest message:
                  # the report always ends with this exact line (job prompt and the
                  # alert-triage skill both require it).
                  LATEST=$(curl -sfG -H "Authorization: Bearer $MATRIX_TOKEN" \
                    --data-urlencode 'dir=b' --data-urlencode 'limit=1' \
                    --data-urlencode 'filter={"types":["m.room.message"],"senders":["@hermes:matrix.jupitertech.net"]}' \
                    "$SYNAPSE/_matrix/client/v3/rooms/$MATRIX_ROOM/messages" || true)
                  TS=$(echo "$LATEST" | grep -o '"origin_server_ts":[0-9]*' | head -1 | cut -d: -f2)
                  AGE_MS=$(( $(date +%s) * 1000 - ${TS:-0} ))
                  if [ -n "$TS" ] && [ "$AGE_MS" -lt 10800000 ] \
                     && echo "$LATEST" | grep -q 'End of daily health review'; then
                    echo "Hermes daily health review arrived $(( AGE_MS / 60000 )) min ago; fallback not needed."
                    exit 0
                  fi
                  echo "No Hermes daily health review in the last 3h; posting the fallback digest."

                  NOW_NS=$(( $(date +%s) * 1000000000 ))
                  # Whole-word error/fatal/panic, minus lines explicitly logged at
                  # info/debug (logfmt, JSON, klog "I1019 ..."). A bare substring
                  # match counted errors=0 counters, Postgres "error_severity":"LOG"
                  # and Loki echoing its own queries: ~40% of the old total.
                  # Keep in sync with ERROR_FILTER in apps/ai/infra-mcp/configmap.yaml.
                  RESP=$(curl -sG "http://loki.logging.svc.cluster.local:3100/loki/api/v1/query" \
                    --data-urlencode 'query=sum by (namespace) (count_over_time({namespace=~".+"} |~ `(?i)\b(error|fatal|panic)\b` !~ `(?i)(\blevel=\"?(info|debug)\b|"level": ?"(info|debug)"|^I\d{4} )` [24h]))' \
                    --data-urlencode "time=$NOW_NS")

                  PAIRS=$(echo "$RESP" | grep -o '"namespace":"[^"]*"},"value":\[[0-9.]*,"[0-9]*"\]' \
                    | sed -E 's/"namespace":"([^"]*)"\},"value":\[[0-9.]*,"([0-9]*)"\]/\1: \2/' \
                    | sort -t: -k2 -rn)

                  HEADER="⚠️ Hermes' daily health review didn't arrive by 23:00 UTC, so here is the fallback digest."
                  if [ -z "$PAIRS" ]; then
                    DIGEST="$HEADER
                  ✅ No error lines logged in the last 24h across any namespace."
                  else
                    DIGEST="$HEADER
                  📋 Error lines in the last 24h (noise-filtered):
                  $PAIRS"
                  fi

                  DIGEST_ESCAPED=$(printf '%s' "$DIGEST" | sed ':a;N;$!ba;s/\\/\\\\/g;s/"/\\"/g;s/\n/\\n/g')

                  # m.notice: shown like a bot message and never triggers other bots.
                  curl -sf -X PUT \
                    -H "Authorization: Bearer $MATRIX_TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "{\"msgtype\":\"m.notice\",\"body\":\"$DIGEST_ESCAPED\"}" \
                    "$SYNAPSE/_matrix/client/v3/rooms/$MATRIX_ROOM/send/m.room.message/digest-$(date +%s)"

apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-digest
  namespace: monitoring
spec:
  # Daily error-count summary per namespace (from Loki), posted to the Matrix
  # room #log-digest as @alertbot over the in-cluster network (Synapse's
  # HAProxy in the matrix namespace; a matrix CiliumNetworkPolicy allows
  # exactly this pod label). Replaced the Buzz channel on 2026-10-17.
  schedule: "0 7 * * *"
  timeZone: "Australia/Adelaide"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: log-digest
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: log-digest
              image: curlimages/curl:8.23.0
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: MATRIX_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: log-digest-matrix
                      key: token
                - name: MATRIX_ROOM
                  valueFrom:
                    secretKeyRef:
                      name: log-digest-matrix
                      key: room-id
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  NOW_NS=$(( $(date +%s) * 1000000000 ))
                  RESP=$(curl -sG "http://loki.logging.svc.cluster.local:3100/loki/api/v1/query" \
                    --data-urlencode 'query=sum by (namespace) (count_over_time({namespace=~".+"} |~ "(?i)error" [24h]))' \
                    --data-urlencode "time=$NOW_NS")

                  PAIRS=$(echo "$RESP" | grep -o '"namespace":"[^"]*"},"value":\[[0-9.]*,"[0-9]*"\]' \
                    | sed -E 's/"namespace":"([^"]*)"\},"value":\[[0-9.]*,"([0-9]*)"\]/\1: \2/' \
                    | sort -t: -k2 -rn)

                  if [ -z "$PAIRS" ]; then
                    DIGEST="✅ No errors logged in the last 24h across any namespace."
                  else
                    DIGEST="📋 Daily log digest — errors in the last 24h:
                  $PAIRS"
                  fi

                  DIGEST_ESCAPED=$(printf '%s' "$DIGEST" | sed ':a;N;$!ba;s/\\/\\\\/g;s/"/\\"/g;s/\n/\\n/g')

                  # m.notice: shown like a bot message and never triggers other bots.
                  curl -sf -X PUT \
                    -H "Authorization: Bearer $MATRIX_TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "{\"msgtype\":\"m.notice\",\"body\":\"$DIGEST_ESCAPED\"}" \
                    "http://matrix-synapse.matrix.svc.cluster.local:8008/_matrix/client/v3/rooms/$MATRIX_ROOM/send/m.room.message/digest-$(date +%s)"

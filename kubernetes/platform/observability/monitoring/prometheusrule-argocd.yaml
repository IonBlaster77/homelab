apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd-app-health
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: argocd-app-health
      rules:
        - alert: ArgoCDAppDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} has been Degraded for 10m+"
            description: "Short health flaps are normal during rollouts; this has been sustained, not transient."
        - alert: ArgoCDAppOutOfSync
          # argocd/cilium are manual-sync by design (see gitops/argocd-apps/
          # cilium.yaml) — sitting OutOfSync between deliberate syncs is
          # their normal resting state, not drift worth paging on. cilium
          # in particular has a known cosmetic OutOfSync on ServiceMonitor/
          # hubble (content matches the rendered chart byte-for-byte; looks
          # like an ArgoCD diff-cache quirk, not a real difference).
          expr: argocd_app_info{sync_status="OutOfSync", name!~"argocd|cilium"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} has been OutOfSync for 10m+"
            description: "This app has automated sync — sustained drift means something changed live outside of git, or a sync is failing."

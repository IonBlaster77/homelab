# Per-cluster PodMonitors live next to each Cluster CR (cluster-grafana-db.yaml,
# kubernetes/apps/network/kea/database.yaml, clusters/homelab/authentik/). This covers the operator
# itself, plus CloudNativePG's own recommended alert rules (upstream:
# docs/src/samples/monitoring/{podmonitor,prometheusrule}.yaml), unmodified.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-controller-manager
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - cnpg-system
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  podMetricsEndpoints:
    - port: metrics

# Longhorn: replicated block storage for every PersistentVolume in the
# cluster, plus the NAS backups. The upstream chart plus this folder (backup
# target, backup schedules, StorageClasses, snapshot class) in one app.
# See README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: homelab
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.13.0
      helm:
        valueFiles:
          - $values/kubernetes/platform/storage/longhorn/values.yaml
    # This folder: applies its own manifests and, as ref "values", supplies
    # values.yaml to the chart above.
    - repoURL: https://github.com/IonBlaster77/homelab.git
      targetRevision: HEAD
      path: kubernetes/platform/storage/longhorn
      ref: values
      plugin:
        name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      # prune: false protects the CRDs this chart ships. If a chart upgrade or
      # values change ever stopped rendering one, pruning would delete it, and
      # Kubernetes would delete every object of that kind:
      #   every Longhorn volume and backup record.
      # Cost: anything the chart drops or renames stays behind (shown as
      # OutOfSync "requires pruning"); after upgrades, delete leftovers by hand.
      # Never tick Prune on a manual sync of this app without reading the diff.
      prune: false
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: latest
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # No conversion.webhook caBundle entry: Longhorn 1.10 dropped the v1beta1
    # API and its conversion webhook, and with RespectIgnoreDifferences that
    # entry made Argo keep the live caBundle in its CRD patch, leaving a
    # conversion block without a strategy, which the API server rejects.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.preserveUnknownFields
        - .status
    - group: ""
      kind: Service
      jqPathExpressions:
        - .spec.ports[].nodePort

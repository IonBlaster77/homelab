# 0 disables moving replicas between disks of the SAME node under disk pressure.
# Every node here has exactly one disk per tag (one "ssd", one "nvme"), so such
# a move can never succeed: Longhorn v1.7 retried it every second (~830,000
# error log lines a day for the Prometheus replica on talos4) instead of giving
# up. Cross-node auto-balance (replica-auto-balance) is unaffected.
#
# (Orphaned replica data cleanup used to live here as the orphan-auto-deletion
# Setting; Longhorn 1.9 replaced it with orphanResourceAutoDeletion, now in
# values.yaml.)
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: replica-auto-balance-disk-pressure-percentage
  namespace: longhorn-system
value: "0"

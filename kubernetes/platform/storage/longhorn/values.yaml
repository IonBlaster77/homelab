defaultSettings:
  defaultReplicaCount: 3
  # Pinned (both already the live values, Longhorn defaults) so a chart change
  # can't quietly loosen them. false = HARD anti-affinity: two replicas of a
  # volume never share a node; if no separate node is free the volume runs
  # degraded instead of doubling up. best-effort = spread replicas back out
  # when nodes return.
  replicaSoftAntiAffinity: false
  replicaAutoBalance: best-effort
  taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule;node-role.kubernetes.io/master:NoSchedule"
  # When Longhorn detects a node down (via k8s node conditions), force-
  # delete its pods (Deployments and StatefulSets) so k8s reschedules
  # them elsewhere and Longhorn reattaches the volume there. Safe here
  # because defaultReplicaCount: 3 spreads every volume across 3 of
  # the 4 nodes - losing one node never means losing the only copy.
  # Was "do-nothing" (the chart default) until a talos4 reboot left
  # Jellyfin's pod stuck waiting for the same node to come back
  # instead of rescheduling (task #27).
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  # createDefaultDiskLabeledNodes: true tells Longhorn to read the
  # node.longhorn.io/default-disks-config annotation on each node
  # (set in the Talos machineconfig) instead of auto-discovering disks.
  # This gives us two tagged disk pools per node:
  #   ssd  → /var/lib/longhorn        (sda4 EPHEMERAL, ~200 GB usable)
  #   nvme → /var/lib/longhorn-nvme   (nvme0n1p1, ~246 GB usable)
  createDefaultDiskLabeledNodes: true
  # After each Longhorn upgrade, live-upgrade volume engines to the new
  # engine image automatically, at most one volume per node at a time.
  # Was 0 (never), which left every volume on the old engine after an
  # upgrade; one-minor-at-a-time upgrades need engines current before
  # the next hop.
  concurrentAutomaticEngineUpgradePerNodeLimit: 1
  # Delete orphaned replica data automatically. With this off, leftover
  # replica folders (from deleted volumes and moved replicas) piled up: 30 of
  # them, ~68 GB on talos4's SSD alone, cleaned up by hand on 2026-10-17.
  # Orphans are, by definition, not used by any replica. Was the
  # orphan-auto-deletion Setting ("true") before Longhorn 1.9.
  orphanResourceAutoDeletion: replica-data
  # Rebuild at most 2 replicas per node at once (default 5). After the
  # talos4 Talos upgrade on 2026-11-07, 5-at-a-time resync onto its BX500
  # (EPHEMERAL + "ssd" Longhorn disk) pinned it at 100% busy: containerd
  # timed out creating containers and CNPG standbys and Prometheus could
  # not start for 10+ minutes. Slower rebuilds, but the node stays usable.
  # It is one global number (Longhorn has no per-node/per-disk limit).
  # Raised to 4 temporarily for the talos2/talos3 upgrades (#401): resyncs
  # then wrote to Samsung disks and finished ~2x faster, but talos4's BX500
  # still reached ~85% I/O stall as the read source. For a planned
  # multi-node maintenance, 4 is reasonable; put it back to 2 afterwards.
  concurrentReplicaRebuildPerNodeLimit: 2
  # Longhorn reserves space by volume SIZE, not by what is used. At the
  # default 100% the NVMe pool had no room to reserve a second 150 GiB copy of
  # harbor-registry (57 GB actually used) on any node, despite 108-120 GB
  # free on each disk. 150% lets scheduling reserve beyond physical size for
  # thinly used volumes. The real safety net is unchanged:
  # storageMinimalAvailablePercentage (25%, Longhorn default) refuses any new
  # replica on a disk whose ACTUAL free space would drop below 25%, and the
  # LonghornDiskUsageHigh/Critical alerts (prometheusrule-infra.yaml) warn at
  # 80%/90% actual use. Note: over-provisioning only governs where NEW
  # replicas go; existing volumes can still grow, which is what the alerts are
  # for. (replica-auto-balance-disk-pressure-percentage is NOT a fix here: it
  # only moves replicas between disks on the same node - see
  # setting-orphans-and-balance.yaml.)
  storageOverProvisioningPercentage: 150
  # How long Longhorn waits for a failed replica to come back (cheap delta
  # resync) before building a new copy elsewhere (full copy). Kept at the
  # 10 min default on purpose: quick re-replication matters more than
  # avoiding rebuild traffic. 30 min was tried on 2026-11-07 for the Talos
  # rollout and left 9 volumes on a single live copy for ~30 min after the
  # talos3 OOM storm, even though talos3 itself stayed up. Rebuild load is
  # capped by concurrentReplicaRebuildPerNodeLimit above instead.
  replicaReplenishmentWaitInterval: 600
longhornManager:
  # OOM protection (docs/projects/oom-protection.md), sized 2026-11-07:
  # ~1.27 GiB typical, 2.45 GiB 30-day peak, ~270m CPU average. Request only,
  # no limit: a kill here stalls every volume operation on the node. Priority
  # is already longhorn-critical (chart default).
  resources:
    requests:
      cpu: 270m
      memory: 1Gi
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
longhornDriver:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
longhornUI:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
csi:
  kubeletRootDir: /var/lib/kubelet
service:
  ui:
    type: LoadBalancer
    annotations:
      # Pins the Longhorn UI to 10.77.20.51 permanently.
      # Reach the storage dashboard at http://10.77.20.51 from any
      # device on VLAN 20 — stable across cluster rebuilds.
      lbipam.cilium.io/ips: "10.77.20.51"
ingress:
  enabled: false
# Chart 1.12 renders ingress NetworkPolicies for Longhorn's own pods by
# default (restrictInternalTraffic: true, even with enabled: false). The
# longhorn-manager one only admits Longhorn pods, which would block
# Prometheus scraping manager metrics (:9500) from the monitoring namespace.
# Longhorn has always run without policies here; keep that until it gets
# its own policy set with a monitoring allowance.
networkPolicies:
  restrictInternalTraffic: false
preUpgradeChecker:
  jobEnabled: false
metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: monitoring
# The NAS backupstore, as Longhorn's "default" BackupTarget (Longhorn 1.8+).
# Replaces the old backup-target Setting: the 1.8 upgrade deletes that
# Setting and its webhook then rejects recreating it ("not supported").
defaultBackupStore:
  backupTarget: nfs://10.77.20.20:/volume1/longhorn-backups

# RustFS, single node: one pod, one data volume. Single-node is the mode
# RustFS has proven longest; distributed mode is not used here.
#
# Recreate, not RollingUpdate: the data volume is ReadWriteOnce, so a second
# pod could never start alongside the first. (This Deployment is created with
# Recreate; switching an existing one to it under SSA would be rejected.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: rustfs
  labels:
    app: rustfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      # The image runs as user `rustfs`, UID/GID 10001. fsGroup makes the
      # Longhorn volume writable by it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          # Pinned by digest (the MinIO lesson: an upstream image that stops
          # being published must not strand the backups). Pulled through
          # Harbor's dockerhub proxy cache by the Talos registry mirror.
          image: docker.io/rustfs/rustfs:1.0.3@sha256:128220dc9382bac81940a1a9616ee8c274a3f3b8f647eedbeb50df5bb8b49922
          args: ["/data"]
          env:
            - name: RUSTFS_ADDRESS
              value: ":9000"
            # The console is enabled but has no HTTPRoute: reach it with
            # kubectl port-forward (see README.md).
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: ":9001"
            - name: RUSTFS_OBS_LOGGER_LEVEL
              value: info
            # Root credential: used only for administration (creating
            # buckets, users and policies), never handed to a client app.
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-root
                  key: accessKey
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-root
                  key: secretKey
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi

---
# Default deny all ingress and egress for the rustfs namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rustfs-default-deny
  namespace: rustfs
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# DNS resolution. RustFS needs no other egress: no internet (update checks,
# telemetry), no other cluster services.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rustfs-allow-dns
  namespace: rustfs
spec:
  endpointSelector:
    matchLabels:
      app: rustfs
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# CNPG clusters: the Barman Cloud sidecar in each Postgres pod uploads WAL and
# base backups. One entry per cluster as it is wired up; each cluster's key
# can only touch its own s3://cnpg/<cluster>/ prefix anyway.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rustfs-allow-ingress-from-cnpg
  namespace: rustfs
spec:
  endpointSelector:
    matchLabels:
      app: rustfs
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            cnpg.io/cluster: grafana-db
        - matchLabels:
            io.kubernetes.pod.namespace: matrix
            cnpg.io/cluster: matrix-db
        - matchLabels:
            io.kubernetes.pod.namespace: harbor
            cnpg.io/cluster: harbor-db
        - matchLabels:
            io.kubernetes.pod.namespace: authentik
            cnpg.io/cluster: authentik-db
        - matchLabels:
            io.kubernetes.pod.namespace: kea
            cnpg.io/cluster: kea-db
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
#
# Each further client gets its own entry or policy here (see README.md).

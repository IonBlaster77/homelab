# Cluster-wide snapshot-controller: watches VolumeSnapshots and creates
# VolumeSnapshotContents, which Longhorn's csi-snapshotter sidecar then acts
# on. Straight from the upstream CSI repo. See README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: volumesnapshot-controller
  namespace: argocd
  annotations:
    # Required with ServerSideApply, or Argo CD shows phantom OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: homelab
  source:
    repoURL: https://github.com/kubernetes-csi/external-snapshotter.git
    targetRevision: v8.7.0
    path: deploy/kubernetes/snapshot-controller
    # Upstream's manifests at the v8.7.0 tag still reference the v8.6.0
    # image (found 2026-11-08 via Trivy), so pin it to match the tag.
    # Bump this together with targetRevision.
    kustomize:
      images:
        - registry.k8s.io/sig-storage/snapshot-controller:v8.7.0
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

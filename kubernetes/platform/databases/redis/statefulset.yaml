# Redis, highly available: 3 pods, each running Redis + Sentinel.
#
# How it fits together (see README.md for the walkthrough):
#   - ONE pod is the primary (takes writes); the other two are replicas that
#     copy everything it writes, live.
#   - Sentinel is Redis' built-in watchdog. All 3 Sentinels watch the primary;
#     if it stops answering for 5s and at least 2 Sentinels agree (quorum),
#     they promote a replica and repoint the others at it.
#   - Clients ask any Sentinel "who is the primary of mymaster?" (service
#     redis-sentinel:26379) and connect there, so they follow failovers.
#
# Why a StatefulSet: each pod keeps a stable name (redis-0/1/2), a stable DNS
# name (redis-N.redis.redis.svc.cluster.local) and its own PVC across restarts.
# Everything announces those DNS names instead of pod IPs, so a pod coming
# back with a new IP is still recognised (resolve/announce-hostnames).
#
# One pod per node, enforced: the podAntiAffinity below is REQUIRED, so the
# scheduler refuses to place two Redis pods on the same node (4 nodes, 3 pods:
# losing any one node loses at most one Redis). The PodDisruptionBudget stops
# voluntary disruptions (drains, upgrades) taking down more than one at a time.
#
# Persistence: AOF (appendonly, fsync every second) on every pod, so a restart
# replays its log. Replication is asynchronous: a failover can lose the last
# moment of writes. Fine for caches/queues (Harbor), not a ledger.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: redis
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 3
  # Start/stop one at a time, in order: redis-0 bootstraps first on a cold
  # start, the others join it.
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: redis
      initContainers:
        # Works out this pod's role and writes redis.conf + sentinel.conf.
        # 1. Ask the OTHER pods' Sentinels who the current primary is.
        # 2. Nobody answers (cold start): redis-0 becomes primary, the rest
        #    replicate redis-0.
        # 3. Somebody answers: replicate that primary (or stay primary if
        #    the answer is this pod).
        # Configs go in an emptyDir (Sentinel rewrites its file at runtime
        # and the password must not land on the PVC).
        - name: config
          image: redis:8.10.2-alpine
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
          command:
            - sh
            - -c
            - |
              set -eu
              SVC=redis.redis.svc.cluster.local
              ME="$(hostname).$SVC"
              ORD="${HOSTNAME##*-}"
              ask() {
                for i in 0 1 2; do
                  PEER="redis-$i.$SVC"
                  [ "$PEER" = "$ME" ] && continue
                  ANS=$(timeout 3 redis-cli -h "$PEER" -p 26379 sentinel get-master-addr-by-name mymaster 2>/dev/null | head -1 || true)
                  case "$ANS" in
                    ""|*nil*|*ERR*|*Could*|*refused*) ;;
                    *) echo "$ANS"; return ;;
                  esac
                done
              }
              MASTER=$(ask)
              # Sentinels naming THIS (just-starting) pod as primary usually
              # means the old primary restarted faster than the failover
              # (5s detection + election). Wait it out and ask again, so a
              # restarting ex-primary doesn't come up as a second primary.
              if [ "$MASTER" = "$ME" ]; then
                echo "Sentinels still name this pod as primary; waiting 15s for any failover"
                sleep 15
                MASTER=$(ask)
              fi
              if [ -z "$MASTER" ]; then
                if [ "$ORD" = "0" ]; then MASTER="$ME"; else MASTER="redis-0.$SVC"; fi
                echo "no Sentinel answered: primary is $MASTER (cold start rule)"
              else
                echo "Sentinels report primary: $MASTER"
              fi
              cat > /etc/redis/redis.conf <<EOF
              port 6379
              dir /data
              appendonly yes
              appendfsync everysec
              requirepass $REDIS_PASSWORD
              masterauth $REDIS_PASSWORD
              replica-announce-ip $ME
              replica-announce-port 6379
              EOF
              if [ "$MASTER" != "$ME" ]; then
                echo "replicaof $MASTER 6379" >> /etc/redis/redis.conf
                echo "role: replica of $MASTER"
              else
                echo "role: primary"
              fi
              cat > /etc/redis/sentinel.conf <<EOF
              port 26379
              dir /tmp
              sentinel resolve-hostnames yes
              sentinel announce-hostnames yes
              sentinel announce-ip $ME
              sentinel announce-port 26379
              sentinel monitor mymaster $MASTER 6379 2
              sentinel auth-pass mymaster $REDIS_PASSWORD
              sentinel down-after-milliseconds mymaster 5000
              sentinel failover-timeout mymaster 60000
              sentinel parallel-syncs mymaster 1
              EOF
          volumeMounts:
            - name: conf
              mountPath: /etc/redis
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: redis
          image: redis:8.10.2-alpine
          command: ["redis-server", "/etc/redis/redis.conf"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
            - name: conf
              mountPath: /etc/redis
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          # redis-cli reads REDISCLI_AUTH from the environment, so the probe
          # doesn't put the password on the command line.
          readinessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
        - name: sentinel
          image: redis:8.10.2-alpine
          command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
          ports:
            - containerPort: 26379
              name: sentinel
          volumeMounts:
            - name: conf
              mountPath: /etc/redis
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
        # redis_exporter translates this pod's Redis INFO into /metrics.
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.96.0-alpine
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: REDIS_ADDR
              value: "redis://localhost:6379"
          ports:
            - containerPort: 9121
              name: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: conf
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn-ssd
        resources:
          requests:
            storage: 4Gi

---
# Default deny all ingress and egress for the redis namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-default-deny
  namespace: redis
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# DNS resolution.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-allow-dns
  namespace: redis
spec:
  endpointSelector:
    matchLabels:
      app: redis
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# The 3 Redis pods talk to each other: replicas stream from the primary
# (6379), Sentinels watch every Redis (6379) and gossip/vote with each other
# (26379), and the init container asks peers' Sentinels who the primary is.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-allow-intra-cluster
  namespace: redis
spec:
  endpointSelector:
    matchLabels:
      app: redis
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
            - port: "26379"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
            - port: "26379"
              protocol: TCP
---
# Prometheus scraping the redis_exporter sidecar.
#
# No client app is admitted on 6379 right now. README.md ("Adding a client")
# shows the policy to add when an app should use this Redis.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-allow-ingress-from-monitoring
  namespace: redis
spec:
  endpointSelector:
    matchLabels:
      app: redis
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9121"
              protocol: TCP

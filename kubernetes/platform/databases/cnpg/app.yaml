# CloudNativePG: the PostgreSQL operator. Runs every Postgres database in
# the cluster (authentik, grafana, kea) from their `Cluster` objects.
# Upstream chart; values in values.yaml. See README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argocd
  annotations:
    # Required with ServerSideApply below, or Argo CD shows phantom OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: homelab
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.28.0
      helm:
        valueFiles:
          - $values/kubernetes/platform/databases/cnpg/values.yaml
    # This repo, only to supply values.yaml to the chart above ($values).
    - repoURL: https://github.com/IonBlaster77/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      # prune: false protects the CRDs this chart ships. If a chart upgrade or
      # values change ever stopped rendering one, pruning would delete it, and
      # Kubernetes would delete every object of that kind:
      #   every Postgres database (authentik, grafana, kea) and its volumes.
      # Cost: anything the chart drops or renames stays behind (shown as
      # OutOfSync "requires pruning"); after upgrades, delete leftovers by hand.
      # Never tick Prune on a manual sync of this app without reading the diff.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

# CloudNativePG: the PostgreSQL operator. Runs every Postgres database in
# the cluster (authentik, grafana, kea) from their `Cluster` objects.
# Upstream chart; values in values.yaml. See README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argocd
  annotations:
    # Required with ServerSideApply below, or Argo CD shows phantom OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  # project: default - kept from before the move so nothing about
  # permissions changed; moving to homelab is a separate cleanup.
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.28.0
      helm:
        valueFiles:
          - $values/kubernetes/platform/databases/cnpg/values.yaml
    # This repo, only to supply values.yaml to the chart above ($values).
    - repoURL: https://github.com/IonBlaster77/homelab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

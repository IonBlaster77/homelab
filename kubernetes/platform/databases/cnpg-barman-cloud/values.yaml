# Same scheduling as the operator (cnpg/values.yaml): may run on any node.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# The chart sets no resources by default; these are its own suggested values.
resources:
  requests:
    cpu: 100m
    memory: 100Mi
  limits:
    memory: 200Mi

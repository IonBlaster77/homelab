existingSecret: pgadmin-credentials
env:
  email: admin@jupitertech.net

persistentVolume:
  enabled: true
  storageClass: longhorn-ssd
  size: 2Gi

# The data volume is RWO, so the chart's default RollingUpdate deadlocks on
# every upgrade: the new pod waits on a volume the old pod still holds
# (Multi-Attach error, hit with chart 1.70.4 on 2026-10-19). Stop first:
# maxSurge 0 removes the old pod before the new one starts. Not
# type: Recreate: Argo's server-side apply keeps the live rollingUpdate block
# and the API rejects Recreate with rollingUpdate set.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi

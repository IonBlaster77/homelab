# pgAdmin: web UI for the cluster's PostgreSQL databases. The upstream chart
# plus this folder (namespace + login secret) in one app. See README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pgadmin
  namespace: argocd
  annotations:
    # Required with ServerSideApply, or Argo CD shows phantom OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: homelab
  sources:
    - repoURL: https://helm.runix.net
      chart: pgadmin4
      targetRevision: 1.62.0
      helm:
        releaseName: pgadmin4
        valueFiles:
          - $values/kubernetes/platform/databases/pgadmin/values.yaml
    # This folder: applies its own manifests (namespace, secret) and, as
    # ref "values", supplies values.yaml to the chart above.
    - repoURL: https://github.com/IonBlaster77/homelab.git
      targetRevision: HEAD
      path: kubernetes/platform/databases/pgadmin
      ref: values
      plugin:
        name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: pgadmin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

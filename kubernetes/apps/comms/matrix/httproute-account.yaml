# account.jupitertech.net: Matrix Authentication Service (the sign-in pages,
# which hand off to Authentik). PUBLIC (Cloudflare Access bypass) because the
# Element X app opens it during login.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-account
  namespace: networking
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: networking
      sectionName: https
  hostnames:
    - account.jupitertech.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: matrix-matrix-authentication-service
          namespace: matrix
          port: 8080

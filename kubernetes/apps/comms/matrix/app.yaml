# Matrix (Synapse + Matrix Authentication Service + Element Web) via Element's
# ESS Community chart: the homelab's alert inbox and chat workspace.
# Alertmanager posts into rooms through an in-cluster bridge; Hermes reads them
# as a bot. Sign-in is Authentik only. See README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: matrix
  namespace: argocd
  annotations:
    # Required with ServerSideApply, or Argo CD shows phantom OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: homelab
  sources:
    # OCI chart: needs the repository entry in bootstrap/argocd-ess-helm-repo.yaml.
    - repoURL: ghcr.io/element-hq/ess-helm
      chart: matrix-stack
      targetRevision: 26.10.3
      helm:
        releaseName: matrix
        valueFiles:
          - $values/kubernetes/apps/comms/matrix/values.yaml
    # This folder: database, secrets, routes and network policy, and (as ref
    # "values") values.yaml for the chart above.
    - repoURL: https://github.com/IonBlaster77/homelab.git
      targetRevision: HEAD
      path: kubernetes/apps/comms/matrix
      ref: values
      plugin:
        name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: matrix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

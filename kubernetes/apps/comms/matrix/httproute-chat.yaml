# chat.jupitertech.net: Element Web, the browser client for computers. Unlike
# matrix. and account., this one STAYS behind Cloudflare Access: phones use the
# Element X app, which never needs it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix-chat
  namespace: networking
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: networking
      sectionName: https
  hostnames:
    - chat.jupitertech.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: matrix-element-web
          namespace: matrix
          port: 80

# matrix.jupitertech.net: the Matrix client API (Synapse) and the well-known
# discovery file. PUBLIC (Cloudflare Access bypass) so Element X on a phone can
# reach it; every request still needs an Authentik-issued login.
# Paths mirror the chart's own Ingress, with federation and the Synapse admin
# API blocked (redirected away) because neither should ever be reachable from
# outside.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: matrix
  namespace: networking
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: networking
      sectionName: https
  hostnames:
    - matrix.jupitertech.net
  rules:
    # Blocked: server-to-server federation, signing-key lookups, admin API.
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix/federation
        - path:
            type: PathPrefix
            value: /_matrix/key
        - path:
            type: PathPrefix
            value: /_synapse/admin
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
    # Login, token refresh and logout are handled by MAS, not Synapse.
    - matches:
        - path: {type: PathPrefix, value: /_matrix/client/api/v1/login}
        - path: {type: PathPrefix, value: /_matrix/client/api/v1/refresh}
        - path: {type: PathPrefix, value: /_matrix/client/api/v1/logout}
        - path: {type: PathPrefix, value: /_matrix/client/r0/login}
        - path: {type: PathPrefix, value: /_matrix/client/r0/refresh}
        - path: {type: PathPrefix, value: /_matrix/client/r0/logout}
        - path: {type: PathPrefix, value: /_matrix/client/v3/login}
        - path: {type: PathPrefix, value: /_matrix/client/v3/refresh}
        - path: {type: PathPrefix, value: /_matrix/client/v3/logout}
        - path: {type: PathPrefix, value: /_matrix/client/unstable/login}
        - path: {type: PathPrefix, value: /_matrix/client/unstable/refresh}
        - path: {type: PathPrefix, value: /_matrix/client/unstable/logout}
      backendRefs:
        - name: matrix-matrix-authentication-service
          namespace: matrix
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /_matrix
        - path:
            type: PathPrefix
            value: /_synapse
      backendRefs:
        - name: matrix-synapse
          namespace: matrix
          port: 8008
    # Everything else: /.well-known/matrix/* (how clients find this server).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: matrix-well-known
          namespace: matrix
          port: 8010

# Values for Element's ESS Community chart (matrix-stack).
# Reference: https://github.com/element-hq/ess-helm/blob/main/charts/matrix-stack/values.yaml

# The domain in every Matrix ID (@user:matrix.jupitertech.net). It can NEVER be
# changed without wiping the database.
serverName: matrix.jupitertech.net

# Routing is done by our own HTTPRoutes (httproute-*.yaml). The chart still
# renders Ingress objects, but nothing reads them: this cluster has no Ingress
# controller (Cilium's is off). If one is ever enabled they would go live.
ingress:
  tlsEnabled: false

# Not used: voice/video calls (needs UDP + TURN), the extra admin UI (one less
# public surface), and the bundled Postgres (we use CloudNativePG instead).
matrixRTC:
  enabled: false
elementAdmin:
  enabled: false
postgres:
  enabled: false

synapse:
  ingress:
    host: matrix.jupitertech.net
  postgres:
    host: matrix-db-rw.matrix.svc.cluster.local
    port: 5432
    user: synapse
    database: synapse
    sslMode: require
    password:
      # Generated by CloudNativePG for the database owner (cluster-matrix-db.yaml).
      secret: matrix-db-app  # scan-secrets: reference
      secretKey: password
  media:
    storage:
      size: 10Gi
  additional:
    homelab.yaml:
      config: |
        # Federation OFF: this server never talks to other Matrix servers.
        federation_domain_whitelist: []
        allow_public_rooms_over_federation: false
        allow_public_rooms_without_auth: false
        # Don't contact matrix.org's key server (only needed for federation).
        trusted_key_servers: []
        suppress_key_server_warning: true
        # Push notifications carry no message content, only "new message".
        push:
          include_content: false
        # No server-side fetching of links people post.
        url_preview_enabled: false

matrixAuthenticationService:
  ingress:
    host: account.jupitertech.net
  postgres:
    host: matrix-db-rw.matrix.svc.cluster.local
    port: 5432
    user: mas
    database: mas
    sslMode: require
    password:
      secret: matrix-db-mas  # scan-secrets: reference
      secretKey: password
  additional:
    # Authentik is the ONLY way in: no local passwords, no self-registration.
    # Accounts are created on first Authentik login (who may log in is decided
    # by the Matrix application's bindings in Authentik).
    auth.yaml:
      config: |
        passwords:
          enabled: false
        account:
          password_registration_enabled: false
          password_change_allowed: false
          password_recovery_enabled: false
    # The Authentik provider (client id/secret), kept in a SOPS secret.
    upstream.yaml:
      configSecret: matrix-mas-upstream  # scan-secrets: reference
      configSecretKey: upstream.yaml

elementWeb:
  ingress:
    host: chat.jupitertech.net

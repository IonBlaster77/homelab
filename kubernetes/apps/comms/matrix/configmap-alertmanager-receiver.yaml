# Config for matrix-alertmanager-receiver: the bridge that turns Alertmanager
# webhooks into Matrix messages, posted as @alertbot. ${...} values are filled
# from the matrix-alertbot Secret (env vars) at startup.
# Room IDs are not secret. Rooms (in the "Homelab" space) were created by
# ~/homelab/restructure-tools/matrix-rooms.sh; to re-point a room, change its ID.
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-alertmanager-receiver
  namespace: matrix
data:
  config.yaml: |
    http:
      port: 12345
      alerts-path-prefix: /alerts
      metrics-path: /metrics
      metrics-enabled: true
      basic-username: alertmanager
      basic-password: ${WEBHOOK_PASSWORD}
    matrix:
      # In-cluster: HAProxy in front of Synapse. Never leaves the namespace.
      homeserver-url: http://matrix-synapse.matrix.svc.cluster.local:8008
      user-id: "@alertbot:matrix.jupitertech.net"
      access-token: ${ACCESS_TOKEN}
      room-mapping:
        alerts-critical: "!IHSCVidCmFd2py1dGRxtgeUYgjkKuKI2XUxLb8JFd3E"
        alerts-warning: "!0lyEnSgrdxRHsROoG4CWcRCnb_ZAKqSloxs2_lghhww"
    # A firing template is REQUIRED (the receiver refuses to start without
    # one). This is the project's default plus the namespace. No separate
    # resolved-template: the default one shows only .Labels.name, which most
    # alerts lack, so resolved alerts reuse this template (in green).
    templating:
      firing-template: |
        {{ $color := "yellow" }}
        {{ if eq .Alert.Labels.severity "warning" }}{{ $color = "orange" }}{{ else if eq .Alert.Labels.severity "critical" }}{{ $color = "red" }}{{ end }}
        {{ if eq .Alert.Status "resolved" }}{{ $color = "green" }}{{ end }}
        <p>
          <strong><font color="{{ $color }}">{{ .Alert.Status | ToUpper }}</font></strong>
          {{ if .Alert.Labels.alertname }}{{ .Alert.Labels.alertname }}{{ end }}
          {{ if .Alert.Labels.namespace }}({{ .Alert.Labels.namespace }}){{ end }}
          &gt;&gt;
          {{ if .Alert.Labels.severity }}{{ .Alert.Labels.severity | ToUpper }}: {{ end }}
          {{ if .Alert.Annotations.description }}{{ .Alert.Annotations.description }}{{ else if .Alert.Annotations.summary }}{{ .Alert.Annotations.summary }}{{ end }}
          {{ if .Alert.Annotations.runbook_url }}&gt;&gt; <a href="{{ .Alert.Annotations.runbook_url }}">Runbook</a>{{ end }}
        </p>

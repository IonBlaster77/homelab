apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-alertmanager-receiver
  namespace: matrix
  labels:
    app.kubernetes.io/name: alertmanager-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager-receiver
      annotations:
        # The bridge reads its config (room mapping) once at startup. Bump
        # this whenever configmap-alertmanager-receiver.yaml changes.
        config-rev: "2026-11-07-vulnerabilities-room"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: docker.io/metio/matrix-alertmanager-receiver:2026.11.25@sha256:c4769eb758fe430ac42d25dbc83b6427f01917404131614e0b4c0436b36f83ab
          args:
            - --config-path=/config/config.yaml
          envFrom:
            - secretRef:
                name: matrix-alertbot
          ports:
            - name: http
              containerPort: 12345
          readinessProbe:
            httpGet:
              path: /metrics
              port: 12345
          livenessProbe:
            httpGet:
              path: /metrics
              port: 12345
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: matrix-alertmanager-receiver

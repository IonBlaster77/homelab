# Music Assistant: the audio engine for the whole-home zoned audio project
# (docs/projects/zoned-audio.md). Runs hostNetwork pinned to talos4 because
# AirPlay needs LAN multicast in both directions; see README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: music-assistant
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/home/music-assistant
    plugin:
      name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: music-assistant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

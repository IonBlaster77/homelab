# Home Assistant: the brain for the whole-home zoned audio project
# (docs/projects/zoned-audio.md).
#
# Plain HA Container, not the supervised/OS install, so there is NO add-on store.
# Music Assistant is therefore deployed as its own workload rather than as an HA
# add-on: see kubernetes/apps/home/music-assistant/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/home/home-assistant
    plugin:
      name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: home-assistant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

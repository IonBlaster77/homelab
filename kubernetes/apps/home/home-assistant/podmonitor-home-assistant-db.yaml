# CNPG metrics for home-assistant-db, so the CNPG alerts (incl.
# WALArchiveBacklog) and the CNPG Grafana dashboard cover it. Hand-rolled
# like the other clusters' (enablePodMonitor is deprecated).
# home-assistant-db-allow-cnpg in networkpolicy.yaml admits the scrape.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: home-assistant-db
  namespace: home-assistant
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: home-assistant-db
  podMetricsEndpoints:
    - port: metrics

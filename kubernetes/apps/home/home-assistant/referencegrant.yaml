# The HTTPRoute lives in `networking` but the Service lives here, and Gateway
# API forbids cross-namespace backendRefs without an explicit grant.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-networking-to-home-assistant
  namespace: home-assistant
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: networking
  to:
    - group: ""
      kind: Service

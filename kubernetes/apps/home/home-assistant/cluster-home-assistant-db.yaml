# Home Assistant's recorder database (state history, events, long-term
# statistics). CloudNativePG generates the credentials into
# home-assistant-db-app (username, password, uri); HA reads `uri` through
# `!env_var RECORDER_DB_URL` in configuration.yaml (configmap.yaml) and
# creates its own schema on first start.
#
# Only the recorder is here. HA's own state (.storage: devices, entities,
# users, the UI-edited automations) stays on the home-assistant-config PVC:
# HA has no option to put that in a database.
#
# Moved off SQLite on 2026-11-26, before HA was onboarded, so no history was
# lost (HA doesn't support migrating recorder data between databases).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: home-assistant-db
  namespace: home-assistant
spec:
  instances: 2
  # Pinned here so Renovate tracks it (same group as the other clusters).
  # `standard` like streamystats-db; `system` (the older clusters) is
  # deprecated upstream.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie
  # OOM protection (docs/projects/oom-protection.md): new, so sized like the
  # other small clusters. Memory request = limit, CPU request, no CPU limit.
  # Revisit from Prometheus once HA has real devices.
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 512Mi
  primaryUpdateMethod: switchover
  # Synchronous replication, same as every other cluster (see
  # paperclip-db): "preferred", never "required" with two instances.
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  storage:
    # HA keeps 7 days of history (purge_keep_days) plus long-term
    # statistics; a few GiB is plenty. Expand here if it grows.
    storageClass: longhorn-nvme
    size: 5Gi
  bootstrap:
    # CNPG's initdb uses UTF8, which HA's docs require for PostgreSQL.
    initdb:
      database: homeassistant
      owner: homeassistant
  # Point-in-time recovery from day one: the Barman Cloud plugin archives every
  # WAL segment and stores base backups in RustFS (s3://cnpg/home-assistant-db/,
  # see objectstore-home-assistant-db.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: home-assistant-db-backup
        serverName: home-assistant-db

# Daily base backup of atlas-db to RustFS via the Barman Cloud plugin.
# 16:10 UTC = 02:40 Adelaide, after paperclip-db (16:00). CNPG cron has a
# seconds field. No `immediate`: created in the same sync as the Cluster's
# plugin entry, it fires before the pods run the sidecar and fails ("requested
# plugin is not available"). Take the first base backup by hand once the pods
# are up (see the cnpg-barman-cloud README).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: atlas-db-daily
  namespace: atlas
spec:
  schedule: "0 10 16 * * *"
  backupOwnerReference: self
  cluster:
    name: atlas-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

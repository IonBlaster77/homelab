# Atlas' Postgres: vulnerability findings, their history and raw Trivy
# reports now; the asset inventory and risk register later. CloudNativePG
# generates the app credentials into atlas-db-app (username, password, uri);
# the collector reads `uri` as DATABASE_URL and applies its own migrations
# (services/atlas/src/db/migrations).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: atlas-db
  namespace: atlas
spec:
  instances: 2
  # Pinned here so Renovate tracks it (see cluster-paperclip-db.yaml).
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie
  # OOM protection (docs/projects/oom-protection.md): memory request = limit
  # so the kubelet and the Talos OOM controller leave it alone; a CPU request
  # but no CPU limit. Not sized from history yet (new cluster): the working
  # set is ~60 MB of data. Revisit after 30 days.
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi
  primaryUpdateMethod: switchover
  # Synchronous replication (2026-11-22, piloted on paperclip-db): commits wait
  # for the standby, so an unplanned failover can't drop acknowledged writes.
  # "preferred", not "required": with two instances "required" would block all
  # writes while the replica is down. See cluster-paperclip-db.yaml.
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  storage:
    # nvme, not ssd: same reasoning as the other databases (kea-db, 2026-08-05).
    storageClass: longhorn-nvme
    # ~60 MB at the start (measured on a copy of the live reports,
    # 2026-11-21); raw reports grow only when a rescan finds something new.
    size: 5Gi
  bootstrap:
    initdb:
      database: atlas
      owner: atlas
  # atlas_web: the web/API's own login, read-only (decided 2026-11-28: no
  # component gets more than it needs). pg_read_all_data = SELECT on every
  # table, including ones added by later migrations; no writes. The API also
  # opens every session with default_transaction_read_only and connects to the
  # replica service (atlas-db-ro). Password in secret-atlas-db-web.sops.yaml.
  managed:
    roles:
      - name: atlas_web
        ensure: present
        login: true
        inRoles:
          - pg_read_all_data
        connectionLimit: 10
        passwordSecret:
          name: atlas-db-web
  # Point-in-time recovery from day one: the Barman Cloud plugin archives every
  # WAL segment and stores base backups in RustFS (s3://cnpg/atlas-db/, see
  # objectstore-atlas-db.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: atlas-db-backup
        serverName: atlas-db

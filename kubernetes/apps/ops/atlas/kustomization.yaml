# Lists every manifest Argo CD applies for this app. app.yaml is deliberately
# NOT listed: it is picked up by the root app, not by this folder's own app.
# *.sops.yaml files are decrypted by the sops-kustomize plugin before this runs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  # Postgres (CloudNativePG) with point-in-time recovery to RustFS
  - cluster-atlas-db.yaml
  - podmonitor-atlas-db.yaml
  - secret-atlas-db-backup.sops.yaml
  - objectstore-atlas-db.yaml
  - scheduledbackup-atlas-db.yaml
  # The vulnerability collector: read access to Trivy reports, the pod, metrics
  - rbac-collector.yaml
  - deployment-collector.yaml
  - podmonitor-collector.yaml
  - prometheusrule-atlas.yaml

---
# Default deny all ingress and egress for the atlas namespace. (One empty
# rule = deny-all; an empty list is rejected by Cilium. See
# kubernetes/apps/ai/crawl4ai/networkpolicy.yaml.)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atlas-default-deny
  namespace: atlas
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# The collector to its Postgres, and Postgres replication.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atlas-allow-intra-namespace
  namespace: atlas
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
  egress:
    - toEndpoints:
        - {}
---
# DNS. The `rules: dns` block sends lookups through Cilium's DNS proxy, which
# is what lets atlas-collector-internet-feeds below allow hosts by name
# (toFQDNs). It allows every lookup; only the connections are restricted.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atlas-allow-dns
  namespace: atlas
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# The collector's only internet access, HTTPS to exactly these hosts
# (services/atlas/src/collector/intel.ts and exposure.ts):
#   www.cisa.gov                 CISA KEV catalog (every 6 h)
#   epss.empiricalsecurity.com   FIRST EPSS scores (every 6 h)
#   cloudflare-dns.com           public DNS check of our own hostnames
#                                (DNS-over-HTTPS; hourly per hostname)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atlas-collector-internet-feeds
  namespace: atlas
spec:
  endpointSelector:
    matchLabels:
      app: atlas-collector
  egress:
    - toFQDNs:
        - matchName: www.cisa.gov
        - matchName: epss.empiricalsecurity.com
        - matchName: cloudflare-dns.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# The collector reads Trivy's VulnerabilityReports and the ReplicaSets from
# the API server, and image-update-exporter's results from Prometheus (plus
# trivy:vulnerability:present once, for the history backfill). Prometheus'
# container port (post-DNAT), not the Service port; they're both 9090 here.
# Prometheus scrapes the collector's /metrics (8080).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atlas-collector
  namespace: atlas
spec:
  endpointSelector:
    matchLabels:
      app: atlas-collector
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# The web/API: in from the Cilium Gateway only (reserved `ingress` identity,
# container port), out to atlas-db (atlas-allow-intra-namespace) and to
# Cloudflare Access for its token-signing keys. Nothing else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atlas-web
  namespace: atlas
spec:
  endpointSelector:
    matchLabels:
      app: atlas-web
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toFQDNs:
        - matchName: jupitertech7.cloudflareaccess.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# atlas-db: the CloudNativePG operator manages it; its instance manager talks
# to the Kubernetes API; the Barman Cloud sidecar uploads to RustFS;
# Prometheus scrapes CNPG metrics.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: atlas-db-allow-cnpg
  namespace: atlas
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: atlas-db
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: rustfs
            app: rustfs
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP
    # `kubectl cnpg status` reads each instance's /pg/status (8000) through
    # the kube-apiserver pod proxy; without this it times out.
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP

# The collector reads, cluster-wide: Trivy's VulnerabilityReports, and
# ReplicaSets (to skip reports of old rollout revisions and to name the owning
# Deployment). Read-only; nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-collector
  namespace: atlas
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atlas-collector-read
rules:
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atlas-collector-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: atlas-collector-read
subjects:
  - kind: ServiceAccount
    name: atlas-collector
    namespace: atlas

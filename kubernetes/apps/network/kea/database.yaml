apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kea-db
  namespace: kea
spec:
  instances: 2
  # Pinned here so Renovate tracks it. Left unset, CNPG writes its default
  # into the live spec at creation and never moves it again: four clusters
  # sat on 18.3 while newer ones got 18.6. Changing it rolls the replica
  # first, then a switchover (primaryUpdateMethod).
  #
  # Postgres 19 since 2026-11-21: the CNPG major-upgrade pilot
  # (docs/runbooks/cnpg-major-upgrade.md). A new major in imageName makes CNPG
  # stop the cluster, run pg_upgrade in a Job and recreate the replica.
  imageName: ghcr.io/cloudnative-pg/postgresql:19.0-system-trixie
  # OOM protection (docs/projects/oom-protection.md), sized 2026-11-07:
  # 30-day peak 136 MiB. Memory request = limit (~2x peak) so the
  # kubelet and the Talos OOM controller leave it alone; a CPU request but
  # no CPU limit (CPU is the scarce resource), so the pod is Burstable.
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 40m
      memory: 384Mi
    limits:
      memory: 384Mi
  # Promote the running standby for primary updates (seconds of downtime)
  # instead of restarting the primary pod in place.
  primaryUpdateMethod: switchover
  # Synchronous replication (2026-11-22, piloted on paperclip-db): commits wait
  # for the standby, so an unplanned failover can't drop acknowledged writes.
  # "preferred", not "required": with two instances "required" would block all
  # writes while the replica is down. See cluster-paperclip-db.yaml.
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  storage:
    # nvme, not ssd: the ssd pool is near its scheduling ceiling cluster-
    # wide (see cnpg-backups migration, 2026-08-05). Existing PVCs stay on
    # ssd until manually rolled - a spec change alone doesn't migrate them.
    storageClass: longhorn-nvme
    size: 5Gi
  bootstrap:
    initdb:
      database: kea
      owner: kea
      secret:
        name: kea-db-credentials
  managed:
    roles:
      - name: grafana_ro
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        comment: "Read-only Grafana datasource user"
        passwordSecret:
          name: kea-db-grafana-credentials
  # Point-in-time recovery: the Barman Cloud plugin archives every WAL segment
  # and stores base backups in RustFS. Adding this restarts both pods once.
  # Since the Postgres 19 upgrade: s3://cnpg/kea-db/pg19/ (objectstore-kea-db-
  # pg19.yaml). pg_upgrade gives the database a new system identifier, so the
  # archive must move to an empty path in the same change as imageName; the
  # Postgres 18 history stays in s3://cnpg/kea-db/base/ and wals/
  # (objectstore-kea-db.yaml) for restores to before the upgrade.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: kea-db-backup-pg19
        serverName: pg19

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kea-dhcp4
  namespace: kea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kea-dhcp4
  template:
    metadata:
      labels:
        app: kea-dhcp4
    spec:
      initContainers:
        # Creates the lease database schema on an empty database, or upgrades
        # it to this Kea version's schema (a no-op when already current).
        # kea-dhcp4 refuses to start against an older schema. Same image
        # version as kea-dhcp4: Renovate updates them together.
        - name: db-schema
          image: jonasal/kea-admin:3.2.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              db="-h kea-db-rw.kea.svc.cluster.local -u kea -p ${DB_PASSWORD} -n kea"
              if kea-admin db-version pgsql $db >/dev/null 2>&1; then
                echo "schema $(kea-admin db-version pgsql $db), upgrading if needed"
                kea-admin db-upgrade pgsql $db
              else
                echo "no schema, creating"
                kea-admin db-init pgsql $db
              fi
              echo "schema now $(kea-admin db-version pgsql $db)"
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kea-db-credentials
                  key: password
      containers:
        - name: kea-dhcp4
          image: jonasal/kea-dhcp4:3.2.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed "s|__DB_PASSWORD__|${DB_PASSWORD}|g" /etc/kea/kea-dhcp4.conf.tmpl > /tmp/kea-dhcp4.conf
              exec kea-dhcp4 -c /tmp/kea-dhcp4.conf
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kea-db-credentials
                  key: password
          ports:
            - name: dhcp
              containerPort: 67
              protocol: UDP
            # The management API (control-sockets in the config). Kea 3.x
            # serves it from kea-dhcp4 itself; there's no Control Agent.
            - name: api
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: kea-config
              mountPath: /etc/kea
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: kea-config
          configMap:
            name: kea-config

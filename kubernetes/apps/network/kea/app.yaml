# Kea DHCPv4 server backed by a CloudNativePG lease database. See README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kea
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/network/kea
    plugin:
      name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: kea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

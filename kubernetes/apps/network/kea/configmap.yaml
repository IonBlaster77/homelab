apiVersion: v1
kind: ConfigMap
metadata:
  name: kea-config
  namespace: kea
data:
  kea-dhcp4.conf.tmpl: |
    {
      "Dhcp4": {
        // eth0 only: "*" also tries the pod's unused tunnel interfaces
        // (tunl0, sit0, ip6tnl0), which are down, and Kea 3.x logs that as
        // DHCP4_OPEN_SOCKETS_FAILED at ERROR. Relayed requests arrive on eth0.
        "interfaces-config": {
          "interfaces": ["eth0"],
          "dhcp-socket-type": "udp"
        },
        // The management API, served by kea-dhcp4 itself on :8000 (the
        // Service is still called kea-ctrl-agent). Kea 3.x removed the
        // separate Control Agent. An authentication block is mandatory;
        // an empty clients list means no credentials are required, the
        // same as the old Control Agent here.
        "control-sockets": [
          {
            "socket-type": "http",
            "socket-address": "0.0.0.0",
            "socket-port": 8000,
            "authentication": {
              "type": "basic",
              "realm": "kea-dhcp4",
              "clients": []
            }
          }
        ],
        "lease-database": {
          "type": "postgresql",
          "host": "kea-db-rw.kea.svc.cluster.local",
          "name": "kea",
          "user": "kea",
          "password": "__DB_PASSWORD__"
        },
        // Bare names: Kea 3.x only loads hooks from its own hooks directory.
        // libdhcp_pgsql.so is required for the PostgreSQL lease database
        // since Kea 2.7.4 (it used to be built in).
        "hooks-libraries": [
          {"library": "libdhcp_pgsql.so"},
          {"library": "libdhcp_lease_cmds.so"},
          {"library": "libdhcp_stat_cmds.so"}
        ],
        "host-reservation-identifiers": ["hw-address", "client-id"],
        "reservations-global": false,
        "reservations-in-subnet": true,
        "valid-lifetime": 86400,
        "renew-timer": 43200,
        "rebind-timer": 75600,
        "option-data": [
          {"name": "domain-name-servers", "data": "10.77.20.53"},
          {"name": "domain-name", "data": "jupitertech.net"}
        ],
        "subnet4": [
          {
            "id": 10,
            "comment": "VLAN 10 — Management",
            "subnet": "10.77.10.0/24",
            "relay": {"ip-addresses": ["10.77.10.1"]},
            "pools": [{"pool": "10.77.10.100 - 10.77.10.200"}],
            "option-data": [
              {"name": "routers", "data": "10.77.10.1"}
            ],
            "reservations": []
          },
          {
            "id": 20,
            "comment": "VLAN 20 — Server (small pool; nodes are statically assigned)",
            "subnet": "10.77.20.0/24",
            "relay": {"ip-addresses": ["10.77.20.1"]},
            "pools": [{"pool": "10.77.20.200 - 10.77.20.250"}],
            "option-data": [
              {"name": "routers", "data": "10.77.20.1"}
            ],
            "reservations": []
          },
          {
            "id": 30,
            "comment": "VLAN 30 — IoT",
            "subnet": "10.77.30.0/24",
            "relay": {"ip-addresses": ["10.77.30.1"]},
            "pools": [{"pool": "10.77.30.100 - 10.77.30.200"}],
            "option-data": [
              {"name": "routers", "data": "10.77.30.1"}
            ],
            "reservations": []
          },
          {
            "id": 110,
            "comment": "VLAN 110 — Trusted",
            "subnet": "10.77.110.0/24",
            "relay": {"ip-addresses": ["10.77.110.1"]},
            "pools": [{"pool": "10.77.110.100 - 10.77.110.200"}],
            "option-data": [
              {"name": "routers", "data": "10.77.110.1"}
            ],
            "reservations": []
          },
          {
            "id": 120,
            "comment": "VLAN 120 — Guest (4h lease)",
            "subnet": "10.77.120.0/24",
            "relay": {"ip-addresses": ["10.77.120.1"]},
            "pools": [{"pool": "10.77.120.100 - 10.77.120.200"}],
            "valid-lifetime": 14400,
            "renew-timer": 7200,
            "rebind-timer": 12600,
            "option-data": [
              {"name": "routers", "data": "10.77.120.1"},
              {"name": "domain-name-servers", "data": "10.77.20.53"},
              {"name": "domain-name", "data": "guest.jupitertech.net"}
            ],
            "reservations": []
          }
        ],
        "loggers": [
          {
            "name": "kea-dhcp4",
            "output_options": [{"output": "stdout"}],
            "severity": "INFO",
            "debuglevel": 0
          }
        ]
      }
    }

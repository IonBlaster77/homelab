apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-replica
  namespace: adguard
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the RWO config volume can only attach to one
  # node, and the required anti-affinity forces a surge pod onto a different
  # node, so a rolling update would hang on Multi-Attach forever.
  strategy:
    type: Recreate
    rollingUpdate: null  # clear the defaulted RollingUpdate params on apply
  selector:
    matchLabels:
      app: adguard-replica
  template:
    metadata:
      labels:
        app: adguard-replica
        app.kubernetes.io/name: adguard
    spec:
      # Keep primary and replica on different nodes.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: adguard
              topologyKey: kubernetes.io/hostname
      # Household DNS: evicted after ordinary pods (docs/projects/oom-protection.md).
      priorityClassName: homelab-critical
      containers:
        - name: adguard
          image: adguard/adguardhome:v0.107.80
          args:
            - --config
            - /opt/adguardhome/conf/AdGuardHome.yaml
            - --work-dir
            - /opt/adguardhome/work
            - --no-check-update
          # Sized 2026-11-07 from Prometheus: ~80 MiB typical, 123 MiB 7-day
          # peak. Limit ~2x peak; no CPU limit (docs/projects/oom-protection.md).
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 256Mi
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /opt/adguardhome/conf
            - name: work
              mountPath: /opt/adguardhome/work
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: adguard-replica-config
        - name: work
          emptyDir: {}

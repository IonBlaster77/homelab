apiVersion: batch/v1
kind: Job
metadata:
  name: adguard-dns-rewrites
  namespace: adguard
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # Hooks re-run on every real sync; a stuck image pull or a hung AdGuard API
  # must not hold the sync open forever. The rewrites are idempotent, so the
  # next sync simply retries.
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply-rewrites
          image: curlimages/curl:8.23.0
          env:
            - name: ADGUARD_USER
              valueFrom:
                secretKeyRef:
                  name: adguard-api-credentials
                  key: username
            - name: ADGUARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adguard-api-credentials
                  key: password
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              API="http://adguard-primary:3000"

              add_rewrite() {
                domain=$1
                answer=$2
                LIST=$(curl -sf -u "$ADGUARD_USER:$ADGUARD_PASSWORD" "$API/control/rewrite/list")
                if echo "$LIST" | grep -q "\"domain\":\"$domain\""; then
                  echo "rewrite $domain already exists, skipping"
                else
                  curl -sf -u "$ADGUARD_USER:$ADGUARD_PASSWORD" \
                    -H 'Content-Type: application/json' \
                    -d "{\"domain\":\"$domain\",\"answer\":\"$answer\"}" \
                    "$API/control/rewrite/add"
                  echo "added $domain -> $answer"
                fi
              }

              del_rewrite() {
                domain=$1
                answer=$2
                LIST=$(curl -sf -u "$ADGUARD_USER:$ADGUARD_PASSWORD" "$API/control/rewrite/list")
                if echo "$LIST" | grep -q "\"domain\":\"$domain\""; then
                  curl -sf -u "$ADGUARD_USER:$ADGUARD_PASSWORD" \
                    -H 'Content-Type: application/json' \
                    -d "{\"domain\":\"$domain\",\"answer\":\"$answer\"}" \
                    "$API/control/rewrite/delete"
                  echo "removed $domain -> $answer"
                else
                  echo "rewrite $domain not present, skipping"
                fi
              }

              # The NAS's management interface (DSM UI) on the management VLAN.
              # Data access (NFS) uses 10.77.20.20 on the server VLAN, always by
              # IP, never by this name.
              add_rewrite "nas.jupitertech.net"      "10.77.10.20"
              # CyberPower RMCARD205 in the OLS2000ERT2UA UPS, management VLAN.
              add_rewrite "ups.jupitertech.net"      "10.77.10.30"
              add_rewrite "argocd.jupitertech.net"   "10.77.20.60"
              add_rewrite "grafana.jupitertech.net"  "10.77.20.60"
              add_rewrite "longhorn.jupitertech.net" "10.77.20.60"
              add_rewrite "adguard.jupitertech.net"  "10.77.20.60"
              add_rewrite "home.jupitertech.net"     "10.77.20.60"
              add_rewrite "auth.jupitertech.net"        "10.77.20.60"
              add_rewrite "pgadmin.jupitertech.net"   "10.77.20.60"
              add_rewrite "radarr.jupitertech.net"    "10.77.20.60"
              add_rewrite "sonarr.jupitertech.net"    "10.77.20.60"
              add_rewrite "prowlarr.jupitertech.net"  "10.77.20.60"
              add_rewrite "qbittorrent.jupitertech.net" "10.77.20.60"
              add_rewrite "jellyfin.jupitertech.net"  "10.77.20.60"
              add_rewrite "seerr.jupitertech.net"     "10.77.20.60"
              add_rewrite "bazarr.jupitertech.net"    "10.77.20.60"
              add_rewrite "nzbget.jupitertech.net"    "10.77.20.60"
              add_rewrite "arrdashboard.jupitertech.net" "10.77.20.60"
              add_rewrite "streamystats.jupitertech.net" "10.77.20.60"
              add_rewrite "hermes.jupitertech.net"   "10.77.20.60"
              add_rewrite "crawl4ai.jupitertech.net" "10.77.20.60"
              add_rewrite "searxng.jupitertech.net"  "10.77.20.60"
              add_rewrite "hubble.jupitertech.net"   "10.77.20.60"
              # Matrix (kubernetes/apps/comms/matrix): server API, sign-in, Element Web.
              add_rewrite "matrix.jupitertech.net"   "10.77.20.60"
              add_rewrite "account.jupitertech.net"  "10.77.20.60"
              add_rewrite "chat.jupitertech.net"     "10.77.20.60"
              # Harbor (kubernetes/platform/system/harbor): LAN-only registry and pull-through cache.
              add_rewrite "registry.jupitertech.net" "10.77.20.60"
              # Nextcloud (kubernetes/apps/other/nextcloud): LAN-only until sign-in is Authentik-only.
              add_rewrite "cloud.jupitertech.net"    "10.77.20.60"
              # Langfuse (kubernetes/apps/ai/langfuse): agent traces. LAN-only
              # until Cloudflare Access + Authentik sign-in; ingestion stays LAN-only.
              add_rewrite "langfuse.jupitertech.net" "10.77.20.60"
              # Whole-home audio hub (ZONED-AUDIO.md). Both go via the Gateway
              # like everything else. Note Home Assistant ALSO has a direct LAN
              # address on 10.77.20.65 for device callbacks that should not
              # traverse the Gateway, and Music Assistant is reachable directly
              # on talos4 (10.77.20.14:8095) because it runs hostNetwork.
              add_rewrite "ha.jupitertech.net"       "10.77.20.60"
              add_rewrite "music.jupitertech.net"    "10.77.20.60"

              # Retired hostnames. add_rewrite never updates or removes an
              # existing record, so renames leave the old name resolving to
              # the gateway, where it matches no HTTPRoute and returns 404.
              del_rewrite "jellyseerr.jupitertech.net" "10.77.20.60"
              del_rewrite "cognee.jupitertech.net"     "10.77.20.60"
              del_rewrite "buzz.jupitertech.net"       "10.77.20.60"
              del_rewrite "minio.jupitertech.net"      "10.77.20.60"
              del_rewrite "relay.jupitertech.net"      "10.77.20.60"

              # Fallback upstream, used only when Quad9 (the one upstream, set in
              # the UI) fails a query. Quad9's DoH intermittently returns
              # "unexpected EOF", which surfaced as Argo CD and Harbor failing to
              # resolve github.com (2026-10-19). Cloudflare by IP, so it needs no
              # bootstrap lookup, which also goes to Quad9. Only posted when
              # missing: saving DNS settings restarts AdGuard's resolver.
              # adguardhome-sync copies it to the replica.
              FALLBACK="https://1.1.1.1/dns-query"
              if curl -sf -u "$ADGUARD_USER:$ADGUARD_PASSWORD" "$API/control/dns_info" | grep -q "\"$FALLBACK\""; then
                echo "fallback upstream already set, skipping"
              else
                curl -sf -u "$ADGUARD_USER:$ADGUARD_PASSWORD" \
                  -H 'Content-Type: application/json' \
                  -d "{\"fallback_dns\":[\"$FALLBACK\",\"https://1.0.0.1/dns-query\"]}" \
                  "$API/control/dns_config"
                echo "set fallback upstream $FALLBACK"
              fi

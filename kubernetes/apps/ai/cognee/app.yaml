# Cognee: self-hosted long-term memory for AI agents (MCP server, Postgres +
# pgvector, dedicated Ollama). See README.md.
#
# Renamed from `cognee-config` in the restructure: this folder is the whole
# app now, so there is no separate chart Application to pair it with.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cognee
  namespace: argocd
  annotations:
    # Compare server-side, to match ServerSideApply below. The client-side
    # diff flags fields the API server defaults (e.g. the HTTPRoute's
    # backendRef group/kind/weight) as a phantom OutOfSync with no diff shown.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: homelab
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/ai/cognee
    plugin:
      name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: cognee
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

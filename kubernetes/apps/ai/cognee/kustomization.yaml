# Lists every manifest Argo CD applies for this app. app.yaml is deliberately
# NOT listed: it is picked up by the root app, not by this folder's own app.
# *.sops.yaml files are decrypted by the sops-kustomize plugin before this runs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  # Database
  - secret-db.sops.yaml
  - secret-db-backup.sops.yaml
  - database.yaml
  - database-backup.yaml
  - monitoring.yaml
  # MCP server
  - deployment-mcp.yaml
  - service-mcp.yaml
  - httproute.yaml
  - referencegrant.yaml
  # Ollama (LLM)
  - pvc-ollama.yaml
  - deployment-ollama.yaml
  - service-ollama.yaml

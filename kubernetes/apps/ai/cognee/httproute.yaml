apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cognee
  namespace: networking
  annotations:
    # Temporary, from the handoff out of the gateway app: stopped that app
    # pruning the live route when the file moved. Removed in the next step.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: networking
      sectionName: https
  hostnames:
    - "cognee.jupitertech.net"
  rules:
    - backendRefs:
        - name: cognee-mcp
          namespace: cognee
          port: 8000

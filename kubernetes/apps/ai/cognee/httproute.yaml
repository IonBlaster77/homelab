apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cognee
  namespace: networking
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: networking
      sectionName: https
  hostnames:
    - "cognee.jupitertech.net"
  rules:
    - backendRefs:
        - name: cognee-mcp
          namespace: cognee
          port: 8000

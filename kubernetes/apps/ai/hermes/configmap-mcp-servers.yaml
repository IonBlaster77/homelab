# Fragment deep-merged into ~/.hermes/config.yaml by the merge-mcp-config
# initContainer in deployment.yaml. Despite the name (kept to avoid touching
# the initContainer/volume wiring for a cosmetic rename), this now covers a
# couple of top-level keys beyond mcp_servers: too — terminal.backend and
# approvals.mode, added together with the research-worker sandbox. Non-secret
# by design — bearer tokens/keys are injected via Hermes' native ${VAR}
# substitution or mounted files, reading from hermes-secret (see
# deployment.yaml/secret.sops.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-mcp-servers
  namespace: hermes
data:
  mcp-servers-fragment.yaml: |
    # Tool-calling rounds per turn, for every chat and cron job alike (cron
    # has no per-job override). Was the default 60: the first hardware-deals
    # run (2026-10-21) used all 60 on research and ended with no report.
    agent:
      max_turns: 100
      # The built-in web toolset is web_search + web_extract. With no paid
      # extract vendor configured, web_extract always fails ("search-only
      # backend"), and Hermes has no per-tool disable, only per-toolset.
      # searxng (search) and crawl4ai (md/html: read a URL) are self-hosted
      # and cover both, without spending Codex quota on search calls.
      disabled_toolsets: [web]
    # delegate_task subagents. Unset, they inherit the parent's gpt-5.6-sol
    # at xhigh: one WebUI research chat (2026-10-28, 3 children, ~30 min)
    # spent ~23.6M tokens and exhausted the ChatGPT Plus 5h window, which
    # also broke smart approvals (their aux LLM call 429'd and escalated to
    # the broken manual prompt). terra/medium matches the hardware-deals
    # cron jobs. Keys confirmed against tools/delegate_tool_config.py.
    delegation:
      provider: openai-codex
      model: gpt-5.6-terra
      reasoning_effort: medium
      # Default 250. Children that run out return partial output with
      # exit_reason max_iterations rather than burning quota on retries.
      max_iterations: 80
      # Inactivity cap, not total runtime — any progress resets it; default
      # 0 = none. Children get a budget warning at ~80% of the window.
      child_timeout_seconds: 600
    # approvals.mode is GLOBAL — Hermes has no per-tool/per-backend approval
    # scoping (confirmed: NousResearch/hermes-agent#33905/#80993 are open,
    # unimplemented feature requests for exactly that). 'smart' (an auxiliary
    # LLM judges each command) instead of 'manual' because manual's
    # approve/deny UI is confirmed broken right now across multiple Hermes
    # clients, including this deployment's own WebUI
    # (nesquena/hermes-webui#4203, #4479) and even Hermes' own Desktop App
    # (NousResearch/hermes-agent#37812) — manual would silently fail closed
    # after a 300s timeout with no button ever rendering, which defeats the
    # point of letting the agent fetch a missing tool mid-task.
    approvals:
      mode: smart
      # Since v2026.9.x, WebUI chats arrive via the gateway's API server, which
      # Hermes classes as an "unattended" platform: approvals.mode no longer
      # applies there, only this binary approve/deny (default deny), and deny
      # refuses every flagged command plus all execute_code. Approve, because
      # the real guardrails are infrastructure: terminal + execute_code run in
      # the isolated research-worker sandbox (no secrets, egress-restricted),
      # infra-mcp is read-only RBAC, and hardline-catastrophic commands stay
      # blocked regardless of this setting. Decided 2026-10-13.
      unattended_mode: approve
    terminal:
      # Was 'local' — executing directly inside this container, which holds
      # LLM_API_KEY/API_SERVER_KEY/CRAWL4AI_AUTH_TOKEN/SEARXNG_MCP_AUTH_TOKEN
      # as real env vars. Found live during this rollout, already an active
      # exposure (terminal/code_execution were enabled by default) before
      # research-worker existed to point it at. Now points at the isolated,
      # no-secrets, egress-restricted sandbox instead — see
      # kubernetes/apps/ai/research-worker/. Host/user/port/key come from
      # TERMINAL_SSH_* env vars on the hermes-agent container (set in
      # deployment.yaml), not from this file.
      backend: ssh
    mcp_servers:
      crawl4ai:
        url: "http://crawl4ai.crawl4ai.svc.cluster.local:11235/mcp/sse"
        # Crawl4AI's mcp_bridge.py implements the legacy dual-endpoint HTTP+SSE
        # transport (GET /mcp/sse for events, POST to a session-scoped
        # /mcp/messages/?session_id=... endpoint discovered from the initial
        # "endpoint" SSE event) rather than the newer single-endpoint
        # Streamable HTTP transport. Hermes' MCP client defaults to Streamable
        # HTTP for any url: entry and silently hangs/times out against an
        # SSE-only server unless told otherwise — confirmed by manually
        # replaying the SSE handshake + JSON-RPC initialize round-trip by hand
        # (worked fine) while `hermes mcp test crawl4ai` timed out without this.
        transport: sse
        headers:
          Authorization: "Bearer ${CRAWL4AI_AUTH_TOKEN}"
        tools:
          # md's `f` param (fit/raw/bm25/llm) and `q` param (BM25 query) are
          # the main extraction levers — call md with q set to get
          # query-relevant content instead of the whole page; f=raw is the
          # fallback if fit/bm25 drop something needed. execute_js is
          # excluded: arbitrary JS execution inside the crawler is out of
          # scope for a read-only web-reading tool.
          include: [md, html, crawl, screenshot, pdf]
          resources: false
          prompts: false
        supports_parallel_tool_calls: true
      searxng:
        # mcp-searxng speaks Streamable HTTP at /mcp (not SSE at /sse) — verify
        # this path again if the bridge image is upgraded past 1.10.0.
        url: "http://searxng-mcp.searxng.svc.cluster.local:3000/mcp"
        headers:
          Authorization: "Bearer ${SEARXNG_MCP_AUTH_TOKEN}"
        tools:
          # web_url_read is excluded on purpose — Crawl4AI is the one "read
          # this URL" tool (main sheet §2); this bridge is discovery-only.
          exclude: [web_url_read]
          resources: false
          prompts: false
        supports_parallel_tool_calls: true
      playwright:
        # Dedicated pod in its own namespace (kubernetes/apps/ai/playwright-mcp/)
        # rather than Hermes spawning @playwright/mcp itself as a stdio
        # subprocess (the pattern in Playwright/Hermes' own docs) — keeps a
        # Chromium compromise confined to a disposable pod with no secrets
        # and no path back into Hermes, mirroring crawl4ai's isolation model.
        # Confirmed interactively: bare HTTP here resolves to Streamable HTTP
        # against the server's /mcp endpoint, no transport: override needed
        # (unlike crawl4ai's SSE-only case below).
        url: "http://playwright-mcp.playwright-mcp.svc.cluster.local:8931/mcp"
        # Connect on first use rather than at Hermes startup — avoids a
        # boot-time connection error if this pod happens to be restarting,
        # and nothing here depends on it being connected eagerly.
        lazy: true
        # trust: untrusted would require approval on every write-capable
        # tool call per Playwright MCP's own read-only annotations — but
        # browser_navigate itself is marked non-read-only, so this would
        # prompt on literally the first step of every task, not just risky
        # ones. Left at the default (full) deliberately; the real controls
        # are network-level (see playwright-mcp's NetworkPolicy) and the
        # zero-ambient-credentials/--isolated setup on the server itself.
        sampling:
          enabled: false
        elicitation:
          enabled: false
        tools:
          # Core navigate/interact/observe tools only. Explicitly excluded:
          # browser_evaluate / browser_run_code_unsafe (arbitrary JS-in-page
          # execution), browser_file_upload (no legitimate use here and no
          # interesting files in this pod anyway), all cookie_*/
          # localstorage_*/sessionstorage_* and browser_set_storage_state
          # (zero ambient state is the point of --isolated — don't also hand
          # the model a tool to read/write it), browser_route/browser_unroute/
          # browser_network_state_set (traffic interception/mocking, no
          # legitimate research use), and the devtools/vision/pdf/testing
          # tool groups (not enabled server-side — no --caps flag passed —
          # so these wouldn't resolve to anything anyway).
          include:
            [
              browser_navigate,
              browser_navigate_back,
              browser_click,
              browser_type,
              browser_press_key,
              browser_select_option,
              browser_hover,
              browser_drag,
              browser_drop,
              browser_wait_for,
              browser_handle_dialog,
              browser_fill_form,
              browser_snapshot,
              browser_take_screenshot,
              browser_find,
              browser_console_messages,
              browser_network_request,
              browser_network_requests,
              browser_tabs,
              browser_resize,
              browser_close,
              browser_emulate_media,
              browser_get_config,
            ]
          resources: false
          prompts: false
        # Browser actions are inherently sequential (can't click two things
        # "at once" meaningfully); serializing also keeps the action log
        # easier to audit after the fact.
        supports_parallel_tool_calls: false
      infra-mcp:
        # Read-only infra visibility (#45) — Kubernetes/Argo Workflows for
        # now, more systems (Talos/Prometheus/Loki/Hubble/ArgoCD/etc.) land
        # incrementally as each is built. Own namespace, own ServiceAccount,
        # no general-purpose fetch-and-run capability at all — deliberately
        # not research-worker, which has exactly that and is an accepted
        # risk specifically because there's nothing to steal there. This
        # pod holds real (if read-only) infra visibility, so it gets both
        # layers crawl4ai/searxng use: NetworkPolicy ingress scoped to this
        # pod specifically, plus this bearer token on top.
        url: "http://infra-mcp.infra-mcp.svc.cluster.local:8000/mcp"
        headers:
          Authorization: "Bearer ${INFRA_MCP_AUTH_TOKEN}"
        sampling:
          enabled: false
        elicitation:
          enabled: false
        tools:
          resources: false
          prompts: false
        supports_parallel_tool_calls: true

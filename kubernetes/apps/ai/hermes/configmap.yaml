apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: hermes
data:
  HERMES_WEBUI_HOST: "0.0.0.0"
  HERMES_WEBUI_PORT: "8787"
  HERMES_WEBUI_STATE_DIR: "/home/hermes/.hermes/webui"
  API_SERVER_ENABLED: "true"
  API_SERVER_PORT: "8642"
  HERMES_API_URL: "http://localhost:8642"
  GATEWAY_HEALTH_URL: "http://localhost:8642/health"
  HERMES_HOME: "/home/hermes/.hermes"
  HERMES_WEBUI_AUTO_INSTALL: "1"
  WANTED_UID: "1000"
  WANTED_GID: "1000"
  HERMES_UID: "1000"
  HERMES_GID: "1000"
  # Matrix gateway (kubernetes/apps/comms/matrix). Hermes posts as @hermes;
  # its token is MATRIX_ACCESS_TOKEN in hermes-secret. In-cluster homeserver
  # (Synapse's HAProxy), never via the internet. Room IDs (not secret):
  #   !vKPF... = #hermes (answers everything; home room for cron output)
  #   !IHSC... = #alerts-critical, !0lyE... = #alerts-warning (@mention only)
  # Triggers: the owner anywhere allowed; @alertbot too, which (because only
  # #hermes and #alerts-critical are free-response rooms) means every
  # CRITICAL alert gets an automatic investigation in its thread, following
  # the alert-triage skill. Warning alerts never mention @hermes, so they do
  # not trigger it; they and the digest (m.notice, ignored) get the daily
  # review cron job instead. Invites are only accepted from allowed users.
  MATRIX_HOMESERVER: "http://matrix-synapse.matrix.svc.cluster.local:8008"
  MATRIX_USER_ID: "@hermes:matrix.jupitertech.net"
  MATRIX_ALLOWED_USERS: "@kmoorthy:matrix.jupitertech.net,@alertbot:matrix.jupitertech.net"
  MATRIX_ALLOWED_ROOMS: "!vKPFxUmlFcYb5FohmI_ye33dd_P_5DWhfJtUdVwehdA,!IHSCVidCmFd2py1dGRxtgeUYgjkKuKI2XUxLb8JFd3E,!0lyEnSgrdxRHsROoG4CWcRCnb_ZAKqSloxs2_lghhww"
  MATRIX_FREE_RESPONSE_ROOMS: "!vKPFxUmlFcYb5FohmI_ye33dd_P_5DWhfJtUdVwehdA,!IHSCVidCmFd2py1dGRxtgeUYgjkKuKI2XUxLb8JFd3E"
  # Approval prompts raised during an alert-triggered turn would otherwise be
  # answerable only by @alertbot (which can't); let the owner answer them.
  MATRIX_APPROVAL_REQUIRE_SENDER: "false"
  MATRIX_HOME_ROOM: "!vKPFxUmlFcYb5FohmI_ye33dd_P_5DWhfJtUdVwehdA"
  MATRIX_REQUIRE_MENTION: "true"
  MATRIX_PROCESS_NOTICES: "false"
  MATRIX_E2EE_MODE: "off"

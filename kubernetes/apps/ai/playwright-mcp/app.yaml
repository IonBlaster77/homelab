# playwright-mcp: a disposable headless browser that Hermes drives over MCP
# for interactive browsing. See README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playwright-mcp
  namespace: argocd
  annotations:
    # Required with ServerSideApply, or Argo CD shows phantom OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: homelab
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/ai/playwright-mcp
    plugin:
      name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: playwright-mcp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

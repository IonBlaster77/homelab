# infra-mcp: read-only cluster/infra tools for Hermes over MCP (pods, logs,
# Argo, Longhorn, CNPG, Talos, Prometheus, Loki, Hubble). See README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-mcp
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/ai/infra-mcp
    plugin:
      name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: infra-mcp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

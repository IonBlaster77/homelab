# Entrypoint script for the research-worker container. Kept as its own
# ConfigMap (mounted and exec'd, rather than inlined into deployment.yaml's
# command) purely to keep that manifest's diff readable — this does the
# actual package install + sshd setup for the sandbox described there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: research-worker-entrypoint
  namespace: research-worker
data:
  entrypoint.sh: |
    #!/bin/sh
    set -e

    # Persistent apk cache: a symlink at /etc/apk/cache is apk's own
    # documented mechanism for this. Caches downloaded .apk files across
    # restarts (faster re-installs) WITHOUT keeping anything installed —
    # the installed-package state itself stays ephemeral on purpose, so a
    # restart still wipes any OS-level tool that isn't in the list below.
    mkdir -p /workspace/apk-cache
    ln -sfn /workspace/apk-cache /etc/apk/cache

    apk update
    # GNU tar, not BusyBox's: Hermes' SSH file sync pipes into
    # `tar xf - --no-overwrite-dir`, which BusyBox tar rejects, so every
    # sync died with SIGPIPE (rc=-13) and spilled tool output never arrived.
    # Same reason for the rest of the GNU userland: models write GNU flags
    # (find -printf, sed -i -E, sort -V, ps aux) and BusyBox rejects them,
    # each one a wasted tool round (2026-10-28 research run).
    apk add bash openssh-server curl wget jq git ripgrep fd unzip p7zip file poppler-utils qpdf tesseract-ocr imagemagick nodejs npm python3 py3-pip exiftool tar \
      findutils coreutils grep sed gawk diffutils procps-ng less

    mkdir -p /workspace/ssh_host_keys /root/.ssh /var/empty/sshd
    chmod 700 /root/.ssh

    for t in ed25519 rsa ecdsa; do
      f="/workspace/ssh_host_keys/ssh_host_${t}_key"
      [ -f "$f" ] || ssh-keygen -q -N '' -t "$t" -f "$f"
    done

    cp /run/secrets/authorized_keys /root/.ssh/authorized_keys
    chmod 600 /root/.ssh/authorized_keys

    cat > /etc/ssh/sshd_config <<SSHDEOF
    Port 22
    ListenAddress 0.0.0.0
    HostKey /workspace/ssh_host_keys/ssh_host_ed25519_key
    HostKey /workspace/ssh_host_keys/ssh_host_rsa_key
    HostKey /workspace/ssh_host_keys/ssh_host_ecdsa_key
    PermitRootLogin prohibit-password
    PasswordAuthentication no
    PubkeyAuthentication yes
    AuthorizedKeysFile /root/.ssh/authorized_keys
    SetEnv PATH=/opt/venv/bin:/opt/npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    SSHDEOF

    # Persist the venv + npm global prefix on /workspace, unlike the apk
    # state above — these are self-contained directories with no
    # system-wide side effects (unlike apk's installed files, which spread
    # across /usr /etc /lib), so there's no meaningful new exposure from
    # keeping them around: whatever's installed came from the same public
    # registries either way, restart or no restart. Skip reinstalling the
    # baseline if a previous run already set it up.
    mkdir -p /workspace/venv /workspace/npm-global
    rm -rf /opt/venv /opt/npm-global
    ln -s /workspace/venv /opt/venv
    ln -s /workspace/npm-global /opt/npm-global

    # python -m venv refuses to create at a path that's already a symlink
    # ("Unable to create directory") even when it resolves to a valid empty
    # dir — create at the real path instead; /opt/venv still works fine for
    # reading through the symlink afterward.
    #
    # A base-image bump can change the system Python minor version (alpine
    # 3.22 -> 3.24 moved 3.12 -> 3.14). The persisted venv then points at an
    # interpreter that no longer exists, yet bin/pip is still there, so the
    # check below would skip the rebuild. Detect the mismatch from
    # pyvenv.cfg, note which packages the old venv had (from its dist-info
    # dirs, since its pip can no longer run), wipe it, and reinstall them
    # alongside the baseline.
    SYSPY=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')
    VENVPY=$(sed -n 's/^version *= *\([0-9]*\.[0-9]*\).*/\1/p' /workspace/venv/pyvenv.cfg 2>/dev/null)
    KEEP=""
    if [ -n "$VENVPY" ] && [ "$VENVPY" != "$SYSPY" ]; then
      KEEP=$(ls -d /workspace/venv/lib/python$VENVPY/site-packages/*.dist-info 2>/dev/null \
        | sed -E 's#.*/##; s/-[0-9][^-]*\.dist-info$//' | grep -vxE 'pip|setuptools|wheel' | tr '\n' ' ')
      echo "venv built for Python $VENVPY but system is $SYSPY: rebuilding, carrying over: $KEEP"
      find /workspace/venv -mindepth 1 -delete
    fi
    if [ ! -x /workspace/venv/bin/pip ]; then
      python3 -m venv /workspace/venv
      /workspace/venv/bin/pip install --no-cache-dir requests beautifulsoup4 lxml pandas pillow openpyxl pdfplumber pytesseract $KEEP
    fi

    # Hermes' code_execution tool invokes /usr/bin/python3 directly over a
    # channel that doesn't inherit the SSH session's PATH/SetEnv at all
    # (confirmed live: os.environ inside it has the bare system PATH, no
    # trace of the SetEnv value above) — so a PATH-based fix can't reach it.
    # Point the system interpreter's own default site-packages lookup at
    # the venv's instead; that works no matter how python3 gets invoked.
    PYVER=$(python3 -c 'import sys; print("python%d.%d" % sys.version_info[:2])')
    rm -rf /usr/lib/$PYVER/site-packages
    ln -s /workspace/venv/lib/$PYVER/site-packages /usr/lib/$PYVER/site-packages
    # With site-packages pointing at the venv, a bare `pip install` (system
    # pip) lands in the venv anyway — but Alpine's PEP 668 marker makes it
    # refuse with externally-managed-environment first. Nothing here is
    # system-managed in the sense the marker protects, so drop it.
    rm -f /usr/lib/$PYVER/EXTERNALLY-MANAGED

    # Hermes' SSH backend syncs skills to this host's $HOME/.hermes
    # (/root/.hermes), but skill_view shows the model Hermes' own absolute
    # paths (/home/hermes/.hermes/skills/...), so every skill script call
    # (grounded-citations' sources.py) failed with "No such file". Alias the
    # Hermes-side path to the synced copy.
    mkdir -p /root/.hermes /home/hermes
    ln -sfn /root/.hermes /home/hermes/.hermes

    npm config set prefix /opt/npm-global

    exec /usr/sbin/sshd -D -e

# research-worker: the isolated, no-secrets sandbox Hermes uses as its
# terminal (terminal.backend: ssh). See README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: research-worker
  namespace: argocd
spec:
  project: homelab
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/ai/research-worker
    plugin:
      name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: research-worker
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

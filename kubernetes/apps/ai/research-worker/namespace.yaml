apiVersion: v1
kind: Namespace
metadata:
  name: research-worker
  labels:
    app.kubernetes.io/managed-by: argocd
    # baseline, not restricted: the sandbox needs real root for apt-get
    # (scoped sudo wouldn't meaningfully reduce risk — a malicious package's
    # postinst script runs as root either way) — same trade-off already made
    # for hermes' own SSH sidecar namespace. The actual safety boundary is
    # the namespace/network isolation below, not in-container UID.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline

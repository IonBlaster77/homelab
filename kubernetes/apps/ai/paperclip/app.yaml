# Paperclip: control plane for the lightweight agents (Pi first) that take over
# Hermes' routine crons. Phase 3 of task #50; see README.md and
# docs/projects/agent-observability.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperclip
  namespace: argocd
  annotations:
    # Required with ServerSideApply, or Argo CD shows phantom OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: homelab
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/ai/paperclip
    plugin:
      name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: paperclip
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

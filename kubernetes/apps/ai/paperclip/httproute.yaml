# paperclip.jupitertech.net through the Gateway. LAN-only for now (AdGuard
# rewrite to the Gateway VIP); a Cloudflare Access app + tunnel hostname for
# remote access come later, as for Langfuse.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperclip
  namespace: networking
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: networking
      sectionName: https
  hostnames:
    - "paperclip.jupitertech.net"
  rules:
    - backendRefs:
        - name: paperclip
          namespace: paperclip
          port: 3100

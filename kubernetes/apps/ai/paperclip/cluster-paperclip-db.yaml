# Paperclip's Postgres (companies, agents, issues, runs, users). CloudNativePG
# generates the app credentials into paperclip-db-app (username, password,
# uri); the server reads `uri` as DATABASE_URL and applies its own migrations.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperclip-db
  namespace: paperclip
spec:
  instances: 2
  # OOM protection (docs/projects/oom-protection.md), sized 2026-11-07:
  # 30-day peak 265 MiB. Memory request = limit (~2x peak) so the
  # kubelet and the Talos OOM controller leave it alone; a CPU request but
  # no CPU limit (CPU is the scarce resource), so the pod is Burstable.
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 130m
      memory: 512Mi
    limits:
      memory: 512Mi
  # Promote the running standby for primary updates (seconds of downtime)
  # instead of restarting the primary pod in place.
  primaryUpdateMethod: switchover
  storage:
    # nvme, not ssd: same reasoning as the other databases (kea-db, 2026-08-05).
    storageClass: longhorn-nvme
    size: 5Gi
  bootstrap:
    initdb:
      database: paperclip
      owner: paperclip
  # Point-in-time recovery from day one: the Barman Cloud plugin archives every
  # WAL segment and stores base backups in RustFS (s3://cnpg/paperclip-db/, see
  # objectstore-paperclip-db.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: paperclip-db-backup
        serverName: paperclip-db

# Paperclip's Postgres (companies, agents, issues, runs, users). CloudNativePG
# generates the app credentials into paperclip-db-app (username, password,
# uri); the server reads `uri` as DATABASE_URL and applies its own migrations.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperclip-db
  namespace: paperclip
spec:
  instances: 2
  storage:
    # nvme, not ssd: same reasoning as the other databases (kea-db, 2026-08-05).
    storageClass: longhorn-nvme
    size: 5Gi
  bootstrap:
    initdb:
      database: paperclip
      owner: paperclip
  # Point-in-time recovery from day one: the Barman Cloud plugin archives every
  # WAL segment and stores base backups in RustFS (s3://cnpg/paperclip-db/, see
  # objectstore-paperclip-db.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: paperclip-db-backup
        serverName: paperclip-db

# Paperclip's Postgres (companies, agents, issues, runs, users). CloudNativePG
# generates the app credentials into paperclip-db-app (username, password,
# uri); the server reads `uri` as DATABASE_URL and applies its own migrations.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperclip-db
  namespace: paperclip
spec:
  instances: 2
  # Pinned here so Renovate tracks it. Left unset, CNPG writes its default
  # into the live spec at creation and never moves it again: four clusters
  # sat on 18.3 while newer ones got 18.6. Changing it rolls the replica
  # first, then a switchover (primaryUpdateMethod).
  imageName: ghcr.io/cloudnative-pg/postgresql:19.0-system-trixie
  # OOM protection (docs/projects/oom-protection.md), sized 2026-11-07:
  # 30-day peak 265 MiB. Memory request = limit (~2x peak) so the
  # kubelet and the Talos OOM controller leave it alone; a CPU request but
  # no CPU limit (CPU is the scarce resource), so the pod is Burstable.
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 130m
      memory: 512Mi
    limits:
      memory: 512Mi
  # Promote the running standby for primary updates (seconds of downtime)
  # instead of restarting the primary pod in place.
  primaryUpdateMethod: switchover
  # Synchronous replication pilot (2026-11-22): a commit returns only once the
  # standby has flushed it, so an unplanned failover (primary node crash or
  # power loss) can't drop acknowledged writes. Planned switchovers are
  # lossless even with async replication. "preferred", not the default
  # "required": with only two instances, "required" blocks every write while
  # the replica is down (each node drain). With "preferred" CNPG lists only
  # ready standbys, so a missing replica makes commits async until it returns.
  # Applied by reload, no restart.
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  storage:
    # nvme, not ssd: same reasoning as the other databases (kea-db, 2026-08-05).
    storageClass: longhorn-nvme
    size: 5Gi
  bootstrap:
    initdb:
      database: paperclip
      owner: paperclip
  # Point-in-time recovery from day one: the Barman Cloud plugin archives every
  # WAL segment and stores base backups in RustFS (s3://cnpg/paperclip-db/, see
  # objectstore-paperclip-db.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: paperclip-db-backup
        serverName: paperclip-db

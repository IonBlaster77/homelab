# CNPG metrics for paperclip-db, so the CNPG alerts (incl. WALArchiveBacklog)
# cover it. Hand-rolled like the other clusters' (enablePodMonitor is
# deprecated). paperclip-db-allow-cnpg in networkpolicy.yaml admits the scrape.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: paperclip-db
  namespace: paperclip
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: paperclip-db
  podMetricsEndpoints:
    - port: metrics

apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
  labels:
    app: searxng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      serviceAccountName: searxng-sa
      restartPolicy: Always
      # SearXNG's entrypoint reads $SEARXNG_PORT to set its listen port.
      # Kubernetes auto-injects a same-named Docker-links-style env var
      # (SEARXNG_PORT=tcp://<clusterIP>:8080) for the "searxng" Service in
      # this namespace, which collides and breaks the container unless
      # service-link injection is disabled.
      enableServiceLinks: false
      containers:
        - name: searxng
          image: searxng/searxng:2026.7.3-747cec4c2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            # The full settings.yml (incl. secret_key) lives in the Secret —
            # see secret.sops.yaml for why.
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
          readinessProbe:
            # SearXNG has no dedicated healthcheck route as of this version;
            # root path reliably returns 200 without needing auth.
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 977
            runAsGroup: 977
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: settings
          secret:
            secretName: searxng-secret
            items:
              - key: settings.yml
                path: settings.yml
            defaultMode: 0444

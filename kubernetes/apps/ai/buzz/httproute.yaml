apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: buzz
  namespace: networking
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: networking
      sectionName: https
  hostnames:
    - "buzz.jupitertech.net"
  rules:
    # Dedicated NIP-AB pairing relay (buzz-pair-relay binary) — a separate,
    # stateless raw-websocket service the client uses for mobile QR pairing.
    # It only speaks websocket at its own root, so the matched prefix is
    # rewritten away before forwarding.
    - matches:
        - path:
            type: PathPrefix
            value: /pair-relay
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: buzz-pairing
          namespace: buzz
          port: 5000
    - backendRefs:
        - name: buzz
          namespace: buzz
          port: 3000

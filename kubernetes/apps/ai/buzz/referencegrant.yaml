# Lets the HTTPRoutes in the networking namespace (httproute*.yaml in this
# folder) reach the buzz, buzz-pairing and buzz-minio-console Services.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-networking-to-buzz
  namespace: buzz
  annotations:
    # Temporary, from the handoff out of the gateway app: stopped that app
    # pruning the live object when the file moved. Removed in the next step.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: networking
  to:
    - group: ""
      kind: Service
      name: buzz
    - group: ""
      kind: Service
      name: buzz-minio-console
    - group: ""
      kind: Service
      name: buzz-pairing

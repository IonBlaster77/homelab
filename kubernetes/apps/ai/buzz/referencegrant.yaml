# Lets the HTTPRoutes in the networking namespace (httproute*.yaml in this
# folder) reach the buzz, buzz-pairing and buzz-minio-console Services.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-networking-to-buzz
  namespace: buzz
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: networking
  to:
    - group: ""
      kind: Service
      name: buzz
    - group: ""
      kind: Service
      name: buzz-minio-console
    - group: ""
      kind: Service
      name: buzz-pairing

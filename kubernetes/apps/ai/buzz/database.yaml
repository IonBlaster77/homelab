apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: buzz-db
  namespace: buzz
spec:
  instances: 2
  storage:
    # nvme, not ssd - see kubernetes/apps/network/kea/database.yaml (2026-08-05) for why.
    storageClass: longhorn-nvme
    size: 5Gi
  bootstrap:
    initdb:
      database: buzz
      owner: buzz
      secret:
        name: buzz-db-credentials
  # CNPG-native backup (task #13) - continuous WAL archiving + scheduled
  # base backups to the in-cluster MinIO tenant (buzz-minio, own dedicated
  # bucket/user - see cnpg-backup-minio-provision.yaml). Longhorn's own
  # hourly/daily block-level backup to the NAS (recurring-jobs.yaml)
  # continues unchanged as the off-cluster durability layer underneath this.
  backup:
    # 7d, not 30d - see kubernetes/apps/ai/cognee/database.yaml for the full reasoning
    # (buzz-minio's pool is only ~20Gi total, full-copy daily base backups
    # at 30d retention would risk filling it). Longhorn's NAS backup
    # already covers 30-day off-cluster retention independently.
    retentionPolicy: 7d
    barmanObjectStore:
      destinationPath: s3://buzz-db-backups
      endpointURL: http://minio.cnpg-backups.svc.cluster.local
      s3Credentials:
        accessKeyId:
          name: buzz-db-backup-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: buzz-db-backup-s3-credentials
          key: SECRET_ACCESS_KEY

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: buzz-db
  namespace: buzz
spec:
  instances: 2
  storage:
    # nvme, not ssd - see kubernetes/apps/network/kea/database.yaml (2026-08-05) for why.
    storageClass: longhorn-nvme
    size: 5Gi
  bootstrap:
    initdb:
      database: buzz
      owner: buzz
      secret:
        name: buzz-db-credentials
  # No CNPG-native (Barman) backup: the cnpg-backups MinIO it archived to was
  # decommissioned 2026-10-14. Longhorn's hourly/daily volume backups to the
  # NAS are the only backup of this database.

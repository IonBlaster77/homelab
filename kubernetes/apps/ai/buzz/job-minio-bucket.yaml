# Creates the buzz-media bucket the relay expects. PostSync hook, so it runs
# after the Tenant is applied, on every sync of this app; creating a bucket
# that already exists is treated as success, so re-runs are harmless.
#
# Uses curl's built-in S3 request signing (--aws-sigv4) rather than MinIO's
# `mc` client: MinIO stopped publishing minio/mc publicly (gone from Docker
# Hub, quay.io needs auth), and the old image only kept working on the one
# node that had it cached.
apiVersion: batch/v1
kind: Job
metadata:
  name: buzz-minio-bucket
  namespace: buzz
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # A pod stuck in ImagePullBackOff never counts as failed, so without a
  # deadline a broken hook holds the whole sync open indefinitely.
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    metadata:
      # Reuses the relay's existing NetworkPolicy allow-rules for
      # DNS/MinIO egress rather than writing new ones just for this Job.
      labels:
        app.kubernetes.io/name: buzz
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-bucket
          image: curlimages/curl:8.21.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: buzz-relay-secrets
                  key: BUZZ_S3_ACCESS_KEY
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: buzz-relay-secrets
                  key: BUZZ_S3_SECRET_KEY
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              # PUT on the bucket path creates it. MinIO's region is the
              # default us-east-1; path-style addressing, as the relay uses.
              code=$(curl -s -o /tmp/out -w '%{http_code}' -X PUT \
                --aws-sigv4 "aws:amz:us-east-1:s3" \
                --user "$ACCESS_KEY:$SECRET_KEY" \
                http://minio.buzz.svc.cluster.local/buzz-media)
              if [ "$code" = 200 ]; then
                echo "created buzz-media"
              elif [ "$code" = 409 ] && grep -q BucketAlreadyOwnedByYou /tmp/out; then
                echo "buzz-media already exists"
              else
                echo "unexpected HTTP $code:"; cat /tmp/out; exit 1
              fi

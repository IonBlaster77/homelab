apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console
  namespace: networking
  annotations:
    # Temporary, from the handoff out of the gateway app: stopped that app
    # pruning the live object when the file moved. Removed in the next step.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: networking
      sectionName: https
  hostnames:
    - "minio.jupitertech.net"
  rules:
    - backendRefs:
        - name: buzz-minio-console
          namespace: buzz
          port: 9090

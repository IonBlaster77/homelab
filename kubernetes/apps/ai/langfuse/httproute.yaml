# langfuse.jupitertech.net through the Gateway. LAN-only for now (AdGuard
# rewrite to the Gateway VIP); a Cloudflare Access app + tunnel hostname for
# remote access come with the Authentik sign-in. The ingestion API sits on the
# same hostname, but stays LAN-only even then (only the UI goes public).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langfuse
  namespace: networking
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: networking
      sectionName: https
  hostnames:
    - "langfuse.jupitertech.net"
  rules:
    - backendRefs:
        - name: langfuse-web
          namespace: langfuse
          port: 3000

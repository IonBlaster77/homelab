# Langfuse's Postgres (users, projects, API keys, prompts, settings; traces
# live in ClickHouse). CloudNativePG generates the app credentials into
# langfuse-db-app (username, password, uri), which Langfuse reads.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: langfuse-db
  namespace: langfuse
spec:
  instances: 2
  # Pinned here so Renovate tracks it. Left unset, CNPG writes its default
  # into the live spec at creation and never moves it again: four clusters
  # sat on 18.3 while newer ones got 18.6. Changing it rolls the replica
  # first, then a switchover (primaryUpdateMethod).
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  # OOM protection (docs/projects/oom-protection.md), sized 2026-11-07:
  # 30-day peak 117 MiB. Memory request = limit (~2x peak) so the
  # kubelet and the Talos OOM controller leave it alone; a CPU request but
  # no CPU limit (CPU is the scarce resource), so the pod is Burstable.
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 30m
      memory: 384Mi
    limits:
      memory: 384Mi
  # Promote the running standby for primary updates (seconds of downtime)
  # instead of restarting the primary pod in place.
  primaryUpdateMethod: switchover
  storage:
    # nvme, not ssd: same reasoning as the other databases (kea-db, 2026-08-05).
    storageClass: longhorn-nvme
    size: 5Gi
  bootstrap:
    initdb:
      database: langfuse
      owner: langfuse
  # Point-in-time recovery from day one: the Barman Cloud plugin archives every
  # WAL segment and stores base backups in RustFS (s3://cnpg/langfuse-db/, see
  # objectstore-langfuse-db.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: langfuse-db-backup
        serverName: langfuse-db

---
# Default deny all ingress and egress for the langfuse namespace. (One empty
# rule = deny-all; an empty list is rejected by Cilium. See
# kubernetes/apps/ai/crawl4ai/networkpolicy.yaml.)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: langfuse-default-deny
  namespace: langfuse
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# Langfuse's components talk to each other freely: web/worker to ClickHouse
# and Postgres, Postgres replication.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: langfuse-allow-intra-namespace
  namespace: langfuse
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
  egress:
    - toEndpoints:
        - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: langfuse-allow-dns
  namespace: langfuse
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# langfuse-db: the CloudNativePG operator manages it; its instance manager
# talks to the Kubernetes API; the Barman Cloud sidecar uploads to RustFS;
# Prometheus scrapes CNPG metrics.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: langfuse-db-allow-cnpg
  namespace: langfuse
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: langfuse-db
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: rustfs
            app: rustfs
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
---
# Langfuse web and worker: the shared Redis (Sentinel 26379 to find the
# primary, then 6379 as ACL user `langfuse`) and RustFS (event uploads). The
# redis and rustfs namespaces admit these pods on their side.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: langfuse-app-allow-redis-rustfs
  namespace: langfuse
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: langfuse
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: redis
            app: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
            - port: "26379"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: rustfs
            app: rustfs
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# The Gateway (browsers and the desktop's Claude Code hook, both via the
# langfuse.jupitertech.net HTTPRoute) reaches the web UI/API. Container port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: langfuse-web-allow-gateway-ingress
  namespace: langfuse
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: langfuse
      app.kubernetes.io/component: web
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# Reply traffic to cross-node Envoy (Gateway) connections, as in the other
# apps (native routing evaluates replies against egress policy), EXCEPT the
# Kubernetes API VIP. Also how web will reach Authentik for OIDC
# (auth.jupitertech.net resolves to the Gateway VIP).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: langfuse-web-allow-node-egress
  namespace: langfuse
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: langfuse
      app.kubernetes.io/component: web
  egress:
    - toCIDRSet:
        - cidr: 10.77.20.0/24
          except:
            - 10.77.20.10/32
---
# Hermes (kubernetes/apps/ai/hermes): its Langfuse plugin exports traces over
# OTLP straight to web's API, in-cluster. The hermes namespace allows this
# side in hermes-allow-langfuse.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: langfuse-web-allow-hermes
  namespace: langfuse
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: langfuse
      app.kubernetes.io/component: web
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: hermes
            app: hermes
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP

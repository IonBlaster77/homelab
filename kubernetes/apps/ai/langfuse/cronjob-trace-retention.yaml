apiVersion: batch/v1
kind: CronJob
metadata:
  name: trace-retention
  namespace: langfuse
spec:
  # Langfuse's built-in data retention is Enterprise-only when self-hosting;
  # without it traces are kept forever. This deletes traces older than
  # RETENTION_DAYS through Langfuse's own batch delete API, which removes their
  # observations and scores from every store (ClickHouse, Postgres, S3).
  # Candidates come straight from ClickHouse: traces whose NEWEST event is
  # older than the cutoff, so a long-running session is never half-deleted.
  # Deletion is asynchronous on Langfuse's side (seconds to minutes) and
  # rate-limited, so batches of 100 with a pause, at most 5000 traces a run;
  # anything left is picked up the next night.
  schedule: "30 16 * * *"   # 03:00 Adelaide
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: trace-retention
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trace-retention
              image: curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: RETENTION_DAYS
                  value: "30"
                - name: CH_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: clickhouse-users, key: password}
                - name: LF_PK
                  valueFrom:
                    secretKeyRef: {name: langfuse-secrets, key: init-project-public-key}
                - name: LF_SK
                  valueFrom:
                    secretKeyRef: {name: langfuse-secrets, key: init-project-secret-key}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  CH="http://clickhouse.langfuse.svc.cluster.local:8123/"
                  LF="http://langfuse-web.langfuse.svc.cluster.local:3000/api/public/traces"
                  ids=$(curl -sf -u "langfuse:$CH_PASSWORD" --data-binary "
                    SELECT trace_id FROM default.events_full
                    WHERE is_deleted = 0 AND trace_id != ''
                    GROUP BY trace_id
                    HAVING max(start_time) < now() - INTERVAL $RETENTION_DAYS DAY
                    LIMIT 5000 FORMAT TSV" "$CH")
                  total=$(printf '%s\n' "$ids" | grep -c . || true)
                  echo "traces older than $RETENTION_DAYS days: $total"
                  [ "$total" -gt 0 ] || exit 0
                  sent=0
                  printf '%s\n' "$ids" | grep . | split -l 100 - /tmp/batch.
                  for f in /tmp/batch.*; do
                    json=$(awk 'BEGIN{printf "{\"traceIds\":["} {printf "%s\"%s\"", (NR>1?",":""), $1} END{printf "]}"}' "$f")
                    code=$(curl -s -o /tmp/resp -w '%{http_code}' -X DELETE -u "$LF_PK:$LF_SK" \
                      -H 'Content-Type: application/json' -d "$json" "$LF")
                    if [ "$code" != 200 ]; then
                      echo "delete failed after $sent traces: HTTP $code $(head -c 300 /tmp/resp)"
                      exit 1
                    fi
                    sent=$((sent + $(grep -c . "$f")))
                    sleep 2
                  done
                  echo "requested deletion of $sent traces (completes asynchronously)"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi

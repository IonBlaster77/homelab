# Langfuse connects with CLICKHOUSE_URL=http://clickhouse.langfuse.svc:8123
# and CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse.langfuse.svc:9000.
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: langfuse
  labels:
    app: clickhouse
spec:
  selector:
    app: clickhouse
  ports:
    - port: 8123
      targetPort: 8123
      name: http
    - port: 9000
      targetPort: 9000
      name: native

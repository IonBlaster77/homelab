# Renders the Langfuse chart (helmCharts, needs the plugin's --enable-helm)
# plus this folder's own manifests: its data stores and network policies.
# app.yaml is deliberately NOT listed: it is picked up by the root app.
# *.sops.yaml files are decrypted by the sops-kustomize plugin before this runs.
#
# helmCharts rather than a second Application source: the chart repo then
# needs no AppProject sourceRepos entry (the AppProject lives in the
# manual-sync argocd app), same approach as Harbor.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: langfuse
    repo: https://langfuse.github.io/langfuse-k8s
    version: 2.2.0
    releaseName: langfuse
    namespace: langfuse
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - networkpolicy.yaml
  # ClickHouse: traces and observations
  - secret-clickhouse.sops.yaml
  - configmap-clickhouse.yaml
  - statefulset-clickhouse.yaml
  - service-clickhouse.yaml
  # Postgres (CloudNativePG) with point-in-time recovery to RustFS
  - cluster-langfuse-db.yaml
  - podmonitor-langfuse-db.yaml
  - secret-langfuse-db-backup.sops.yaml
  - objectstore-langfuse-db.yaml
  - scheduledbackup-langfuse-db.yaml
  # Langfuse's RustFS key (s3://langfuse/) and Redis ACL user's password
  - secret-langfuse-s3.sops.yaml
  - secret-redis-langfuse.sops.yaml
  # The app's own secrets (salt, encryption key, NextAuth, first admin, API keys)
  - secret-langfuse-app.sops.yaml
  # Nightly deletion of traces older than 30 days (retention is Enterprise-only)
  - cronjob-trace-retention.yaml
  # LAN access through the Gateway (Cloudflare Access + Authentik come later)
  - httproute.yaml
  - referencegrant.yaml
patches:
  # The chart always renders a "langfuse-app" Secret for values it would
  # generate. Every one is pinned in langfuse-secrets, so it renders empty;
  # drop it rather than keep a stray empty Secret.
  - target:
      kind: Secret
      name: langfuse-app
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: langfuse-app

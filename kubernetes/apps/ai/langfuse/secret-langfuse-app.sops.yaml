# Langfuse application secrets. salt / encryption-key / nextauth-secret are
# pinned here (not chart-generated: lookup() doesn't work under Argo, so a
# generated value would change on every render). ENCRYPTION_KEY encrypts
# stored LLM API keys: changing it makes those unreadable.
#
# init-*: headless initialization on first start (LANGFUSE_INIT_*), creating
# the "Homelab" org, the "agents" project with this API key pair (Hermes,
# Claude Code etc. report with it) and the first admin user. Sign-up is
# disabled; sign-in moves to Authentik later.

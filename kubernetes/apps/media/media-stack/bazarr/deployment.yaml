apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: media
  labels:
    app: bazarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
        app.kubernetes.io/name: bazarr
    spec:
      containers:
        - name: bazarr
          image: ghcr.io/linuxserver/bazarr:v1.6.2-ls374
          ports:
            - containerPort: 6767
          env:
            - name: PUID
              value: "1032"
            - name: PGID
              value: "100"
            - name: TZ
              value: Australia/Adelaide
            # Database: Postgres in the CNPG cluster bazarr-db
            # (cluster-bazarr-db.yaml), from its generated credentials. These
            # env vars override config.yaml. Moved off SQLite on 2026-11-26
            # with pgloader (Bazarr wiki recipe); /config/db/bazarr.db is
            # unused.
            - name: POSTGRES_ENABLED
              value: "true"
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: bazarr-db-app
                  key: host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: bazarr-db-app
                  key: port
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: bazarr-db-app
                  key: dbname
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bazarr-db-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bazarr-db-app
                  key: password
            # linuxserver runs Bazarr as a non-root user; without this libpq
            # tries /root/.postgresql/postgresql.crt and the connection fails
            # (Bazarr wiki).
            - name: PGSSLCERT
              value: /tmp/postgresql.crt
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: 6767
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 6767
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 6767
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 250m
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bazarr-config
        - name: media
          persistentVolumeClaim:
            claimName: media-nfs

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr
  namespace: networking
spec:
  hostnames:
    - bazarr.jupitertech.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab-gateway
      namespace: networking
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: bazarr
          namespace: media
          port: 6767
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /

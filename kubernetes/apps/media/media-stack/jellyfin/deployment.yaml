apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
        app.kubernetes.io/name: jellyfin
    spec:
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.11
          ports:
            - containerPort: 8096
          env:
            - name: TZ
              value: Australia/Adelaide
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
              readOnly: true
            # Transcode segments in RAM, not the node's ephemeral disk. On talos4
            # that is the BX500 SSD that also holds Longhorn "ssd" replicas: a
            # 25x-speed transcode (10 GB in 7 min) saturated it on 2026-10-20,
            # replicas timed out and three volumes (redis-1, redis-2,
            # prowlarr-config) went read-only. Jellyfin's transcode throttling
            # and segment deletion (Dashboard > Playback > Transcoding) keep
            # roughly 1 GB per Blu-ray stream here.
            - name: transcodes
              mountPath: /cache/transcodes
          livenessProbe:
            tcpSocket:
              port: 8096
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8096
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # tmpfs pages count against the memory limit: +3Gi for transcodes.
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 6Gi
              cpu: 2000m
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          persistentVolumeClaim:
            claimName: media-nfs
        - name: transcodes
          emptyDir:
            medium: Memory
            sizeLimit: 3Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
  labels:
    app: sonarr
spec:
  # 0 during the Postgres 17 -> 18 upgrade of sonarr-db.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
        app.kubernetes.io/name: sonarr
    spec:
      containers:
        - name: sonarr
          image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls329
          ports:
            - containerPort: 8989
          env:
            - name: PUID
              value: "1032"
            - name: PGID
              value: "100"
            - name: TZ
              value: Australia/Adelaide
            # Database: Postgres 17 in the CNPG cluster sonarr-db
            # (cluster-sonarr-db.yaml), databases sonarr-main and sonarr-log.
            # These env vars override config.xml. Moved off SQLite on
            # 2026-11-28 with pgloader (Servarr wiki recipe); /config/sonarr.db
            # and logs.db are unused.
            - name: SONARR__POSTGRES__HOST
              valueFrom:
                secretKeyRef:
                  name: sonarr-db-app
                  key: host
            - name: SONARR__POSTGRES__PORT
              valueFrom:
                secretKeyRef:
                  name: sonarr-db-app
                  key: port
            - name: SONARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: sonarr-db-app
                  key: username
            - name: SONARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarr-db-app
                  key: password
            - name: SONARR__POSTGRES__MAINDB
              value: sonarr-main
            - name: SONARR__POSTGRES__LOGDB
              value: sonarr-log
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 8989
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8989
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              # .NET caps its heap at ~75% of this. At 1Gi, large release
              # batches threw OutOfMemoryException and failed searches.
              memory: 2Gi
              cpu: 500m
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: media
          persistentVolumeClaim:
            claimName: media-nfs

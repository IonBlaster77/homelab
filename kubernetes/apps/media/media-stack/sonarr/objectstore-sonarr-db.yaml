# HISTORY: sonarr-db's Postgres 17 WAL archive and base backups (s3://cnpg/sonarr-db/),
# up to the 17 -> 18 upgrade on 2026-11-28. Nothing archives here any more
# (see objectstore-sonarr-db-pg18.yaml), so retention no longer prunes it: delete
# old backups by hand when they're no longer wanted. Restoring from here
# lands on Postgres 17. Original header:
# Where sonarr-db's WAL archive and base backups go: RustFS, under s3://cnpg/sonarr-db/.
# The key in sonarr-db-backup-s3 can only touch that prefix and cannot delete object
# versions (versioned bucket). See
# kubernetes/platform/databases/cnpg-barman-cloud/README.md.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: sonarr-db-backup
  namespace: media
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: s3://cnpg/
    endpointURL: http://rustfs.rustfs.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: sonarr-db-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: sonarr-db-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      # Newer boto3 data-integrity checks break S3-compatible stores like
      # RustFS (x-amz-content-sha256 errors, plugin issue #393).
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required

# Daily base backup of sonarr-db to RustFS. 17:30 UTC = 04:00 Adelaide (ACDT).
# CNPG cron has a seconds field. No `immediate` (it fires before the
# sidecar exists); the first base backup is taken by hand.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: sonarr-db-daily
  namespace: media
spec:
  schedule: "0 30 17 * * *"
  backupOwnerReference: self
  cluster:
    name: sonarr-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

# Run: sops -e -i kubernetes/apps/media/media-stack/recyclarr/secret.sops.yaml
# Age public key is stored in Bitwarden under "Homelab SOPS Age Key"
#
# Unencrypted structure (reference only — never commit without encryption):
#
# stringData:
#   SONARR_API_KEY: "<Sonarr Settings > General > API Key>"
#   RADARR_API_KEY: "<Radarr Settings > General > API Key>"
#     Both are auto-generated by their respective apps on first start and
#     stored in /config/config.xml on each app's own PVC — not a value we
#     choose. Read via `grep ApiKey /config/config.xml` in the running pod
#     if they ever need to be re-synced (e.g. after a config.xml reset).
#     Referenced from recyclarr.yml via the !env_var tag (Recyclarr >= v4.3.0).
#   RECYCLARR_API_KEY: "<openssl rand -hex 32>"
#     Recyclarr 9 server API key (>= 32 chars), chosen by us. Read by the
#     server (deployment.yaml, envFrom) and sent by the nightly sync
#     CronJob (cronjob.yaml, secretKeyRef). Rotate by editing it here;
#     restart the recyclarr Deployment afterwards.

# Daily base backup of prowlarr-db to RustFS. 17:10 UTC = 03:40 Adelaide (ACDT).
# CNPG cron has a seconds field. No `immediate` (it fires before the
# sidecar exists); the first base backup is taken by hand.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: prowlarr-db-daily
  namespace: media
spec:
  schedule: "0 10 17 * * *"
  backupOwnerReference: self
  cluster:
    name: prowlarr-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

# CNPG metrics for prowlarr-db, so the CNPG alerts and Grafana dashboard cover it.
# (The media namespace has no network policies, so no scrape rule is needed.)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: prowlarr-db
  namespace: media
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: prowlarr-db
  podMetricsEndpoints:
    - port: metrics

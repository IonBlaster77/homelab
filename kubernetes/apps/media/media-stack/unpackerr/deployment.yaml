apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpackerr
  namespace: media
  labels:
    app: unpackerr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unpackerr
  template:
    metadata:
      labels:
        app: unpackerr
    spec:
      containers:
        - name: unpackerr
          image: golift/unpackerr:v0.16.1
          env:
            - name: TZ
              value: Australia/Adelaide
            - name: UN_FOLDER_0_PATH
              value: /data/torrents
            - name: UN_FOLDER_0_DELETE_AFTER
              value: "0"
            - name: UN_FOLDER_0_DELETE_FILES
              value: "false"
            - name: UN_FOLDER_0_MOVE_BACK
              value: "false"
            - name: UN_SONARR_0_URL
              value: http://sonarr:8989
            - name: UN_SONARR_0_API_KEY
              valueFrom:
                secretKeyRef:
                  name: unpackerr-secret
                  key: UN_SONARR_0_API_KEY
            # 0.16+ caps uncompressed extract size per item (defaults: Sonarr
            # 20GB, Radarr 75GB) and fails anything bigger without retry.
            # Season packs and 4K remuxes exceed those; raise rather than
            # disable, so the archive-bomb guard stays.
            - name: UN_SONARR_0_MAX_BYTES
              value: "150GB"
            - name: UN_RADARR_0_URL
              value: http://radarr:7878
            - name: UN_RADARR_0_API_KEY
              valueFrom:
                secretKeyRef:
                  name: unpackerr-secret
                  key: UN_RADARR_0_API_KEY
            - name: UN_RADARR_0_MAX_BYTES
              value: "150GB"
          volumeMounts:
            - name: media
              mountPath: /data
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 256Mi
              cpu: 250m
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-nfs

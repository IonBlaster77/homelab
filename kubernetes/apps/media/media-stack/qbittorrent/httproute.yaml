apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: networking
spec:
  hostnames:
    - qbittorrent.jupitertech.net
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab-gateway
      namespace: networking
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: qbittorrent
          namespace: media
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /

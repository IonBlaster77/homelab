apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: media
  labels:
    app: seerr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
        app.kubernetes.io/name: seerr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.5.2
          ports:
            - containerPort: 5055
          env:
            - name: TZ
              value: Australia/Adelaide
            - name: PORT
              value: "5055"
            # Database: Postgres in the CNPG cluster seerr-db
            # (cluster-seerr-db.yaml), from its generated credentials. Moved
            # off SQLite on 2026-11-26 with pgloader (data only); the old
            # /app/config/db/db.sqlite3 is unused. settings.json stays on
            # the PVC.
            - name: DB_TYPE
              value: postgres
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: seerr-db-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: seerr-db-app
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: seerr-db-app
                  key: username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: seerr-db-app
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: seerr-db-app
                  key: dbname
          volumeMounts:
            - name: config
              mountPath: /app/config
          livenessProbe:
            tcpSocket:
              port: 5055
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 5055
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config

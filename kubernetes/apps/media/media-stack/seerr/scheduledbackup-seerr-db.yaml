# Daily base backup of seerr-db to RustFS. 16:50 UTC = 03:20 Adelaide (ACDT).
# CNPG cron has a seconds field. No `immediate` (it fires before the
# sidecar exists); the first base backup is taken by hand.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: seerr-db-daily
  namespace: media
spec:
  schedule: "0 50 16 * * *"
  backupOwnerReference: self
  cluster:
    name: seerr-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

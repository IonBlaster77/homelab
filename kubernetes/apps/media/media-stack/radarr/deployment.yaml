apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media
  labels:
    app: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
        app.kubernetes.io/name: radarr
    spec:
      containers:
        - name: radarr
          image: ghcr.io/linuxserver/radarr:7.0.3.10918-ls328
          ports:
            - containerPort: 7878
          env:
            - name: PUID
              value: "1032"
            - name: PGID
              value: "100"
            - name: TZ
              value: Australia/Adelaide
            # Database: Postgres 17 in the CNPG cluster radarr-db
            # (cluster-radarr-db.yaml), databases radarr-main and radarr-log.
            # These env vars override config.xml. Moved off SQLite on
            # 2026-11-28 with pgloader (Servarr wiki recipe); /config/radarr.db
            # and logs.db are unused.
            - name: RADARR__POSTGRES__HOST
              valueFrom:
                secretKeyRef:
                  name: radarr-db-app
                  key: host
            - name: RADARR__POSTGRES__PORT
              valueFrom:
                secretKeyRef:
                  name: radarr-db-app
                  key: port
            - name: RADARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: radarr-db-app
                  key: username
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radarr-db-app
                  key: password
            - name: RADARR__POSTGRES__MAINDB
              value: radarr-main
            - name: RADARR__POSTGRES__LOGDB
              value: radarr-log
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 7878
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 7878
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: media
          persistentVolumeClaim:
            claimName: media-nfs

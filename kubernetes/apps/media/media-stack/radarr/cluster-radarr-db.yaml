# Radarr's Postgres: radarr-main (movies, files, history, blocklist, profiles, settings) and radarr-log (log entries), both owned by radarr. RADARR__POSTGRES__* env selects it (overrides config.xml).
# CloudNativePG generates the credentials into radarr-db-app (username, password,
# host, uri); the Deployment reads them.
#
# Right-sized for a small app database (decided 2026-11-26: one cluster per
# app, not a shared media cluster): 2 instances, 256Mi, 2Gi. The existing
# small clusters use 45-90 MiB per pod on average.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: radarr-db
  namespace: media
spec:
  instances: 2
  # Pinned here so Renovate tracks it (same group as the other clusters).
  # Upgraded in place from 17.12 on 2026-11-28 (pg_upgrade, CNPG major
  # upgrade, docs/runbooks/cnpg-major-upgrade.md); 17 was only for the
  # SQLite -> Postgres migration, which the Servarr wiki documents for <18.
  imageName: ghcr.io/cloudnative-pg/postgresql:19.0-standard-trixie
  # OOM protection (docs/projects/oom-protection.md): memory request = limit,
  # a CPU request, no CPU limit, like the other clusters.
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 256Mi
  primaryUpdateMethod: switchover
  # Synchronous replication, same as every other cluster (see
  # paperclip-db): "preferred", never "required" with two instances.
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  storage:
    storageClass: longhorn-nvme
    size: 2Gi
  bootstrap:
    initdb:
      database: radarr-main
      owner: radarr
  # Point-in-time recovery from day one: WAL archive + base backups in RustFS
  # (s3://cnpg/radarr-db/pg18/ since the Postgres 18 upgrade, see
  # objectstore-radarr-db-pg18.yaml; the 17 history is in objectstore-radarr-db.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: radarr-db-backup-pg18
        serverName: pg18
---
# Second database for the same app user (created by CNPG, owned by radarr).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: radarr-db-radarr-log
  namespace: media
spec:
  name: radarr-log
  owner: radarr
  cluster:
    name: radarr-db

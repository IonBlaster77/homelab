# Daily base backup of radarr-db to RustFS. 17:20 UTC = 03:50 Adelaide (ACDT).
# CNPG cron has a seconds field. No `immediate` (it fires before the
# sidecar exists); the first base backup is taken by hand.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: radarr-db-daily
  namespace: media
spec:
  schedule: "0 20 17 * * *"
  backupOwnerReference: self
  cluster:
    name: radarr-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

# Daily base backup of arr-dashboard-pg17 to RustFS. 17:45 UTC = 04:15
# Adelaide (ACDT), just after arr-dashboard-db's slot. CNPG cron has a seconds
# field. No `immediate` (it fires before the sidecar exists); the first base
# backup is taken by hand.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: arr-dashboard-pg17-daily
  namespace: media
spec:
  schedule: "0 45 17 * * *"
  backupOwnerReference: self
  cluster:
    name: arr-dashboard-pg17
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

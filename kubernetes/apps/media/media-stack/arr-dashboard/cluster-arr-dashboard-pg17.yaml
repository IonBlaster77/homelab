# arr-dashboard's Postgres, on Postgres 17 on purpose (2026-11-28).
#
# Why 17: arr-dashboard 2.25.x refuses to start on Postgres 18. Its startup
# schema check only knows primary-key, unique and foreign-key constraints, and
# Postgres 18 records every NOT NULL as a constraint too (pg_constraint
# contype 'n'), so the check gives up ("Destructive schema changes are
# intentionally rejected at startup"). Proven on an empty 18 database; 2.25.3
# starts fine on 17. Move back to 18 (cnpg-major-upgrade runbook, serverName
# pg18) once upstream handles contype 'n'.
#
# Replaces arr-dashboard-db (Postgres 18, kept for a while as the rollback).
# Data was copied across with pg_dump/psql. The app reads DATABASE_URL from
# arr-dashboard-pg17-app (generated by CloudNativePG).
#
# Sized like the other per-app media clusters: 2 instances, 256Mi, 2Gi.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: arr-dashboard-pg17
  namespace: media
spec:
  instances: 2
  # Pinned here so Renovate tracks 17.x minors (it never offers majors).
  imageName: ghcr.io/cloudnative-pg/postgresql:17.12-standard-trixie
  # OOM protection (docs/projects/oom-protection.md): memory request = limit,
  # a CPU request, no CPU limit, like the other clusters.
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 256Mi
  primaryUpdateMethod: switchover
  # Synchronous replication, same as every other cluster (see
  # paperclip-db): "preferred", never "required" with two instances.
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
  storage:
    storageClass: longhorn-nvme
    size: 2Gi
  bootstrap:
    initdb:
      database: arr_dashboard
      owner: arr_dashboard
  # WAL archive + base backups in RustFS under the existing arr-dashboard-db
  # prefix (its key can only write there): s3://cnpg/arr-dashboard-db/pg17/.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: arr-dashboard-db-backup-pg17
        serverName: pg17

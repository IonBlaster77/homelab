# Where arr-dashboard-db's WAL archive and base backups go: RustFS, under
# s3://cnpg/arr-dashboard-db/. The key in arr-dashboard-db-backup-s3 can only
# touch that prefix and cannot delete object versions (versioned bucket). See
# kubernetes/platform/databases/cnpg-barman-cloud/README.md.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: arr-dashboard-db-backup
  namespace: media
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: s3://cnpg/
    endpointURL: http://rustfs.rustfs.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: arr-dashboard-db-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: arr-dashboard-db-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      # Newer boto3 data-integrity checks break S3-compatible stores like
      # RustFS (x-amz-content-sha256 errors, plugin issue #393).
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required

# Daily base backup of streamystats-db to RustFS via the Barman Cloud plugin.
# 16:30 UTC = 03:00 Adelaide, after the other clusters (15:00-16:20). CNPG
# cron has a seconds field. No `immediate`: created in the same sync as the
# Cluster's plugin entry, it fires before the pods have the sidecar and fails
# ("requested plugin is not available"). Take the first base backup by hand
# once the cluster is up (see the cnpg-barman-cloud README).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: streamystats-db-daily
  namespace: streamystats
spec:
  schedule: "0 30 16 * * *"
  backupOwnerReference: self
  cluster:
    name: streamystats-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

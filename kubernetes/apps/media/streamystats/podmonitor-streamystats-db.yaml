# CNPG metrics for streamystats-db, so the CNPG alerts (incl.
# WALArchiveBacklog) and the CNPG Grafana dashboard cover it. Hand-rolled
# like the other clusters' (enablePodMonitor is deprecated).
# streamystats-db-allow-cnpg in networkpolicy.yaml admits the scrape.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: streamystats-db
  namespace: streamystats
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: streamystats-db
  podMetricsEndpoints:
    - port: metrics

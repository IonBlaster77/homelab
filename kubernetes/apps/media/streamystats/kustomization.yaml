# Lists every manifest Argo CD applies for this app. app.yaml is deliberately
# NOT listed: it is picked up by the root app, not by this folder's own app.
# *.sops.yaml files are decrypted by the sops-kustomize plugin before this runs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - secret.sops.yaml
  # Database
  - service-vectorchord.yaml
  - statefulset-vectorchord.yaml
  # Embedding server
  - pvc-ollama.yaml
  - service-ollama.yaml
  - deployment-ollama.yaml
  # Job server
  - service-job-server.yaml
  - deployment-job-server.yaml
  # Web UI
  - service.yaml
  - deployment.yaml
  - httproute.yaml
  - referencegrant.yaml
  - networkpolicy.yaml

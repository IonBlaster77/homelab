              password: "{{HOMEPAGE_VAR_SYNOLOGY_PASSWORD}}"
              volume: volume_1

    # Patch ops centre (task #21). Deliberately built with customapi
    # widgets hitting public APIs directly rather than a custom
    # aggregator service: this repo has no image-build pipeline, so a
    # bespoke backend would be a delivery problem, not a coding one.
    #
    # Division of labour: Renovate (task #22) covers every Helm chart
    # and container image in the repo and raises a PR per update, so
    # "Update Queue" just counts its open PRs rather than duplicating
    # version-checking. "Upstream Releases" covers the things Renovate
    # structurally CANNOT see - Talos OS (Image Factory serves
    # content-addressed installer images, not versioned tags, so
    # Renovate's docker datasource gets no-result) and Kubernetes
    # (ships as part of Talos, not as a tracked dependency here).
    - Update Queue:
        - Renovate:
            id: renovate-card
            href: https://github.com/IonBlaster77/homelab/pulls
            description: Dependency update PRs awaiting review
            icon: mdi-source-pull
            widget:
              type: customapi
              # GitHub's search API returns a single total_count field,
              # which maps cleanly onto one customapi field. Listing
              # /pulls directly would return an array with no count.
              # Unauthenticated search is rate-limited to 10 req/min;
              # a 10-minute refresh sits far inside that.
              url: "https://api.github.com/search/issues?q=repo:IonBlaster77/homelab+is:pr+is:open+label:renovate"
              refreshInterval: 600000
              # GitHub's API rejects any request without a User-Agent
              # ("Request forbidden by administrative rules"), and
              # Homepage's proxy sends none by default - without this
              # the widget shows a bare "API Error Information".
              headers:
                User-Agent: homepage-jupitertech
              mappings:
                - field: total_count
                  label: Open PRs
                  format: number
        - Dependency Dashboard:
            id: renovate-dashboard-card
            href: https://github.com/IonBlaster77/homelab/issues
            description: Full backlog incl. rate-limited & skipped updates
            icon: mdi-clipboard-list-outline

    - Upstream Releases:
        - Talos OS:
            id: talos-release-card
            # Current version is hardcoded because nothing serves it
            # over HTTP that Homepage can reach - it lives on the Node
            # objects (.status.nodeInfo.osImage) and reading those needs
            # a service-account token, which customapi cannot supply.
            # Update this line whenever the cluster is upgraded, or
            # replace the whole card once the aggregator lands.
            description: Running v1.12.6 — compare against latest
            href: https://github.com/siderolabs/talos/releases
            icon: mdi-server
            widget:
              type: customapi
              url: "https://api.github.com/repos/siderolabs/talos/releases/latest"
              refreshInterval: 3600000
              headers:
                User-Agent: homepage-jupitertech
              mappings:
                - field: tag_name
                  label: Latest
                - field: published_at
                  label: Released
                  format: relativeDate
        - Kubernetes:
            id: k8s-release-card
            description: Running v1.35.0 — ships with Talos, not tracked by Renovate
            href: https://github.com/kubernetes/kubernetes/releases
            icon: kubernetes.png
            widget:
              type: customapi
              url: "https://api.github.com/repos/kubernetes/kubernetes/releases/latest"
              refreshInterval: 3600000
              headers:
                User-Agent: homepage-jupitertech
              mappings:
                - field: tag_name
                  label: Latest
                - field: published_at
                  label: Released
                  format: relativeDate
    # Per-device firmware. AP versions come from unpoller_device_info's
    # `version` label - note the metric prefix is `unpoller_`, not
    # `unifi_` (the project renamed itself from unifi-poller to
    # UnPoller), which makes the data very easy to miss when grepping.
    # Read through Prometheus' HTTP API via customapi rather than
    # Homepage's `prometheus` widget type, because that widget renders
    # a series *value* and the information here lives in a label.
    # Each AP is selected by name so the cards can't silently swap
    # round if the series order changes.
    - Device Firmware:
        - U6-Lite Office:
            id: unifi-ap-office-card
            description: Access point — 10.77.10.12
            href: https://10.77.10.10
            icon: ubiquiti.png
            widget:
              type: customapi
              url: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090/api/v1/query?query=unpoller_device_info%7Bname%3D%22U6-Lite-Office%22%7D"
              refreshInterval: 3600000
              mappings:
                - field: data.result.0.metric.version
                  label: Firmware
        - U6-Lite Garage:
            id: unifi-ap-garage-card
            description: Access point — 10.77.10.100
            href: https://10.77.10.10
            icon: ubiquiti.png
            widget:
              type: customapi
              url: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090/api/v1/query?query=unpoller_device_info%7Bname%3D%22U6-Lite-Garage%22%7D"
              refreshInterval: 3600000
              mappings:
                - field: data.result.0.metric.version
                  label: Firmware
        - UniFi Network Controller:
            id: unifi-controller-card
            # unpoller_controller_info carries NO version label (only
            # hostname/site_name/source), so the controller's version
            # string is not obtainable here. What IS available is
            # whether the controller reports a pending update, which is
            # the part that actually matters for patch ops. 0 = up to
            # date, 1 = update waiting.
            description: Network application — update flag
            href: https://10.77.10.10
            icon: unifi.png
            widget:
              type: customapi
              url: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090/api/v1/query?query=unpoller_controller_update_available"
              refreshInterval: 3600000
              mappings:
                - field: data.result.0.value.1
                  label: Update pending
        - CloudKey Gen2+ / UniFi OS:
            id: cloudkey-pending-card
            # Placeholder, not a live card. The CloudKey never appears
            # in unpoller_device_info - unpoller polls the Network API
            # and so only sees adopted devices (the 2 APs), not the
            # host it runs on. Probed the controller directly on
            # 2026-08-15: https://10.77.10.10/api/system answers
            # UNauthenticated but returns only identity/state
            # (hardware.shortname UCKP, name, mac, cloudConnected) with
            # no firmware field; /proxy/network/status is 401. Getting
            # UniFi OS + CloudKey firmware needs a real login flow
            # (POST /api/auth/login -> token -> authed GET), which
            # customapi cannot do - it sends static headers, not a
            # round-trip. Needs the aggregator (task #21/#31).
            description: Firmware needs authenticated API — see task #21
            icon: mdi-alert-circle-outline
        - MikroTik RouterOS:
            id: routeros-pending-card
            # Placeholder, not a live card. RouterOS versions need
            # either SSH (blocked - task #26, the router key import has
            # never worked) or the REST API; the mikrotik exporter
            # feeding Prometheus has no version collector (confirmed
            # 2026-08-15: only cpu/memory/interface/route/uptime).
            description: Version check blocked — see task #26
            icon: mdi-alert-circle-outline


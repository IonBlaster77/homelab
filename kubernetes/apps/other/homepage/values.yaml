# Pinned here, not in the chart: the chart (jameswynn/homepage 2.1.0) still
# defaults to an old appVersion. Bump this tag to upgrade Homepage itself.
image:
  repository: ghcr.io/gethomepage/homepage
  tag: v2.7.0

enableRbac: true
serviceAccount:
  name: homepage
  create: true

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "home.jupitertech.net,home.jupitertech.net:443,home.jupitertech.net:80"

envFrom:
  - secretRef:
      name: homepage-synology
  - secretRef:
      name: homepage-arr-keys
      optional: true

service:
  main:
    ports:
      http:
        port: 3000

config:
  settings:
    title: Jupiter Tech
    theme: dark
    color: zinc
    headerStyle: boxedWidgets
    cardBlur: sm
    layout:
      Cluster Management:
        tab: Infrastructure
        style: row
        columns: 4
        icon: mdi-server-network
      Network & Security:
        tab: Infrastructure
        style: row
        columns: 2
        icon: mdi-shield-lock
      # Things with no web UI of their own: the tile is there for its
      # status badge (pod state from the Kubernetes API), so a glance
      # shows whether everything the cluster runs is up.
      Platform Services:
        tab: Infrastructure
        style: row
        columns: 4
        icon: mdi-cogs
      Databases:
        tab: Infrastructure
        style: row
        columns: 4
        icon: mdi-database
      Monitoring Pipeline:
        tab: Infrastructure
        style: row
        columns: 4
        icon: mdi-chart-line
      Network Hardware:
        tab: Infrastructure
        style: row
        columns: 4
        icon: mdi-router-network
      Media:
        tab: Media
        style: row
        columns: 2
        icon: mdi-television-play
      Media Management:
        tab: Media
        style: row
        columns: 5
        icon: mdi-cog-play
      Audio:
        tab: Media
        style: row
        columns: 2
        icon: mdi-speaker-multiple
      Files & Chat:
        tab: Apps
        style: row
        columns: 2
        icon: mdi-account-group
      Tools & AI:
        tab: Apps
        style: row
        columns: 3
        icon: mdi-toolbox
      Quick Links:
        tab: Apps
        icon: mdi-bookmark-multiple
      Update Queue:
        tab: Patch Ops
        style: row
        columns: 2
        icon: mdi-package-down
      Upstream Releases:
        tab: Patch Ops
        style: row
        columns: 3
        icon: mdi-tag-arrow-up
      Device Firmware:
        tab: Patch Ops
        style: row
        columns: 3
        icon: mdi-chip

  bookmarks:
    - Quick Links:
        - GitHub:
            - abbr: GH
              href: https://github.com/IonBlaster77/homelab
              icon: github.png

  services:
    - Cluster Management:
        - pgAdmin:
            id: pgadmin-card
            href: https://pgadmin.jupitertech.net
            description: PostgreSQL database administration
            icon: pgadmin.png
            siteMonitor: http://pgadmin4.pgadmin.svc.cluster.local:80
            namespace: pgadmin
            app: pgadmin4
        - ArgoCD:
            id: argocd-card
            href: https://argocd.jupitertech.net
            description: GitOps continuous delivery
            icon: argo-cd.png
            siteMonitor: http://argocd-server.argocd.svc.cluster.local:80
            namespace: argocd
            app: argocd-server
        - Grafana:
            id: grafana-card
            href: https://grafana.jupitertech.net
            description: Metrics & dashboards
            icon: grafana.png
            siteMonitor: http://monitoring-grafana.monitoring.svc.cluster.local:80
            namespace: monitoring
            app: grafana
        - Longhorn:
            id: longhorn-card
            href: https://longhorn.jupitertech.net
            description: Distributed block storage
            icon: longhorn.png
            siteMonitor: http://longhorn-frontend.longhorn-system.svc.cluster.local:80
            namespace: longhorn-system
            app: longhorn
        - Hubble:
            id: hubble-card
            href: https://hubble.jupitertech.net
            description: Cilium network flow visibility
            icon: mdi-lan-check
            siteMonitor: http://hubble-ui.kube-system.svc.cluster.local:80
            namespace: kube-system
            app: hubble-ui
        - Prometheus:
            id: prometheus-card
            # No href: not exposed via the gateway. Grafana is the
            # dashboard surface; this tile is for knowing Prometheus
            # itself is alive, which Grafana being up does NOT imply.
            description: Metrics store & alert rules — internal only
            icon: prometheus.png
            siteMonitor: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090/-/healthy
            namespace: monitoring
            app: prometheus
        - Alertmanager:
            id: alertmanager-card
            description: Alert routing & silences — internal only
            icon: alertmanager.png
            siteMonitor: http://monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093/-/healthy
            namespace: monitoring
            app: alertmanager
        - Argo Workflows:
            id: argo-workflows-card
            # Intentionally NO href. The server runs with authModes
            # `server`, i.e. it acts as its own ServiceAccount with no
            # per-user login - putting a reachable URL in front of it
            # would publish an unauthenticated cluster-admin UI. Reach
            # it with a port-forward until it is behind SSO or Access.
            description: In-cluster build & job orchestration — port-forward only
            icon: mdi-sitemap
            siteMonitor: http://argo-workflows-server.argo-workflows.svc.cluster.local:2746
            namespace: argo-workflows
            app: argo-workflows-server
        - Harbor:
            id: harbor-card
            href: https://registry.jupitertech.net
            description: Container registry & pull-through cache — LAN only
            icon: harbor.png
            # Through the Gateway: the harbor namespace is default-deny
            # and only admits the Gateway. /api/v2.0/ping answers "Pong".
            siteMonitor: https://registry.jupitertech.net/api/v2.0/ping
            namespace: harbor
            app: harbor
            podSelector: app=harbor

    - Network & Security:
        - Authentik:
            id: authentik-card
            href: https://auth.jupitertech.net
            description: Identity provider — SSO, LDAP, RADIUS
            icon: authentik.png
            # Poll the lightweight health endpoint rather than /, which
            # 302-redirects into the flow interface and runs Authentik's
            # full ~20-layer Django middleware stack (~400ms vs ~100ms).
            siteMonitor: http://authentik-server.authentik.svc.cluster.local:80/-/health/live/
            namespace: authentik
            app: authentik
        - AdGuard Home:
            id: adguard-card
            href: https://adguard.jupitertech.net
            description: Network-wide DNS filtering & ad blocking
            icon: adguard-home.png
            siteMonitor: http://adguard-ui.adguard.svc.cluster.local:3000
            namespace: adguard
            app: adguard
        - Kea:
            id: kea-card
            description: DHCP server
            icon: isc-kea.png
            siteMonitor: http://kea-ctrl-agent.kea.svc.cluster.local:8000
            namespace: kea
            app: kea-dhcp4
            podSelector: app=kea-dhcp4
        - Cilium:
            id: cilium-card
            description: CNI, network policy, load balancer IPs — agents + operator
            icon: cilium.png
            namespace: kube-system
            app: cilium
            podSelector: app.kubernetes.io/name in (cilium-agent,cilium-operator)
        - Cilium Gateway:
            id: cilium-gateway-card
            description: The shared Gateway (10.77.20.60) every web UI goes through
            icon: mdi-gate
            # Any Gateway-routed host proves the path; this is Homepage's
            # own, so it fails only if the Gateway (or Envoy) does.
            siteMonitor: https://home.jupitertech.net
            namespace: kube-system
            app: cilium-envoy
            podSelector: app.kubernetes.io/name=cilium-envoy
        - Cloudflare Tunnel:
            id: cloudflared-card
            description: cloudflared — public hostnames in from Cloudflare
            icon: cloudflare.png
            namespace: cloudflared
            app: cloudflared
            podSelector: app=cloudflared
        - CoreDNS:
            id: coredns-card
            description: In-cluster DNS
            icon: coredns.png
            namespace: kube-system
            app: coredns
            podSelector: k8s-app=kube-dns

    # No web UIs here: each tile's badge is the pod status Homepage reads
    # from the Kubernetes API (namespace + podSelector), which needs no
    # network access to the app.
    - Platform Services:
        - Redis:
            id: redis-card
            description: Shared HA Redis + Sentinel (3 pods)
            icon: redis.png
            namespace: redis
            app: redis
            podSelector: app=redis
        - RustFS:
            id: rustfs-card
            description: In-cluster S3 for database backups
            icon: mdi-bucket-outline
            namespace: rustfs
            app: rustfs
            podSelector: app=rustfs
        - CloudNativePG:
            id: cnpg-card
            description: Postgres operator + Barman Cloud backup plugin
            icon: postgresql.png
            namespace: cnpg-system
            app: cloudnative-pg
            podSelector: app.kubernetes.io/name in (cloudnative-pg,plugin-barman-cloud)
        - cert-manager:
            id: cert-manager-card
            description: Wildcard certificate (Cloudflare DNS-01)
            icon: cert-manager.png
            namespace: cert-manager
            app: cert-manager
            podSelector: app.kubernetes.io/instance=cert-manager
        - Loki:
            id: loki-card
            description: Log store (Grafana Explore)
            icon: loki.png
            namespace: logging
            app: loki
            podSelector: app.kubernetes.io/name=loki
        - Alloy:
            id: alloy-card
            description: Log shipper, one per node
            icon: mdi-transit-connection-variant
            namespace: logging
            app: alloy
            podSelector: app.kubernetes.io/name=alloy
        - metrics-server:
            id: metrics-server-card
            description: Pod/node CPU & memory for kubectl top and Homepage
            icon: mdi-gauge
            namespace: kube-system
            app: metrics-server
            podSelector: app.kubernetes.io/name=metrics-server
        - Snapshot Controller:
            id: snapshot-controller-card
            description: Volume snapshots (Longhorn, CNPG)
            icon: mdi-camera-timer
            namespace: kube-system
            app: snapshot-controller
            podSelector: app.kubernetes.io/name=snapshot-controller
        - Node Uncordon:
            id: node-uncordon-card
            description: Uncordons nodes after a reboot, one per node
            icon: mdi-autorenew
            namespace: kube-system
            app: node-uncordon
            podSelector: app=node-uncordon

    # One tile per CloudNativePG cluster (2 instances each) plus the shared
    # Redis above. Pods only: the databases aren't reachable from Homepage.
    - Databases:
        - authentik-db:
            id: authentik-db-card
            description: Authentik
            icon: postgresql.png
            namespace: authentik
            app: authentik-db
            podSelector: cnpg.io/cluster=authentik-db
        - grafana-db:
            id: grafana-db-card
            description: Grafana
            icon: postgresql.png
            namespace: monitoring
            app: grafana-db
            podSelector: cnpg.io/cluster=grafana-db
        - harbor-db:
            id: harbor-db-card
            description: Harbor
            icon: postgresql.png
            namespace: harbor
            app: harbor-db
            podSelector: cnpg.io/cluster=harbor-db
        - kea-db:
            id: kea-db-card
            description: Kea leases
            icon: postgresql.png
            namespace: kea
            app: kea-db
            podSelector: cnpg.io/cluster=kea-db
        - langfuse-db:
            id: langfuse-db-card
            description: Langfuse
            icon: postgresql.png
            namespace: langfuse
            app: langfuse-db
            podSelector: cnpg.io/cluster=langfuse-db
        - matrix-db:
            id: matrix-db-card
            description: Synapse + MAS
            icon: postgresql.png
            namespace: matrix
            app: matrix-db
            podSelector: cnpg.io/cluster=matrix-db
        - nextcloud-db:
            id: nextcloud-db-card
            description: Nextcloud
            icon: postgresql.png
            namespace: nextcloud
            app: nextcloud-db
            podSelector: cnpg.io/cluster=nextcloud-db
        - paperclip-db:
            id: paperclip-db-card
            description: Paperclip
            icon: postgresql.png
            namespace: paperclip
            app: paperclip-db
            podSelector: cnpg.io/cluster=paperclip-db

    # What turns metrics into alerts and gets them to Matrix. Grafana,
    # Prometheus and Alertmanager themselves are under Cluster Management.
    - Monitoring Pipeline:
        - Prometheus Operator:
            id: prometheus-operator-card
            description: Turns ServiceMonitors/rules into Prometheus config
            icon: prometheus.png
            namespace: monitoring
            app: prometheus-operator
            podSelector: app=kube-prometheus-stack-operator
        - Alert Bridge:
            id: alert-bridge-card
            description: Alertmanager → Matrix #alerts rooms
            icon: mdi-bell-ring
            namespace: matrix
            app: alertmanager-receiver
            podSelector: app.kubernetes.io/name=alertmanager-receiver
        - node-exporter:
            id: node-exporter-card
            description: Host metrics, one per node
            icon: mdi-server
            namespace: monitoring
            app: prometheus-node-exporter
            podSelector: app.kubernetes.io/name=prometheus-node-exporter
        - kube-state-metrics:
            id: kube-state-metrics-card
            description: Kubernetes object metrics
            icon: kubernetes.png
            namespace: monitoring
            app: kube-state-metrics
            podSelector: app.kubernetes.io/name=kube-state-metrics
        - Blackbox Exporter:
            id: blackbox-exporter-card
            description: Probes DNS, Kea API, NAS NFS, the Gateway
            icon: mdi-radar
            namespace: monitoring
            app: blackbox-exporter
            podSelector: app=blackbox-exporter
        - MikroTik Exporter:
            id: mikrotik-exporter-card
            description: Router metrics
            icon: mikrotik.png
            namespace: monitoring
            app: mikrotik-exporter
            podSelector: app=mikrotik-exporter
        - UniFi Poller:
            id: unifi-poller-card
            description: UniFi AP & controller metrics
            icon: mdi-access-point-network
            namespace: monitoring
            app: unifi-poller
            podSelector: app=unifi-poller

    - Media:
        - Jellyfin:
            id: jellyfin-card
            href: https://jellyfin.jupitertech.net
            description: Media server
            icon: jellyfin.png
            siteMonitor: http://jellyfin.media.svc.cluster.local:8096
            namespace: media
            app: jellyfin
        - Seerr:
            id: seerr-card
            href: https://seerr.jupitertech.net
            description: Media requests (Jellyseerr/Overseerr successor)
            icon: jellyseerr.png
            siteMonitor: http://seerr.media.svc.cluster.local:5055
            namespace: media
            app: seerr

    # Whole-home audio hub — see ZONED-AUDIO.md.
    - Audio:
        - Home Assistant:
            id: home-assistant-card
            href: https://ha.jupitertech.net
            description: Home automation hub — zones, presence, announcements
            icon: home-assistant.png
            siteMonitor: http://home-assistant.home-assistant.svc.cluster.local:8123
            namespace: home-assistant
            app: home-assistant
            podSelector: app=home-assistant
        - Music Assistant:
            id: music-assistant-card
            href: https://music.jupitertech.net
            description: Multiroom audio — Sendspin zones, AirPlay, library
            icon: music-assistant.png
            # Resolves to talos4's node IP because the pod is hostNetwork
            # (required for AirPlay multicast). The Service still works as
            # a stable name for this probe.
            siteMonitor: http://music-assistant.music-assistant.svc.cluster.local:8095
            namespace: music-assistant
            app: music-assistant
            podSelector: app=music-assistant

    - Media Management:
        - Radarr:
            id: radarr-card
            href: https://radarr.jupitertech.net
            description: Movie automation
            icon: radarr.png
            siteMonitor: http://radarr.media.svc.cluster.local:7878
            namespace: media
            app: radarr
            widget:
              type: radarr
              url: http://radarr.media.svc.cluster.local:7878
              key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        - Sonarr:
            id: sonarr-card
            href: https://sonarr.jupitertech.net
            description: TV show automation
            icon: sonarr.png
            siteMonitor: http://sonarr.media.svc.cluster.local:8989
            namespace: media
            app: sonarr
            widget:
              type: sonarr
              url: http://sonarr.media.svc.cluster.local:8989
              key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        - Prowlarr:
            id: prowlarr-card
            href: https://prowlarr.jupitertech.net
            description: Indexer management
            icon: prowlarr.png
            siteMonitor: http://prowlarr.media.svc.cluster.local:9696
            namespace: media
            app: prowlarr
            widget:
              type: prowlarr
              url: http://prowlarr.media.svc.cluster.local:9696
              key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
        - qBittorrent:
            id: qbittorrent-card
            href: https://qbittorrent.jupitertech.net
            description: Torrent client
            icon: qbittorrent.png
            siteMonitor: http://qbittorrent.media.svc.cluster.local:8080
            namespace: media
            app: qbittorrent
            widget:
              type: qbittorrent
              url: http://qbittorrent.media.svc.cluster.local:8080
              username: "{{HOMEPAGE_VAR_QBIT_USER}}"
              password: "{{HOMEPAGE_VAR_QBIT_PASSWORD}}"
        - NZBGet:
            id: nzbget-card
            href: https://nzbget.jupitertech.net
            description: Usenet download client
            icon: nzbget.png
            siteMonitor: http://nzbget.media.svc.cluster.local:6789
            namespace: media
            app: nzbget
            widget:
              type: nzbget
              url: http://nzbget.media.svc.cluster.local:6789
              username: "{{HOMEPAGE_VAR_NZBGET_USER}}"
              password: "{{HOMEPAGE_VAR_NZBGET_PASSWORD}}"
        - Bazarr:
            id: bazarr-card
            href: https://bazarr.jupitertech.net
            description: Subtitle automation
            icon: bazarr.png
            siteMonitor: http://bazarr.media.svc.cluster.local:6767
            namespace: media
            app: bazarr
            widget:
              type: bazarr
              url: http://bazarr.media.svc.cluster.local:6767
              key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
        - Arr Dashboard:
            id: arrdashboard-card
            href: https://arrdashboard.jupitertech.net
            description: Unified *arr management dashboard
            icon: mdi-view-dashboard-variant
            siteMonitor: http://arr-dashboard.media.svc.cluster.local:3000
            namespace: media
            app: arr-dashboard
        - FlareSolverr:
            id: flaresolverr-card
            description: Solves Cloudflare challenges for Prowlarr — no web UI
            icon: flaresolverr.png
            namespace: media
            app: flaresolverr
            podSelector: app=flaresolverr
        - Unpackerr:
            id: unpackerr-card
            description: Extracts finished downloads for the *arrs — no web UI
            icon: unpackerr.png
            namespace: media
            app: unpackerr
            podSelector: app=unpackerr

    - Files & Chat:
        - Nextcloud:
            id: nextcloud-card
            href: https://cloud.jupitertech.net
            description: Files, sync and share links — LAN only (for now)
            icon: nextcloud.png
            # Through the Gateway (the namespace is default-deny).
            siteMonitor: https://cloud.jupitertech.net/status.php
            namespace: nextcloud
            app: nextcloud
            # The app and its Redis; not the cron Job pods (component=cronjob).
            podSelector: app.kubernetes.io/name in (nextcloud,nextcloud-redis),app.kubernetes.io/component!=cronjob
        - Matrix:
            id: matrix-card
            href: https://chat.jupitertech.net
            description: Element chat, alert rooms and Hermes
            icon: element.png
            siteMonitor: https://matrix.jupitertech.net/_matrix/client/versions
            namespace: matrix
            app: synapse
            podSelector: app.kubernetes.io/name in (synapse-main,matrix-authentication-service,element-web,haproxy)

    - Tools & AI:
        - SearXNG:
            id: searxng-card
            href: https://searxng.jupitertech.net
            description: Privacy-respecting metasearch engine
            icon: searxng.png
            siteMonitor: http://searxng.searxng.svc.cluster.local:8080
            namespace: searxng
            app: searxng
            podSelector: app=searxng
        - Crawl4AI:
            id: crawl4ai-card
            href: https://crawl4ai.jupitertech.net
            description: LLM-friendly web crawler & scraper
            icon: mdi-spider-web
            siteMonitor: http://crawl4ai.crawl4ai.svc.cluster.local:11235
            namespace: crawl4ai
            app: crawl4ai
            podSelector: app=crawl4ai
        - Playwright MCP:
            id: playwright-mcp-card
            # No href — internal only, no public hostname (same as
            # Prometheus/Alertmanager/Argo Workflows above). No
            # widget — it's a pure MCP server, no stats API to poll.
            description: Interactive browser automation (MCP server) — no web UI
            icon: mdi-google-chrome
            # No siteMonitor, deliberately — this server has no route
            # that both (a) closes quickly and (b) returns a status
            # Homepage accepts as "up" (<=403). / and /mcp both demand
            # a properly-formed MCP request and return 400 to a bare
            # HEAD/GET, which Homepage shows as "NOT FOUND" despite
            # the pod being healthy. /sse (legacy SSE transport) was
            # tried next since it returns 200 to a quick spider-style
            # HEAD — but Homepage's own httpMonitor client doesn't
            # short-circuit the way `wget --spider` does: it waits for
            # the response body to close, which an SSE stream never
            # does on its own. Confirmed live — the siteMonitor call
            # hung indefinitely rather than erroring, meaning every
            # 30s poll would leave a connection open on the homepage
            # pod forever. Worse than a wrong badge. Same no-monitor
            # treatment as CloudKey/RouterOS below.
            #
            # The "NOT FOUND" badge itself turned out to be from a
            # SEPARATE mechanism entirely — Homepage's Kubernetes pod
            # lookup, read directly from its own compiled source
            # (api/kubernetes/status/[...service].js): with no
            # explicit podSelector, it defaults to searching for label
            # app.kubernetes.io/name=<app>, not plain app=<app>. This
            # Deployment (like crawl4ai/hermes/research-worker) only
            # carries the plain `app` label, so that search matched
            # zero pods — genuinely, correctly "not found", nothing to
            # do with siteMonitor or HTTP at all. podSelector below
            # fixes the real cause; same pattern already used by
            # Crawl4AI/Hermes/SearXNG/Kea above.
            namespace: playwright-mcp
            app: playwright-mcp
            podSelector: app=playwright-mcp
        - Infra MCP:
            id: infra-mcp-card
            # No href — internal only, no web UI, same as Playwright
            # MCP above. Unlike Playwright MCP, siteMonitor DOES work
            # here: this server is bearer-token-gated, and an
            # unauthenticated request gets a quick 401 from the auth
            # middleware before it ever reaches the MCP transport
            # layer — no SSE-hang risk, confirmed live. 401 is <=403,
            # which Homepage accepts as "up".
            description: Read-only infra visibility for Hermes (MCP server) — no web UI
            icon: mdi-server-security
            siteMonitor: http://infra-mcp.infra-mcp.svc.cluster.local:8000/mcp
            namespace: infra-mcp
            app: infra-mcp
            podSelector: app=infra-mcp
        - Hermes:
            id: hermes-card
            href: https://hermes.jupitertech.net
            description: Self-hosted AI chat
            icon: mdi-robot-happy-outline
            siteMonitor: http://hermes-webui.hermes.svc.cluster.local:8787
            namespace: hermes
            app: hermes
            podSelector: app=hermes
        - Streamystats:
            id: streamystats-card
            href: https://streamystats.jupitertech.net
            description: Jellyfin watch stats & AI recommendations
            icon: mdi-chart-box-outline
            siteMonitor: http://streamystats.streamystats.svc.cluster.local:3000
            namespace: streamystats
            app: streamystats
            podSelector: app=streamystats
        - Langfuse:
            id: langfuse-card
            href: https://langfuse.jupitertech.net
            description: LLM tracing for Hermes
            icon: mdi-chart-timeline-variant
            siteMonitor: https://langfuse.jupitertech.net/api/public/health
            namespace: langfuse
            app: langfuse
            podSelector: app in (web,worker,clickhouse)
        - Paperclip:
            id: paperclip-card
            href: https://paperclip.jupitertech.net
            description: Paperclip — LAN only
            icon: mdi-paperclip
            siteMonitor: https://paperclip.jupitertech.net
            namespace: paperclip
            app: paperclip
            podSelector: app=paperclip
        - Research Worker:
            id: research-worker-card
            description: Sandboxed terminal for Hermes — no web UI
            icon: mdi-console
            namespace: research-worker
            app: research-worker
            podSelector: app=research-worker
        - SearXNG MCP:
            id: searxng-mcp-card
            description: Search tools for Hermes (MCP server) — no web UI
            icon: mdi-magnify
            namespace: searxng
            app: searxng-mcp
            podSelector: app=searxng-mcp


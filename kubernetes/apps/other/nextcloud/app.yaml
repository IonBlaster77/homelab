# Nextcloud: file storage, OneDrive-style folder sync, and share/receive
# links for people without accounts. See README.md.
#
# Single source: the chart is rendered by Kustomize (helmCharts in
# kustomization.yaml) inside the sops-kustomize plugin, as Harbor is, so
# this folder's secrets and manifests ship in the same app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
  annotations:
    # Required with ServerSideApply, or Argo CD shows phantom OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: homelab
  source:
    repoURL: https://github.com/IonBlaster77/homelab.git
    targetRevision: HEAD
    path: kubernetes/apps/other/nextcloud
    plugin:
      name: sops-kustomize-v1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

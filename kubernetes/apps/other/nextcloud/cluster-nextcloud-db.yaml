# Nextcloud's database. No credentials secret is supplied, so CloudNativePG
# generates one (nextcloud-db-app: username, password, host, dbname, ...)
# and Nextcloud reads all four from it (externalDatabase.existingSecret).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-db
  namespace: nextcloud
spec:
  instances: 2
  # Pinned here so Renovate tracks it. Left unset, CNPG writes its default
  # into the live spec at creation and never moves it again: four clusters
  # sat on 18.3 while newer ones got 18.6. Changing it rolls the replica
  # first, then a switchover (primaryUpdateMethod).
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie
  # OOM protection (docs/projects/oom-protection.md), sized 2026-11-07:
  # 30-day peak 137 MiB. Memory request = limit (~2x peak) so the
  # kubelet and the Talos OOM controller leave it alone; a CPU request but
  # no CPU limit (CPU is the scarce resource), so the pod is Burstable.
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      memory: 384Mi
  # Promote the running standby for primary updates (seconds of downtime)
  # instead of restarting the primary pod in place.
  primaryUpdateMethod: switchover
  # Point-in-time recovery: the Barman Cloud plugin archives every WAL segment
  # and stores base backups in RustFS (s3://cnpg/nextcloud-db/, see
  # objectstore-nextcloud-db.yaml). Adding this restarts both pods once.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: nextcloud-db-backup
        serverName: nextcloud-db
  storage:
    # nvme, not ssd: same reasoning as the other databases (kea-db, 2026-08-05).
    storageClass: longhorn-nvme
    # Was 5Gi: the primary filled it with WAL on ~2026-10-30 and CNPG refused
    # to start Postgres ("no free disk space for WALs"), taking Nextcloud down.
    size: 10Gi
  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
      # Nextcloud's installer revokes CONNECT on its database from PUBLIC, which
      # locks out CNPG's metrics user (a pg_monitor member) and silently drops
      # the replication and slot metrics the alerts rely on. A grant to the
      # role itself survives that revoke. Runs only at bootstrap; the live
      # cluster got the same GRANT by hand on 2026-11-04.
      postInitApplicationSQL:
        - GRANT CONNECT ON DATABASE nextcloud TO pg_monitor

# Values for the Nextcloud chart (nextcloud.github.io/helm).
# Reference: https://github.com/nextcloud/helm/blob/main/charts/nextcloud/values.yaml

# PHP-FPM image (tag = chart appVersion + flavor, so it moves with the chart
# version in kustomization.yaml). Nextcloud upgrades must go ONE major
# version at a time: never let a chart bump skip a Nextcloud major.
image:
  flavor: fpm-alpine

# nginx serves static files and passes PHP to FPM on 127.0.0.1:9000. The
# unprivileged image listens on 8080 as uid 101, so the pod can stay PSA
# restricted (the default nginx image binds 80 as root).
nginx:
  enabled: true
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.30.6-alpine
  containerPort: 8080
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

service:
  type: ClusterIP
  port: 8080

nextcloud:
  host: cloud.jupitertech.net
  trustedDomains:
    - cloud.jupitertech.net
  # The Service's targetPort: nginx's port, since nginx is in front.
  containerPort: 8080

  # Break-glass local admin (nextcloud-username / nextcloud-password in
  # secret-nextcloud-admin.sops.yaml). Everyone else signs in through
  # Authentik once user_oidc is set up (README.md).
  existingSecret:
    enabled: true
    secretName: nextcloud-admin
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password

  # Recreate (the chart default): the pod holds ReadWriteOnce volumes.
  # Created this way, so Argo SSA keeps it (see the RWO strategy note in
  # kubernetes/platform/system/harbor/kustomization.yaml for the opposite case).
  strategy:
    type: Recreate

  # www-data in the Alpine image is uid/gid 82. The image's entrypoint
  # supports running as that user directly (it skips its root-only chown
  # steps), and fsGroup makes the Longhorn volumes group-writable for it.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 82
    runAsGroup: 82
    fsGroup: 82
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

  extraEnv:
    # Read by the image's PHP ini. Large single uploads only matter for
    # browser uploads by people without accounts (File drop); the desktop
    # and phone clients upload in chunks.
    - name: PHP_MEMORY_LIMIT
      value: 512M
    - name: PHP_UPLOAD_LIMIT
      value: 16G
    # Read by homelab.config.php (see "Database and cache" below).
    - name: NEXTCLOUD_REDIS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: nextcloud-redis
          key: redis-password

  # Merged into config.php. Settings that live in the database (sharing
  # defaults, background-job mode, apps) are set by the hooks below.
  configs:
    homelab.config.php: |-
      <?php
      $CONFIG = array(
        // Every request arrives from the Gateway's Envoy, which has a pod
        // address. Trusting the pod range makes Nextcloud take the client
        // IP from X-Forwarded-For instead (Envoy appends the address it saw;
        // through the tunnel, cloudflared's pod address is trusted too and
        // skipped). The brute-force protection needs the real IP, or one
        // bad password would throttle everyone at once.
        // Pod addresses come from Cilium's default cluster pool (a /24 per
        // node out of 10.0.0.0/8: talos1-4 have 10.0.8-11.0/24), NOT the
        // 10.244.0.0/16 in the Talos config, which Cilium ignores. /16, not
        // /8: the /8 would include the LAN (10.77.x), letting LAN clients
        // forge X-Forwarded-For.
        'trusted_proxies' => array('10.0.0.0/16'),
        'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
        // Also set here, not just at install (NEXTCLOUD_TRUSTED_DOMAINS),
        // so git stays the source of truth.
        'trusted_domains' => array('cloud.jupitertech.net'),
        // Nextcloud insists on mode 0770 for its data directory. kubelet
        // creates the volume's "data" subPath with the volume root's mode
        // (2775, from fsGroup) and owner root, so uid 82 can't chmod it, and
        // the check makes every request and occ call fail. The only other
        // users who could list it are other processes in this pod.
        'check_data_directory_permissions' => false,
        // Nextcloud refuses outgoing requests to private addresses (SSRF
        // protection), and auth.jupitertech.net resolves to the Gateway VIP
        // 10.77.20.60, so sign-in failed with "Could not reach the OpenID
        // Connect provider" (LocalServerException). The pod's egress policy
        // still limits what "local" it can reach: 10.77.20.0/24 minus the
        // API VIP, plus its own namespace.
        'allow_local_remote_servers' => true,
        // TLS ends at the Gateway; generate https links regardless.
        'overwriteprotocol' => 'https',
        'overwrite.cli.url' => 'https://cloud.jupitertech.net',
        'default_phone_region' => 'AU',
        // Heavy background jobs run in a 4h window from this hour (UTC):
        // 17:00 UTC = 03:30 ACDT / 02:30 ACST, after the 16:30 UTC Longhorn
        // daily backup has started.
        'maintenance_window_start' => 17,
        // Cache and file locking in the in-namespace Redis. Set here, not
        // via the chart's externalRedis (see "Database and cache" below).
        'memcache.distributed' => '\OC\Memcache\Redis',
        'memcache.locking' => '\OC\Memcache\Redis',
        'redis' => array(
          'host' => 'nextcloud-redis',
          'port' => 6379,
          'password' => (string) getenv('NEXTCLOUD_REDIS_PASSWORD'),
        ),
      );

  # PHP-FPM worker pool (the image's default of 5 workers is too few once
  # several clients sync at once).
  phpConfigs:
    zz-homelab.conf: |-
      [www]
      pm = dynamic
      pm.max_children = 20
      pm.start_servers = 4
      pm.min_spare_servers = 2
      pm.max_spare_servers = 6

  hooks:
    # Runs on every start, after install/upgrade, so these can't drift from
    # git, and a first install that stopped part-way still gets them. (A
    # post-installation hook runs only if the install step finished cleanly;
    # the first install here didn't, so that hook never ran.) Every step is
    # idempotent.
    before-starting: |-
      #!/bin/sh
      set -eu
      occ() { php /var/www/html/occ "$@"; }
      if occ status --output=json | grep -q '"installed":true'; then
        # Background jobs come from the CronJob below, not from page loads.
        occ background:cron
        # Sign-in via Authentik (configured by hand once the Authentik app
        # exists, README.md), the NAS "Dump" folder, and TOTP for the
        # break-glass admin. Installed from the app store only if missing,
        # and never fatal: an unreachable app store mustn't stop Nextcloud
        # starting (a failing hook aborts the entrypoint).
        apps=$(occ app:list --output=json)
        for app in user_oidc twofactor_totp; do
          echo "$apps" | grep -q "\"$app\"" || occ app:install "$app" || echo "WARN: could not install $app"
        done
        for app in user_oidc twofactor_totp files_external; do
          occ app:enable "$app" || echo "WARN: could not enable $app"
        done
        # Authentik is the only sign-in (the login page goes straight to it;
        # the break-glass admin uses /login?direct=1). Only once a provider
        # is registered, so a fresh install can't hide the login form
        # before Authentik is set up (README.md).
        if occ user_oidc:provider --output=json | grep -q '"identifier"'; then
          occ config:app:set --value=0 user_oidc allow_multiple_user_backends
        fi
        # Share links get a 30-day expiry by default (changeable per link).
        occ config:app:set core shareapi_default_expire_date --value=yes
        occ config:app:set core shareapi_expire_after_n_days --value=30
      fi

# --- Database and cache --------------------------------------------------------
internalDatabase:
  enabled: false

# CloudNativePG cluster nextcloud-db (cluster-nextcloud-db.yaml); its
# generated nextcloud-db-app secret has every connection detail.
externalDatabase:
  enabled: true
  type: postgresql
  existingSecret:
    enabled: true
    secretName: nextcloud-db-app
    usernameKey: username
    passwordKey: password
    hostKey: host
    databaseKey: dbname

# The in-namespace Redis (deployment-redis.yaml), not the shared Sentinel one,
# is configured in homelab.config.php above, NOT here. externalRedis sets
# REDIS_HOST, and when REDIS_HOST is set the image's entrypoint writes PHP's
# Redis session handler into /usr/local/etc/php/conf.d, which only root can
# write: as uid 82 the container exits ("can't create .../redis-session.ini").
# The cost: PHP sessions stay in files in the pod, so a restart signs browser
# users out (desktop/phone clients use app passwords and don't notice).
externalRedis:
  enabled: false

# --- Storage ---------------------------------------------------------------
# Both volumes are two-replica NVMe: the app volume holds config.php, whose
# instance secrets can't be regenerated, so it gets the same protection as
# the files. Prune/Delete=false: Argo never deletes them, even if this app
# or the chart's PVC templates go away.
persistence:
  enabled: true
  storageClass: longhorn-nvme-double
  accessMode: ReadWriteOnce
  # /var/www/html: Nextcloud's code, config, apps and themes.
  size: 5Gi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  # The files. Grow it here (Longhorn expands online).
  nextcloudData:
    enabled: true
    storageClass: longhorn-nvme-double
    accessMode: ReadWriteOnce
    size: 20Gi
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false

# --- Background jobs -----------------------------------------------------------
# A Kubernetes CronJob running cron.php every 5 minutes (the sidecar option
# needs root). It mounts the same ReadWriteOnce volumes, so it must run on
# the node where the Nextcloud pod is.
cronjob:
  enabled: true
  type: cronjob
  cronjob:
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: nextcloud
                app.kubernetes.io/component: app
            topologyKey: kubernetes.io/hostname
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 1Gi

# --- Probes and resources ----------------------------------------------------
# The first start installs Nextcloud into the database, which takes a few
# minutes; the startup probe holds off liveness until then.
startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 60

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

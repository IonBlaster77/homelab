# ReferenceGrant — allow networking namespace to route to buzz/{buzz,buzz-minio-console}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-networking-to-buzz
  namespace: buzz
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: networking
  to:
    - group: ""
      kind: Service
      name: buzz
    - group: ""
      kind: Service
      name: buzz-minio-console

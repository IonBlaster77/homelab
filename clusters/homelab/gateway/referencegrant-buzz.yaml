# ReferenceGrant — allow networking namespace to route to buzz/{buzz,buzz-minio-console}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-networking-to-buzz
  namespace: buzz
  annotations:
    # Temporary, for the handoff to the buzz app: stops this app pruning
    # the live object when the file moves. Removed once buzz owns it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: networking
  to:
    - group: ""
      kind: Service
      name: buzz
    - group: ""
      kind: Service
      name: buzz-minio-console
    - group: ""
      kind: Service
      name: buzz-pairing

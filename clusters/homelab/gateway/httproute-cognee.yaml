apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cognee
  namespace: networking
  annotations:
    # Temporary, for the handoff to the cognee app: stops this app pruning
    # the live route when the file moves. Removed once cognee owns it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: networking
      sectionName: https
  hostnames:
    - "cognee.jupitertech.net"
  rules:
    - backendRefs:
        - name: cognee-mcp
          namespace: cognee
          port: 8000

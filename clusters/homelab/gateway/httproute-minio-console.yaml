apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console
  namespace: networking
  annotations:
    # Temporary, for the handoff to the buzz app: stops this app pruning
    # the live object when the file moves. Removed once buzz owns it.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: networking
      sectionName: https
  hostnames:
    - "minio.jupitertech.net"
  rules:
    - backendRefs:
        - name: buzz-minio-console
          namespace: buzz
          port: 9090

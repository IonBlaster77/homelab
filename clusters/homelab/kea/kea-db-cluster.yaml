apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kea-db
  namespace: kea
spec:
  instances: 2
  storage:
    # nvme, not ssd: the ssd pool is near its scheduling ceiling cluster-
    # wide (see cnpg-backups migration, 2026-08-05). Existing PVCs stay on
    # ssd until manually rolled - a spec change alone doesn't migrate them.
    storageClass: longhorn-nvme
    size: 5Gi
  bootstrap:
    initdb:
      database: kea
      owner: kea
      secret:
        name: kea-db-credentials
  managed:
    roles:
      - name: grafana_ro
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        comment: "Read-only Grafana datasource user"
        passwordSecret:
          name: kea-db-grafana-credentials
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kea-db
  namespace: kea
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: kea-db
  podMetricsEndpoints:
    - port: metrics

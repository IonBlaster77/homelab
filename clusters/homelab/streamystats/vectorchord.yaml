# VectorChord-enhanced PostgreSQL 17 — stores Streamystats' data AND the
# media embeddings used for recommendations (vector similarity / cosine distance).
#
# Deliberately NOT a CNPG Cluster: CNPG requires images built on its own
# postgres-containers base (barman-cloud, pgaudit, the CNPG entrypoint), and
# tensorchord/vchord-postgres is a plain upstream-postgres image with the
# VectorChord extension layered on. Running it as a normal StatefulSet is what
# upstream ships and avoids fighting the operator.
#
# Version is pinned to the tag upstream's docker-compose pins (pg17-v0.4.1)
# rather than the newest pg17-v1.1.1 — the VectorChord extension API changed
# between them and Streamystats' schema is written against 0.4.x.
apiVersion: v1
kind: Service
metadata:
  name: vectorchord
  namespace: streamystats
spec:
  type: ClusterIP
  selector:
    app: vectorchord
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vectorchord
  namespace: streamystats
  labels:
    app: vectorchord
spec:
  serviceName: vectorchord
  replicas: 1
  selector:
    matchLabels:
      app: vectorchord
  template:
    metadata:
      labels:
        app: vectorchord
        app.kubernetes.io/name: vectorchord
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: tensorchord/vchord-postgres:pg17-v0.4.1
          # args, NOT command: upstream's compose sets `command:`, which in
          # Compose overrides CMD and leaves docker-entrypoint.sh (ENTRYPOINT)
          # in place. In Kubernetes `command:` overrides ENTRYPOINT instead,
          # which skips the entrypoint's root->postgres drop and makes the
          # server refuse to start ("root execution ... is not permitted").
          args: ["postgres", "-c", "log_checkpoints=off"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: streamystats
            - name: POSTGRES_DB
              value: streamystats
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: streamystats-secret
                  key: POSTGRES_PASSWORD
            # Longhorn formats volumes ext4, which leaves a lost+found directory
            # at the mount root. initdb refuses to run in a non-empty directory,
            # so PGDATA must be a subdirectory of the mount, not the mount itself.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_HOST_AUTH_METHOD
              value: scram-sha-256
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
            - name: TZ
              value: Australia/Adelaide
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "streamystats", "-d", "streamystats"]
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "streamystats", "-d", "streamystats"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "streamystats", "-d", "streamystats"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 2Gi
              cpu: 1000m
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-ssd
        resources:
          requests:
            storage: 10Gi

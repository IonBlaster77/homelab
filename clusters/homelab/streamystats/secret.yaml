# Run: sops -e -i clusters/homelab/streamystats/secret.yaml
# Age public key is stored in Bitwarden under "Homelab SOPS Age Key"
#
# Unencrypted structure (reference only — never commit without encryption):
#
# stringData:
#   POSTGRES_PASSWORD: "<openssl rand -hex 24>"
#     Password for the `streamystats` role in the VectorChord StatefulSet.
#   DATABASE_URL: "postgresql://streamystats:<POSTGRES_PASSWORD>@vectorchord:5432/streamystats"
#     Consumed by both the Next.js app and the job server. Must be kept in sync
#     with POSTGRES_PASSWORD above — they are the same credential.
#   SESSION_SECRET: "<openssl rand -hex 32>"
#     Signs Streamystats' user sessions.
#   NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "<openssl rand -base64 32>"
#     Next.js server-action closure encryption. Must stay stable across
#     redeploys; rotating it logs every user out.

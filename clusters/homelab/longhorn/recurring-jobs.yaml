apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: hourly-backup
  namespace: longhorn-system
spec:
  name: hourly-backup
  cron: "0 * * * *"
  task: backup
  groups:
    - default
  retain: 24
  concurrency: 2
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  name: daily-backup
  # 02:00 Adelaide. These crons are evaluated in **UTC**, not local time —
  # confirmed empirically: Backup CRs from cron "0 2 * * *" were stamped
  # 02:0xZ. So the previous "2am" schedule was really running at 11:30am
  # Adelaide, a 23-minute backup sweep in the middle of the working day.
  #
  # Must not share a minute with hourly-backup ("0 * * * *"): both target the
  # same `default` group, and a Longhorn backup takes a per-volume lock in the
  # backupstore that the loser fails on outright ("failed to acquire lock ...
  # please try again later") rather than waiting or retrying. That collision
  # is what produced four LonghornBackupFailed alerts.
  #
  # Adelaide is UTC+9:30, so a local :30 time lands exactly on a UTC hour
  # boundary — i.e. 02:30 Adelaide IS 17:00 UTC, straight into the hourly run.
  # Keeping the UTC minute at :30 (max separation from any hourly) therefore
  # requires the local time to be on the hour. Hence 02:00, not 02:30.
  #
  # Drifts to 03:00 Adelaide over ACDT (UTC+10:30); accepted deliberately
  # rather than chasing daylight saving.
  cron: "30 16 * * *"
  task: backup
  groups:
    - default
  retain: 30
  concurrency: 2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-volume-labeler
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-volume-labeler
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-volume-labeler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-volume-labeler
subjects:
  - kind: ServiceAccount
    name: longhorn-volume-labeler
    namespace: longhorn-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: enable-recurring-jobs
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: longhorn-volume-labeler
      restartPolicy: OnFailure
      containers:
        - name: labeler
          # bitnami/* public Docker Hub tags were sunset (Aug 2025); use the
          # maintained rancher/kubectl image instead. It is FROM scratch — only
          # /bin/kubectl, no shell and no xargs — so the labeler must be a single
          # shell-free `kubectl label --all` call (not a get|xargs pipeline), run
          # directly via the image's /bin/kubectl entrypoint.
          image: rancher/kubectl:v1.31.0
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # rancher/kubectl declares its user by name (USER kubectl), which
            # kubelet can't verify against runAsNonRoot; pin the numeric UID the
            # image assigns that user (useradd -u 1000) so the check passes.
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args:
            - label
            - volumes.longhorn.io
            - --all
            - recurring-job-group.longhorn.io/default=enabled
            - -n
            - longhorn-system
            - --overwrite

apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-custom-css
  namespace: homepage
data:
  custom.css: |
    /* ══════════════════════════════════════════════════════════════
       Jupiter Tech homepage — v2
       Keeps the deep-space background + per-card colour identity,
       but trades the neon-glow/rainbow-group look for calmer, flat
       tints keyed to each service's own id (stable regardless of
       group/tab ordering) plus pill-style tab & widget chrome.
       ═══════════════════════════════════════════════════════════ */

    /* ── Scrollbar ───────────────────────────────────────────────── */
    ::-webkit-scrollbar { display: none; }
    body { -ms-overflow-style: none; scrollbar-width: none; }

    /* ── Background: deep space (unchanged) ─────────────────────── */
    body {
      background:
        radial-gradient(ellipse 80% 50% at 10% 5%,  rgba(140,40,255,0.30) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 90%, rgba(0,100,255,0.25)  0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 50% 40%, rgba(50,0,100,0.50)   0%, transparent 100%),
        #04030a !important;
      min-height: 100vh;
    }

    :root {
      --color-text-primary: rgba(255,255,255,0.97);
    }

    /* ── Master rounded corners ─────────────────────────────────── */
    .service-card,
    .bookmark-card,
    .group-header,
    div[id$="-card"],
    div[id$="-card"] > div,
    div[class*="rounded-lg"] {
      border-radius: 20px !important;
      overflow: hidden !important;
      isolation: isolate !important;
    }

    /* ══════════════════════════════════════════════════════════════
       Per-service colour identity (flat tint, no glow)
       Selectors key off the `id:` field set on each service in
       homepage.yaml, so they survive reordering/regrouping.
       ═══════════════════════════════════════════════════════════ */

    #pgadmin-card, #argocd-card, #grafana-card, #longhorn-card, #hubble-card, #minio-card,
    #authentik-card, #adguard-card, #kea-card,
    #jellyfin-card, #seerr-card,
    #radarr-card, #sonarr-card, #prowlarr-card, #qbittorrent-card, #nzbget-card, #bazarr-card, #arrdashboard-card,
    #searxng-card, #crawl4ai-card, #hermes-card, #streamystats-card, #buzz-card,
    #mikrotik-core-card, #unifi-card, #mikrotik-agg-card, #dell-switch-card, #hp-switch-card, #synology-card {
      position: relative !important;
      background-color: transparent !important;
    }

    #pgadmin-card::before, #argocd-card::before, #grafana-card::before, #longhorn-card::before,
    #hubble-card::before, #minio-card::before,
    #authentik-card::before, #adguard-card::before, #kea-card::before,
    #jellyfin-card::before, #seerr-card::before,
    #radarr-card::before, #sonarr-card::before, #prowlarr-card::before, #qbittorrent-card::before,
    #nzbget-card::before, #bazarr-card::before, #arrdashboard-card::before,
    #searxng-card::before, #crawl4ai-card::before, #hermes-card::before, #streamystats-card::before, #buzz-card::before,
    #mikrotik-core-card::before, #unifi-card::before, #mikrotik-agg-card::before,
    #dell-switch-card::before, #hp-switch-card::before, #synology-card::before {
      content: "";
      position: absolute;
      top: 2px; left: 2px; right: 2px; bottom: 6px;
      z-index: 0;
      border-radius: 18px !important;
      opacity: 0.30;
    }

    /* Cluster Management */
    #pgadmin-card::before   { background-color: #326690 !important; } /* pgAdmin blue      */
    #argocd-card::before    { background-color: #EF7B4D !important; } /* ArgoCD orange     */
    #grafana-card::before   { background-color: #F46800 !important; } /* Grafana orange    */
    #longhorn-card::before  { background-color: #4CB5F5 !important; } /* Longhorn blue     */
    #hubble-card::before    { background-color: #FDBA12 !important; } /* Cilium/Hubble gold*/
    #minio-card::before     { background-color: #C72E49 !important; } /* MinIO red         */

    /* Network & Security */
    #authentik-card::before { background-color: #FD4B2D !important; } /* Authentik orange  */
    #adguard-card::before   { background-color: #68BC71 !important; } /* AdGuard green     */
    #kea-card::before       { background-color: #0073A8 !important; } /* ISC Kea blue      */

    /* Media */
    #jellyfin-card::before  { background-color: #AA5CC3 !important; } /* Jellyfin purple   */
    #seerr-card::before     { background-color: #8B5CF6 !important; } /* Seerr violet      */

    /* Media Management (*arr stack) */
    #radarr-card::before       { background-color: #FFC230 !important; }
    #sonarr-card::before       { background-color: #25C1FF !important; }
    #prowlarr-card::before     { background-color: #ff3d00 !important; }
    #qbittorrent-card::before  { background-color: #39BA5D !important; }
    #nzbget-card::before       { background-color: #F4A93D !important; }
    #bazarr-card::before       { background-color: #6351A4 !important; }
    #arrdashboard-card::before { background-color: #14B8A6 !important; }

    /* Tools & AI */
    #searxng-card::before      { background-color: #3050FF !important; }
    #crawl4ai-card::before     { background-color: #6366F1 !important; }
    #hermes-card::before       { background-color: #06B6D4 !important; }
    #streamystats-card::before { background-color: #F97316 !important; }
    #buzz-card::before         { background-color: #EC4899 !important; }

    /* Network Hardware */
    #mikrotik-core-card::before { background-color: #FFFFFF !important; }
    #unifi-card::before         { background-color: #0559C9 !important; }
    #mikrotik-agg-card::before  { background-color: #FFFFFF !important; }
    #dell-switch-card::before   { background-color: #007DB8 !important; }
    #hp-switch-card::before     { background-color: #0096D6 !important; }
    #synology-card::before      { background-color: #0F5FA6 !important; }

    /* Fallback tint for any future card without an explicit id */
    .service-card:not([id$="-card"]) {
      position: relative;
      background-color: rgba(255,255,255,0.04) !important;
    }

    /* ── Status & ping badge positioning ────────────────────────── */
    .service-card > div { position: relative; z-index: 1; }

    span[class*="status-"],
    div[class*="status-"] {
      position: absolute !important;
      top: 10px !important;
      right: 12px !important;
      z-index: 10 !important;
      border-radius: 8px !important;
      background-color: rgba(255, 255, 255, 0.05) !important;
      padding: 2px 6px !important;
    }

    .service-tags {
      display: flex !important;
      flex-direction: column !important;
      align-items: flex-end !important;
      gap: 4px !important;
      top: 10px !important;
      right: 12px !important;
      position: absolute !important;
      z-index: 20 !important;
    }

    .service-ping .ping-status {
      background-color: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 8px !important;
      padding: 2px 6px !important;
      height: auto !important;
      width: auto !important;
      background-image: none !important;
    }

    .service-ping .ping-status div {
      font-size: 9px !important;
      font-weight: 800 !important;
      text-transform: uppercase !important;
      opacity: 1 !important;
      line-height: 1.2 !important;
    }

    .service-ping .ping-status div[class*="text-emerald"],
    .service-ping .ping-status div[class*="text-rose"],
    .service-ping .ping-status div[class*="text-red"] {
      filter: brightness(1.4) !important;
    }

    /* ── Tab navigation: pill style ──────────────────────────────── */
    #tabs ul {
      width: fit-content !important;
      margin-left: auto !important;
      margin-right: auto !important;
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: wrap !important;
      justify-content: center !important;
      gap: 4px !important;
      border-radius: 50px !important;
      padding: 4px !important;
      background-color: rgba(58, 58, 58, 0.2);
    }

    #tabs ul li { width: auto !important; flex: 0 0 auto !important; }

    #tabs ul li button {
      width: auto !important;
      border-radius: 50px !important;
      padding: 6px 20px !important;
      min-height: unset !important;
      color: #ffffff83 !important;
      background-color: transparent !important;
    }

    #tabs ul li button[aria-selected="true"] {
      color: #6aabbf !important;
      background-color: rgba(78, 59, 122, 0.15) !important;
      font-weight: bold !important;
    }

    @media (max-width: 768px) {
      #tabs ul li button { padding: 5px 10px !important; font-size: 13px !important; }
      #tabs ul { max-width: 100% !important; }
    }

    /* ── Bookmark styling ────────────────────────────────────────── */
    li.bookmark a {
      border-radius: 20px !important;
      background-color: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      box-shadow: none !important;
      overflow: hidden !important;
      margin-bottom: 8px !important;
      transition: all 0.2s ease-in-out !important;
    }

    li.bookmark .bookmark-icon {
      border-radius: 0 !important;
      background-color: rgba(255, 255, 255, 0.03) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.05) !important;
    }

    li.bookmark .bookmark-text { border-radius: 0 !important; }

    .bookmark-name {
      color: #f5f5f583 !important;
      font-weight: 600 !important;
      font-size: 0.85rem !important;
    }

    .bookmark-description {
      color: #94a3b8 !important;
      font-size: 0.7rem !important;
    }

    li.bookmark a:hover {
      background-color: rgba(255, 255, 255, 0.1) !important;
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2) !important;
    }

    /* ── Service card hover ──────────────────────────────────────── */
    #layout-groups > div li {
      transition: filter 0.2s ease, transform 0.2s ease;
    }
    #layout-groups > div li:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    /* ── Group section wrapper ───────────────────────────────────── */
    #layout-groups > div {
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform 0.2s ease;
    }

    #layout-groups > div > button {
      border-radius: 12px !important;
      padding: 11px 16px !important;
      width: 100%;
      font-weight: 800 !important;
      letter-spacing: 0.09em !important;
      text-transform: uppercase !important;
      font-size: 0.78em !important;
      background-color: rgba(255,255,255,0.04) !important;
      border: 1px solid rgba(255,255,255,0.08) !important;
      margin-bottom: 8px;
    }

    /* ── boxedWidgets info bar: capsule pills ───────────────────── */
    @media (min-width: 768px) {
      .widget-container,
      .information-widget-logo,
      [class*="information-widget-glances"] {
        background-color: rgba(58, 58, 58, 0.2) !important;
        border-radius: 50px !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        height: 42px !important;
        display: flex !important;
        align-items: center !important;
        padding: 0 16px !important;
        margin-top: 10px !important;
        box-shadow: none !important;
      }
    }

    @media (max-width: 767px) {
      .widget-container,
      .information-widget-logo,
      [class*="information-widget-glances"] {
        background-color: rgba(58, 58, 58, 0.2) !important;
        border-radius: 20px !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        height: auto !important;
        min-height: 40px !important;
        padding: 8px 12px !important;
        margin: 5px 0 !important;
        width: 100% !important;
      }

      .information-widget-inner,
      [class*="information-widget-glances"] > div {
        flex-wrap: wrap !important;
        justify-content: center !important;
        gap: 8px !important;
      }
    }

    .information-widget-logo img { margin: 0 !important; max-height: 24px !important; }

    .information-widget-resource,
    .widget-inner-text,
    .resource-icon {
      display: flex !important;
      align-items: center !important;
      margin: 0 !important;
    }

    .information-widget-resource { margin-right: 12px !important; }

    /* ── Typography ──────────────────────────────────────────────── */
    .service-group-name, .bookmark-group-name {
      color: #9ca3af !important;
      font-weight: 700 !important;
    }

    .service-name, .service-description {
      color: #f5f5f583 !important;
    }

# blackbox_exporter — active probes for services with no native /metrics
# endpoint (AdGuard's DNS resolution, Kea's control-agent API). Prometheus
# Operator's Probe CRD (below) tells Prometheus to hit this exporter, which
# in turn performs the actual check against the target.
#
# This binary only reads config.yml at startup — no --web.enable-lifecycle,
# no reloader sidecar. Editing `modules:` below requires a manual
# `kubectl rollout restart deployment/blackbox-exporter -n monitoring`
# afterward, or the new/changed module 400s until the pod happens to restart
# some other way.
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: monitoring
data:
  config.yml: |
    modules:
      dns_udp:
        prober: dns
        timeout: 5s
        dns:
          transport_protocol: "udp"
          query_name: "jupitertech.net."
          query_type: "A"
          valid_rcodes:
            - NOERROR
      kea_ctrl_agent:
        prober: http
        timeout: 5s
        http:
          method: POST
          headers:
            Content-Type: application/json
          body: '{"command":"list-commands"}'
          valid_status_codes: [200]
      tcp_connect:
        prober: tcp
        timeout: 5s
      gateway_https:
        prober: http
        timeout: 5s
        http:
          method: GET
          tls_config:
            insecure_skip_verify: true
          headers:
            Host: hermes.jupitertech.net
          valid_status_codes: [200, 301, 302, 401, 403]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
    spec:
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.25.0
          args:
            - --config.file=/config/config.yml
          ports:
            - containerPort: 9115
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app: blackbox-exporter
spec:
  selector:
    app: blackbox-exporter
  ports:
    - port: 9115
      targetPort: 9115
      name: http
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: adguard-dns
  namespace: monitoring
  labels:
    release: monitoring
spec:
  module: dns_udp
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - adguard-dns.adguard.svc.cluster.local:53
      labels:
        target: adguard-dns
  interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: kea-ctrl-agent
  namespace: monitoring
  labels:
    release: monitoring
spec:
  module: kea_ctrl_agent
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - kea-ctrl-agent.kea.svc.cluster.local:8000
      labels:
        target: kea-ctrl-agent
  interval: 30s
---
# TCP connect check against the Synology's NFS port. This is the earliest
# possible signal that media-nfs (see NAS-AND-SWITCH-MAINTENANCE.md) has
# gone unreachable — well before it'd show up as pod errors, and in time to
# scale down consumers before anyone attempts a node reboot into a hang.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: nas-nfs
  namespace: monitoring
  labels:
    release: monitoring
spec:
  module: tcp_connect
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - 10.77.20.20:2049
      labels:
        target: nas-nfs
  interval: 30s
---
# Probes the shared Cilium Gateway the same way cloudflared does: an HTTPS
# request straight to the gateway's ClusterIP with a real Host header. This
# is the origin-reachability check cloudflared itself can't give us — its
# CloudflareTunnelDown alert only fires on zero edge connections, which
# stayed healthy during the 2026-08-09 outage even though every hostname
# behind the gateway was unreachable (cilium-agent/cilium-envoy proxy-port
# drift after a partial restart). hermes.jupitertech.net is just the canary
# Host header; a failure here means the whole gateway is down, not just Hermes.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: cilium-gateway
  namespace: monitoring
  labels:
    release: monitoring
spec:
  module: gateway_https
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://cilium-gateway-homelab-gateway.networking.svc.cluster.local:443/
      labels:
        target: cilium-gateway
  interval: 30s

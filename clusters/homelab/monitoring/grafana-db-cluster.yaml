apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db
  namespace: monitoring
spec:
  instances: 2
  storage:
    # nvme, not ssd - see kea-db-cluster.yaml (2026-08-05) for why.
    storageClass: longhorn-nvme
    size: 5Gi
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
      secret:
        name: grafana-db-credentials
---
# spec.monitoring.enablePodMonitor is deprecated in CNPG — hand-rolled
# PodMonitor per the project's own current recommendation.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: grafana-db
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: grafana-db
  podMetricsEndpoints:
    - port: metrics

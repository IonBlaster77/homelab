apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd-app-health
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: argocd-app-health
      rules:
        - alert: ArgoCDAppDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} has been Degraded for 10m+"
            description: "Short health flaps are normal during rollouts; this has been sustained, not transient."
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} has been OutOfSync for 10m+"
            description: "Either a real drift, or an app with automated sync disabled (argocd/cilium) that has pending changes to sync manually."

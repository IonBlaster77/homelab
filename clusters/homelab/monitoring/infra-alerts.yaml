apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: infra-health
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: cert-expiry
      rules:
        - alert: CertificateExpiringSoon
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 14 days"
            description: "If this is the wildcard cert, a renewal failure here takes down every public *.jupitertech.net hostname — check `kubectl describe certificate` for the stuck challenge."
        - alert: CertificateNotReady
          expr: certmanager_certificate_ready_status{condition="False"} == 1
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} has been NotReady for 1h+"
            description: "Renewal is stuck (e.g. the Cloudflare DNS-01 challenge issue seen before) — sustained NotReady means it's not just mid-renewal."

    - name: cloudflare-tunnel
      rules:
        - alert: CloudflareTunnelDown
          expr: cloudflared_tunnel_ha_connections == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "cloudflared has zero active connections to the Cloudflare edge"
            description: "Every public *.jupitertech.net hostname is unreachable from outside your network while this is firing."

    - name: longhorn-health
      rules:
        - alert: LonghornBackupFailed
          expr: longhorn_backup_state == 4
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn backup for volume {{ $labels.volume }} is in Error state"
            description: "The hourly backup job ran but this backup failed — check `kubectl get backups -n longhorn-system` for details."
        - alert: LonghornVolumeFaulted
          expr: longhorn_volume_robustness == 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} ({{ $labels.pvc }}) is Faulted"
            description: "All replicas for this volume are unavailable — data on this PVC is currently inaccessible."

    - name: cilium-gateway
      rules:
        - alert: CiliumGatewayProbeFailed
          expr: probe_success{target="cilium-gateway"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Cilium Gateway (networking/homelab-gateway) is not responding"
            description: "Every public *.jupitertech.net hostname except auth.jupitertech.net routes through this shared Envoy Gateway — a failure here takes all of them down at once, even though cloudflared's tunnel-to-edge connection (see CloudflareTunnelDown) stays healthy throughout, since this is an origin-reachability failure, not a tunnel one. Known cause: cilium-agent/cilium-envoy proxy-port drift after a partial restart (agent restarted without envoy, or vice versa) — compare `cilium-dbg envoy admin listeners` against the agent's 'Adding new proxy port rules' log line on each node; a mismatch means that node's envoy needs restarting too."

    - name: network-services
      rules:
        - alert: AdGuardDNSProbeFailed
          expr: probe_success{target="adguard-dns"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "AdGuard DNS (10.77.20.53) is not resolving queries"
            description: "This is the DNS resolver for the whole LAN — sustained failure breaks name resolution network-wide."
        - alert: KeaControlAgentProbeFailed
          expr: probe_success{target="kea-ctrl-agent"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Kea DHCP control-agent API is not responding"
            description: "The control-agent (lease/config API) is down. This doesn't necessarily mean DHCP itself (UDP/67) has stopped — kube-prometheus-stack's default pod-health rules cover the kea-dhcp4 pod separately."
        - alert: NASNFSUnreachable
          expr: probe_success{target="nas-nfs"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Synology NAS (10.77.20.20) NFS port is unreachable"
            description: "media-nfs's backing server is down — jellyfin/sonarr/radarr/etc. will hang on any I/O rather than error. See NAS-AND-SWITCH-MAINTENANCE.md: if this was an unplanned outage (not you doing NAS/switch maintenance under the runbook), consider scaling the affected media Deployments to 0 (kubectl scale deploy -n media bazarr jellyfin nzbget qbittorrent radarr sonarr unpackerr --replicas=0) until it's back, since a node reboot while this is firing risks the hard-NFS-hang failure mode documented there."

    - name: unifi
      rules:
        - alert: UnifiPollerDown
          expr: up{job="unifi-poller"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "unifi-poller can't reach or scrape the UniFi controller (10.77.10.10)"
            description: "Either the exporter pod is down or it lost contact with the CloudKey."
        - alert: UnifiCloudKeyUnreachable
          # unpoller keeps serving its last-good snapshot even when the
          # controller itself is unreachable, so `up{job="unifi-poller"}`
          # alone would stay green through a CloudKey outage. This metric
          # reflects the actual last poll result against the controller.
          expr: unpoller_controller_up{source="https://10.77.10.10"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "CloudKey Gen2+ (10.77.10.10) is unreachable"
            description: "unpoller's last poll of the controller failed — the CloudKey itself may be down, not just an individual AP."
        - alert: UnifiAPOffline
          # Verified live against a real offline AP: uptime reports exactly 0
          # for a device the controller can't currently reach; a healthy AP
          # reports its real uptime in seconds (always > 0).
          expr: unpoller_device_uptime_seconds{type="uap"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Access point {{ $labels.name }} is offline"
            description: "The UniFi controller reports zero uptime for this AP, meaning it's currently unreachable/disconnected."

    - name: kernel-memory
      rules:
        # Memory the kernel holds that no counter attributes: not anon, not
        # page cache, not slab, not page tables, kernel stacks, percpu or
        # vmalloc. It is normally a small stable residual - measured across
        # all four nodes on 2026-08-29 it was 0.21-0.38 GiB.
        #
        # talos2 reached 9.1 GiB of this before its 2026-08-29 reboot, while
        # every process's RSS summed to 6.16 GiB against 13.96 GiB used - so
        # most of the node's memory had no owning process at all. Everything
        # ordinary was ruled out (BPF maps, GUP pins, netns/veth, slab,
        # vmalloc, every cgroup, hardware). NodeMemoryHighUtilization only
        # caught it at 90% with ~2 days left; this catches the same leak
        # about 2.5 days in, with two weeks of headroom to act.
        - record: node:memory_unaccounted_bytes
          expr: >-
            node_memory_MemTotal_bytes
            - node_memory_MemFree_bytes
            - node_memory_Buffers_bytes
            - node_memory_Cached_bytes
            - node_memory_AnonPages_bytes
            - node_memory_Slab_bytes
            - node_memory_PageTables_bytes
            - node_memory_KernelStack_bytes
            - node_memory_Percpu_bytes
            - node_memory_VmallocUsed_bytes

        - alert: NodeKernelMemoryUnaccounted
          # ~4x the observed baseline. for:2h so a transient allocation spike
          # during heavy I/O doesn't page anyone.
          expr: node:memory_unaccounted_bytes > 1.5e9
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} holds {{ $value | humanize1024 }}B of unattributable kernel memory"
            description: "Baseline is 0.2-0.4 GiB per node, so this is a leak, not load - it will not be reclaimed under pressure and ends in an OOM on a control-plane node if left. Confirm with `scripts/kpageflags-audit.sh` (watch the flags=0 UNCLASSIFIED line, healthy is under ~1 GiB), and note .11=talos1 .12=talos2 .13=talos3 .14=talos4. A drain plus reboot clears it; to actually identify the call site, attach eBPF to the kmem:mm_page_alloc / kmem:mm_page_free tracepoints and diff outstanding allocations by kernel stack - both tracepoints and /sys/kernel/btf/vmlinux are present, so this needs no reboot."

        - alert: NodeMemoryExhaustionPredicted
          # Backstop for leaks that DO land in ordinary counters, which the
          # unaccounted rule above would miss entirely.
          #
          # The `and` on a plain instant selector is load-bearing twice over,
          # both verified against live data before this was committed:
          #
          #  - After a node-exporter pod restart the previous pod's series is
          #    still inside the [24h] window, so predict_linear alone reports
          #    two results per node and the dead one keeps the pre-restart
          #    trend for a full day. An instant selector goes stale in ~5m, so
          #    the `and` drops it on label match.
          #  - A freshly-started series extrapolates wildly from a handful of
          #    points - talos2's new pod predicted -240 GiB an hour after the
          #    reboot. Requiring the node to actually be under 8 GiB available
          #    means a trend on a near-empty node can't page anyone.
          expr: >-
            predict_linear(node_memory_MemAvailable_bytes[24h], 7 * 86400) < 0
            and node_memory_MemAvailable_bytes < 8e9
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }} is on track to run out of memory within 7 days"
            description: "Extrapolating the last 24h, MemAvailable reaches zero inside a week. This fires while there is still time to schedule a drain rather than discover it at 95%. If NodeKernelMemoryUnaccounted is also firing for this instance it is the known kernel leak; if not, something is growing in a way that IS accounted for, so check `kubectl top pods --sort-by=memory` on that node first."

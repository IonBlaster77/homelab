apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: media
data:
  recyclarr.yml: |
    # Recyclarr configuration
    # api_key values come from recyclarr-secret via !env_var (RADARR_API_KEY /
    # SONARR_API_KEY), sourced from each app's own config.xml — see
    # recyclarr-secret.yaml for details.

    radarr:
      main-radarr:
        base_url: http://radarr:7878
        api_key: !env_var RADARR_API_KEY

        quality_profiles:
          - name: SQP-1 (1080p)
            reset_unmatched_scores:
              enabled: true
            upgrade:
              allowed: true
              until_quality: Bluray-1080p
              until_score: 10000
            min_format_score: 0
            quality_sort: top
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
              - name: HDTV-1080p

        custom_formats:
          - trash_ids:
              # Unwanted
              # EVO (no WEBDL) was removed from the current TRaSH guide (no
              # replacement) — release-group-specific unwanted formats fell out
              # of favor and this one is no longer part of the collection.
              - ed38b889b31be83fda192888e2286d83  # BR-DISK
              - 90a6f9a284dff5103f6346090e6280c8  # LQ
              - b8cd450cbfa689c0259a01d9e29ba3d6  # LQ (Release Title)
            assign_scores_to:
              - name: SQP-1 (1080p)
                score: -10000

          - trash_ids:
              # HDR Formats
              # Standalone "HDR10" was retired in favor of the general "HDR"
              # format, which matches HDR10/HDR10+/HLG/PQ/DV-with-fallback.
              - 493b6d1dbec3c3364c59d7607f7e3405  # HDR
            assign_scores_to:
              - name: SQP-1 (1080p)
                score: 10

          - trash_ids:
              # Standalone "DV" was retired in favor of "DV Boost".
              - b337d6812e06c200ec9a2d3cfa9d20a7  # DV Boost
            assign_scores_to:
              - name: SQP-1 (1080p)
                score: 15

          - trash_ids:
              - 9170d55c319f4fe40da8711ba9d8050d  # x265 (HD)
            assign_scores_to:
              - name: SQP-1 (1080p)
                score: -10

    sonarr:
      main-sonarr:
        base_url: http://sonarr:8989
        api_key: !env_var SONARR_API_KEY

        quality_profiles:
          - name: WEB-1080p
            reset_unmatched_scores:
              enabled: true
            upgrade:
              allowed: true
              until_quality: WEB 1080p
              until_score: 10000
            min_format_score: 0
            quality_sort: top
            qualities:
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
              - name: HDTV-1080p

        custom_formats:
          - trash_ids:
              # Unwanted
              - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
              - 9c11cd3f07101cdba90a2d81cf0e56b4  # x265 (HD)
              - 47435ece6b99a0b477caf360e79ba0bb  # x265 (no HDR/DV)
            assign_scores_to:
              - name: WEB-1080p
                score: -10000

          - trash_ids:
              # Streaming services
              - d660701077794679fd59e8bdf4ce3a29  # AMZN
              - f67c9ca88f463a48346062e8ad07713f  # ATVP
              - 77a7b25585c18af08f60b1547bb9b4fb  # CC
              - 36b72f59f4ea20aad9316f475f2d9fbb  # NF
              - 1656adc6d7bb2c8cca6acfb6592db421  # PCOK
              - c67a75ae4a1715f2bb4d492755ba4195  # PMTP
            assign_scores_to:
              - name: WEB-1080p
                score: 15

          - trash_ids:
              # HDR
              - 418f50b10f1907201b6cfdf881f467b7  # HDR10
            assign_scores_to:
              - name: WEB-1080p
                score: 10
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: media
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          # Recyclarr writes migration/state data into RECYCLARR_CONFIG_DIR, but a
          # ConfigMap volume is always read-only — so recyclarr.yml is copied from
          # the ConfigMap into a writable emptyDir before the real run.
          initContainers:
            - name: copy-config
              image: ghcr.io/recyclarr/recyclarr:8.7.0
              command:
                - sh
                - -c
                - cp /input/recyclarr.yml /config/recyclarr.yml
              volumeMounts:
                - name: config-input
                  mountPath: /input
                - name: config
                  mountPath: /config
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.7.0
              args:
                - sync
              env:
                - name: TZ
                  value: Australia/Adelaide
                - name: RECYCLARR_CONFIG_DIR
                  value: /config
              envFrom:
                - secretRef:
                    name: recyclarr-secret
              volumeMounts:
                - name: config
                  mountPath: /config
          volumes:
            - name: config-input
              configMap:
                name: recyclarr-config
                items:
                  - key: recyclarr.yml
                    path: recyclarr.yml
            - name: config
              emptyDir: {}

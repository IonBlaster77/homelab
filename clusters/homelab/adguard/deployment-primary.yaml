apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-primary
  namespace: adguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguard-primary
  template:
    metadata:
      labels:
        app: adguard-primary
        app.kubernetes.io/name: adguard
    spec:
      # Keep primary and replica on different nodes, and pin primary to
      # talos1 specifically. adguard-dns uses externalTrafficPolicy: Local
      # (needed for real client-IP visibility in query logs), which the
      # Cilium L2 announcement feature doesn't respect correctly (see
      # cilium/cilium#27800) — so this service is reached via NodePort at
      # a known node IP instead of the floating LB VIP. Pinning to a fixed
      # node makes that IP predictable for the router-side DNAT rule.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: adguard
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - talos1
      containers:
        - name: adguard
          image: adguard/adguardhome:v0.107.52
          args:
            - --config
            - /opt/adguardhome/conf/AdGuardHome.yaml
            - --work-dir
            - /opt/adguardhome/work
            - --no-check-update
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /opt/adguardhome/conf
            - name: work
              mountPath: /opt/adguardhome/work
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: adguard-config
        - name: work
          emptyDir: {}

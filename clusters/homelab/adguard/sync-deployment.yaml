apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-sync
  namespace: adguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguard-sync
  template:
    metadata:
      labels:
        app: adguard-sync
    spec:
      containers:
        - name: sync
          # Pinned, and deliberately held one release back. Upstream v0.9.2
          # raised its minimum supported AdGuard Home from v0.107.40 to
          # v0.107.68 (internal/versions: MinAgh); because this tag was
          # floating on :latest it silently rolled onto v0.9.2 and every sync
          # since failed with "Origin AdGuard Home version must be >= v0.107.68"
          # against the v0.107.52 instances. That left the replica stale, so the
          # DNS LoadBalancer answered recently-added rewrites only when the
          # query happened to land on the primary.
          # v0.9.1 still requires only v0.107.40, so it works with v0.107.52.
          # Revisit and move to :v0.9.2-lsNNN when AdGuard Home itself is
          # upgraded to >= v0.107.68.
          image: lscr.io/linuxserver/adguardhome-sync:v0.9.2-ls167
          volumeMounts:
            - name: config
              mountPath: /config/adguardhome-sync.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: adguard-sync-credentials
            items:
              - key: config.yaml
                path: config.yaml

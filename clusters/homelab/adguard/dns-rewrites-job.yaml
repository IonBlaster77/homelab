apiVersion: batch/v1
kind: Job
metadata:
  name: adguard-dns-rewrites
  namespace: adguard
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply-rewrites
          image: curlimages/curl:8.7.1
          env:
            - name: ADGUARD_USER
              valueFrom:
                secretKeyRef:
                  name: adguard-api-credentials
                  key: username
            - name: ADGUARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adguard-api-credentials
                  key: password
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              API="http://adguard-primary:3000"

              add_rewrite() {
                domain=$1
                answer=$2
                LIST=$(curl -sf -u "$ADGUARD_USER:$ADGUARD_PASSWORD" "$API/control/rewrite/list")
                if echo "$LIST" | grep -q "\"domain\":\"$domain\""; then
                  echo "rewrite $domain already exists, skipping"
                else
                  curl -sf -u "$ADGUARD_USER:$ADGUARD_PASSWORD" \
                    -H 'Content-Type: application/json' \
                    -d "{\"domain\":\"$domain\",\"answer\":\"$answer\"}" \
                    "$API/control/rewrite/add"
                  echo "added $domain -> $answer"
                fi
              }

              del_rewrite() {
                domain=$1
                answer=$2
                LIST=$(curl -sf -u "$ADGUARD_USER:$ADGUARD_PASSWORD" "$API/control/rewrite/list")
                if echo "$LIST" | grep -q "\"domain\":\"$domain\""; then
                  curl -sf -u "$ADGUARD_USER:$ADGUARD_PASSWORD" \
                    -H 'Content-Type: application/json' \
                    -d "{\"domain\":\"$domain\",\"answer\":\"$answer\"}" \
                    "$API/control/rewrite/delete"
                  echo "removed $domain -> $answer"
                else
                  echo "rewrite $domain not present, skipping"
                fi
              }

              add_rewrite "nas.jupitertech.net"      "10.77.20.20"
              add_rewrite "argocd.jupitertech.net"   "10.77.20.60"
              add_rewrite "grafana.jupitertech.net"  "10.77.20.60"
              add_rewrite "longhorn.jupitertech.net" "10.77.20.60"
              add_rewrite "adguard.jupitertech.net"  "10.77.20.60"
              add_rewrite "home.jupitertech.net"     "10.77.20.60"
              add_rewrite "auth.jupitertech.net"        "10.77.20.60"
              add_rewrite "pgadmin.jupitertech.net"   "10.77.20.60"
              add_rewrite "radarr.jupitertech.net"    "10.77.20.60"
              add_rewrite "sonarr.jupitertech.net"    "10.77.20.60"
              add_rewrite "prowlarr.jupitertech.net"  "10.77.20.60"
              add_rewrite "qbittorrent.jupitertech.net" "10.77.20.60"
              add_rewrite "jellyfin.jupitertech.net"  "10.77.20.60"
              add_rewrite "seerr.jupitertech.net"     "10.77.20.60"
              add_rewrite "bazarr.jupitertech.net"    "10.77.20.60"
              add_rewrite "nzbget.jupitertech.net"    "10.77.20.60"
              add_rewrite "arrdashboard.jupitertech.net" "10.77.20.60"
              add_rewrite "streamystats.jupitertech.net" "10.77.20.60"
              add_rewrite "hermes.jupitertech.net"   "10.77.20.60"
              add_rewrite "crawl4ai.jupitertech.net" "10.77.20.60"
              add_rewrite "searxng.jupitertech.net"  "10.77.20.60"
              add_rewrite "hubble.jupitertech.net"   "10.77.20.60"
              add_rewrite "buzz.jupitertech.net"     "10.77.20.60"
              add_rewrite "minio.jupitertech.net"    "10.77.20.60"
              # LAN resolution for the two hostnames whose HTTPRoutes are live
              # but which had no rewrite, so they resolved nowhere on the LAN.
              # Public DNS for both is still pending in Cloudflare (tasks #4/#7);
              # these entries are the LAN half only and are independent of it.
              add_rewrite "cognee.jupitertech.net"   "10.77.20.60"
              add_rewrite "relay.jupitertech.net"    "10.77.20.60"
              # Whole-home audio hub (ZONED-AUDIO.md). Both go via the Gateway
              # like everything else. Note Home Assistant ALSO has a direct LAN
              # address on 10.77.20.65 for device callbacks that should not
              # traverse the Gateway, and Music Assistant is reachable directly
              # on talos4 (10.77.20.14:8095) because it runs hostNetwork.
              add_rewrite "ha.jupitertech.net"       "10.77.20.60"
              add_rewrite "music.jupitertech.net"    "10.77.20.60"

              # Retired hostnames. add_rewrite never updates or removes an
              # existing record, so renames leave the old name resolving to
              # the gateway, where it matches no HTTPRoute and returns 404.
              del_rewrite "jellyseerr.jupitertech.net" "10.77.20.60"

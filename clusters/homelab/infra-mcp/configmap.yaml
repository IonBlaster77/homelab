# Entrypoint + server source for infra-mcp. Same "install deps + exec a
# ConfigMap-mounted script at pod start" pattern as playwright-mcp and
# research-worker — no prebuilt image, nothing heavy enough to need one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-mcp-entrypoint
  namespace: infra-mcp
data:
  entrypoint.sh: |
    #!/bin/sh
    set -e
    # Non-root (PSA restricted) means pip can't write into the image's own
    # site-packages — install to $HOME/.local instead, same as research-worker's
    # venv-not-system-site-packages reasoning, just via --user rather than a venv.
    # mcp>=2.0 renamed FastMCP to MCPServer and changed the API (found live:
    # ModuleNotFoundError pointed straight at this) - pin <2 to keep running
    # the v1 API this server is written against, rather than migrate blind.
    pip install --user --no-cache-dir --quiet "mcp<2" kubernetes starlette uvicorn

    # talosctl is a single static binary, no package manager needed - pinned
    # to the same version already running on this cluster (confirmed via
    # `talosctl version --client` this session) rather than "latest", same
    # never-:latest discipline as every image in this repo.
    mkdir -p /home/app/.local/bin
    python3 -c "
    import urllib.request
    urllib.request.urlretrieve(
        'https://github.com/siderolabs/talos/releases/download/v1.12.6/talosctl-linux-amd64',
        '/home/app/.local/bin/talosctl',
    )
    "
    chmod +x /home/app/.local/bin/talosctl

    # hubble CLI, same pinned-static-binary pattern as talosctl.
    python3 -c "
    import tarfile, urllib.request, io
    data = urllib.request.urlopen(
        'https://github.com/cilium/hubble/releases/download/v1.17.3/hubble-linux-amd64.tar.gz'
    ).read()
    tarfile.open(fileobj=io.BytesIO(data)).extract('hubble', '/home/app/.local/bin')
    "
    chmod +x /home/app/.local/bin/hubble

    exec python3 /app/server.py

  server.py: |
    import json
    import logging
    import os
    import subprocess
    import sys
    import time
    import urllib.parse
    import urllib.request

    from kubernetes import client, config as k8s_config
    from kubernetes.client.rest import ApiException
    from mcp.server.fastmcp import FastMCP

    logging.basicConfig(
        stream=sys.stdout,
        level=logging.INFO,
        format='{"ts":"%(asctime)s","level":"%(levelname)s","msg":%(message)s}',
    )
    audit = logging.getLogger("infra-mcp.audit")

    def log_call(tool, args, ok, summary):
        audit.info(json.dumps({"tool": tool, "args": args, "ok": ok, "summary": summary}))

    k8s_config.load_incluster_config()
    core_v1 = client.CoreV1Api()
    apps_v1 = client.AppsV1Api()
    custom_api = client.CustomObjectsApi()

    mcp = FastMCP("infra-mcp")
    # The mcp SDK's DNS-rebinding protection defaults to loopback-only Host
    # headers (127.0.0.1/localhost), which 421s every real in-cluster caller
    # - confirmed live (same class of issue as cognee-mcp's, see
    # feedback_mcp_dns_rebinding_hosts memory). Scope to the exact expected
    # service DNS name rather than disabling the check outright.
    mcp.settings.transport_security.allowed_hosts = [
        "infra-mcp.infra-mcp.svc.cluster.local:8000",
        "infra-mcp.infra-mcp.svc:8000",
    ]
    mcp.settings.transport_security.allowed_origins = ["*"]

    def _api_call(tool_name, args, fn):
        try:
            result = fn()
            log_call(tool_name, args, True, f"{len(result) if isinstance(result, list) else 1} item(s)")
            return json.dumps(result, default=str)
        except ApiException as e:
            log_call(tool_name, args, False, f"ApiException {e.status}")
            return json.dumps({"error": f"Kubernetes API error {e.status}: {e.reason}"})
        except Exception as e:
            log_call(tool_name, args, False, str(e))
            return json.dumps({"error": str(e)})

    @mcp.tool()
    def kubectl_get_pods(namespace: str = "") -> str:
        """List pods and their status/phase. Empty namespace lists across all namespaces."""
        def run():
            items = (core_v1.list_namespaced_pod(namespace) if namespace else core_v1.list_pod_for_all_namespaces()).items
            return [
                {
                    "name": p.metadata.name,
                    "namespace": p.metadata.namespace,
                    "phase": p.status.phase,
                    "ready": sum(1 for c in (p.status.container_statuses or []) if c.ready),
                    "containers": len(p.spec.containers),
                    "restarts": sum(c.restart_count for c in (p.status.container_statuses or [])),
                    "node": p.spec.node_name,
                }
                for p in items
            ]
        return _api_call("kubectl_get_pods", {"namespace": namespace}, run)

    @mcp.tool()
    def kubectl_get_deployments(namespace: str = "") -> str:
        """List deployments and their replica status. Empty namespace lists across all namespaces."""
        def run():
            items = (apps_v1.list_namespaced_deployment(namespace) if namespace else apps_v1.list_deployment_for_all_namespaces()).items
            return [
                {
                    "name": d.metadata.name,
                    "namespace": d.metadata.namespace,
                    "replicas": d.status.replicas or 0,
                    "ready_replicas": d.status.ready_replicas or 0,
                    "available_replicas": d.status.available_replicas or 0,
                }
                for d in items
            ]
        return _api_call("kubectl_get_deployments", {"namespace": namespace}, run)

    @mcp.tool()
    def kubectl_get_events(namespace: str = "", limit: int = 50) -> str:
        """List recent Kubernetes events, most recent first. Empty namespace lists across all namespaces."""
        def run():
            items = (core_v1.list_namespaced_event(namespace) if namespace else core_v1.list_event_for_all_namespaces()).items
            items = sorted(items, key=lambda e: e.last_timestamp or e.event_time or "", reverse=True)[:limit]
            return [
                {
                    "namespace": e.metadata.namespace,
                    "type": e.type,
                    "reason": e.reason,
                    "object": f"{e.involved_object.kind}/{e.involved_object.name}",
                    "message": e.message,
                    "count": e.count,
                    "last_seen": str(e.last_timestamp or e.event_time),
                }
                for e in items
            ]
        return _api_call("kubectl_get_events", {"namespace": namespace, "limit": limit}, run)

    @mcp.tool()
    def kubectl_get_pod_logs(namespace: str, pod_name: str, container: str = "", tail_lines: int = 200) -> str:
        """Read the tail of a pod's logs. container is optional if the pod has only one."""
        def run():
            kwargs = {"tail_lines": tail_lines}
            if container:
                kwargs["container"] = container
            text = core_v1.read_namespaced_pod_log(pod_name, namespace, **kwargs)
            return {"logs": text}
        return _api_call("kubectl_get_pod_logs", {"namespace": namespace, "pod_name": pod_name, "container": container}, run)

    def _custom_list(tool_name, args, group, version, plural, namespace=None):
        def run():
            if namespace:
                resp = custom_api.list_namespaced_custom_object(group, version, namespace, plural)
            else:
                resp = custom_api.list_cluster_custom_object(group, version, plural)
            return resp.get("items", [])
        return _api_call(tool_name, args, run)

    @mcp.tool()
    def kubectl_get_networkpolicies(namespace: str = "") -> str:
        """List CiliumNetworkPolicy objects. Empty namespace lists across all namespaces."""
        return _custom_list("kubectl_get_networkpolicies", {"namespace": namespace}, "cilium.io", "v2", "ciliumnetworkpolicies", namespace or None)

    @mcp.tool()
    def kubectl_get_httproutes(namespace: str = "") -> str:
        """List Gateway API HTTPRoute objects. Empty namespace lists across all namespaces."""
        return _custom_list("kubectl_get_httproutes", {"namespace": namespace}, "gateway.networking.k8s.io", "v1", "httproutes", namespace or None)

    @mcp.tool()
    def argo_list_workflows(namespace: str = "") -> str:
        """List Argo Workflows and their phase/status. Empty namespace lists across all namespaces."""
        return _custom_list("argo_list_workflows", {"namespace": namespace}, "argoproj.io", "v1alpha1", "workflows", namespace or None)

    @mcp.tool()
    def argocd_application_status(namespace: str = "argocd") -> str:
        """Read ArgoCD Application sync/health status directly from the Application CRs."""
        def run():
            resp = custom_api.list_namespaced_custom_object("argoproj.io", "v1alpha1", namespace, "applications")
            return [
                {
                    "name": a["metadata"]["name"],
                    "sync_status": a.get("status", {}).get("sync", {}).get("status"),
                    "health_status": a.get("status", {}).get("health", {}).get("status"),
                }
                for a in resp.get("items", [])
            ]
        return _api_call("argocd_application_status", {"namespace": namespace}, run)

    @mcp.tool()
    def longhorn_volume_status(namespace: str = "longhorn-system") -> str:
        """Read Longhorn volume health/state and robustness."""
        def run():
            resp = custom_api.list_namespaced_custom_object("longhorn.io", "v1beta2", namespace, "volumes")
            return [
                {
                    "name": v["metadata"]["name"],
                    "state": v.get("status", {}).get("state"),
                    "robustness": v.get("status", {}).get("robustness"),
                }
                for v in resp.get("items", [])
            ]
        return _api_call("longhorn_volume_status", {"namespace": namespace}, run)

    @mcp.tool()
    def cnpg_cluster_status(namespace: str = "") -> str:
        """Read CloudNativePG cluster health and instance status. Empty namespace lists across all namespaces."""
        return _custom_list("cnpg_cluster_status", {"namespace": namespace}, "postgresql.cnpg.io", "v1", "clusters", namespace or None)

    @mcp.tool()
    def minio_tenant_status(namespace: str = "") -> str:
        """Read MinIO Tenant health status. Empty namespace lists across all namespaces."""
        return _custom_list("minio_tenant_status", {"namespace": namespace}, "minio.min.io", "v2", "tenants", namespace or None)

    TALOS_NODES = ["10.77.20.11", "10.77.20.12", "10.77.20.13", "10.77.20.14"]
    TALOSCTL = os.path.expanduser("~/.local/bin/talosctl")

    def _talosctl(tool_name, args, cmd_args, nodes):
        def run():
            targets = nodes if nodes else TALOS_NODES
            result = subprocess.run(
                [TALOSCTL, "-n", ",".join(targets)] + cmd_args,
                capture_output=True, text=True, timeout=20,
            )
            if result.returncode != 0:
                return {"error": result.stderr.strip() or result.stdout.strip()}
            return {"output": result.stdout.strip()}
        return _api_call(tool_name, args, run)

    @mcp.tool()
    def talos_version(node: str = "") -> str:
        """Get Talos OS version for one node (IP) or all known nodes if omitted."""
        nodes = [node] if node else []
        return _talosctl("talos_version", {"node": node}, ["version"], nodes)

    @mcp.tool()
    def talos_service_status(service: str = "", node: str = "") -> str:
        """List Talos service status (kubelet, etcd, etc.) for one node or all known nodes. Empty service lists all services."""
        cmd = ["services"]
        if service:
            cmd.append(service)
        nodes = [node] if node else []
        return _talosctl("talos_service_status", {"service": service, "node": node}, cmd, nodes)

    @mcp.tool()
    def talos_members() -> str:
        """List cluster membership as seen by Talos (node names, IPs, roles)."""
        return _talosctl("talos_members", {}, ["get", "members"], [])

    PROMETHEUS_URL = "http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
    LOKI_URL = "http://loki.logging.svc.cluster.local:3100"
    HUBBLE_CLI = os.path.expanduser("~/.local/bin/hubble")

    def _http_get_json(tool_name, args, url):
        def run():
            with urllib.request.urlopen(url, timeout=10) as resp:
                return json.loads(resp.read().decode())
        return _api_call(tool_name, args, run)

    @mcp.tool()
    def prometheus_query(promql: str) -> str:
        """Run an instant PromQL query against Prometheus and return the result."""
        url = f"{PROMETHEUS_URL}/api/v1/query?{urllib.parse.urlencode({'query': promql})}"
        return _http_get_json("prometheus_query", {"promql": promql}, url)

    @mcp.tool()
    def loki_query(logql: str, limit: int = 100) -> str:
        """Run an instant LogQL query against Loki and return matching log lines."""
        url = f"{LOKI_URL}/loki/api/v1/query?{urllib.parse.urlencode({'query': logql, 'limit': limit})}"
        return _http_get_json("loki_query", {"logql": logql, "limit": limit}, url)

    def _hubble(tool_name, args, cmd_args):
        def run():
            env = dict(os.environ)
            env["HUBBLE_SERVER"] = "hubble-relay.kube-system.svc.cluster.local:80"
            result = subprocess.run(
                [HUBBLE_CLI] + cmd_args, capture_output=True, text=True, timeout=15, env=env,
            )
            if result.returncode != 0:
                return {"error": result.stderr.strip() or result.stdout.strip()}
            return {"output": result.stdout.strip()}
        return _api_call(tool_name, args, run)

    @mcp.tool()
    def hubble_observe(namespace: str = "", limit: int = 50) -> str:
        """Observe recent Cilium network flows — what's talking to what, and what got dropped by which policy. Empty namespace covers the whole cluster."""
        cmd = ["observe", "--output", "json", "-n", str(limit)]
        if namespace:
            cmd += ["--namespace", namespace]
        return _hubble("hubble_observe", {"namespace": namespace, "limit": limit}, cmd)

    if __name__ == "__main__":
        import uvicorn
        from starlette.middleware.base import BaseHTTPMiddleware
        from starlette.responses import PlainTextResponse

        # Defense in depth on top of the NetworkPolicy ingress restriction
        # (already scoped to the hermes pod specifically) - same dual-layer
        # pattern as crawl4ai/searxng. MCP_AUTH_TOKEN comes from
        # infra-mcp-secret, mirroring those servers' own bearer tokens.
        AUTH_TOKEN = os.environ.get("MCP_AUTH_TOKEN")

        class BearerAuthMiddleware(BaseHTTPMiddleware):
            async def dispatch(self, request, call_next):
                if AUTH_TOKEN:
                    if request.headers.get("authorization") != f"Bearer {AUTH_TOKEN}":
                        return PlainTextResponse("Unauthorized", status_code=401)
                return await call_next(request)

        app = mcp.streamable_http_app()
        app.add_middleware(BearerAuthMiddleware)
        port = int(os.environ.get("PORT", "8000"))
        uvicorn.run(app, host="0.0.0.0", port=port)

# Run: sops -e -i clusters/homelab/infra-mcp/secret.yaml
# Age public key is stored in Bitwarden under "Homelab SOPS Age Key"
#
# Unencrypted structure (reference only — never commit without encryption):
#
# stringData:
#   MCP_AUTH_TOKEN: "<random, e.g. openssl rand -hex 32 -- bearer token the
#     server checks on every request, defense in depth on top of the
#     NetworkPolicy ingress restriction already scoping this to the hermes
#     pod. Same value must be duplicated into clusters/homelab/hermes/secret.yaml
#     as INFRA_MCP_AUTH_TOKEN so Hermes can send it as a Bearer header —
#     SOPS secrets aren't shareable cross-namespace, same pattern as
#     CRAWL4AI_AUTH_TOKEN/SEARXNG_MCP_AUTH_TOKEN.>

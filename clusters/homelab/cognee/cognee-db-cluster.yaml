# CNPG cluster for Cognee's central memory store — all-in-one Postgres+pgvector
# (graph, vectors, sessions, and metadata all live here; no separate graph DB).
# pgvector via CNPG 1.29 Image Volume Extensions — the extension binary is
# mounted from a separate image, not baked into the base Postgres image, so
# this stays on the same ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie
# base as every other cluster in this repo.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cognee-db
  namespace: cognee
spec:
  instances: 2
  storage:
    # nvme, not ssd - see kea-db-cluster.yaml (2026-08-05) for why.
    storageClass: longhorn-nvme
    size: 5Gi
  postgresql:
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.1-18-trixie
  bootstrap:
    initdb:
      database: cognee
      owner: cognee
      secret:
        name: cognee-db-credentials
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  managed:
    roles:
      # Cognee's postgres-backed graph store creates a separate database
      # per dataset (named by UUID) rather than using tables within one
      # database - confirmed via the actual failure: "permission denied
      # to create database" on CREATE DATABASE "<uuid>". The bootstrap
      # initdb owner doesn't get CREATEDB by default.
      - name: cognee
        ensure: present
        createdb: true
        login: true
        # Cognee also runs `CREATE EXTENSION IF NOT EXISTS vector` inside
        # each dynamically-created per-dataset database, which needs
        # superuser regardless of database ownership - confirmed via the
        # actual failure ("Must be superuser to create this extension").
        # Proportionate here since this cluster is dedicated solely to
        # Cognee - cognee is the only role, on the only tenant, of this
        # entire CNPG cluster.
        superuser: true
        # Explicit here (matching kea-db-cluster.yaml's role entries) even
        # though these match CNPG's own webhook defaults - spec.managed.roles
        # is an atomic list, so ArgoCD's SSA dry-run comparison doesn't see
        # webhook-injected defaults the same way the real live object does,
        # causing a persistent phantom OutOfSync with no visible diff.
        inherit: true
        connectionLimit: -1
  # CNPG-native backup (task #13) - continuous WAL archiving + scheduled
  # base backups to the in-cluster MinIO tenant (buzz-minio, shared cluster
  # object storage - see cnpg-backup-minio-provision.yaml in buzz/ for the
  # dedicated bucket/user). Gives true point-in-time recovery, not just
  # snapshot-granularity restore, and is fast (cluster-local, no NFS) for
  # the common "cluster's fine, I broke something" case. Longhorn's own
  # hourly/daily block-level backup to the NAS (recurring-jobs.yaml)
  # continues unchanged as the off-cluster durability layer underneath this.
  backup:
    # 7d, not 30d: base backups here are full copies each time (no
    # incremental/differential chaining configured), and buzz-minio's pool
    # is only ~20Gi total. 30d retention would be ~18-19Gi for buzz-db
    # alone within a month, enough to crowd out cognee-db's backups and
    # Buzz's own media bucket. Longhorn's NAS backup (recurring-jobs.yaml)
    # already covers 30-day off-cluster retention - this MinIO copy is for
    # fast recent-history restores, not long-term archival.
    retentionPolicy: 7d
    barmanObjectStore:
      destinationPath: s3://cognee-db-backups
      endpointURL: http://minio.cnpg-backups.svc.cluster.local
      s3Credentials:
        accessKeyId:
          name: cognee-db-backup-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cognee-db-backup-s3-credentials
          key: SECRET_ACCESS_KEY
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cognee-db-backup
  namespace: cognee
spec:
  schedule: "0 0 4 * * *" # 4am daily base backup - WAL archiving is continuous regardless
  backupOwnerReference: self
  method: barmanObjectStore
  cluster:
    name: cognee-db
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cognee-db
  namespace: cognee
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: cognee-db
  podMetricsEndpoints:
    - port: metrics

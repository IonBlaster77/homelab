# Dedicated Ollama instance for Cognee - separate from streamystats' ollama
# (which only serves small embeddings) so a heavy LLM workload here can't
# starve or be starved by that unrelated pipeline. Serves both the
# memory-extraction LLM and embeddings for Cognee, self-contained.
#
# Model: qwen2.5:7b-instruct-q4_K_M - switched from gemma4:26b (2026-08-05),
# which crashed loading a CLIP component and, before that, was too slow to
# pull reliably (cluster egress kept getting throttled mid-download). qwen2.5
# handles structured-output/JSON entity extraction cleanly and pulls in
# minutes instead of hours. Embeddings come from Streamystats' shared Ollama,
# not this instance.
#
# Node: talos4 is the only dedicated worker (talos1-3 are control-plane) -
# pinning heavy application workloads off the control-plane nodes, same
# philosophy as the CPU/memory-headroom pinning already done for hermes.
#
# Model pulling is a one-off `ollama pull` against this Deployment's Service,
# run manually (not via postStart - kubelet kills a postStart hook that runs
# too long, ~20min observed, which a multi-GB pull always exceeds - and not
# via a standing Job, since Job pod specs are immutable and a completed pull
# has nothing left to reconcile). The model persists on the PVC below.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cognee-ollama-models
  namespace: cognee
spec:
  accessModes:
    - ReadWriteOnce
  # nvme, not ssd: all 3 replicas landed on the same node (talos4) with
  # only 1/3 actually running - the ssd pool's capacity pressure (see
  # database migrations, 2026-08-05) blocked Longhorn from scheduling
  # replicas onto other nodes at all. nvme has ample headroom everywhere.
  storageClassName: longhorn-nvme
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cognee-ollama
  namespace: cognee
spec:
  type: ClusterIP
  selector:
    app: cognee-ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognee-ollama
  namespace: cognee
  labels:
    app: cognee-ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cognee-ollama
  template:
    metadata:
      labels:
        app: cognee-ollama
        app.kubernetes.io/name: cognee-ollama
    spec:
      # Ollama's registry resolves AAAA records, but this cluster only has
      # IPv4 masquerading enabled (cilium status: "Masquerading: IPv6
      # Disabled") - Go's dialer tried the IPv6 address first, got no
      # response since there's no egress path for it, and hung indefinitely
      # instead of falling back to the working IPv4 address. Tried disabling
      # IPv6 via a pod securityContext sysctl first - rejected outright by
      # this namespace's baseline PodSecurity level (forbidden sysctls), not
      # just slow. hostAliases stays within baseline and pins the one
      # hostname that was actually observed hanging (manifest pull); if a
      # blob-download stage hits a different Cloudflare-fronted hostname
      # later, it'll need its own entry the same way.
      hostAliases:
        - ip: "104.18.17.170"
          hostnames:
            - registry.ollama.ai
      # required, not preferred: as `preferred` this scheduled onto talos1 (a
      # control-plane node) and sat there, pushing it to 93% memory requests /
      # 133% limits alongside etcd and the apiserver, while the dedicated
      # worker talos4 idled at 12% - the exact inversion of the intent stated
      # above. A soft preference silently loses to whatever the scheduler
      # scored higher at admission time and never re-evaluates afterwards.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["talos4"]
      containers:
        - name: ollama
          image: ollama/ollama:0.32.5
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            # Keep the LLM resident - reloading from disk between calls adds
            # real latency on top of already-slow CPU inference. Only one
            # model lives here; embeddings come from Streamystats' Ollama.
            - name: OLLAMA_KEEP_ALIVE
              value: 4h
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: TZ
              value: Australia/Adelaide
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          startupProbe:
            tcpSocket:
              port: 11434
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # Sized for qwen2.5:7b-instruct-q4_K_M, the only model on this
            # instance: 4.7GB of weights + KV cache + runtime overhead, so a
            # ~7GB working set. The previous 19Gi/23Gi was carried over from
            # gemma4:26b (16.75GiB weights) and never revisited when that was
            # abandoned on 2026-08-05 - it was reserving 19Gi to serve a
            # process observed using 25Mi at idle.
            requests:
              memory: 7Gi
              cpu: 1000m
            limits:
              memory: 12Gi
              cpu: 4000m
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: cognee-ollama-models

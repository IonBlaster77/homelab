# Dedicated Ollama instance for Cognee - separate from streamystats' ollama
# (which only serves small embeddings) so a heavy LLM workload here can't
# starve or be starved by that unrelated pipeline. Serves both the
# memory-extraction LLM and embeddings for Cognee, self-contained.
#
# Model: gemma4:26b - chosen for quality over speed (async/queued extraction,
# so CPU-only throughput of ~0.5-2 tok/s is acceptable) and strong clean-JSON
# structured-output behavior, which is what memory extraction needs most.
#
# Node: talos4 is the only dedicated worker (talos1-3 are control-plane) -
# pinning heavy application workloads off the control-plane nodes, same
# philosophy as the CPU/memory-headroom pinning already done for hermes.
#
# Model pulling is NOT done here (no postStart hook) - kubelet kills a
# postStart hook that runs too long (~20min observed), which an 18GB pull
# always exceeds, causing an infinite ContainerCreating/kill/restart loop
# that can never finish regardless of network speed. See
# cognee-ollama-pull-models.yaml (a plain Job, no hook-tied deadline) for
# the actual model pull, run once against this Deployment's Service.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cognee-ollama-models
  namespace: cognee
spec:
  accessModes:
    - ReadWriteOnce
  # nvme, not ssd: all 3 replicas landed on the same node (talos4) with
  # only 1/3 actually running - the ssd pool's capacity pressure (see
  # database migrations, 2026-08-05) blocked Longhorn from scheduling
  # replicas onto other nodes at all. nvme has ample headroom everywhere.
  storageClassName: longhorn-nvme
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cognee-ollama
  namespace: cognee
spec:
  type: ClusterIP
  selector:
    app: cognee-ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognee-ollama
  namespace: cognee
  labels:
    app: cognee-ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cognee-ollama
  template:
    metadata:
      labels:
        app: cognee-ollama
        app.kubernetes.io/name: cognee-ollama
    spec:
      # Ollama's registry resolves AAAA records, but this cluster only has
      # IPv4 masquerading enabled (cilium status: "Masquerading: IPv6
      # Disabled") - Go's dialer tried the IPv6 address first, got no
      # response since there's no egress path for it, and hung indefinitely
      # instead of falling back to the working IPv4 address. Tried disabling
      # IPv6 via a pod securityContext sysctl first - rejected outright by
      # this namespace's baseline PodSecurity level (forbidden sysctls), not
      # just slow. hostAliases stays within baseline and pins the one
      # hostname that was actually observed hanging (manifest pull); if a
      # blob-download stage hits a different Cloudflare-fronted hostname
      # later, it'll need its own entry the same way.
      hostAliases:
        - ip: "104.18.17.170"
          hostnames:
            - registry.ollama.ai
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["talos4"]
      containers:
        - name: ollama
          image: ollama/ollama:0.32.5
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            # Keep both the LLM and embedding model resident - reloading an
            # 18GB model from disk between calls would add real latency on
            # top of already-slow CPU inference.
            - name: OLLAMA_KEEP_ALIVE
              value: 4h
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            - name: TZ
              value: Australia/Adelaide
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          startupProbe:
            tcpSocket:
              port: 11434
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: 19Gi
              cpu: 1000m
            limits:
              memory: 20Gi
              cpu: 4000m
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: cognee-ollama-models

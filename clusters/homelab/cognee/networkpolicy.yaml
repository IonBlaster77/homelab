---
# Gateway (public route, cognee.jupitertech.net) -> cognee-mcp, port 8000.
# Gateway-routed traffic arrives under Cilium's reserved:ingress identity,
# not the client pod's own identity - fromEntities: ingress is required
# here, not a namespace-based fromEndpoints selector (see
# feedback_cilium_gateway_ingress_entity in memory - this exact gotcha has
# bitten this cluster before, e.g. buzz-allow-ingress-from-gateway).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-ingress-from-gateway
  namespace: cognee
spec:
  endpointSelector:
    matchLabels:
      app: cognee-mcp
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# Hermes -> cognee-mcp, port 8000. The in-cluster memory integration path
# (task #23) - independent of the public Gateway route above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-mcp-ingress-from-hermes
  namespace: cognee
spec:
  endpointSelector:
    matchLabels:
      app: cognee-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: hermes
            app: hermes
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# cognee-db -> the dedicated cnpg-backups-minio tenant (CNPG Barman Cloud
# WAL archiving + base backups, task #13). Cross-namespace - a dedicated
# tenant, not shared with Buzz's own media storage, scoped to its own
# bucket/user (cognee-db-backups) - see clusters/homelab/cnpg-backups/.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-db-egress-to-minio
  namespace: cognee
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: cognee-db
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-backups
            v1.min.io/tenant: cnpg-backups-minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# cognee-mcp -> Streamystats' Ollama, for embeddings only (nomic-embed-text
# is already pulled there - shared instance instead of duplicating the
# download into cognee-ollama, which only needs gemma4:26b now).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-mcp-egress-to-streamystats-ollama
  namespace: cognee
spec:
  endpointSelector:
    matchLabels:
      app: cognee-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: streamystats
            app: ollama
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
---
# cognee-mcp needs to download the HuggingFace tokenizer config once
# (config.json/tokenizer files for token-counting during chunking, see
# HUGGINGFACE_TOKENIZER in cognee-mcp.yaml) - caches locally after the
# first successful pull. Same scoped-to-this-app pattern as
# cognee-allow-ollama-egress-to-internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-mcp-egress-to-internet
  namespace: cognee
spec:
  endpointSelector:
    matchLabels:
      app: cognee-mcp
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Default deny all ingress and egress for the cognee namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-default-deny
  namespace: cognee
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# CNPG operator polls each instance's status API to report Cluster health.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-ingress-from-cnpg-operator
  namespace: cognee
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: cognee-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# Prometheus scraping CNPG's built-in Postgres exporter (port 9187). Added
# upfront this time - buzz-db went without this for its first two days and
# fired BuzzRelayDown/TargetDown continuously as a result.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-ingress-from-monitoring-to-db
  namespace: cognee
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: cognee-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-dns
  namespace: cognee
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-egress-to-apiserver
  namespace: cognee
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
---
# cognee-ollama needs to reach the internet to pull models from Ollama's
# registry (registry.ollama.ai). Scoped to just the ollama pod, not
# namespace-wide - default-deny silently drops (not rejects) blocked
# egress, which is why `ollama pull` just hung at "pulling manifest"
# instead of failing fast.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-ollama-egress-to-internet
  namespace: cognee
spec:
  endpointSelector:
    matchLabels:
      app: cognee-ollama
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
---
# The model-pull Job's ollama CLI talks to the running server's API, not
# the internet directly - the server does the actual download using the
# egress rule above. Job pod needs egress to the server; server needs
# ingress from the Job pod. Both halves required, same as every other
# pod-to-pod rule in this namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-ollama-puller-egress
  namespace: cognee
spec:
  endpointSelector:
    matchLabels:
      app: cognee-ollama-puller
  egress:
    - toEndpoints:
        - matchLabels:
            app: cognee-ollama
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-ingress-from-puller
  namespace: cognee
spec:
  endpointSelector:
    matchLabels:
      app: cognee-ollama
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: cognee-ollama-puller
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
---
# CNPG-to-CNPG replication traffic (primary <-> replica).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-db-to-db
  namespace: cognee
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: cognee-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: cognee-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: cognee-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# cognee-mcp -> cognee-db.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-mcp-egress-to-db
  namespace: cognee
spec:
  endpointSelector:
    matchLabels:
      app: cognee-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: cognee-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-db-ingress-from-mcp
  namespace: cognee
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: cognee-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: cognee-mcp
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# cognee-mcp -> cognee-ollama, same pattern as the puller Job.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-mcp-egress-to-ollama
  namespace: cognee
spec:
  endpointSelector:
    matchLabels:
      app: cognee-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            app: cognee-ollama
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cognee-allow-ollama-ingress-from-mcp
  namespace: cognee
spec:
  endpointSelector:
    matchLabels:
      app: cognee-ollama
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: cognee-mcp
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP

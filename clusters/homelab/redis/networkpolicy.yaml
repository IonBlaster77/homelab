---
# Default deny all ingress and egress for the redis namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-default-deny
  namespace: redis
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# DNS resolution.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-allow-dns
  namespace: redis
spec:
  endpointSelector:
    matchLabels:
      app: redis
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# Prometheus scraping the redis_exporter sidecar.
#
# No client app is admitted on 6379 right now (Buzz, the only one, was
# decommissioned 2026-10-14). To let an app use this Redis, add a policy
# like the old redis-allow-ingress-from-buzz (in git history): ingress
# fromEndpoints its namespace (+ app label), toPorts 6379/TCP.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-allow-ingress-from-monitoring
  namespace: redis
spec:
  endpointSelector:
    matchLabels:
      app: redis
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9121"
              protocol: TCP

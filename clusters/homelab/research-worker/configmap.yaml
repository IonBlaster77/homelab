# Entrypoint script for the research-worker container. Kept as its own
# ConfigMap (mounted and exec'd, rather than inlined into deployment.yaml's
# command) purely to keep that manifest's diff readable — this does the
# actual package install + sshd setup for the sandbox described there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: research-worker-entrypoint
  namespace: research-worker
data:
  entrypoint.sh: |
    #!/bin/sh
    set -e

    # Persistent apk cache: a symlink at /etc/apk/cache is apk's own
    # documented mechanism for this. Caches downloaded .apk files across
    # restarts (faster re-installs) WITHOUT keeping anything installed —
    # the installed-package state itself stays ephemeral on purpose, so a
    # restart still wipes any OS-level tool that isn't in the list below.
    mkdir -p /workspace/apk-cache
    ln -sfn /workspace/apk-cache /etc/apk/cache

    apk update
    apk add openssh-server curl wget jq git ripgrep fd unzip p7zip file poppler-utils qpdf tesseract-ocr imagemagick nodejs npm python3 py3-pip exiftool

    mkdir -p /workspace/ssh_host_keys /root/.ssh /var/empty/sshd
    chmod 700 /root/.ssh

    for t in ed25519 rsa ecdsa; do
      f="/workspace/ssh_host_keys/ssh_host_${t}_key"
      [ -f "$f" ] || ssh-keygen -q -N '' -t "$t" -f "$f"
    done

    cp /run/secrets/authorized_keys /root/.ssh/authorized_keys
    chmod 600 /root/.ssh/authorized_keys

    cat > /etc/ssh/sshd_config <<SSHDEOF
    Port 22
    ListenAddress 0.0.0.0
    HostKey /workspace/ssh_host_keys/ssh_host_ed25519_key
    HostKey /workspace/ssh_host_keys/ssh_host_rsa_key
    HostKey /workspace/ssh_host_keys/ssh_host_ecdsa_key
    PermitRootLogin prohibit-password
    PasswordAuthentication no
    PubkeyAuthentication yes
    AuthorizedKeysFile /root/.ssh/authorized_keys
    SetEnv PATH=/opt/venv/bin:/opt/npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    SSHDEOF

    # Persist the venv + npm global prefix on /workspace, unlike the apk
    # state above — these are self-contained directories with no
    # system-wide side effects (unlike apk's installed files, which spread
    # across /usr /etc /lib), so there's no meaningful new exposure from
    # keeping them around: whatever's installed came from the same public
    # registries either way, restart or no restart. Skip reinstalling the
    # baseline if a previous run already set it up.
    mkdir -p /workspace/venv /workspace/npm-global
    rm -rf /opt/venv /opt/npm-global
    ln -s /workspace/venv /opt/venv
    ln -s /workspace/npm-global /opt/npm-global

    # python -m venv refuses to create at a path that's already a symlink
    # ("Unable to create directory") even when it resolves to a valid empty
    # dir — create at the real path instead; /opt/venv still works fine for
    # reading through the symlink afterward.
    if [ ! -x /workspace/venv/bin/pip ]; then
      python3 -m venv /workspace/venv
      /workspace/venv/bin/pip install --no-cache-dir requests beautifulsoup4 lxml pandas pillow openpyxl pdfplumber pytesseract
    fi

    npm config set prefix /opt/npm-global

    exec /usr/sbin/sshd -D -e

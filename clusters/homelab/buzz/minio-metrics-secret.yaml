# JWT scoped only for reading /minio/v2/metrics/cluster, not full admin
# access. Referenced by the PodMonitor in minio-tenant.yaml as bearerTokenSecret.
#
# Regenerated 2026-08-04: the original token (from the first deploy) was
# returning 403 Forbidden on every scrape - never actually worked past
# whatever state it was minted in. Confirmed root cause via Prometheus's
# own target diagnostics (lastError: "server returned HTTP status 403
# Forbidden"), not a NetworkPolicy gap this time - that's already allowed
# via buzz-allow-ingress-from-monitoring-to-minio. Regenerated end-to-end
# inside the cluster (mc admin prometheus generate -> sops --encrypt, both
# as Job initContainers) so the plaintext token never left the pod.

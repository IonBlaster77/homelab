---
# Default deny all ingress and egress for the buzz namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-default-deny
  namespace: buzz
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# Namespace-wide: both the MinIO Tenant's operator-sidecar init container
# ("validate-arguments") and CNPG's own bootstrap/instance-manager pods
# call the Kubernetes API directly (to check the Tenant CR / Cluster CR,
# report status, etc.) — hit this as two separate failures (MinIO's init
# container timing out, then CNPG's initdb job doing the same) before
# realizing both operators need it. toEntities: kube-apiserver is Cilium's
# reserved identity for the API server, robust regardless of ClusterIP/
# KubePrism.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-egress-to-apiserver
  namespace: buzz
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-dns
  namespace: buzz
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# The CNPG operator (cnpg-system namespace) polls each instance's status
# API to report Cluster health — without this it can't tell if buzz-db is
# actually up ("Instance Status Extraction Error: HTTP communication
# issue" even though the pod itself is Running).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-ingress-from-cnpg-operator
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: buzz-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
# Relay -> Postgres (CNPG, same namespace).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-egress-to-db
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: buzz
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: buzz-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# Ingress half of relay -> Postgres. Default-deny is per-pod on both
# directions, so the egress rule above (on the relay) isn't enough by
# itself — buzz-db-1 also needs an explicit allow for incoming connections
# from the relay. Missed this the first time (only realized when a debug
# pod with the relay's label still timed out connecting to buzz-db-rw).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-ingress-to-db
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: buzz-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: buzz
        # Replica-join / streaming replication: buzz-db pods connect to
        # each other (primary <-> replica), not just the relay. Missed this
        # too — the replica-join Job kept retrying/timing out against
        # buzz-db-rw even after the relay itself connected fine, because it
        # carries cnpg.io/cluster labels, not app.kubernetes.io/name: buzz.
        - matchLabels:
            cnpg.io/cluster: buzz-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# Egress half of CNPG-to-CNPG replication traffic (the replica connects
# out to the primary as a client).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-egress-db-to-db
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: buzz-db
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: buzz-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
# Relay -> Redis (cross-namespace; the redis app's own policy grants the
# matching ingress half of this).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-egress-to-redis
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: buzz
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: redis
            app: redis
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# The MinIO Operator itself (minio-operator namespace) polls each Tenant's
# health endpoint (GET /minio/health/cluster) — same class of gap as the
# CNPG operator's status-port check above. Without this the Tenant sits at
# availableReplicas: 0 / "Waiting for Tenant to be healthy" forever even
# though the pod itself is 2/2 Running.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-ingress-from-minio-operator
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      v1.min.io/tenant: buzz-minio
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: minio-operator
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# Prometheus scraping buzz-db's CNPG-built-in Postgres exporter (port 9187).
# Missing since Buzz was first deployed - the exporter itself was always up,
# but default-deny silently dropped every scrape, firing BuzzRelayDown/
# TargetDown continuously. Same class of gap as the CNPG operator status-port
# and MinIO metrics rules above - a new scrape target needs its own explicit
# ingress rule, the PodMonitor existing isn't enough by itself.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-ingress-from-monitoring-to-db
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: buzz-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
---
# Prometheus scraping MinIO's cluster metrics (same S3 port, 9000 — MinIO
# doesn't run a separate metrics port).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-ingress-from-monitoring-to-minio
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      v1.min.io/tenant: buzz-minio
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# Relay -> MinIO (S3, same namespace).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-egress-to-minio
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: buzz
  egress:
    - toEndpoints:
        - matchLabels:
            v1.min.io/tenant: buzz-minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# Ingress half of relay -> MinIO, same reason as the Postgres one above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-ingress-to-minio
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      v1.min.io/tenant: buzz-minio
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: buzz
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# buzz-db -> the dedicated cnpg-backups-minio tenant (CNPG Barman Cloud WAL
# archiving + base backups, task #13). Cross-namespace - moved off
# buzz-minio to a dedicated tenant so backup storage doesn't share a pool
# with Buzz's actual media uploads. Separate from the relay's own egress
# rule to buzz-minio above - buzz-db pods carry cnpg.io/cluster, not
# app.kubernetes.io/name: buzz, and this targets a different namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-db-egress-to-minio
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: buzz-db
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cnpg-backups
            v1.min.io/tenant: cnpg-backups-minio
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# Gateway (public route) -> relay web UI, port 3000. Gateway-routed traffic
# arrives under Cilium's reserved:ingress identity, not the client pod's own
# identity — fromEntities: ingress is required here, not a namespace-based
# fromEndpoints selector (that gotcha's already bitten this cluster before,
# see feedback_cilium_gateway_ingress_entity in memory).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-ingress-from-gateway
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: buzz
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# Gateway -> pairing relay, port 5000. Same fromEntities: ingress reasoning
# as the main relay rule above — separate rule because the pairing relay
# is a distinct component (app.kubernetes.io/component: pairing-relay)
# listening on its own port, even though it shares app.kubernetes.io/name.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-ingress-from-gateway-to-pairing
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: pairing-relay
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
---
# Gateway -> MinIO Console, port 9090. Same fromEntities: ingress reasoning.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-ingress-from-gateway-to-minio-console
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      v1.min.io/tenant: buzz-minio
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
# Homepage dashboard -> relay, port 3000. Homepage's siteMonitor polls the
# ClusterIP directly (not through the Gateway route), so it carries the
# homepage pod's own identity, not reserved:ingress — needs a namespace-based
# fromEndpoints rule alongside the fromEntities: ingress one above, same
# pattern as hermes-allow-homepage-ingress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-homepage-ingress
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: buzz
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: homepage
            io.kubernetes.pod.namespace: homepage
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# Homepage dashboard -> MinIO Console, port 9090. Same reasoning as above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-homepage-ingress-to-minio-console
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      v1.min.io/tenant: buzz-minio
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: homepage
            io.kubernetes.pod.namespace: homepage
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
# Prometheus scraping the relay's metrics/health endpoints, and Alertmanager
# POSTing to the webhook receivers on the app port.
#
# 3000 is deliberate: Alertmanager delivers straight to this Service rather
# than out through buzz.jupitertech.net, so the alerting path doesn't depend
# on DNS, the Gateway datapath or Cloudflare Access. Those are exactly the
# things you stop hearing about when they break — routing alerts through the
# ingress they're meant to report on is a silent single point of failure.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: buzz-allow-ingress-from-monitoring
  namespace: buzz
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: buzz
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "9102"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "3000"
              protocol: TCP

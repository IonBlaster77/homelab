apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: buzz-db
  namespace: buzz
spec:
  instances: 2
  storage:
    storageClass: longhorn-ssd
    size: 5Gi
  bootstrap:
    initdb:
      database: buzz
      owner: buzz
      secret:
        name: buzz-db-credentials
  # CNPG-native backup (task #13) - Longhorn's own hourly/daily backup
  # already covers this PVC block-level (recurring-jobs.yaml), this adds a
  # clean per-cluster restore path via `cnpg` tooling on top of that. Needs
  # volumesnapshot-crds + volumesnapshot-controller (separate ArgoCD apps).
  backup:
    volumeSnapshot:
      className: longhorn-backup-vsc
      online: true
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: buzz-db-backup
  namespace: buzz
spec:
  schedule: "0 30 4 * * *" # 4:30am daily - staggered after cognee-db-backup
  backupOwnerReference: self
  method: volumeSnapshot
  cluster:
    name: buzz-db
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: buzz-db
  namespace: buzz
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: buzz-db
  podMetricsEndpoints:
    - port: metrics

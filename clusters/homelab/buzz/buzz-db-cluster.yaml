apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: buzz-db
  namespace: buzz
spec:
  instances: 2
  storage:
    # nvme, not ssd - see kea-db-cluster.yaml (2026-08-05) for why.
    storageClass: longhorn-nvme
    size: 5Gi
  bootstrap:
    initdb:
      database: buzz
      owner: buzz
      secret:
        name: buzz-db-credentials
  # CNPG-native backup (task #13) - continuous WAL archiving + scheduled
  # base backups to the in-cluster MinIO tenant (buzz-minio, own dedicated
  # bucket/user - see cnpg-backup-minio-provision.yaml). Longhorn's own
  # hourly/daily block-level backup to the NAS (recurring-jobs.yaml)
  # continues unchanged as the off-cluster durability layer underneath this.
  backup:
    # 7d, not 30d - see cognee-db-cluster.yaml for the full reasoning
    # (buzz-minio's pool is only ~20Gi total, full-copy daily base backups
    # at 30d retention would risk filling it). Longhorn's NAS backup
    # already covers 30-day off-cluster retention independently.
    retentionPolicy: 7d
    barmanObjectStore:
      destinationPath: s3://buzz-db-backups
      endpointURL: http://minio.cnpg-backups.svc.cluster.local
      s3Credentials:
        accessKeyId:
          name: buzz-db-backup-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: buzz-db-backup-s3-credentials
          key: SECRET_ACCESS_KEY
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: buzz-db-backup
  namespace: buzz
spec:
  schedule: "0 30 4 * * *" # 4:30am daily base backup - staggered after cognee-db-backup
  backupOwnerReference: self
  method: barmanObjectStore
  cluster:
    name: buzz-db
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: buzz-db
  namespace: buzz
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: buzz-db
  podMetricsEndpoints:
    - port: metrics

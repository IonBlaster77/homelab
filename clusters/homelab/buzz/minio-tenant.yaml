# Single-node MinIO Tenant, dedicated to Buzz. requestAutoCert: false — plain
# HTTP on the in-cluster Service, matching how other internal-only traffic
# in this cluster is handled (e.g. Grafana's DB connection); avoids dealing
# with the operator's self-signed cert for traffic that never leaves the
# cluster network.
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: buzz-minio
  namespace: buzz
spec:
  configuration:
    name: buzz-minio-config
  requestAutoCert: false
  # prometheusOperator is just a bare boolean in this CRD version (no
  # labels sub-field, despite some older examples showing one) — its
  # auto-created ServiceMonitor wouldn't carry the release: monitoring
  # label Prometheus' selector needs anyway, so hand-writing one below
  # instead, consistent with every other ServiceMonitor in this repo.
  pools:
    - name: pool-0
      servers: 1
      volumesPerServer: 4
      volumeClaimTemplate:
        metadata:
          name: data
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: longhorn-ssd
          resources:
            requests:
              storage: 5Gi
      containerSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
---
# PodMonitor, not ServiceMonitor: none of the MinIO Operator's generated
# Services (minio, buzz-minio-hl, buzz-minio-console) carry any labels at
# all, so a ServiceMonitor's selector (which matches on Service labels)
# can never find them — silently dropped the target rather than erroring.
# The pods themselves DO carry v1.min.io/tenant, so select on that instead.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: buzz-minio
  namespace: buzz
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      v1.min.io/tenant: buzz-minio
  podMetricsEndpoints:
    - port: minio-port
      path: /minio/v2/metrics/cluster
      interval: 30s
      # Without this, MinIO returns 403 — this endpoint requires the
      # scoped bearer token from `mc admin prometheus generate`, generated
      # once and stored in minio-metrics-secret.yaml.
      bearerTokenSecret:
        name: buzz-minio-metrics-token
        key: token

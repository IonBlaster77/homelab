name: secret-scan

# Server-side enforcement: runs on every push and PR regardless of where the
# commit was authored, and cannot be skipped with `git commit --no-verify`.
# Uses the same script as the local pre-commit hook.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan all tracked YAML for unencrypted secrets
        run: ./scripts/scan-secrets.sh
